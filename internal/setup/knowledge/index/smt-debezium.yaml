  source: https://repo1.maven.org/maven2/io/debezium/debezium-connector-jdbc/3.2.0.Final/debezium-connector-jdbc-3.2.0.Final-sources.jar

- name: jdbc-field-name-transformation
  kind: smt
  component: debezium
  runtime: connect
  class: io.debezium.connector.jdbc.transforms.FieldNameTransformation
  versions: ">=3.2.0.Final"
  summary: Adds a prefix or suffix to, or restyles, the column names the JDBC sink writes.
  install: bundled
  runtime_image: connect
  plugin_ref: debezium-jdbc-sink
  keys:
    - {name: column.naming.prefix, default: ""}
    - {name: column.naming.suffix, default: ""}
    - {name: column.naming.style, default: "default"}
  checks:
    - Ships in the Debezium JDBC sink plugin from 3.2.0.Final.
  doc: https://debezium.io/documentation/reference/3.2/connectors/jdbc.html
  source: https://repo1.maven.org/maven2/io/debezium/debezium-connector-jdbc/3.2.0.Final/debezium-connector-jdbc-3.2.0.Final-sources.jar
