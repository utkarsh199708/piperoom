- id: dbz-topic-heartbeat-transaction
  title: heartbeat.topics.prefix and transaction.topic were replaced by topic.heartbeat.prefix and topic.transaction
  component: debezium
  theme: renamed
  affected: ">=2.0.0.Beta1"
  symptoms: [heartbeat.topics.prefix, transaction.topic, topic.heartbeat.prefix, topic.transaction, heartbeat topic name]
  workaround: >-
    Rename heartbeat.topics.prefix to topic.heartbeat.prefix and transaction.topic to
    topic.transaction. With the 2.0 topic naming strategy the heartbeat topic is
    <topic.heartbeat.prefix>.<topic.prefix>.
  renamed_keys:
    - {old: heartbeat.topics.prefix, new: topic.heartbeat.prefix}
    - {old: transaction.topic, new: topic.transaction}
  source: https://issues.redhat.com/browse/DBZ-4180

- id: dbz-sqlserver-database-names
  title: SQL Server database.dbname was replaced by database.names
  component: debezium-sqlserver
  theme: renamed
  affected: ">=2.0.0.Final"
  symptoms: [database.dbname, database.names, sql server multiple databases]
  workaround: >-
    Replace database.dbname with database.names (a comma-separated list; one connector can now
    capture several databases of one instance).
  renamed_keys:
    - {old: database.dbname, new: database.names}
  source: https://debezium.io/documentation/reference/2.0/connectors/sqlserver.html

- id: dbz-mongodb-connection-string
  title: MongoDB mongodb.hosts was removed for mongodb.connection.string
  component: debezium-mongodb
  theme: renamed
  affected: ">=2.4.0.Beta2"
  symptoms: [mongodb.hosts, mongodb.members.autodiscover, mongodb.connection.string, replica set hosts]
  workaround: >-
    Replace mongodb.hosts (and mongodb.members.autodiscover) with mongodb.connection.string, a
    standard mongodb:// URI that names the replica set or the mongos routers.
  renamed_keys:
    - {old: mongodb.hosts, new: mongodb.connection.string}
  source: https://issues.redhat.com/browse/DBZ-6892

- id: dbz-snapshot-mode-no-data
  title: snapshot.mode schema_only and schema_only_recovery are deprecated for no_data and recovery
  component: debezium
  theme: renamed
  affected: ">=2.6.0.CR1"
  symptoms: [snapshot.mode, schema_only, schema_only_recovery, no_data, recovery, deprecated snapshot mode]
  workaround: >-
    Use snapshot.mode=no_data instead of schema_only and snapshot.mode=recovery instead of
    schema_only_recovery. 2.6 aligned the snapshot modes of all connectors.
  renamed_values:
    - {old: schema_only, new: no_data}
    - {old: schema_only_recovery, new: recovery}
  source: https://issues.redhat.com/browse/DBZ-7308

- id: dbz-unwrap-tombstone-handling
  title: ExtractNewRecordState drop.tombstones and delete.handling.mode gave way to delete.tombstone.handling.mode
  component: debezium
  theme: renamed
  affected: ">=2.5.0.Final"
  symptoms: [drop.tombstones, delete.handling.mode, delete.tombstone.handling.mode, ExtractNewRecordState, unwrap, tombstone]
  workaround: >-
    Configure transforms.<name>.delete.tombstone.handling.mode (tombstone, drop, rewrite,
    rewrite-with-tombstone, delete-to-tombstone) instead of the two older options; current docs list only
    the new one.
  renamed_keys:
    - {old: drop.tombstones, new: delete.tombstone.handling.mode}
    - {old: delete.handling.mode, new: delete.tombstone.handling.mode}
  source: https://issues.redhat.com/browse/DBZ-7062
