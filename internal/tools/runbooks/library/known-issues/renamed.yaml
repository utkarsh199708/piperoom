# Known issues: renamed properties (plan docs/product/so-gaps-2026-10.md §6, theme 1).
# Format: see LoadKnownIssues in ../../knownissues.go. "affected" is the range of
# releases where the old name no longer works (or is deprecated); "fixed_in" is
# empty because a rename is not fixed, it is followed.

- id: dbz-topic-prefix
  title: database.server.name was replaced by topic.prefix
  component: debezium
  theme: renamed
  affected: ">=2.0.0.Beta1"
  symptoms: [database.server.name, topic.prefix, missing required configuration, logical name, topic naming strategy]
  workaround: >-
    Rename database.server.name to topic.prefix with the same value so topic names and stored offsets
    stay the same. Debezium 2.0 replaced the logical server name with the topic naming strategy.
  renamed_keys:
    - {old: database.server.name, new: topic.prefix}
  source: https://issues.redhat.com/browse/DBZ-4180

- id: dbz-mongodb-topic-prefix
  title: MongoDB mongodb.name was replaced by topic.prefix
  component: debezium-mongodb
  theme: renamed
  affected: ">=2.1.0.Final"
  symptoms: [mongodb.name, topic.prefix, logical name, missing required configuration]
  workaround: >-
    Rename mongodb.name to topic.prefix with the same value. In 2.0 topic.prefix still defaulted to
    mongodb.name; later 2.x releases document only topic.prefix.
  renamed_keys:
    - {old: mongodb.name, new: topic.prefix}
  source: https://issues.redhat.com/browse/DBZ-5817

- id: dbz-schema-history-internal
  title: database.history.* properties were renamed to schema.history.internal.*
  component: debezium
  theme: renamed
  affected: ">=2.0.0.Beta2"
  symptoms:
    - database.history.kafka.topic
    - database.history.kafka.bootstrap.servers
    - schema.history.internal
    - history topic
    - db history topic
    - sasl ssl security history producer consumer
  workaround: >-
    Rename every database.history.* key to schema.history.internal.*, including the
    database.history.producer.* and database.history.consumer.* security keys (SASL, SSL), or the
    history producer cannot authenticate against a secured Kafka. Debezium 2.x stores history with
    io.debezium.storage.kafka.history.KafkaSchemaHistory.
  renamed_keys:
    - {old: database.history.kafka.topic, new: schema.history.internal.kafka.topic}
    - {old: database.history.kafka.bootstrap.servers, new: schema.history.internal.kafka.bootstrap.servers}
    - {old: database.history.skip.unparseable.ddl, new: schema.history.internal.skip.unparseable.ddl}
    - {old: database.history.store.only.captured.tables.ddl, new: schema.history.internal.store.only.captured.tables.ddl}
    - {old: database.history.producer.security.protocol, new: schema.history.internal.producer.security.protocol}
    - {old: database.history.consumer.security.protocol, new: schema.history.internal.consumer.security.protocol}
    - {old: database.history.producer.*, new: schema.history.internal.producer.*}
    - {old: database.history.consumer.*, new: schema.history.internal.consumer.*}
    - {old: database.history.*, new: schema.history.internal.*}
    - {old: database.history, new: schema.history.internal}
  source: https://issues.redhat.com/browse/DBZ-5043

