byId("ap-reset").addEventListener("click", () => apRest(true));
$$("#ap-level button").forEach((b) => b.addEventListener("click", () => apSetLevel(b.dataset.level)));
byId("ap-level").addEventListener("keydown", (e) => { if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) { e.preventDefault(); const nx = AP.level === "NONE" ? "FULL" : "NONE"; apSetLevel(nx); byId(nx === "NONE" ? "ap-lv-none" : "ap-lv-full").focus(); } });
byId("ap-write").addEventListener("click", (e) => {
  if (AP.phase !== "R" && AP.phase !== "V") return;
  AP.write = !AP.write; e.currentTarget.setAttribute("aria-checked", String(AP.write)); apApproveLabel();
  apLive.textContent = AP.write ? "Write mode on." : "Write mode off.";
});
new IntersectionObserver((ents) => ents.forEach((en) => byId("approval").classList.toggle("paused", !en.isIntersecting))).observe(byId("ap-side"));
apRest(false);

/* ---------- 04 hand-off ---------- */
const hoScene = byId("ho-scene"), hoBaton = byId("ho-baton"), hoLive = byId("ho-live");
let hoAccepted = false;
function hoLayout() {
  const r = hoScene.getBoundingClientRect(), a = byId("ho-av-a").getBoundingClientRect(), m = byId("ho-av-m").getBoundingClientRect();
  const ax = a.left - r.left + a.width / 2, ay = a.top - r.top + a.height / 2, mx = m.left - r.left + m.width / 2, my = m.top - r.top + m.height / 2;
  let d;
  if (Math.abs(my - ay) < 40) d = `M${ax.toFixed(1)} ${ay.toFixed(1)} C ${(ax + (mx - ax) * .25).toFixed(1)} ${(ay - 46).toFixed(1)}, ${(mx - (mx - ax) * .25).toFixed(1)} ${(my - 46).toFixed(1)}, ${mx.toFixed(1)} ${my.toFixed(1)}`;
  else { const bx = r.width - 14; d = `M${ax.toFixed(1)} ${ay.toFixed(1)} C ${bx} ${(ay + (my - ay) * .2).toFixed(1)}, ${bx} ${(ay + (my - ay) * .8).toFixed(1)}, ${mx.toFixed(1)} ${my.toFixed(1)}`; }
  const svg = byId("ho-arc-svg"); svg.setAttribute("viewBox", `0 0 ${r.width.toFixed(0)} ${r.height.toFixed(0)}`); byId("ho-arc").setAttribute("d", d);
  hoBaton.style.offsetPath = `path('${d}')`; hoBaton.style.offsetDistance = hoAccepted ? "100%" : "0%";
}
function hoSet(accepted, animate) {
  hoAccepted = accepted;
  if (animate && !reduced()) hoBaton.classList.add("go"); else hoBaton.classList.remove("go");
  hoBaton.style.offsetDistance = accepted ? "100%" : "0%";
  byId("ho-pa").style.setProperty("--lamp-on", accepted ? ".3" : "1");
  byId("ho-tag-a").textContent = accepted ? "Arjun · watching" : "Arjun · local 18:00";
  byId("ho-tag-m").textContent = accepted ? "Meera · driving" : "Meera · local 07:00";
  byId("ho-btns").hidden = accepted;
}
byId("ho-accept").addEventListener("click", () => { hoSet(true, true); const m = byId("ho-msg"); m.hidden = false; m.textContent = "Meera is driving."; hoLive.textContent = "Meera is driving."; m.focus(); });
byId("ho-later").addEventListener("click", () => { const m = byId("ho-msg"); m.hidden = false; m.textContent = "The room stays with Arjun until you accept."; hoLive.textContent = m.textContent; });
byId("ho-reset").addEventListener("click", () => { hoSet(false, false); byId("ho-msg").hidden = true; hoLive.textContent = "Reset. The room is with Arjun."; });

/* ---------- 05 trust, 06 integrations: one emphasis each, from a readable rest state ---------- */
function onceInView(el, fn, ratio = .4) {
  new IntersectionObserver((ents, o) => ents.forEach((en) => { if (en.isIntersecting && en.intersectionRatio >= ratio) { o.disconnect(); if (!reduced()) fn(); } }), { threshold: [ratio] }).observe(el);
}
onceInView(byId("t1"), () => byId("t1-strike").animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 600, easing: "cubic-bezier(.2,.7,.2,1)", delay: 300 }));
onceInView(byId("t2"), () => $$("#t2 .r").forEach((r, i) => r.animate([{ strokeDashoffset: 100 }, { strokeDashoffset: 0 }], { duration: 700, delay: 200 + i * 220, easing: "cubic-bezier(.2,.7,.2,1)", fill: "backwards" })));
let t3Tok = 0;
function t3Scramble() {
  if (reduced()) return;
  const el = byId("t3-rd"), fin = "[redacted 16]", t0 = performance.now(), tok = ++t3Tok;
  const glyphs = "•#%*+=?@&$";
  const step = (now) => { if (tok !== t3Tok) return; const p = (now - t0) / 600; if (p >= 1) { el.textContent = fin; return; } el.textContent = fin.split("").map((c, i) => i < fin.length * p ? c : glyphs[(i * 7 + Math.floor(now / 50)) % glyphs.length]).join(""); requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
onceInView(byId("t3"), t3Scramble);
byId("t3v").addEventListener("mouseenter", t3Scramble);
onceInView(byId("ig-cdc"), () => {
  const pulse = byId("ig-pulse"), sr = byId("ig-sr"), row = byId("ig-cdc").getBoundingClientRect(), s = sr.getBoundingClientRect();
  const to = s.left - row.left + s.width / 2;
  pulse.animate([{ left: "-80px", opacity: 1 }, { left: `${to - 80}px`, opacity: 1 }], { duration: 1100, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" }).finished.then(() => {
    pulse.style.background = "linear-gradient(90deg, transparent, var(--tally))"; sr.classList.add("hit");
    setTimeout(() => { sr.classList.remove("hit"); pulse.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: "forwards" }); }, 800);
  }).catch(() => {});
}, .6);

/* ---------- 08 pilot form: nothing is sent; the visitor copies a summary ---------- */
const form = byId("pilot-form"), result = byId("pf-result");
const val = (id) => byId(id).value.trim();
function fieldErr(id, msg) { const el = byId(id), er = byId(id + "-err"); if (msg) { el.setAttribute("aria-invalid", "true"); er.textContent = msg; } else { el.removeAttribute("aria-invalid"); er.textContent = ""; } return !msg; }
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const checks = [
    ["pf-name", val("pf-name") ? "" : "Add your name"],
    ["pf-company", val("pf-company") ? "" : "Add your team or company"],
    ["pf-email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val("pf-email")) ? "" : "Add a work email"],
  ];
  const order = ["pf-name", "pf-company", "pf-email"]; let first = null;
  for (const [id, msg] of checks) if (!fieldErr(id, msg) && !first) first = id;
  if (first) { byId(order.find((id) => byId(id).getAttribute("aria-invalid") === "true")).focus(); return; }
  const stack = ["pf-stack-pg", "pf-stack-debezium", "pf-stack-connect", "pf-stack-sr", "pf-stack-kafka"].filter((id) => byId(id).checked).map((id) => byId(id).value);
  const lines = [
    "Piperoom design-partner application",
    "Name: " + val("pf-name"),
    "Role: " + (val("pf-role") || "not given"),
    "Team or company: " + val("pf-company"),
    "Work email: " + val("pf-email"),
    "CDC path: " + (stack.length ? stack.join(", ") : "not given"),
    "Warehouse: " + val("pf-warehouse"),
    "CDC pipelines in production: " + val("pf-pipelines"),
    "Would run it on: " + val("pf-deploy"),
    "Claude endpoint: " + val("pf-model"),
    "Last pipeline incident: " + (val("pf-incident") || "not given"),
  ];
  byId("pf-summary").value = lines.join("\n");
  const send = byId("pf-sendto"); send.textContent = "";
  if (PILOT_CONTACT !== "") {
    send.append("Send it to the Piperoom team at ");
    const b = document.createElement("b"); b.textContent = PILOT_CONTACT; send.append(b, ".");
    const cb = document.createElement("button"); cb.type = "button"; cb.className = "btn btn-ghost btn-sm"; cb.id = "pf-copy-addr"; cb.textContent = "Copy address";
    cb.addEventListener("click", () => copyText(PILOT_CONTACT, null, cb, "Copy address")); send.append(cb);
  } else send.textContent = "Send it to the Piperoom team. We'll share the address with you.";
  form.hidden = true; result.hidden = false; byId("pf-copy-msg").textContent = "";
  byId("pf-result-h").focus();
});
["pf-name", "pf-company", "pf-email"].forEach((id) => byId(id).addEventListener("input", () => { if (byId(id).getAttribute("aria-invalid") === "true") fieldErr(id, ""); }));
function copyText(text, selectEl, btn, label) {
  const msg = byId("pf-copy-msg");
  const fallback = () => {
    if (selectEl) { selectEl.focus(); selectEl.select(); }
    else { const b = byId("pf-sendto").querySelector("b"); if (b) { const r = document.createRange(); r.selectNodeContents(b); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } }
    msg.textContent = "Selected. Press Ctrl+C, or ⌘C on a Mac, to copy.";
  };
  if (!(navigator.clipboard && navigator.clipboard.writeText)) { fallback(); return; }
  navigator.clipboard.writeText(text).then(() => {
    const lab = btn.querySelector("span") || btn; lab.textContent = "Copied";
    msg.textContent = "Copied.";
    setTimeout(() => { lab.textContent = label; }, 2000);
  }, fallback);
}
byId("pf-copy").addEventListener("click", (e) => copyText(byId("pf-summary").value, byId("pf-summary"), e.currentTarget, "Copy application"));
byId("pf-edit").addEventListener("click", () => { result.hidden = true; form.hidden = false; byId("pf-name").focus(); });

/* ---------- boot ---------- */
if (reduced()) { byId("transcript").open = true; byId("top").classList.remove("pre"); }
mqReduce.addEventListener("change", () => draw());
applyCC();
new ResizeObserver(() => { SR = null; layout(); }).observe(player);
new ResizeObserver(() => { SR = null; syncUI(); }).observe(seekEl);
new ResizeObserver(() => hoLayout()).observe(hoScene);
addEventListener("resize", () => { SR = null; });
layout(); hoLayout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { SR = null; layout(); hoLayout(); });
</script>
