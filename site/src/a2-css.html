<style>
/* hero grid (spec 3.2): slate + H1 in columns 1-8, lead + buttons + status in 9-12, bottom-aligned */
.hero-side { justify-items: start; gap: 18px; align-self: end; }
.hero-lead { font-size: 17px; line-height: 1.5; }
.h1 { font-size: clamp(40px, 4.4vw + 10px, 76px); }
.h1 > span { display: block; }
@media (max-width: 1023px) { .h1 { font-size: clamp(40px, 6.4vw + 8px, 76px); } .hero-side { padding-bottom: 0; } }
/* film world extras */
.wc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.wc-c { display: grid; gap: 1px; min-width: 0; font-size: 12px; overflow-wrap: anywhere; }
.wc-w { grid-column: 1 / -1; }
.mh { display: block; font-size: 11px; line-height: 14px; font-weight: 600; color: var(--ui-agent-fg); margin-bottom: 1px; }
.msg.ok .mh { color: var(--ui-success-fg); }
.ok-t { color: var(--ui-success-fg); display: inline-flex; gap: 4px; align-items: center; font-size: 12px; }
.conf .cp-l, #w-cpath { fill: none; stroke: var(--ui-agent); stroke-width: 1.5; }
.conf .cp-a, .conf svg > circle:first-of-type { fill: var(--ui-muted-fg); }
.conf .cp-b, #w-cdot { fill: var(--ui-agent); }
.wh-res:empty { display: none; }
.cp-in.caret::after { content: ""; display: inline-block; width: 1.5px; height: 1em; margin-left: 1px; background: currentColor; vertical-align: -2px; }
/* figures */
.k-a { fill: var(--skin-arjun); } .k-p { fill: var(--skin-priya); } .k-k { fill: var(--skin-kabir); } .k-m { fill: var(--skin-meera); }
.h-d { fill: var(--hair-dark); } .h-b { fill: var(--hair-brown); } .h-g { fill: var(--hair-grey); }
.ol { stroke: var(--fig-line); stroke-width: 1.5; stroke-linejoin: round; }
.f-con { fill: var(--l-connect); } .f-sr { fill: var(--l-sr); } .f-cons { fill: var(--l-consumer); } .f-wh { fill: var(--l-wh); }
.eye { fill: var(--fig-line); }
.nose, .mouth { fill: none; stroke: var(--fig-line); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.mouth { opacity: .7; }
.glass { fill: none; stroke: var(--fig-line); stroke-width: 1.3; }
.band { fill: none; stroke: var(--l-consumer); stroke-width: 3; stroke-linecap: round; }
.ring-e { fill: none; stroke: var(--lamp); stroke-width: 1.2; }
.cord { fill: none; stroke: color-mix(in oklab, var(--l-connect) 55%, var(--caption-ink)); stroke-width: 1.2; stroke-linecap: round; }
.collar { fill: none; stroke: color-mix(in oklab, var(--fig-line) 70%, transparent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.metal { fill: none; stroke: var(--metal); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tyre { fill: none; stroke: var(--tyre); stroke-width: 6; stroke-linecap: round; }
.rim { fill: none; stroke: var(--rim, transparent); stroke-width: 1.5; stroke-linecap: round; }
.star { fill: var(--sky-dawn-2); opacity: .75; }
.sun { fill: var(--sun); }
.sc-lampb { fill: var(--fig-line); }
.sc-lamps { fill: var(--l-connect); stroke: var(--fig-line); stroke-width: 1.5; stroke-linejoin: round; }
.lamp-bulb { fill: var(--lamp); opacity: var(--lamp-on, 1); transition: opacity .6s; }
.sc-mug { fill: var(--l-sr); stroke: var(--fig-line); stroke-width: 1.5; }
.sc-plant { fill: var(--l-connect); stroke: var(--fig-line); stroke-width: 1.5; stroke-linejoin: round; }
.sc-leaf { fill: var(--l-consumer); stroke: var(--fig-line); stroke-width: 1.5; stroke-linejoin: round; }
</style>
