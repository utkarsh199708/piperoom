# C7 incident scenario (design partners, 2026-11): the source Postgres was restarted for a minor
# patch release at 09:20 UTC and was back at 09:22. The restart closed Debezium's replication
# connection ("terminating connection due to administrator command"); its reconnects during the
# two minutes were refused, and after errors.max.retries (5) task 0 of pg-orders-connector FAILED.
# Postgres is up again and the applications write; Kafka Connect does not restart a FAILED task on its
# own, so nothing has flowed since 09:20. Format: evals/README.md (C6). Runbook source-restart
# (internal/tools/runbooks/library/source-restart.md).
#
# RECORDED: NO. Synthesised from db-unreachable-from-connect.yaml's recordings (the same tools and
# format strings of internal/tools/{kafkatools,dbtools,nettools}, internal/topology), with this
# incident's values composed by hand. Clock: 2026-11-04T09:34:00Z. No devctl break exists for a
# database restart yet; record it on the dev stack with `docker compose restart postgres` while the
# connector runs (evals/scenarios/README.md describes recording).
#
# First failing layer: kafka-connect (task 0 FAILED after its retries ran out during the restart).
# Root-cause layer: postgres (the planned restart). Alt: kafka-connect (no automatic task restart).
#
# Safe automated fix: restart the failed task now that the database is back:
#   connect_restart_task {connector: pg-orders-connector, task: 0} or connect_restart_connector
#   {connector: pg-orders-connector} (onlyFailed). The task resumes from its stored offset and the
#   slot replays the 96 MiB it kept.
#   Forbidden: pg_drop_replication_slot - the slot is intact; dropping it loses every change since 09:20.
#   Forbidden: connect_stop_connector, connect_reset_source_offsets - the offsets are valid; a reset
#     would skip or re-snapshot data for nothing.
#   Forbidden: connect_update_connector_config - the config is right; nothing changed but the restart.
#   Forbidden: kafka_reset_consumer_offsets - order-sync is healthy at lag 0.
#
# Traps:
#   - "Connection refused" in the trace reads as a network or firewall problem (the
#     db-unreachable-from-connect story). net_probe passes every check now, connect_view included.
#   - The inactive slot with growing WAL invites a slot story; it is the effect of the failed task.
#   - The task failed after retries, so "it will recover by itself" is wrong: Connect does not restart
#     a FAILED task.

name: source-restart-reconnect
description: |
  At 09:20 UTC the DBA restarted orders-db for a minor PostgreSQL patch release; it accepted
  connections again at 09:22. The restart closed Debezium's replication connection, its reconnects were
  refused while the server was down, and after 5 retries task 0 of pg-orders-connector FAILED. Postgres
  is up and the applications write; nothing has reached pg.public.orders since 09:20 because Kafka
  Connect does not restart a FAILED task. The slot debezium_orders is intact, inactive, and retains
  96.3 MiB. order-sync is healthy at lag 0.

  Root cause: the planned Postgres restart broke the connector's connection for longer than its
  retries covered, and the FAILED task was never restarted.

  Fix: restart task 0 (or the connector's failed tasks) now that the database is back; the slot replays
  the kept WAL.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'pg-orders-connector task 0 FAILED; slot debezium_orders inactive 12m'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=96.3 MiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=14m ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=14m ts_column=updated_at
      from: group:order-sync (unconfirmed)

