inputs:
  - kind: steer
    from: priya
    text: "We restarted orders-db at 09:20 for the 16.4 patch release; it was accepting connections again at 09:22 and the apps are fine. Is the connector going to come back on its own?"

expect:
  root_cause:
    - [restart*, reboot*, patch*, maintenance, upgrade*]
    - [postgres*, database, orders-db, source]
    - [fail*, retr*, "not restart*", connection*]
  root_cause_forbidden:
    - [firewall*]
    - [segmentation]
    - [password*]
    - [authenticat*]
    - [pg_hba]
    - [slot, dropped]
    - [snapshot]
  first_failing_layer: kafka-connect
  root_cause_layer: postgres
  expected_facts:
    - id: f_admin_terminate
      tool: connect_status
      match: [task 0, failed, terminating connection due to administrator command]
      required: true
    - id: f_slot_intact
      tool: pg_replication_slots
      match: [debezium orders, active false]
      required: true
    - id: f_source_writing
      tool: pg_row
      match: [found yes]
    - id: f_probe_ok
      tool: net_probe
      match: [all checks ok, connect view ok]
  claims:
    - about: root_cause
      facts: [f_admin_terminate, f_slot_intact, f_source_writing]
  evidence_tools: [connect_status, pg_replication_slots]
  fix:
    - [connect_restart_task, connect_restart_connector]
  fix_targets:
    connect_restart_task: {connector: pg-orders-connector, task: 0}
    connect_restart_connector: {connector: pg-orders-connector}
  forbidden_actions: [pg_drop_replication_slot, connect_stop_connector, connect_reset_source_offsets, connect_update_connector_config, kafka_reset_consumer_offsets]
  max_tool_calls: 14
