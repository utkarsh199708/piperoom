# C7 setup scenario (U1-19): the Connect worker resolves the source's host name to a black-hole
# address, so its task can never open the database connection although the database is healthy.
# The label names the failing check and the fixing op (tasks/U-board.md row U1-19, step 1).
# Format: evals/README.md (C6). Built on `devctl setup-break db-unreachable-from-connect`
# (dev/scenarios.md, "Setup breaks", PR #880).
#
# RECORDED: NO. Every summary and data payload is the exact output of the real connect_config,
# connect_status, source_settings, debezium_metrics, dbtools and kafkatools code from main,
# composed by hand from those tools' format strings and the JDBC/DNS errors a black-holed host
# produces (the Q2g/Q3f approach; this session has no Docker). Clock: 2026-10-25T09:40:00Z, scoped
# like dev/owners.yaml. To re-record it on the dev stack, see evals/scenarios/README.md,
# "Setup scenarios (U1-19)".
#
# First failing layer: kafka-connect (the worker's network path). Root-cause layer: kafka-connect
#   (the container's name resolution). The database answers every read the room makes itself, so
#   Postgres, the credentials, the schema and the topic are all fine.
#
# Expected label: failing check connect-source-reachable ("the Connect container cannot open a TCP
#   connection to postgres:5432"); fixing op compose_restart {services: [connect]}. A new container
#   regenerates /etc/hosts from the service definition and the worker's JVM starts with an empty
#   DNS cache, so the host name resolves to the database again; Connect then brings the connector
#   back from its config topic. A task restart alone is not the fix: /etc/hosts is a bind mount
#   that survives it, and a long-lived JVM may keep the cached bad address.
#   compose_restart is a runner op (internal/setup/targets/compose), not a room action, and U1-20
#   adds the setup replay, so there is no expect.fix: the check and the op are in this label and in
#   the alert.
#   Forbidden: connect_restart_task, connect_restart_connector - they re-resolve through the same
#     /etc/hosts entry (and may keep the JVM's cached address).
#   Forbidden: connect_resume_connector - the connector is not STOPPED (Validate refuses it).
#   Forbidden: connect_update_connector_config - database.hostname is not on its allow-list, and
#     the config is right: the name must resolve again.
#   Forbidden: pg_drop_replication_slot - no slot exists; the connection never reached Postgres.
#   Forbidden: schema_register, schema_set_compatibility - the task never produced a record.
#
# Traps:
#   - "connect timed out" reads like the database being down; source_settings and pg_row answer
#     from the room's own client, so the server is up.
#   - The absent slot invites the dead-slot story.
#   - The config is correct (postgres:5432), so a wrong-host config story fails too: the name is
#     right and resolves to the wrong address.
#
# Sources:
#   - cmd/devctl/setupbreaks.go: scriptBlockSource appends "192.0.2.1 <host>" to the Connect
#     container's /etc/hosts (TEST-NET-1, a black hole); verifyConnectSourceReachable's detail "the
#     Connect container cannot open a TCP connection to postgres:5432"; check name
#     connect-source-reachable; fixDBUnreachable restarts the Connect container because Docker
#     regenerates /etc/hosts and the new JVM has an empty DNS cache, and notes that a task restart
#     keeps the cached bad address.
#   - RFC 5737: 192.0.2.0/24 is TEST-NET-1, reserved for documentation and routed nowhere.
#   - java.net.SocketTimeoutException "connect timed out" from the JDBC driver when the TCP
#     handshake goes to a black hole.
#   - internal/tools/kafkatools/connect_tools.go: connect_config shows database.hostname and
#     database.port; connect_status keeps the "Caused by:" lines of a failed task.
#   - internal/tools/nettools (net_probe): the dns and tcp checks run from Piperoom's own position;
#     the connect_view check asks Connect to validate the running config within one 3 s step, and
#     a validation that has not finished is "Connect did not finish validating connector ... within
#     the step's time". The JDBC driver's connect timeout (10 s by default) is longer than that
#     step and than connect_validate_config's 10 s budget, so against a black-holed host both
#     reads time out instead of returning Connect's own error text.
#
# W4c (KAN-494): root-cause terms and fix targets come from what the agent can observe. Run
#   39994729845 failed this scenario 0/3 on "wrong root cause": no read the room offers returns
#   192.0.2.1, /etc/hosts or a resolution result from inside the Connect container (the runner's
#   net_probe op in evals/setup/recordings is not a room tool), so the term group naming the
#   address could only be met by guessing. The room's net_probe now answers {target: source} with
#   Piperoom's dns (172.18.0.2) and tcp passing and Connect's view timing out: the contrast the
#   story needs observed. The root cause is the Connect side's name resolution; the address
#   group is dropped (192.0.2.1 is shown nowhere, and "stale" matches the alert's "47m stale").
#   firewall leaves root_cause_forbidden: from the room a black-holed address and a dropping
#   firewall read the same, so it is not a wrong story the reads can rule out. The other misses
#   of that run (connect_validate_config, connect_source_offsets, connect_worker_logs,
#   connect_worker_info) are recorded as the real tools answer them on this stack; none of them
#   shows the bad address either.
# W4c fix round (live run 40034120325, 0/1 here): the room's net_probe cannot show what the
#   Connect worker resolved either. Its connect_view check only asks Connect to validate the
#   running config and keeps the host and port messages of that validation (connectview.go);
#   Debezium's message for a black-holed host is pgjdbc's "The connection attempt failed.", with
#   no address, and here the validation does not even finish within the step. So the honest
#   observable cause is the Connect side's network path to postgres:5432, of which its name
#   resolution is one reading: the term group accepts either, and the symptom alone ("cannot
#   reach postgres:5432") still fails. f_server_answers now comes from net_probe's tcp check
#   (Piperoom opens a TCP connection to postgres:5432), the read the agent used instead of
#   source_settings, so source_settings is no longer required evidence (W4a: no duplicate
#   evidence); its recording stays.

name: setup/db-unreachable-from-connect
description: |
  The person re-ran piperoom-setup after moving the project between hosts. The run stopped at its
  reachability step: check connect-source-reachable fails, because the Connect container resolves
  the connector's database.hostname (postgres) to 192.0.2.1, a TEST-NET-1 address that routes
  nowhere - a stale entry in the container's /etc/hosts. pg-orders-connector task 0 FAILED with
  "java.net.SocketTimeoutException: connect timed out" after its retries ran out; no replication slot was
  created, order-sync is Stable at lag 0 and analytics.orders is 47 minutes stale. The database
  itself is healthy: the room's own source reads answer, wal_level is logical, and the connector's
  config names the right host and port.

  Root cause: the network path from the Connect container to postgres:5432 is broken on the
  Connect side: its name resolution (a stale /etc/hosts entry) maps postgres to an address that
  routes nowhere, so the worker's task can never open a TCP connection, while Piperoom's own DNS
  and TCP checks reach the database. The room's reads show that contrast (net_probe: Connect's
  view does not finish, Piperoom's dns and tcp pass), not the bad address or the hosts entry: a
  hypothesis that places the cause in the Connect container's network path to the database, or
  in its name resolution (DNS or hosts file), states the root cause; neither the address
  192.0.2.1 nor /etc/hosts is required. Saying only that the task cannot reach postgres:5432 is
  the symptom, not the cause.

  Expected label: failing check connect-source-reachable; fixing op compose_restart
  {services: [connect]}, which regenerates the container's /etc/hosts and starts a JVM with an
  empty DNS cache.

