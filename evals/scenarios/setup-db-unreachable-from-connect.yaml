  # connect_worker_info (1 of 3 runs, after the steer): the compose project's one worker
  # (GROUP_ID piperoom-connect, internal topics _connect_configs/_connect_offsets/_connect_status
  # on the single broker, internal/setup/targets/compose/templates.go).
