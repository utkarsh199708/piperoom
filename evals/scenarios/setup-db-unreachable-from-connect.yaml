inputs:
  - kind: steer
    from: arjun
    text: "The setup run cannot reach the database from Connect and task 0 keeps timing out, but I can query the database from my laptop. The config says postgres:5432, which is what the compose file names. What do I change on the Connect side?"

expect:
  root_cause:
    # The Connect side's network path to the database, or its name resolution (W4c fix round):
    # what net_probe's contrast shows, Piperoom's dns and tcp passing while Connect's view of the
    # same host does not finish. The real tool cannot show what the worker resolved, so the
    # address (192.0.2.1) and the hosts entry are not required. No bare symptom word: "reach",
    # "timeout" and "address" are not terms, so "cannot reach postgres:5432" alone fails.
    - [resolv*, dns, hosts, network path, route*]
  # The wrong stories of a task that cannot connect.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - [permission denied]
    - [disk full]
    - [retention, delet*]
    - [slot, lost]
    - [database, down]
    - [wrong host, bad host]
    - [listen*, localhost]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_connect_timeout
      tool: connect_status
      match: [connect timed out, connection attempt failed]
      required: true
    # W4c fix round: the server answering is what net_probe's tcp check shows (Piperoom opens a
