inputs:
  - kind: steer
    from: arjun
    text: "The setup run cannot reach the database from Connect and task 0 keeps timing out, but I can query the database from my laptop. The config says postgres:5432, which is what the compose file names. What do I change on the Connect side?"

expect:
  root_cause:
    # The worker's name resolution, and the address it lands on.
    - [name resolution, dns, hosts, resolve*]
    - [192.0.2.1, black hole, black-hole, test net, test-net, stale, /etc/hosts]
  # The wrong stories of a task that cannot connect.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - [permission denied]
    - [disk full]
    - [retention, delet*]
    - [slot, lost]
    - [database, down]
    - [wrong host, bad host]
    - [firewall]
    - [listen*, localhost]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_connect_timeout
      tool: connect_status
      match: [connect timed out, connection attempt failed]
      required: true
    - id: f_server_answers
      tool: source_settings
      match: [wal level logical]
      required: true
    - id: f_config_right
      tool: connect_config
      match: [database hostname postgres, database port 5432]
    - id: f_credentials_ok
      tool: source_role_grants
      match: [replication yes, selectable yes]
    - id: f_no_slot
      tool: pg_replication_slots
      match: [not found in pg replication slots]
    - id: f_not_connected
      tool: debezium_metrics
      match: [connected false, queue]
  claims:
    - about: root_cause
      facts: [f_connect_timeout, f_server_answers]
  evidence_tools: [connect_status, source_settings]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, pg_drop_replication_slot, schema_register, schema_set_compatibility]
  max_tool_calls: 12
