# C7 incident scenario (X1e): a consumer release rewrote its warehouse upsert and stopped writing
# updated_at. 20 late-arriving orders load with updated_at NULL; counts by id match, lag is 0,
# Connect and the slot are healthy. Format: evals/README.md (C6). Built on
# `devctl break sink-dropped-column` (X1g, dev/scenarios.md §15).
#
# RECORDED: NO (synthesised from the code paths). Every summary and data payload below is the
# exact output of the real kafkatools, dbtools and topology code at c71c4477, run by a throwaway
# generator (not committed) over fake clients holding the state the break leaves on an idle dev
# stack, scoped like dev/owners.yaml. Clock: 2026-10-21T09:40:00Z. Nothing was read from a
# running stack; it must be re-recorded there (evals/scenarios/README.md, "Silent-corruption
# scenarios (X1e)"). The reconcile answer was run on the fixed clock with an explicit window.
#
# How the room opens: a data test, not the drift watcher. The generator ran the real watcher
# over this state from 09:22:30 to 11:40 (and over a variant with `devctl load --rate 1`): it
# never fires. Both drift checks key on sink_ts_column, the very column the release dropped:
# the sink's lag is measured from its newest updated_at (frozen at 08:46:03, so every window
# ends before it), count_drift counts by it (a NULL is in no window) and row_drift samples by
# it. dev/scenarios.md §15 expects row_drift; that does not hold for this code. The alert
# title is hand-written: the dbt not_null test a warehouse team runs on its timestamp column.
#
# First failing layer: consumer. Root-cause layer: consumer (the 09:21Z order-sync release).
#
# Expected fix: none automated. A human ships an order-sync build that writes updated_at again,
#   then replays the topic so the upsert fills the NULLs (`devctl fix sink-dropped-column`).
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector - the
#     connector produced every event; reconcile's "connector side" verdict is a trap (below).
#   Forbidden: schema_register, schema_set_compatibility, connect_update_connector_config - no
#     DDL ran, the schema has updated_at, the topic events carry it.
#
# Traps:
#   - reconcile buckets by updated_at: the 20 source rows sit at 08:46:03 (late-arriving), their
#     events at 09:22, and the sink rows have no updated_at, so its verdict reads "the topic
#     carried only 6 change events for 26 source rows (connector side)". The key diff, a
#     warehouse_row (updated_at=<nil>) and trace_record (seen, diff_columns=updated_at) show the
#     rows are in the sink with the column missing.
#   - warehouse_freshness and pipeline_map say the warehouse is 53 minutes stale: on an idle
#     stack that is "no new source writes", not an outage.
#   - Counts by id match and lag is 0: nothing is lost, one column is.
#
# Sources:
#   - cmd/devctl/scenarios_silent.go breakSinkDroppedColumn: DEVCONSUMER_DROP_COLUMNS=updated_at,
#     20 orders (customer g, amount 800+g) whose updated_at is the sink's newest (epoch micros).
#   - internal/watch/drift.go sinkLag, countWindow, compareRows: why no drift signal fires.

name: sink-dropped-column
description: |
  At 09:21:50 UTC order-sync 2.16.1 went out with a rewritten warehouse upsert that no longer
  writes updated_at (the column is left out of the INSERT and of the update list). At 09:22:05
  20 late-arriving orders were written whose updated_at is 08:46:03.311383 (the time of the
  newest row the warehouse had). They reached pg.public.orders, were consumed and loaded, and
  sit in analytics.orders with updated_at NULL; the source has the timestamps. Counts match, lag
  is 0, Connect and the slot are healthy; no source write since, so the warehouse looks 53
  minutes stale. A dbt not_null test on analytics.orders.updated_at opened the room.

  Root cause: the order-sync 2.16.1 release dropped updated_at from its upsert, so new rows load
  with the column NULL.

  Expected fix: none automated; ship a build that writes updated_at, then replay the topic.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

