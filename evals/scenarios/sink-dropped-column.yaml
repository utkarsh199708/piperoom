  # Budget 14 -> 18 (W4b, KAN-493; the number is the ticket's). Derivation from the input turns, by
  # the reads each needs on the path the traps set (distinct reads first, then the re-reads):
  #   turn 1, the alert (dbt not_null on updated_at): kafka_consumer_lag (f_lag_zero), reconcile
  #     (f_keys_missing; its "connector side" verdict is the trap), warehouse_row (f_sink_null),
  #     trace_record (f_trace_diff), pg_recent_ddl (f_no_ddl), warehouse_freshness, pipeline_map
  #     (optional: the alert carries it)                                              = 7
  #   turn 2, Kabir's comment (2.16.1 reworked the upsert): connect_status (to rule out the
  #     connector side that reconcile names), kafka_find_by_key (the event carries updated_at, so
  #     the column is lost after the topic), pg_row (the source still has the timestamp) = 3
  #   turn 3, the steer ("why NULL, what puts the timestamps back?"): kafka_topic_offsets or
  #     schema_registry_versions (the schema has the column), similar_incidents, and one re-read of
  #     kafka_consumer_lag / reconcile to say lag is still 0 and the count is unchanged = 4
  #   That is 14 reads (one of them a re-read); 14 + 4 for the re-reads a trap-walking run adds
  #   after each input = 18.
  #   Measured since (W4-0, reviews/evals-2026-10-23/misses.md, run 39994729845): 16, 17 and 15
  #   calls, every one of them in the alert turn; Kabir's comment and the steer drew 0 calls in all
  #   three runs. Runs 1 and 2 failed on the budget alone (16 > 14, 17 > 14), run 3 also on the root
  #   cause, so no run passed and no passing-run budget exists yet. 18 covers the measured 17 with
  #   one call to spare (max + 2 over a budget-only failure would give 19); re-derive it as the
  #   highest passing count + 2 from W4b's verification run.
  max_tool_calls: 18
