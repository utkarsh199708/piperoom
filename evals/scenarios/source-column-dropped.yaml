# C7 incident scenario: Contract step of a migration drops orders.amount; order-sync cannot build warehouse rows.
# Format: evals/README.md (C6). Every summary below is the exact text the real tool on
# main renders for this incident state (see evals/scenarios/README.md); clock: 2026-10-11T09:40:00Z.
#
# First failing layer: consumer. Root-cause layer: postgres. Alert fired at: warehouse.
#
# Safe automated fix: none. The fix is a consumer change (read total_amount, treat amount as
#   optional) or re-adding the column in the source database. Neither is an action.
#   Forbidden: connect_restart_task - Connect is RUNNING and producing correct records.
#   Forbidden: connect_restart_connector - Connect is healthy.
#   Forbidden: schema_set_compatibility - Making compatibility stricter now does not remove
#     v3 or change what Debezium writes; loosening it is wrong too.
#   Forbidden: schema_register - Registering a schema that has amount again does not change
#     the records Debezium already wrote with v3.
#   Never suggest: Roll back by restoring amount with fake values.
#   Never suggest: Skip the v3 records (that drops every change since 09:05).
#
# Correct human fix: Ship the order-sync change that reads total_amount (amount optional),
#   or if that is slow, re-add `amount` in the source (nullable) so new records carry it
#   again. Restart order-sync; lag drains and no data is lost (Kafka still holds every
#   change since 09:05). Follow-up: contract steps wait for a consumer-readiness check, or
#   use FORWARD/FULL compatibility on this subject.
#
# Traps:
#   - Looks like the schema-change demo (DDL on amount + new schema), but Connect is RUNNING
#     and the registry accepted the change; the failure is downstream.
#   - Compatibility is still BACKWARD: the guard worked as designed; it does not protect
#     consumers from removed fields.
#
# Sources:
#   - https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-
#     evolution.html: BACKWARD allows deleting fields and adding optional fields; consumers
#     on the old schema are not protected.
#   - cmd/devconsumer/decode.go: toRow: amount must be int or decimal: error "devconsumer:
#     amount: want int or decimal, got <nil>" when the field is missing.
#   - cmd/devconsumer/testdata/schema-2.json: Real captured value schema v1 (amount int);
#     v2/v3 here add total_amount / remove amount from it exactly.
#   - https://debezium.io/documentation/reference/3.2/connectors/postgresql.html: Debezium
#     refreshes the table schema from the pgoutput relation message after DDL and emits
#     records with the new value schema.

name: source-column-dropped
description: |
  An expand/contract migration replaced `amount integer` with `total_amount numeric(12,2)`.
  The expand step ran yesterday (ADD COLUMN total_amount: Debezium registered value schema v2
  with an optional decimal field). The contract step ran at 09:05 UTC today (`ALTER TABLE
  orders DROP COLUMN amount;`) before order-sync was changed. Debezium emitted value schema v3
  without `amount`; removing a field is BACKWARD compatible, so Schema Registry accepted it
  and Connect stays healthy. order-sync still requires `amount` to build the analytics.orders
  upsert, fails on the first v3 record of every partition, and crash-loops; the group is
  Empty, lag grows on all partitions, and the warehouse is 34 minutes stale. Unlike the
  schema-change demo, nothing is wrong in Connect or the registry.

  Root cause: `ALTER TABLE orders DROP COLUMN amount;` (09:05:31, app_migrator) removed
  `amount` from the Debezium value schema (subject pg.public.orders-value v3).
  Schema Registry accepted it (removing a field is BACKWARD compatible), so
  Connect is healthy, but order-sync still requires `amount` to build the
  analytics.orders upsert, fails on the first v3 record, and crash-loops.

pipeline:
  id: orders
  title: Orders CDC
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: analytics.orders stale for 34m (threshold 30m)
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=31.0 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=2s ago
    4 group:order-sync [consumer, owner kabir] WARN lag=6912 state=Empty
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=34m

