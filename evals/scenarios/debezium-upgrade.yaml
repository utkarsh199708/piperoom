# C7 incident scenario (Q7i, pull-request fix): a known Debezium bug, fixed in a later release,
# stops the MySQL connector, and the version is pinned in the Connect image's repository. The fix
# is a pull request that raises the pin to the fixed-in release of the known issue. Format:
# evals/README.md (C6). Row Q7i (tasks/Q-board.md, step 7; docs/design/fix-pr.md §10 "Scenarios
# (Q7i)": "version pin to the fixed-in release of a known issue", Jira KAN-320).
#
# RECORDED: NO. Synthesised from the code paths (the real tools' format strings on this branch, as
# mysql-binlog-purged.yaml for the MySQL pipeline), composed by hand. The known issue is
# dbz-mysql-ddl-grant-sensitive-variables of the Q1 index
# (internal/tools/runbooks/library/known-issues/fixed-bugs.yaml: MySQL DDL parser fails on GRANT
# SENSITIVE_VARIABLES_OBSERVER, affected <3.1.0.Alpha2, fixed in 3.1.0.Alpha2, DBZ-8685).
# runbook_lookup is not recorded: the harness runs it live over that index. Clock:
# 2026-10-23T09:40:00Z, scoped like orders-mysql in dev/owners.mysql.yaml plus the repos: block
# below. The mysql: nodes render "owner " empty (per-pipeline mysql owner). See
# evals/scenarios/README.md, "Pull-request fix scenarios (Q7i)".
#
# First failing layer: kafka-connect. Root-cause layer: kafka-connect (the Debezium MySQL
#   connector 3.0.8.Final's DDL parser; the GRANT itself is valid MySQL 8.4).
#
# Label (the row's done-when: repo, paths and applied_when):
#   action: repo_open_pull_request (Q7c), one step, layer kafka-connect
#   repo: connect-image (https://github.com/acme/connect-image, base main)
#   paths: [docker/connect/versions.env] (glob docker/connect/**, layer kafka-connect), nothing else
#   edit: `DEBEZIUM_VERSION=3.0.8.Final` -> `DEBEZIUM_VERSION=3.1.0.Final` (the first Final at or
#     after the fixed-in 3.1.0.Alpha2; the PR body names the known issue and DBZ-8685)
#   applied_when: {kind: plugin, class: io.debezium.connector.mysql.MySqlConnector,
#                  version: 3.1.0.Final}
#   On the new image the task resumes from its stored offset, before the GRANT event, and parses
#   it. A live stop-gap (schema.history.internal.skip.unparseable.ddl=true, low risk for a GRANT
#   per the known issue's workaround) is a separate proposal (design §14 D4) and is not in
#   connect_update_connector_config's allow-list.
#
# Fixture repo (resources.repos below, Q7j's forge replay; base_sha
#   9a41c7e2d35b08f6a1c4e7d290b3f58e6c1a0d47):
#   connect-image @ main
#     docker/connect/versions.env:
#       # Versions baked into the Connect image (read by docker/connect/Dockerfile and the Makefile).
#       KAFKA_VERSION=3.8.1
#       DEBEZIUM_VERSION=3.0.8.Final
#       AVRO_CONVERTER_VERSION=7.7.1
#     docker/connect/Dockerfile: ARG DEBEZIUM_VERSION (set from versions.env by make image),
#       DEBEZIUM_CONNECTORS="postgres mysql", the plugin tarballs from plugins/
#
# What is graded (Q7j, as plugin-missing-in-image.yaml): the diagnosis, fix
#   [[repo_open_pull_request]] on fix_targets {repo: connect-image}, and fix_files: path set ==
#   [docker/connect/versions.env], the edit above, no other line changed (KAFKA_VERSION and
#   AVRO_CONVERTER_VERSION stay). The repository tools run live over the fixture repo.
#
#   Forbidden: connect_restart_task, connect_restart_connector - the task re-reads the same GRANT
#     event and fails again.
#   Forbidden: connect_reset_source_offsets, connect_stop_connector - skipping past the event by
#     a reset loses every change between; the bug is in the parser, not the position.
#   Forbidden: connect_delete_connector, connect_resume_connector, source_grant_select,
#     source_end_session, pg_* actions, kafka_reset_consumer_offsets, schema_register,
#     schema_set_compatibility.
#
# Traps:
#   - "DDL statement couldn't be parsed" reads like a broken migration. The statement is a GRANT
#     for the monitoring user: no table changed.
#   - Upgrading Debezium to any newer version is not enough as a label: the pin must reach the
#     fixed-in release of the known issue (>= 3.1.0.Alpha2), and only the Debezium line changes.
#
# Sources:
#   - docs/design/fix-pr.md §1, §6.1, §8.2 (applied_when plugin), §10.
#   - internal/tools/runbooks/library/known-issues/fixed-bugs.yaml, id
#     dbz-mysql-ddl-grant-sensitive-variables (https://issues.redhat.com/browse/DBZ-8685).
#   - Debezium: "io.debezium.text.ParsingException: DDL statement couldn't be parsed. Please open a
#     Jira issue with the statement '<statement>'" (text as reported on DBZ-8685; unconfirmed on the
#     dev profile).

name: debezium-upgrade
description: |
  At 09:10 UTC a DBA ran GRANT SENSITIVE_VARIABLES_OBSERVER ON *.* TO 'monitoring'@'%' on the shop
  MySQL server for the new monitoring agent. The statement is written to the binlog, and
  orders-mysql (Debezium MySQL connector 3.0.8.Final, pinned in connect-image's
  docker/connect/versions.env) parses every DDL it streams: task 0 FAILED with
  "io.debezium.text.ParsingException: DDL statement couldn't be parsed" on that GRANT. This is the
  known issue dbz-mysql-ddl-grant-sensitive-variables (DBZ-8685), fixed in Debezium 3.1.0.Alpha2.
  The source, the binlog position, Kafka and the registry are healthy; nothing new reaches
  shop.shop.orders since 09:10.

  Root cause: Debezium MySQL 3.0.8.Final's DDL parser does not know GRANT
  SENSITIVE_VARIABLES_OBSERVER (a bug fixed in 3.1.0.Alpha2), so the connector fails on the GRANT
  in the binlog.

  Expected label: a pull request (repo_open_pull_request) to repo connect-image changing only
  docker/connect/versions.env, DEBEZIUM_VERSION=3.0.8.Final to 3.1.0.Final; applied when Connect
  lists io.debezium.connector.mysql.MySqlConnector 3.1.0.Final.

pipeline:
  id: orders-mysql
  title: Shop orders CDC (MySQL)
  source_kind: mysql
  topic_prefix: shop
  source_tables: [shop.orders, shop.order_items]
  connectors: [orders-mysql]
  owners:
    mysql: {approvers: priya}
  repos:
    - id: connect-image
      url: https://github.com/acme/connect-image
      base: main
      paths:
        - {glob: "docker/connect/**", layer: kafka-connect}

resources:
  connectors: [orders-mysql]
  subjects: [shop.shop.orders-key, shop.shop.orders-value, shop.shop.order_items-key, shop.shop.order_items-value]
  repos:
    connect-image:
      base_sha: 9a41c7e2d35b08f6a1c4e7d290b3f58e6c1a0d47
      files:
        docker/connect/versions.env: |
          # Versions baked into the Connect image (read by docker/connect/Dockerfile and the Makefile).
          KAFKA_VERSION=3.8.1
          DEBEZIUM_VERSION=3.0.8.Final
          AVRO_CONVERTER_VERSION=7.7.1
        docker/connect/Dockerfile: |
          FROM quay.io/debezium/connect-base:3.0.8.Final
          # Set from versions.env by make image.
          ARG DEBEZIUM_VERSION
          ARG DEBEZIUM_CONNECTORS="postgres mysql"
          COPY plugins/ /tmp/plugins/
          RUN for c in $DEBEZIUM_CONNECTORS; do \
                tar -xzf /tmp/plugins/debezium-connector-$c-$DEBEZIUM_VERSION-plugin.tar.gz -C /kafka/connect; \
              done && rm -rf /tmp/plugins

