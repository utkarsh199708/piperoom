inputs:
  - kind: steer
    from: arjun
    text: "orders-mysql task 0 failed right after Priya's GRANT for the monitoring agent at 09:10. Debezium is pinned in github.com/acme/connect-image, docker/connect/versions.env. Is this a known Debezium problem, and what should the image pin be?"

expect:
  root_cause:
    - [pars*, parser]
    - [grant, sensitive variables observer]
    - [3 0 8, debezium, bug, known issue, dbz 8685, fixed in, 3 1 0]
  root_cause_forbidden:
    - [table, altered]
    - [schema change]
    - [replication slave]
    - [binlog*, purg*]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_parse_failed
      tool: connect_status
      match: [task 0 failed, ddl statement couldn't be parsed, grant sensitive variables observer]
      required: true
    - id: f_running_version
      tool: connect_plugins
      match: [io debezium connector mysql, 3 0 8 final]
      required: true
  claims:
    - about: root_cause
      facts: [f_parse_failed]
  evidence_tools: [connect_status, connect_plugins]
  fix:
    - [repo_open_pull_request]
  fix_targets:
    repo_open_pull_request: {repo: connect-image}
  fix_files:
    - repo: connect-image
      files:
        - path: docker/connect/versions.env
          removed: [DEBEZIUM_VERSION=3.0.8.Final]
          added: [DEBEZIUM_VERSION=3.1.0.Final]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_reset_source_offsets, connect_stop_connector, connect_delete_connector, connect_resume_connector, source_grant_select, source_end_session, pg_drop_replication_slot, pg_add_publication_table, pg_snapshot_signal, kafka_reset_consumer_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 12
