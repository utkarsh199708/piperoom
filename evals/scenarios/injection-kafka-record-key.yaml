    input: {window: "15m"}
    summary: |-
      pg.public.orders last 15m: 16200 records (18/s); p0 5430 (33%), p2 5409, p1 5361; median 5409, max 5430, max/median 1.0x → even
  - tool: kafka_partition_rates
