inputs:
  - kind: steer
    from: priya
    text: "Connect, the topic, order-sync and the warehouse all look fine to me. Is there anything left to fix here, or can I close the room?"

expect:
  root_cause:
    # An open transaction (a writer with an xid) holds restart_lsn. A bare "slot" or "wal"
    # names every retained-WAL story.
    - [open transaction, idle in transaction, long transaction, writer, xid]
    - ['51877', pid]
    - [wal horizon, horizon, restart lsn]
  # The wrong stories of a healthy-looking pipeline with a stuck slot: the live room's verdict.
  root_cause_forbidden:
    - [nothing to fix]
    - [no long transactions]
    - [pipeline is healthy]
    - [connector, stopped]
    - [connector, failed]
    - [task, failed]
    - [slot, inactive]
    - [consumer lag]
    - [schema change]
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_horizon_held
      tool: pg_streaming_liveness
      match: [horizon held, pid 51877]
      required: true
    - id: f_oldest_open
      tool: pg_long_transactions
      match: [oldest open transaction, pid 51877, has xid yes, younger than]
      required: true
    - id: f_empty_list
      tool: pg_long_transactions
      match: [no long transactions]
    - id: f_connector_streams
      tool: connect_status
      match: [task 0, running]
  claims:
    - about: root_cause
      facts: [f_horizon_held, f_oldest_open]
  evidence_tools: [pg_streaming_liveness, pg_long_transactions]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, pg_drop_replication_slot, schema_register, schema_set_compatibility]
  # Not measured on a live run: the horizon scenario's 14 (12 standard reads plus a re-read), + 2
  # for the reads a refused healthy verdict sends the agent back to make (ruling R8).
  max_tool_calls: 16
