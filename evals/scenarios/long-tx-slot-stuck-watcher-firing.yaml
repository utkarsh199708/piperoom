# C7 incident scenario (H2): the watcher still fires long_tx and slot_wal, every other layer reads healthy.
# Format: evals/README.md (C6). Clock: 2026-10-24T11:40:00Z, scoped by the pipeline below.
#
# RECORDED: the recordings are the ones of long-transaction-horizon-held.yaml, the exact summary and
# data of the real dbtools and kafkatools code over the world w4kHorizonHeld in
# evals/w4k_world_test.go (a young open transaction, pid 51877, holds the WAL horizon of a healthy
# slot). TestW4kHorizonHeldRecordingsAreRealToolOutput runs both scenarios against that world and
# fails when a recording drifts. The Kafka, warehouse and not-found recordings after them are
# composed by hand from the tools' format strings, like the other C7 scenarios. pg_replication_slots
# is the same static two-read slot as the horizon scenario (restart_lsn flat, 204.7 MiB retained),
# not a sequence: the real pg_streaming_liveness takes the second read itself.
#
# What this one adds: `watch_status`, the watcher's status row the hypothesis guard reads
# (internal/agent/symptomguard.go, rule 1). long_tx and slot_wal are firing, not clearing, and the
# row is 20 s old. In the room the driver asks whether anything is left, which invites the verdict
# that sank the live room this scenario models: "the connector is fine, nothing to fix". Everything
# the agent reads for the connector, the topic, the group and the warehouse IS healthy, so the
# only thing that says otherwise is the slot and the watcher.
#
# First failing layer: postgres. Root-cause layer: postgres. Proposed fix: none graded; ending the
#   backfill is the postgres owner's (priya) call.
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector,
#   pg_drop_replication_slot, schema_register, schema_set_compatibility.
#
# Expected with the guard in enforce mode: a flat healthy verdict is refused while the watcher row
# fires; the agent must read pg_long_transactions / pg_streaming_liveness, find the transaction and
# say so. No guard_refusals bound is set: a model that reads first is refused 0 times, one that
# does not is refused up to twice and then accepted at low confidence, which fails the root cause.
#
# Traps:
#   - connect_status, the topic, the group and the warehouse are healthy: "nothing to fix".
#   - pg_long_transactions' list is empty (the writer is younger than its 5 min threshold).
#   - the slot is active and confirmed_flush_lsn advances; restart_lsn is the flat one.

name: long-tx-slot-stuck-watcher-firing
description: |
  At about 11:35 UTC a backfill job ("refund-backfill") opened a transaction on public.orders,
  wrote to it (it holds an xid) and has left it open, idle in transaction, for 4 min 50 s. It
  holds the WAL horizon of the logical slot debezium_orders: restart_lsn is flat, so Postgres
  retains all WAL since then (204.7 MiB, growing about 740 kB/s). The connector itself is
  healthy: RUNNING, task 0 streams, confirmed_flush_lsn advances, the topic is fresh, order-sync
  has no lag and the warehouse is current. The watcher has had long_tx firing for 4 minutes and
  slot_wal for 2 minutes, and has not cleared either.

  Root cause: an open transaction (pid 51877, app refund-backfill, has_xid, idle in
  transaction) holds the WAL horizon, so restart_lsn is flat and retained WAL grows until it
  commits or rolls back. The pipeline is not healthy while that holds, however green Connect,
  Kafka and the warehouse look.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

# The watcher's row for the pipeline, read through agent.Deps.Watch: both signals firing, neither
# clearing (no clearing_since), checked 20 s ago. Offsets are from the start of the run.
watch_status:
  checked_at: -20s
  signals:
    - {signal: long_tx, state: firing, severity: sev2, since: -4m}
    - {signal: slot_wal, state: firing, severity: sev3, since: -2m}

alert:
  title: 'orders: watcher long_tx firing (replication slot debezium_orders restart_lsn not moving, 204.7 MiB of WAL retained and growing; connector RUNNING)'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] WARN slot_active=true slot_retained=204.7 MiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=2s ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] OK stale_for=4s ts_column=updated_at
      from: group:order-sync (unconfirmed)

