# C7 setup scenario (U1-19): the person's own Compose file runs the Connect service with
# privileged: true, and the setup validator refuses the document before anything starts. The label
# names the validator rule and the fixing op (tasks/U-board.md row U1-19, step 1). Format:
# evals/README.md (C6). The rule and its message are internal/setup/targets/compose's
# (validator.go, knownRefusals, RulePrivilege).
#
# RECORDED: NO, and no pipeline read is replayed: this incident happens before the stack exists.
# The stack never came up, so there is no pipeline for the room's read tools to answer about, and
# the refusal is compose_write's/compose_up's own result (a *RuleError the server turns into the
# T2 preview's reason), not a CDC read. The one replayed read is similar_incidents, the past-room
# lookup that answers before the stack exists; it is the evidence the hypothesis cites. U1-20 adds
# the setup runner replay (evals/setup) and the setup prompt; when it lands, record compose_write's
# refusal for this file's stack (rule privilege, service connect) and make it the required fact and
# evidence tool. Clock: 2026-10-25T09:40:00Z.
#
# First failing layer: kafka-connect (the service the file would run). Root-cause layer:
#   kafka-connect. Nothing is running yet: the document is refused before compose_up.
#
# Expected label: validator rule privilege - "compose: privilege: service \"connect\":
#   \"privileged\" runs the container with host privileges". The fix is to render the stack from
#   the driver's templates with compose_write (the connect template renders no privileged, cap_add,
#   devices or security_opt, no host network mode and no writable bind outside the plugin
#   directory), then compose_up. file_write cannot edit the file: the compose names
#   (compose.yaml, compose.yml, compose.override.yaml, docker-compose*.yml) are refused, so the
#   template is the only writer.
#   No expect.fix: compose_write and compose_up are runner ops
#   (internal/setup/targets/compose), not room actions.
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector - no
#     connector runs; the stack was never created.
#   Forbidden: connect_update_connector_config, schema_register, schema_set_compatibility - they
#     act on a running stack and the registry; a compose field is the problem.
#
# Also refused, and not this incident: the validator's other rules (an image not in the
#   knowledge allow-list or without its pinned digest, the other privilege fields, a bind outside
#   the project, the Docker socket, /, extends, a build:, a port not on 127.0.0.1 for a local
#   target, a plain-text credential in an environment). Each has its own test in
#   validator_test.go; a hypothesis that names one of them is a wrong cause.
#
# Sources:
#   - internal/setup/targets/compose/validator.go: knownRefusals maps "privileged" to
#     RulePrivilege, "runs the container with host privileges", whatever its value (true or
#     false); RuleError.Error renders "compose: <rule>: service \"<svc>\": <detail>".
#   - internal/setup/targets/compose/validator_test.go: {"privileged", "    privileged: true\n",
#     protocol.ClassLocal, RulePrivilege} and {"privileged false is still the field",
#     "    privileged: false\n", protocol.ClassLocal, RulePrivilege}: the field is refused whatever
#     its value.
#   - internal/setup/targets/compose/templates.go: no template renders privileged, cap_add,
#     devices, security_opt, pid, ipc, userns_mode or a host network mode.
#   - internal/setup/ops/files.go: file_write refuses the compose file names, so a hand edit is
#     not an op the room can propose.
#   - docs/design/setup-agent.md §2.5: a validator failure makes the step T2 with the reason in
#     the preview and nothing runs.

name: setup/compose-privileged-refused
description: |
  The person brought their own compose.yaml for the project (copied from a blog post), with the
  connect service declared as privileged: true. The setup run stopped at the compose step: the
  validator refused the document with rule privilege - "compose: privilege: service \"connect\":
  \"privileged\" runs the container with host privileges" - before compose_up, so no container was
  created, no connector exists, and the orders pipeline is not running in this project.

  Root cause: the compose file's connect service asks for host privileges (privileged: true), which
  the setup validator refuses outright: the agent may start only allow-listed images without
  privileged, added capabilities, host devices or changed namespaces.

  Expected label: validator rule privilege. Fix by re-rendering the stack from the driver's
  templates with compose_write (the connect template renders no privileged field) and starting it
  with compose_up; file_write refuses the compose file names, so the template is the only writer.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

alert:
  title: 'orders setup: the compose step was refused before compose_up - validator rule privilege failed on the connect service; no container started'
  # No pipeline_map: nothing is running in this project yet, so the room has no topology to show.

recordings:
  - tool: similar_incidents
    summary: |-
      No similar closed incident found on pipeline orders (3 past rooms searched).

inputs:
  - kind: steer
    from: arjun
    text: "The setup run refused my compose file and says something about privileges on the connect service. I copied that stack from a blog post that runs fine on my laptop. What exactly is refused, and what should the file say instead?"

expect:
  root_cause:
    - [privileged, host privileges, cap add, security opt]
    - [compose file, yaml, stack]
  # The wrong stories of a stack that never started.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - [permission denied]
    - [disk full]
    - [retention, delet*]
    - [image, digest]
    - [plain text, credential]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  evidence_tools: [similar_incidents]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_register, schema_set_compatibility]
  max_tool_calls: 6
