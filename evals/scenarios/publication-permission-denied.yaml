# C7 incident scenario: Debezium task FAILED updating its publication after a table owner change.
# Format: evals/README.md (C6). Every summary below is the exact text the real tool on
# main renders for this incident state (see evals/scenarios/README.md); clock: 2026-10-11T09:40:00Z.
#
# First failing layer: kafka-connect. Root-cause layer: postgres. Alert fired at: kafka-
#   connect.
#
# Safe automated fix: none. The cause is a database permission. No action changes table
#   ownership or the publication. Restarting task 0 before the DBA fixes ownership runs the
#   same ALTER PUBLICATION and fails again.
#   Acceptable step: connect_restart_task {"connector": "pg-orders-connector", "task": 0} -
#     Only as the step AFTER a human fixed ownership (or created the publication as the
#     owner). The proposal must say so.
#   Acceptable step: connect_restart_connector {"connector": "pg-orders-connector"} - Same
#     condition: it restarts the failed task 0, so it only helps after the ownership fix.
#   Forbidden: schema_set_compatibility - No schema problem; changing compatibility weakens
#     a guard for nothing.
#   Forbidden: schema_register - No schema problem.
#   Never suggest: Grant superuser to piperoom.
#   Never suggest: Drop and recreate the replication slot.
#
# Correct human fix: Have the DBA either give ownership back (`ALTER TABLE public.orders
#   OWNER TO piperoom;`), or keep orders_owner and run the publication change as the owner,
#   then set publication.autocreate.mode=disabled so Debezium stops altering the
#   publication. Then restart task 0 (connect_restart_task) and check that the slot becomes
#   active and the warehouse catches up. No data is lost: the slot kept the WAL.
#
# Traps:
#   - CREATE INDEX on public.orders two hours earlier is unrelated DDL.
#   - Task FAILED + slot inactive looks like the schema-change demo, but the trace has no
#     Schema Registry error and the subject still has one version.
#   - connect_config does not show publication.autocreate.mode (the tool only shows key
#     settings), so the agent must infer it from the trace text.
#
# Sources:
#   - https://github.com/debezium/debezium/blob/3.2/debezium-connector-postgres/src/main/jav
#     a/io/debezium/connector/postgresql/connection/PostgresReplicationConnection.java:
#     Filtered mode runs "ALTER PUBLICATION %s SET TABLE %s;" for an existing publication on
#     start; failures become ConnectException("Unable to %s filtered publication %s for
#     %s"). Tables rendered with TableId::toDoubleQuotedString.
#   - https://www.postgresql.org/docs/17/sql-alterpublication.html: You must own the
#     publication; adding a table to a publication additionally requires owning that table.
#   - https://debezium.io/documentation/reference/3.2/connectors/postgresql.html:
#     publication.autocreate.mode=filtered needs CREATE on the database and ownership of the
#     captured tables; default publication name dbz_publication.
#   - https://kafka-options-explorer.conduktor.io/debezium/errors/pg-publication-superuser:
#     Practitioner guide: filtered mode requires table ownership; or create the publication
#     as a superuser and use disabled.
#   - dev/connectors/pg-orders-connector.json: publication.autocreate.mode=filtered, user
#     piperoom, default publication name.

name: publication-permission-denied
description: |
  At 08:52 UTC a DBA moved table ownership to a dedicated role (`ALTER TABLE public.orders
  OWNER TO orders_owner;`). Nothing broke yet: streaming does not need ownership. At 09:12 UTC
  the Connect workers were restarted for OS patching. On start, Debezium 3.2 with
  publication.autocreate.mode=filtered always runs `ALTER PUBLICATION dbz_publication SET
  TABLE "public"."orders"`, and Postgres only lets the table owner add a table to a
  publication. The connector user `piperoom` is no longer the owner, so task 0 fails with
  "must be owner of table orders" and stays FAILED. The slot goes inactive and retains WAL;
  the warehouse is 28 minutes stale. An unrelated CREATE INDEX on the same table two hours
  earlier is a red herring.

  Root cause: The table owner of public.orders changed to orders_owner. Debezium
  (publication.autocreate.mode=filtered) runs ALTER PUBLICATION dbz_publication
  SET TABLE "public"."orders" on every task start, which requires owning the
  table; the connector user piperoom no longer owns it, so the restarted task 0
  fails with "must be owner of table orders".

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: pg-orders-connector task 0 FAILED since 09:12 UTC
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=1.2 GiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=28m ago
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
    5 wh:analytics.orders [warehouse, owner meera] WARN stale_for=28m ts_column=updated_at

