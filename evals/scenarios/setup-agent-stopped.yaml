# C7 setup scenario (U4d): SQL Server Agent on the source stopped after the setup run, so CDC's
# capture job no longer moves changes from the transaction log into the change tables. The
# connector and its task stay RUNNING and Debezium logs nothing; only the source's own state says
# why nothing flows. The label names the failing check and the fix with its tier (Jira KAN-5
# rows U4b and U4d, step 4). Format: evals/README.md (C6). Built on `devctl setup-break
# agent-stopped` (dev/mssql/README.md, cmd/devctl/setupbreaks_mssql.go, U4c).
#
# RECORDED: NO. Every summary and data payload is the exact output format of the real
# connect_status, connect_config, connect_worker_logs, debezium_metrics, kafkatools and dbtools
# code from main, composed by hand (the U1-19 approach; this session has no Docker, and the SQL
# Server source driver, U4b, is not on main). The check name and its message are devctl's
# verifyMSSQLAgentRunning, which reads what the U4a client's AgentState reads. Clock:
# 2026-10-26T09:40:00Z. Runner session: evals/setup/recordings/setup-agent-stopped.json. To
# re-record both on the dev stack, see evals/scenarios/README.md, "Setup scenarios: SQL Server
# (U4d)".
#
# Timeline: 09:20 the setup run registered mssql-orders-connector (snapshot of dbo.orders, 100
#   rows); 09:22 the first verification was green on rungs 1 to 7 (canary 1 on
#   mssql.orders.dbo.piperoom_canary). 09:30 a DBA stopped SQL Server Agent to hold the nightly
#   jobs (xp_servicecontrol STOP SQLServerAGENT) and did not start it again. 09:33 the person
#   inserted order 101 into dbo.orders: it never reached Kafka. 09:39 the re-verification's
#   canary 2 was not captured (rung canary_event red). 09:40 the re-run of the prerequisite checks:
#   sqlserver-agent-running failed.
#
# First failing layer: postgres (the source layer: the capture job is a SQL Server Agent job on
#   the source; owners.yaml has no sqlserver source_kind yet, so the source layer is named
#   postgres). Root-cause layer: postgres. Connect, Kafka and the registry are healthy.
#
# Expected label: failing check sqlserver-agent-running ("SQL Server Agent is Stopped; CDC capture
#   and cleanup jobs do not run"); fix: start SQL Server Agent. Its tier (U4b): T2 service_restart
#   of the SQL Server service on a host target (with the Agent enabled); on this Compose project the
#   SQL Server container is the person's own, not one this room created, so it is a documented ask
#   to the person or DBA (EXEC xp_servicecontrol N'START', N'SQLServerAGENT' as a sysadmin, or
#   restart the container with MSSQL_AGENT_ENABLED=true); on managed SQL (Azure SQL Managed
#   Instance, RDS) a documented ask to the provider's console. No connector action: once the
#   capture job runs again it reads the log from its last LSN (CDC holds log truncation until
#   it has captured), and the RUNNING task streams order 101 and canary 2 without a restart.
#   No room action starts the Agent, so there is no expect.fix.
#   Forbidden: connect_restart_task, connect_restart_connector - the task is RUNNING; a restart
#     starts no Agent job and changes nothing.
#   Forbidden: connect_resume_connector - the connector is not paused or stopped.
#   Forbidden: connect_update_connector_config, connect_delete_connector,
#     connect_reset_source_offsets - no connector setting or offset is wrong; resetting the
#     offsets would re-snapshot for nothing.
#   Forbidden: schema_register, schema_set_compatibility - the registry is fine.
#
# Traps:
#   - Everything on the Connect side is green: connector and task RUNNING, no WARN line,
#     "streaming connected=true". Debezium polls the change tables and finds nothing new, so it
#     has nothing to complain about.
#   - The first canary is on the topic: capture worked until 09:30. The new canary (key
#     4f2a9c71e0b85d36a1c7e2f09b4d8a65) and order 101 are not.
#   - The room's source tools cannot read a SQL Server source today (source_settings errors); the
#     Agent state comes from the setup check in the alert.
#
# Sources:
#   - cmd/devctl/setupbreaks_mssql.go: breakMSSQLAgentStopped (xp_servicecontrol STOP),
#     verifyMSSQLAgentRunning's detail "SQL Server Agent is <status>; CDC capture and cleanup jobs
#     do not run", check name sqlserver-agent-running; fixMSSQLAgentStopped (xp_servicecontrol
#     START); dev/mssql/README.md: a container restart with MSSQL_AGENT_ENABLED=true starts it too.
#   - internal/clients/sqlserver/readers.go: AgentState (sys.dm_server_services, the Agent sessions
#     fallback on Linux).
#   - Jira KAN-5 U4b: "Agent stopped is a check whose fix is T2 (service_restart on a host
#     target) or a documented ask on managed SQL".
#   - https://learn.microsoft.com/sql/relational-databases/track-changes/about-change-data-capture-sql-server:
#     the capture and cleanup jobs are SQL Server Agent jobs; the log is not truncated until the
#     capture job has processed it.

name: setup/agent-stopped
description: |
  The SQL Server pipeline orders-mssql was set up at 09:20 and verified at 09:22 (rungs 1 to 7
  green). At 09:30 a DBA stopped SQL Server Agent on the source to hold the nightly jobs and did not
  start it again. The order the person inserted at 09:33 (id 101) never reached Kafka, and the
  re-verification at 09:39 failed at rung canary_event: the new canary is not on the topic. The
  re-run of the prerequisite checks fails sqlserver-agent-running: "SQL Server Agent is Stopped;
  CDC capture and cleanup jobs do not run". mssql-orders-connector and task 0 are RUNNING, its
  worker logs no warning and the snapshot's 100 rows and the first canary are on Kafka.

  Root cause: SQL Server Agent is stopped on the source database, so the CDC capture job does not
  run and no change reaches the change tables Debezium reads.

  Expected label: failing check sqlserver-agent-running; fix: start SQL Server Agent (T2
  service_restart on a host target, or a documented ask to the DBA here: xp_servicecontrol START
  or a container restart with MSSQL_AGENT_ENABLED=true); no connector action.

setup:
  source_kind: sqlserver
  target: compose

pipeline:
  id: orders-mssql
  title: Orders CDC (SQL Server)
  topic_prefix: mssql.orders
  source_tables: [dbo.orders]
  connectors: [mssql-orders-connector]

resources:
  connectors: [mssql-orders-connector]
  subjects: [mssql.orders.dbo.orders-key, mssql.orders.dbo.orders-value, mssql.orders.dbo.piperoom_canary-key, mssql.orders.dbo.piperoom_canary-value]

alert:
  # The title names the rung and the check, not the check's message: the message states the cause
  # (it is in the description), and a title that hands the cause back must not pass.
  title: 'orders-mssql setup: re-verification failed at rung canary_event (the canary key is absent from Kafka); prerequisite check sqlserver-agent-running failed'
  pipeline_map: |
    pipeline orders-mssql
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:dbo.orders [postgres, owner priya] UNKNOWN
    2 connect:mssql-orders-connector [kafka-connect, owner arjun] OK tasks_running=1
      from: pg:dbo.orders
    3 topic:mssql.orders.dbo.orders [kafka, owner arjun] OK newest_record=19m ago
      from: connect:mssql-orders-connector

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders-mssql}
    summary: |
      pipeline orders-mssql
      legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
      1 pg:dbo.orders [postgres, owner priya] UNKNOWN
      2 connect:mssql-orders-connector [kafka-connect, owner arjun] OK tasks_running=1
        from: pg:dbo.orders
      3 topic:mssql.orders.dbo.orders [kafka, owner arjun] OK newest_record=19m ago
        from: connect:mssql-orders-connector
    data:
      edges:
        - from: pg:dbo.orders
          to: connect:mssql-orders-connector
        - from: connect:mssql-orders-connector
          to: topic:mssql.orders.dbo.orders
      nodes:
        - health: unknown
          id: pg:dbo.orders
          kind: source_table
          layer: postgres
          name: dbo.orders
          owner: priya
        - facts:
            tasks_running: "1"
          health: ok
          id: connect:mssql-orders-connector
          kind: connector
          layer: kafka-connect
          name: mssql-orders-connector
          owner: arjun
        - facts:
            newest_record: 19m ago
          health: ok
          id: topic:mssql.orders.dbo.orders
          kind: topic
          layer: kafka
          name: mssql.orders.dbo.orders
          owner: arjun
      pipeline_id: orders-mssql
  - tool: connect_status
    input: {connector: mssql-orders-connector}
    summary: |-
      mssql-orders-connector (source): RUNNING on connect:8083.
      Task 0: RUNNING
    data:
      name: mssql-orders-connector
      state: RUNNING
      tasks:
        - id: 0
          state: RUNNING
      type: source
      worker: connect:8083
  - tool: connect_config
    input: {connector: mssql-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.sqlserver.SqlServerConnector
      database.encrypt: false
      database.hostname: mssql
      database.names: orders
      database.password: ***
      database.port: 1433
      database.user: piperoom_cdc
      schema.history.internal.kafka.bootstrap.servers: kafka:9092
      schema.history.internal.kafka.topic: schema-changes.orders-mssql
      table.include.list: dbo.orders,dbo.piperoom_canary
      topic.prefix: mssql
    data:
      connector.class: io.debezium.connector.sqlserver.SqlServerConnector
      database.encrypt: "false"
      database.hostname: mssql
      database.names: orders
      database.password: '***'
      database.port: "1433"
      database.user: piperoom_cdc
      schema.history.internal.kafka.bootstrap.servers: kafka:9092
      schema.history.internal.kafka.topic: schema-changes.orders-mssql
      table.include.list: dbo.orders,dbo.piperoom_canary
      topic.prefix: mssql
  - tool: debezium_metrics
    input: {connector: mssql-orders-connector}
    summary: |-
      mssql-orders-connector: streaming connected=true, 0.0 s behind source, last event 18 min ago, queue 0/8192, 1 events seen; snapshot running=false, completed=true, rows scanned of table orders.dbo.orders 100, orders.dbo.piperoom_canary 0, 100 events seen
    data:
      connector: mssql-orders-connector
      metrics_found: 12
      rows_scanned_by_table:
        orders.dbo.orders: 100
        orders.dbo.piperoom_canary: 0
      snapshot:
        SnapshotCompleted: 1
        SnapshotRunning: 0
        TotalNumberOfEventsSeen: 100
      streaming:
        Connected: 1
        MilliSecondsBehindSource: 0
        MilliSecondsSinceLastEvent: 1084000
        QueueRemainingCapacity: 8192
        QueueTotalCapacity: 8192
        TotalNumberOfEventsSeen: 1
      topic_prefix: mssql
  - tool: connect_worker_logs
    input: {connector: mssql-orders-connector}
    summary: |-
      Worker log lines naming mssql-orders-connector at WARN or above, 2026-10-26T08:40:00Z to 2026-10-26T09:40:00Z: 0 line(s), newest last (all of them in data).
      No matching lines. The connector may log nothing at this level, or its lines may not name it (Debezium's own lines name the topic prefix); try level INFO or a longer since.
    data:
      bytes: 0
      connector: mssql-orders-connector
      lines: []
      min_level: WARN
      since: "2026-10-26T08:40:00Z"
      summary_lines: 0
      until: "2026-10-26T09:40:00Z"
  - tool: kafka_topic_offsets
    input: {topic: mssql.orders.dbo.orders}
    summary: |-
      partition 0: 0–100 (100 records), newest 19 min ago
    data:
      partitions:
        - end: 100
          last_timestamp: "2026-10-26T09:21:04Z"
          partition: 0
          start: 0
      topic: mssql.orders.dbo.orders
      total_records: 100
  - tool: kafka_topic_offsets
    input: {topic: mssql.orders.dbo.piperoom_canary}
    summary: |-
      partition 0: 0–1 (1 records), newest 18 min ago
    data:
      partitions:
        - end: 1
          last_timestamp: "2026-10-26T09:22:06Z"
          partition: 0
          start: 0
      topic: mssql.orders.dbo.piperoom_canary
      total_records: 1
  - tool: kafka_find_by_key
    input: {topic: mssql.orders.dbo.orders}
    summary: |-
      not found: no record with key "101" since 2026-10-26T09:30:00Z
    data:
      found: false
      key: "101"
      records: null
      topic: mssql.orders.dbo.orders
      truncated: false
  - tool: kafka_find_by_key
    input: {topic: mssql.orders.dbo.piperoom_canary}
    summary: |-
      not found: no record with key "4f2a9c71e0b85d36a1c7e2f09b4d8a65" since 2026-10-26T09:30:00Z
    data:
      found: false
      key: 4f2a9c71e0b85d36a1c7e2f09b4d8a65
      records: null
      topic: mssql.orders.dbo.piperoom_canary
      truncated: false
  - tool: schema_registry_subjects
    summary: |-
      mssql.orders.dbo.orders-key
      mssql.orders.dbo.orders-value
      mssql.orders.dbo.piperoom_canary-key
      mssql.orders.dbo.piperoom_canary-value
  - tool: similar_incidents
    summary: |-
      No similar closed incident found on pipeline orders-mssql (0 past rooms searched).
  # The room's source tools have no SQL Server reader on main: the real tools' answer.
  - tool: source_settings
    error: 'dbtools: source_settings: the source client cannot read database settings'
  - tool: source_role_grants
    error: 'dbtools: source_role_grants: the source client cannot read database settings'
  - tool: source_table_replication
    error: 'dbtools: source_table_replication: the source client cannot read database settings'
  # Calls no recording above covers: the real tools' not-found answers.
  - tool: connect_status
    error: 'connect: GET /connectors/<name>/status: not found'
  - tool: connect_config
    error: 'connect: GET /connectors/<name>/config: not found'
  - tool: pipeline_map
    error: 'out of scope: pipeline_id "default" is not this room''s pipeline "orders-mssql"; read tools only work on the room''s own pipeline'
  - tool: kafka_topic_offsets
    error: 'kafka: topic <topic>: not found'

inputs:
  - kind: steer
    from: priya
    text: "The setup was green twenty minutes ago and now my test order never shows up, and the new canary failed too. The connector says RUNNING. What stopped, and what do I need to do about it?"

expect:
  root_cause:
    - [sql server agent, agent]
    - [stop*, not running, down]
  # The wrong stories of a RUNNING connector that streams nothing.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - [permission denied]
    - [include list]
    - [not tracked]
    - [cdc, disabled, table]
    - [connector, paused]
    - [offset*, reset]
    - [network, unreachable]
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_connect_running
      tool: connect_status
      match: [task 0, running]
      required: true
    - id: f_order_missing
      tool: kafka_find_by_key
      match: [not found, '101']
    - id: f_canary_missing
      tool: kafka_find_by_key
      match: [not found, 4f2a9c71e0b85d36a1c7e2f09b4d8a65]
    - id: f_no_event
      tool: debezium_metrics
      match: [streaming connected true, last event 18 min ago]
    - id: f_no_warning
      tool: connect_worker_logs
      match: [0 line s]
  claims:
    - about: root_cause
      facts: [f_connect_running, f_order_missing, f_canary_missing, f_no_event]
  evidence_tools: [connect_status]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, connect_delete_connector, connect_reset_source_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 12
