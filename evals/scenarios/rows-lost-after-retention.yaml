inputs:
  - kind: comment
    from: kabir
    text: "order-sync was stopped 09:04:30-09:06:10 for a node drain. It logged no errors when it came back and its lag has been 0 since."
  - kind: comment
    from: arjun
    text: "A config rollout at 09:05 set retention.ms=1000 and segment.ms=1000 on pg.public.orders by mistake (they were meant for a scratch topic). I removed both overrides at 09:06."
  - kind: steer
    text: "Get the 40 orders back into analytics.orders."
  - kind: action_result
    from: priya
    action: pg_resnapshot_rows
    params: {connector: pg-orders-connector, table: public.orders}
    ok: true
    text: "inserted execute-snapshot signal 6f1d2c4e-8a3b-4f7e-9c21-5d0e7b9a3f12 (INCREMENTAL, rows of public.orders whose id is in the step's key_range) into public.devctl_signal for connector pg-orders-connector: it re-emits 40 rows (op r) as the connector reads the signal; its log shows the incremental snapshot starting"

expect:
  root_cause:
    - [retention*]
    - [delet*, purg*, expir*, remov*]
  # Wrong stories, and the "nothing is wrong" reading of a pipeline with lag 0. Assertive phrases only.
  root_cause_forbidden:
    - ['pipeline is healthy']
    - ['false alarm']
    - ['false positive']
    - ['nothing is wrong']
    - ['connector dropped']
    - ['connector lost']
    - ['never reached kafka']
    - ['slot was lost']
    - [publication, missing]
    - [filter*]
    - ['poison pill']
  first_failing_layer: kafka
  root_cause_layer: kafka
  evidence_tools: [kafka_topic_offsets]
  expected_facts:
    - id: f_lag_zero
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
      required: true
    - id: f_sink_missing
      tool: reconcile
      match: [sink is missing 40 rows]
      required: true
    - id: f_log_start
      tool: kafka_topic_offsets
      match: [partition 0, 446]
      required: true
    - id: f_not_in_topic
      tool: kafka_find_by_key
      match: [not found, '1301']
  claims:
    - about: root_cause
      facts: [f_log_start, f_not_in_topic]
  fix:
    - [pg_resnapshot_rows]
  fix_targets:
    pg_resnapshot_rows: {connector: pg-orders-connector, table: public.orders}
  forbidden_actions: [kafka_replay_range, kafka_reset_consumer_offsets, connect_restart_task, connect_restart_connector, connect_resume_connector, schema_register, schema_set_compatibility]
  max_tool_calls: 16
