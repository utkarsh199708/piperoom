# C7 recovery scenario (X2e): a retention cut on the CDC topic deleted 40 change events while
# order-sync was stopped; when it came back its committed offset was below the log start, so it
# resumed at the earliest retained offset and skipped them without an error. Lag 0, Connect
# RUNNING, slot active: the 40 rows are in public.orders and nowhere downstream. Format:
# evals/README.md (C6). Built on `devctl break rows-lost-after-retention` (dev/scenarios.md §18).
#
# RECORDED: NO (synthesised from the code paths). Every summary and data payload below is the
# exact output of the real kafkatools, dbtools and topology code at bcee33c9, run by a throwaway
# generator (not committed; the X1e generator, extended with a log start per partition) over
# fake clients holding the state the break leaves, scoped like dev/owners.recovery.yaml. Clock:
# 2026-10-22T09:40:00Z. Nothing was read from a running stack; it must be re-recorded there
# (evals/scenarios/README.md, "Recovery scenarios (X2e)"). The reconcile answers ran on the fixed
# clock with an explicit window; the second is the same tool over 09:00-09:10, served as a
# sequence so a narrowed second call gets the key diff.
#
# Timeline (the break): 09:04:30 order-sync stopped (node drain); 09:05:00 retention.ms=1000 and
# segment.ms=1000 set on pg.public.orders; 50 orders (ids 1301-1350) written in five batches of
# 10, two seconds apart, so each batch rolls a new segment; every older segment is deleted (the
# whole history and ids 1301-1340); 09:06:00 the overrides removed; 09:06:10 order-sync back: its
# offsets are below the log start, auto.offset.reset=earliest, it loads ids 1341-1350; 09:06:20
# marker order 1351 loaded. The stack is idle after that.
#
# First failing layer: kafka (the topic lost records before the consumer read them).
# Root-cause layer: kafka (the retention override).
#
# Expected fix: pg_resnapshot_rows on public.orders with key_range id 1301..1340 (40 rows): the
#   connector re-emits exactly the lost rows from the source (incremental snapshot with an
#   additional condition, through the signal table public.devctl_signal the break configures).
#   The replay's executed step is scripted (ok); the agent's own recovery check (X2c) then
#   counts the range at the source and the sink: before 40 rows, after 0.
#   Forbidden: kafka_replay_range - the range is below the log start (446/447/447): those
#     records were deleted, so Kafka cannot replay them; its Validate refuses and says to use
#     pg_resnapshot_rows.
#   Forbidden: kafka_reset_consumer_offsets - a reset reads only the 11 retained records; the
#     deleted events cannot come back (and order-sync is running).
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector - Connect
#     is RUNNING and streamed every event; a restart re-emits nothing.
#   Forbidden: schema_register, schema_set_compatibility - no schema is involved.
#
# Traps:
#   - reconcile and trace_record both say the 40 rows never reached the topic ("the topic
#     carried only 10 change events for 50 source rows (connector side)", "kafka-connect: not_seen"):
#     offsets by time read only what is retained, so deleted records look unwritten. The
#     connector did stream them: the log start (kafka_topic_offsets: the topic holds 11 records,
#     offsets from 446/447) shows they were deleted.
#   - kafka_topic_config shows the default retention: the override is already gone; only the
#     kafka owner's comment names it.
#   - The map's warehouse FAIL (stale_for=33m) is the idle stack: nothing was written after the
#     marker order, which the sink holds.
#
# Replay of the recovery (evals/README.md, X2e note in evals/replay_actions.go): no read tool
# counts a key range, so resources.tables declares public.orders' key column and the ids that
# hold rows; the sink holds what the run's executed pg_resnapshot_rows steps re-emitted.
# kafka_topic_offsets refuses the reprocess topic (not a CDC topic), so resources.topics
# declares it (empty) for kafka_replay_range's Validate. There is no recovered phase: X2c's
# verdict ("pipeline recovered" status) is not a tool read, and evals/verify_score.go would
# count it as a claim without a re-check.
#
# Sources:
#   - cmd/devctl/scenarios_recovery.go breakRowsLostAfterRetention: the timeline above.
#   - internal/actions/pgactions/resnapshot_rows.go: Describe, Execute's result text.
#   - internal/actions/kafka_replay_range.go belowLogStart: the refusal.

name: rows-lost-after-retention
description: |
  order-sync was stopped from 09:04:30 to 09:06:10 UTC for a node drain. At 09:05 a config rollout
  set retention.ms=1000 on pg.public.orders by mistake; 50 orders written at 09:05 rolled
  segments and the broker deleted the change events of ids 1301-1340 before order-sync read
  them. When order-sync came back its committed offsets were below the log start, so it
  resumed at the earliest retained offset (auto.offset.reset=earliest) without an error. Lag is
  0, Connect RUNNING, the slot active; the 40 orders are in public.orders only.

  Root cause: the retention override on pg.public.orders deleted the 40 change events before the
  consumer read them.

  Expected fix: pg_resnapshot_rows on public.orders for id 1301-1340 (the events are gone from
  Kafka, so kafka_replay_range cannot replay them).

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at
  reprocess_topic: pg.public.orders.reprocess

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]
  # What pg_resnapshot_rows reads that no tool shows: the key column and the ids that hold rows,
  # the signal table the break configures and the publication it is in.
  tables:
    public.orders: {primary_key: true, estimated_rows: 1351, key_column: id, key_ranges: [[1, 1351]]}
    public.devctl_signal: {primary_key: true, signal_columns: true}
  publications:
    dbz_publication: [public.orders, public.devctl_signal]
  topics:
    pg.public.orders.reprocess: {partitions: 3}

