expect:
  outcome: abstain
  # Abstaining is only right after looking: the lag, Connect and the DDL log.
  expected_facts:
    - id: f_lag_spread_stable
      tool: kafka_consumer_lag
      match: [stable, 1 members, total lag 4826]
      required: true
    # Required (E6b review, kept): the prompt says "before abstaining ... confirm each stage
    # with its own status read; the pipeline map is a summary, not a status read". Connect is
    # the stage upstream of the lag; abstaining without its status is the guess this scenario
    # tests against. One read, inside the 14 budget.
    - id: f_connect_running
      tool: connect_status
      match: [task 0, running]
      required: true
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl since]
      required: true
    - id: f_slot_active
      tool: pg_replication_slots
      match: [active true]
  evidence_tools: [kafka_consumer_lag, connect_status, pg_recent_ddl]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 14
