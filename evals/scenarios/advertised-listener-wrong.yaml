inputs:
  - kind: steer
    from: arjun
    text: "I rolled kafka-2 at 09:14 with the new Helm values for the listener split; it came back fine and the ISR is full. The Connect workers and Piperoom run on the ops VMs, outside the Kubernetes cluster; order-sync runs inside it. Find out why the connector cannot write."

expect:
  root_cause:
    - [advertis*, listener*]
    - [kafka-2, broker 2, node 2, headless, cluster.local, kubernetes, internal, svc]
    - [resolv*, dns, "no such host", unreachable, reach*, outside]
  # The stories a failed producer invites. A clause with a negator is skipped
  # ("broker 2 is not down" is fine).
  root_cause_forbidden:
    - [broker*, down]
    - [no leader]
    - [leader, offline]
    - [disk*, full]
    - [not enough replicas]
    - [sasl]
    - [authenticat*]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka
  expected_facts:
    - id: f_batches_expired
      tool: connect_status
      match: [task 0, failed, expiration, pg public orders 1]
      required: true
    - id: f_isr_full
      tool: kafka_cluster_health
      match: [3 brokers, 0 under replicated, 0 offline]
      required: true
    - id: f_p1_lag_unknown
      tool: kafka_consumer_lag
      match: [lag unknown, pg public orders 1]
    - id: f_slot_inactive
      tool: pg_replication_slots
      match: [active false]
    - id: f_listener_fails
      tool: net_probe
      match: [listeners fail, node 2 advertises, not reachable from here]
      required: true
  claims:
    - about: root_cause
      facts: [f_batches_expired, f_isr_full, f_p1_lag_unknown, f_listener_fails]
  evidence_tools: [connect_status, kafka_cluster_health, net_probe]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_update_connector_config, connect_resume_connector, kafka_reset_consumer_offsets, pg_drop_replication_slot]
  max_tool_calls: 14
