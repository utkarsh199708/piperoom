# C7 incident scenario (X1e): the same change events are on pg.public.orders twice (same key, same
# payload, same source.lsn), as after an at-least-once redelivery. order-sync reprocessed them
# without harm (the load is an upsert by id): lag 0, warehouse correct. Format: evals/README.md
# (C6). Built on `devctl break consumer-duplicates` (X1g, dev/scenarios.md §16).
#
# RECORDED: NO (synthesised from the code paths). Every summary and data payload below is the
# exact output of the real kafkatools, dbtools and topology code at c71c4477, run by a throwaway
# generator (not committed) over fake clients holding the state the break leaves on an idle dev
# stack, scoped like dev/owners.yaml. Clock: 2026-10-21T09:40:00Z. The duplicate scan is the
# clients.DupScanner contract computed over the generator's event log (key fingerprints are the
# SHA-256 of the Confluent-framed Avro key), not the kafka client reading a topic. Nothing was
# read from a running stack; it must be re-recorded there (evals/scenarios/README.md,
# "Silent-corruption scenarios (X1e)").
#
# How the room opens: the drift watcher (X1b). The alert title is the exact title the real
# internal/watch code wrote when the generator ran it over the same state (first scan at
# 09:40:00 over 09:25-09:40: 10 duplicate events in 21 records, sev3). It opens with `alert`
# here, not `start: watcher`: the eval watcher (evals/watcher_start.go, C6) has no Kafka client
# and accepts connector_down, slot_inactive and slot_wal only.
#
# First failing layer: kafka (the topic holds each of the 10 events twice). Root-cause layer:
# kafka, or kafka-connect (an unclean connector restart that replays from its last flushed
# offset is the usual producer of such copies; nothing here proves which writer it was).
#
# Outcome: healthy now, with a past finding (ruling R4, tasks/W4-evals-to-100.md, applied in W4n,
# KAN-497; prompt rule 7). The sink fully absorbed the redelivery, so "the pipeline is healthy
# now" is right as long as the hypothesis also states the duplicates; the forbidden rows that
# contradicted it are gone: "pipeline is healthy", "pipeline healthy" and "nothing is wrong" (the
# answer to "Is analytics.orders wrong?" is "nothing is wrong with it now"). The rows that deny
# the finding itself (false positive, false alarm) stay: the duplicates are real.
#
# Expected fix: none. Kafka cannot delete single records, and the upsert sink is already right.
#   The finding is that consumers must stay idempotent (a non-upsert consumer would double count).
#   Forbidden: kafka_reset_consumer_offsets - replaying reprocesses everything to remove nothing.
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector - a
#     restart is how a connector redelivers; Connect is RUNNING.
#   Forbidden: schema_register, schema_set_compatibility, connect_update_connector_config.
#
# Traps:
#   - Everything is green: lag 0, warehouse in sync, reconcile shows the sink matches the source.
#   - The 10 copies are not new source changes: one source row, one LSN, two records. A story of
#     the application inserting twice is wrong (pg_row shows each order once; same lsn).
#   - 0 order regressions: the copies are the newest event of each key, so nothing is out of order.
#   - The marker order (77, 4200) is one of the ten: the break copies the newest event per key.
#
# Sources:
#   - cmd/devctl/scenarios_silent.go breakConsumerDuplicates: 10 inserts (customer g, amount
#     600+g), the marker order, then the newest record of each of 10 keys from the tail produced
#     again (same key and value, default partitioner: same partition).
#   - internal/clients/clients.go DupScanner, DupReport; internal/watch/drift.go dupReading.

name: consumer-duplicates
description: |
  At 09:31:43 UTC ten change events of pg.public.orders were written to the topic a second time:
  same key, same payload, same source.lsn, the way an at-least-once redelivery (an unclean
  connector restart replaying from its last flushed offset, or a relay re-publishing a window)
  leaves them. They are the newest events of the orders written at 09:31:40-41. order-sync
  reprocessed them; its load is an upsert by id, so analytics.orders is right and lag is 0. The
  drift watcher's dup_keys opened the room at 09:40.

  Root cause: duplicate change events (each event delivered twice, same key and lsn) on
  pg.public.orders from a redelivery upstream of the consumer; no source row changed twice.

  Expected fix: none (the upsert sink absorbs them; no action removes records from a topic).

