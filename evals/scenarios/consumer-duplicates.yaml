expect:
  root_cause:
    - [duplicat*, twice, redeliver*, republish*, replay*, copies]
    - [lsn*, 'same key', 'same keys', 'same event', 'same events', 'same change event*', 'same payload']
  root_cause_forbidden:
    - ['false positive']
    - ['false alarm']
    - ['inserted twice']
    - ['double insert*']
    - ['duplicate inserts']
    - ['out of order']
    - [retention, delet*]
    - ['poison pill']
    - [rebalanc*]
  first_failing_layer: kafka
  root_cause_layer: kafka
  root_cause_layer_alt: [kafka-connect]
  evidence_tools: [kafka_dup_keys]
  expected_facts:
    - id: f_dups
      tool: kafka_dup_keys
      match: [10 duplicate events, 10 keys]
      required: true
    - id: f_same_lsn
      tool: kafka_dup_keys
      match: [repeats lsn]
    - id: f_lag_zero
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
    - id: f_sink_matches
      tool: reconcile
      match: [sink matches the source]
    - id: f_two_records
      tool: kafka_find_by_key
      match: [found 2 record]
  claims:
    - about: root_cause
      facts: [f_dups, f_same_lsn, f_two_records]
  forbidden_actions: [kafka_reset_consumer_offsets, connect_restart_task, connect_restart_connector, connect_resume_connector, schema_register, schema_set_compatibility, connect_update_connector_config]
