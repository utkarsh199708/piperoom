    input: {pipeline_id: payments}
    summary: |
      pipeline payments
      1 pg:public.payments [postgres, owner priya] WARN slot_active=false slot_retained=212.4 MiB
      2 connect:pg-payments-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
      3 connect:wh-payments-sink [kafka-connect, owner arjun] OK
      4 topic:pay.public.payments [kafka, owner arjun] OK newest_record=9m ago
      5 group:connect-wh-payments-sink [consumer, owner kabir] OK lag=0 state=Stable
      6 wh:analytics.payments [warehouse, owner meera] WARN stale_for=9m ts_column=updated_at
  - tool: connect_list_connectors
    summary: |-
      pg-payments-connector (source): RUNNING, 1 failed tasks
      wh-payments-sink (sink): RUNNING, 0 failed tasks
  - tool: connect_status
    input: {connector: pg-payments-connector}
    summary: |-
      pg-payments-connector (source): RUNNING on connect-1:8083.
      Task 0: FAILED:
      org.apache.kafka.connect.errors.ConnectException: Failed to authenticate to the Kafka broker
      Caused by: org.apache.kafka.common.errors.SaslAuthenticationException: Authentication failed during authentication due to invalid credentials with SASL mechanism SCRAM-SHA-512
  - tool: connect_status
    input: {connector: wh-payments-sink}
    summary: |-
      wh-payments-sink (sink): RUNNING on connect-2:8083.
      Task 0: RUNNING
      Task 1: RUNNING
  - tool: connect_config
    input: {connector: pg-payments-connector}
    summary: |-
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: payments
      database.hostname: postgres
      database.password: ***
      database.port: 5432
      database.user: piperoom
      key.converter: io.confluent.connect.avro.AvroConverter
      slot.name: debezium_payments
      table.include.list: public.payments
      topic.prefix: pay
      value.converter: io.confluent.connect.avro.AvroConverter
      sasl.mechanism: SCRAM-SHA-512
      security.protocol: SASL_SSL
      sasl.jaas.config: ***
  - tool: connect_config
    input: {connector: wh-payments-sink}
    summary: |-
      connector.class: io.confluent.connect.jdbc.JdbcSinkConnector
      key.converter: io.confluent.connect.avro.AvroConverter
      value.converter: io.confluent.connect.avro.AvroConverter
  - tool: schema_registry_subjects
    summary: |-
      pay.public.payments-key
      pay.public.payments-value
  - tool: schema_registry_versions
    input: {subject: pay.public.payments-value}
    summary: |-
      pay.public.payments-value: versions [1 2], latest id 5, compatibility BACKWARD (global)
  - tool: schema_registry_versions
    input: {subject: pay.public.payments-key}
    summary: |-
      pay.public.payments-key: versions [1], latest id 1, compatibility BACKWARD (global)
  - tool: schema_registry_diff
    input: {subject: pay.public.payments-value, from_version: 1}
    summary: |-
      + Value.status_reason: [null, string]
  - tool: schema_registry_diff
    input: {subject: pay.public.payments-value}
    error: 'bad tool input: from_version or schema is required'
  - tool: kafka_topic_offsets
    input: {topic: pay.public.payments}
    summary: |-
      partition 0: 12706447–21206447 (8500000 records), newest 9 min ago
      partition 1: 12698902–21198902 (8500000 records), newest 9 min ago
      partition 2: 12711360–21211360 (8500000 records), newest 9 min ago
  - tool: kafka_topic_config
    input: {pipeline_id: payments}
    summary: |-
      pay.public.payments: retention.ms=604800000, retention.bytes=-1, cleanup.policy=delete, min.insync.replicas=2, 3 partitions, replication factor 3
  - tool: kafka_acls
    summary: |-
      User:debezium: ALLOW DESCRIBE cluster; ALLOW CREATE,DESCRIBE,WRITE topic pay. (PREFIXED)
      User:wh-sink: ALLOW READ group connect-wh-payments-sink (LITERAL); ALLOW READ topic pay.public.payments (LITERAL)
  - tool: kafka_acls
    input: {principal: 'User:debezium'}
    summary: |-
      User:debezium: ALLOW DESCRIBE cluster; ALLOW CREATE,DESCRIBE,WRITE topic pay. (PREFIXED)
  - tool: kafka_list_groups
    summary: |-
      connect-wh-payments-sink: Stable
  - tool: kafka_consumer_lag
    input: {group: connect-wh-payments-sink}
    summary: |-
      connect-wh-payments-sink: Stable, 2 members, total lag 0
        pay.public.payments/1: committed 21198902, end 21198902, lag 0
        pay.public.payments/0: committed 21206447, end 21206447, lag 0
        pay.public.payments/2: committed 21211360, end 21211360, lag 0
  - tool: pg_replication_slots
    summary: |
      slot debezium_payments: active=false retained=212.4 MiB wal_status=reserved
  - tool: pg_recent_ddl
    summary: |
      2026-10-09T14:20:11Z CREATE INDEX public.payments_status_idx | CREATE INDEX CONCURRENTLY payments_status_idx ON public.payments (status); | app_migrator
  - tool: pg_recent_ddl
    input: {table: public.payments}
    summary: |
      2026-10-09T14:20:11Z CREATE INDEX public.payments_status_idx | CREATE INDEX CONCURRENTLY payments_status_idx ON public.payments (status); | app_migrator
  - tool: pg_long_transactions
    summary: |
      pid=31877 user=app_payments app=payments-api state=active age=43m wait=Lock:transactionid verb=UPDATE writer=yes
  - tool: warehouse_freshness
    input: {table: analytics.payments, ts_column: updated_at}
    summary: |-
      newest=2026-10-14T13:51:02Z (stale for 9m)
  - tool: trace_record
    input: {pipeline_id: payments, table: public.payments, key: '77120'}
    summary: |
      postgres public.payments: seen updated_at=2026-10-14T13:58:31.118402Z
      kafka-connect pg-payments-connector: stopped_here tasks_failed=1
      kafka pay.public.payments: not_seen
      consumer connect-wh-payments-sink: not_seen
      warehouse analytics.payments: not_seen
      stopped at: kafka-connect pg-payments-connector
  - tool: pg_row
    input: {pipeline_id: payments, table: public.payments, pk_column: id, key: '77120'}
    summary: |-
      found: yes, updated_at=2026-10-14T13:58:31.118402Z, columns=[amount, id=77120, status, updated_at=2026-10-14T13:58:31.118402Z]
  - tool: warehouse_row
    input: {pipeline_id: payments, table: analytics.payments, pk_column: id, key: '77120'}
    summary: |-
      not found
  - tool: pipeline_map
    error: 'bad tool input: topology: bad input: pipeline "<id>" not found'
  - tool: connect_status
    error: 'connect: GET /connectors/<name>/status: not found'
  - tool: connect_config
    error: 'connect: GET /connectors/<name>/config: not found'
  - tool: schema_registry_versions
    error: 'schemareg: GET /subjects/<subject>/versions: not found: schema registry error 40401: Subject ''<subject>'' not found.'
  - tool: schema_registry_diff
    error: 'schemareg: GET /subjects/<subject>/versions/latest: not found: schema registry error 40401: Subject ''<subject>'' not found.'
  - tool: kafka_topic_offsets
    error: 'kafka: topic <topic>: not found'
  - tool: kafka_consumer_lag
    error: 'kafka: group <group>: not found'
  - tool: pg_row
    summary: |-
      not found
  - tool: warehouse_row
    summary: |-
      not found
  - tool: trace_record
    summary: |
      postgres public.payments: not_seen
      kafka-connect pg-payments-connector: not_seen
      kafka pay.public.payments: not_seen
      consumer connect-wh-payments-sink: not_seen
      warehouse analytics.payments: not_seen
  # E5c: answers for calls the agent made that no recording covered (baseline run 38655252568).
  - tool: similar_incidents
    input: {pipeline_id: "payments"}
    summary: |-
      No similar closed incident found on pipeline payments (2 past rooms searched).
  - tool: debezium_metrics
    input: {connector: "pg-payments-connector"}
    summary: |-
      pg-payments-connector: metrics found: 0 of 12 under prefix "debezium_metrics_" (set DEBEZIUM_METRICS_PREFIX, or the exporter has no samples for topic.prefix "pay")
  - tool: kafka_cluster_health
    summary: |-
      cluster Xk3vN8pQSz2mR1aYb7dEfg (3 brokers, controller 1); log dirs below 85% used
      pay.public.payments: 3 partitions, 0 under-replicated, 0 under min ISR (min 2), 0 offline, 0 reassigning

inputs:
  - kind: steer
    from: Priya
    text: "pg-payments-connector task 0 is FAILED and the slot has been inactive for 9 minutes. Find out why before anyone restarts it."

expect:
  root_cause:
    - [sasl, authenticat*, credential*, password*, secret*]
    - [rotat*, changed, expired, invalid, 'no longer valid', 'out of date', stale]
  # The trap story: missing ACLs. A negated clause ("the ACLs are not missing") does not fire.
  root_cause_forbidden:
    - [missing, acl*]
    - [grant*, acl*]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka
  expected_facts:
    - id: f_sasl_failed
      tool: connect_status
      match: [task 0, failed, sasl authentication exception, invalid credentials]
      required: true
    - id: f_acls_intact
      tool: kafka_acls
      match: [user debezium, allow, write, topic]
      required: true
    - id: f_sink_fine
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
  claims:
    - about: root_cause
      facts: [f_sasl_failed]
  evidence_tools: [connect_status, kafka_acls]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 12
