# C7 incident scenario (P3g-1): a new table the connector should capture never reaches Kafka,
# because it is not in the Debezium publication. Format: evals/README.md (C6). Built on
# `devctl break missed-table` (dev/scenarios.md §8, PR #613).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# kafkatools, dbtools and topology code from main, run by a throwaway generator (not
# committed) over fake clients holding the state that `devctl break missed-table` leaves on
# the dev stack, scoped by dev/owners.p3.yaml (the owners file these scenarios need). Clock:
# 2026-10-18T09:40:00Z. Nothing here was read from a running stack (the P3g-1 session had no
# Docker; dev/scenarios.md §8-§11 are not observed yet either). To replace it with a real
# recording, see evals/scenarios/README.md, "P3 scenarios (P3g-1)".
#
# First failing layer: postgres (the publication). Root-cause layer: postgres. Nothing
#   FAILS: the connector and task are RUNNING, the slot is active, order-sync has lag 0.
#
# Expected fix (the label): pg_add_publication_table {connector: pg-orders-connector,
#   publication: dbz_publication, table: public.devctl_refunds} (postgres owner approves; new
#   refunds flow from then on), then
#   pg_snapshot_signal {connector: pg-orders-connector, tables: [public.devctl_refunds]} for
#   the 25 rows written before (an incremental snapshot). pg_snapshot_signal, not
#   connect_snapshot_table: the break registers the connector with
#   signal.data.collection=public.devctl_signal and no signal.kafka.topic (Kafka signal channel
#   off), so connect_snapshot_table (via signal_topic, the only via it accepts since #620)
#   refuses with ErrSignalNotConfigured, and its via signal_table is refused at every stage in
#   favour of the postgres-layer pg_snapshot_signal (#633). `devctl fix missed-table` writes the
#   same execute-snapshot row.
#   expect.fix cannot name these actions yet: evals.LiveActions registers only
#   actions.Register's seven, so -validate rejects pgactions names as unknown actions. P3g-2
#   (C6) registers the P3 actions on replay clients; then set
#   `fix: [[pg_add_publication_table], [pg_snapshot_signal]]` (pg_snapshot_signal needs #633
#   merged). Until then the run is graded on root cause, layers, facts and forbidden actions.
#   Forbidden: connect_restart_task, connect_restart_connector - restarting changes nothing:
#     with publication.autocreate.mode=disabled Debezium never adds the table, and nothing failed.
#   Forbidden: connect_resume_connector - the connector is RUNNING (Validate refuses it anyway).
#   Forbidden: schema_register, schema_set_compatibility - no subject exists for the table
#     because no record was ever produced; a schema is not missing, the data is.
#   Not forbidden, but not the fix: connect_update_connector_config with
#     publication.autocreate.mode=filtered would let Debezium rewrite the publication the DBA
#     owns, and would not re-emit the 25 rows already written.
#
# Traps:
#   - Everything is green: an agent that looks for FAILED, lag or an inactive slot finds
#     nothing. The warehouse looks stale (41 m), but only because the dev stack is quiet: the
#     marker order written after the refunds reached analytics.orders.
#   - connect_config shows table.include.list with public.devctl_refunds, so "add the table to
#     the include list" is wrong: it is there. connect_config hides publication.* and signal.*
#     keys (evals/scenarios/README.md, tool gaps); only pg_publication_tables shows the gap.
#   - pg_recent_ddl shows the CREATE TABLE, which looks like a schema-change story.
#
# Sources:
#   - cmd/devctl/scenarios_p3.go breakMissedTable and missedTableConnector (#613): the SQL,
#     the connector keys and the 25 refunds.
#   - dev/scenarios.md §8: expected symptoms; the fix is pg_add_publication_table, then the
#     incremental snapshot for the rows written before.
#   - Debezium PostgreSQL connector docs, publication.autocreate.mode=disabled: the connector
#     neither creates nor changes the publication; pgoutput decodes only published tables.
#   - internal/actions/snapshot_table.go (#620) and the pg_snapshot_signal branch (#633).

name: missed-table
description: |
  At 08:57 UTC the app team created public.devctl_refunds and added it to
  pg-orders-connector's table.include.list (with signal.data.collection=public.devctl_signal
  for incremental snapshots), but the DBA owns the publication
  (publication.autocreate.mode=disabled) and nobody added the table to dbz_publication. pgoutput
  only decodes published tables, so the 25 refunds written since never reach Kafka: topic
  pg.public.devctl_refunds does not exist. The connector, task 0, the slot and order-sync are
  all healthy; nothing failed.

  Root cause: public.devctl_refunds is not in the publication dbz_publication.

  Expected fix (label): pg_add_publication_table, then pg_snapshot_signal (an incremental
  snapshot of public.devctl_refunds through the connector's signal table).

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders, public.devctl_refunds]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at
  watch:
    dlq_topics:
      - {topic: devctl.order-sync.dlq, written_by: order-sync}

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

