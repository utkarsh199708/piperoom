    from: priya
    text: "I own the publication. Tell me what is missing and propose the change; the 25 refunds already written must reach Kafka too."

expect:
  root_cause:
    - [publication*]
    - [devctl refunds, refunds, refund, new table]
  # Assertive phrases of the wrong "something failed" story; nothing failed here.
  root_cause_forbidden:
    - ['task failed']
    - ['task 0 failed']
    - ['connector failed']
    - ['connector crashed']
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_not_in_publication
      tool: pg_publication_tables
      match: [devctl refunds, in publication no]
      required: true
    - id: f_task_running
      tool: connect_status
      match: [task 0, running]
    - id: f_in_include_list
      tool: connect_config
      match: [table include list, devctl refunds]
  claims:
    - about: root_cause
      facts: [f_not_in_publication]
  evidence_tools: [pg_publication_tables]
  # P3g-2: fix: [[pg_add_publication_table], [pg_snapshot_signal]] (see the header).
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, schema_register, schema_set_compatibility]
  max_tool_calls: 14
