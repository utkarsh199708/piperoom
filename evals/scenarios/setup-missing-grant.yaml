  - tool: pg_recent_ddl
    summary: |
      (no DDL since 2026-10-24T09:40:00Z)
  - tool: kafka_topic_offsets
    input: {topic: pg.public.orders}
    summary: |-
      partition 0: 0–1428 (1428 records), newest 36 min ago
      partition 1: 0–1417 (1417 records), newest 36 min ago
      partition 2: 0–1403 (1403 records), newest 36 min ago
    data:
      partitions:
        - end: 1428
          last_timestamp: "2026-10-25T09:04:10Z"
          partition: 0
          start: 0
        - end: 1417
          last_timestamp: "2026-10-25T09:04:10Z"
          partition: 1
          start: 0
        - end: 1403
          last_timestamp: "2026-10-25T09:04:10Z"
          partition: 2
          start: 0
      topic: pg.public.orders
      total_records: 4248
  - tool: kafka_consumer_lag
    input: {group: order-sync}
    summary: |-
      order-sync: Stable, 1 members, total lag 0
        pg.public.orders/0: committed 1428, end 1428, lag 0
        pg.public.orders/1: committed 1417, end 1417, lag 0
        pg.public.orders/2: committed 1403, end 1403, lag 0
    data:
      group: order-sync
      members: 1
      state: Stable
      total_lag: 0
      worst_partitions:
        - committed: 1428
          end: 1428
          lag: 0
          partition: 0
          topic: pg.public.orders
        - committed: 1417
          end: 1417
          lag: 0
          partition: 1
