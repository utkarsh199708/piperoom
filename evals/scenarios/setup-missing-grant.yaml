# C7 setup scenario (U1-19): the setup run created its connector role without REPLICATION and
# without SELECT on the captured table, so the connector cannot log in as a replication client or
# read the snapshot. The label names the failing check and the fixing op (tasks/U-board.md row
# U1-19, step 1). Format: evals/README.md (C6). Built on `devctl setup-break missing-grant`
# (dev/scenarios.md, "Setup breaks", PR #880).
#
# RECORDED: NO. Every summary and data payload is the exact output of the real source_role_grants,
# connect_config, connect_status, dbtools and kafkatools code from main, composed by hand from
# those tools' format strings and the Postgres error the dev task shows (the Q2g/Q3f approach;
# this session has no Docker). Clock: 2026-10-25T09:40:00Z, scoped like dev/owners.yaml. To
# re-record it on the dev stack, see evals/scenarios/README.md, "Setup scenarios (U1-19)".
#
# First failing layer: kafka-connect (task 0 FAILED). Root-cause layer: postgres (the role's
#   attributes and grants). The slot never became active: the snapshot every start takes fails
#   before the connector creates one.
#
# Expected label: failing check source-role-grants ("role devctl_setup_grant is missing
#   REPLICATION, SELECT on public.orders"); fixing ops: ALTER ROLE devctl_setup_grant WITH
#   REPLICATION (the setup source driver's role grant; no room action sets a role attribute in
#   this wave), source_grant_select {connector: pg-orders-connector, role: devctl_setup_grant,
#   tables: [public.orders]} (SELECT and nothing else; the action refuses a role that is not the
#   connector's own database.user), then connect_restart_task {connector: pg-orders-connector,
#   task: 0} so the snapshot runs again.
#   source_grant_select is not registered in evals.LiveActions this wave (Q2h adds it), so there is
#   no expect.fix: the check and the ops are in this label and in the alert.
#   Forbidden: connect_update_connector_config - putting the baseline (superuser-ish) piperoom role
#     back is exactly what the least-privilege setup avoids, and its allow-list cannot change
#     database.user anyway.
#   Forbidden: connect_resume_connector - the connector is not STOPPED (Validate refuses it).
#   Forbidden: pg_drop_replication_slot - no slot exists, and a slot is not what is missing.
#   Forbidden: schema_register, schema_set_compatibility - the task never produced a record.
#
# Traps:
#   - The task error says "permission denied for table orders", which reads like the table owner
#     story; here the role is the connector's own least-privilege user, and REPLICATION is missing
#     too, which the Postgres error does not say (source_role_grants does).
#   - source_settings is fine (wal_level=logical), so a server-setting story fails.
#   - No DDL ran and the schema has one version: a schema-change story fails.
#
# Sources:
#   - cmd/devctl/setupbreaks.go: breakSetupMissingGrant creates devctl_setup_grant with LOGIN only
#     (CONNECT on orders and USAGE on public; no REPLICATION, no SELECT), points the connector at
#     it and restarts task 0 until it FAILS; verifySourceRoleGrants' detail "role <r> is missing
#     REPLICATION, SELECT on public.orders"; check name source-role-grants.
#   - https://www.postgresql.org/docs/17/sql-grant.html: a logical replication connection needs
#     LOGIN and REPLICATION; the snapshot reads the table with SELECT.
#   - internal/tools/dbtools/source_settings.go: source_role_grants' summary (exists, login,
#     replication, selectable per table); internal/actions/sourceactions/grant_select.go: the
#     action's params and its refusal unless role is the connector's database.user and lacks
#     SELECT.
#   - dev/scenarios.md: the dev fix re-registers the baseline connector user and drops the role,
#     which is a baseline restore, not the setup's incident fix.

name: setup/missing-grant
description: |
  The person re-ran piperoom-setup to rebuild the connector role. The run created
  devctl_setup_grant (LOGIN only: CONNECT on orders, USAGE on public, no REPLICATION, no SELECT on
  public.orders) and pointed pg-orders-connector at it. It stopped at the role step: check
  source-role-grants fails with "role devctl_setup_grant is missing REPLICATION, SELECT on
  public.orders". Task 0 was restarted and FAILED with "permission denied for table orders"; no
  replication slot was created; order-sync is Stable at lag 0 and analytics.orders is 36 minutes
  stale. The server settings, the schema and the topic are unchanged.

  Root cause: the connector's role devctl_setup_grant has neither REPLICATION (needed for a logical
  replication connection) nor SELECT on public.orders (needed by the snapshot), so task 0 fails and
  no slot is created.

  Expected label: failing check source-role-grants; fixing ops ALTER ROLE devctl_setup_grant WITH
  REPLICATION, source_grant_select for public.orders, then connect_restart_task for task 0.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'orders setup: check source-role-grants failed; pg-orders-connector task 0 FAILED (permission denied for table orders) and analytics.orders is 36m stale'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] UNKNOWN slot=missing
    2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=36m ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=36m ts_column=updated_at
      from: group:order-sync (unconfirmed)

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders}
    summary: |
      pipeline orders
      legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
      1 pg:public.orders [postgres, owner priya] UNKNOWN slot=missing
      2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
        from: pg:public.orders
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=36m ago
        from: connect:pg-orders-connector
      4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
        from: topic:pg.public.orders
      5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=36m ts_column=updated_at
        from: group:order-sync (unconfirmed)
    data:
      edges:
        - from: pg:public.orders
          to: connect:pg-orders-connector
        - from: connect:pg-orders-connector
          to: topic:pg.public.orders
        - from: topic:pg.public.orders
          to: group:order-sync
        - from: group:order-sync
          mapping: inferred
          to: wh:analytics.orders
      nodes:
        - facts:
            slot: missing
          health: unknown
          id: pg:public.orders
          kind: source_table
          layer: postgres
          name: public.orders
          owner: priya
        - facts:
            tasks_failed: "1"
          health: fail
          id: connect:pg-orders-connector
          kind: connector
          layer: kafka-connect
          name: pg-orders-connector
          owner: arjun
        - facts:
            newest_record: 36m ago
          health: ok
          id: topic:pg.public.orders
          kind: topic
          layer: kafka
          name: pg.public.orders
          owner: arjun
        - facts:
            lag: "0"
            state: Stable
          health: ok
          id: group:order-sync
          kind: consumer_group
          layer: consumer
          name: order-sync
          owner: kabir
        - facts:
            stale_for: 36m
            ts_column: updated_at
          health: fail
          id: wh:analytics.orders
          kind: sink_table
          layer: warehouse
          name: analytics.orders
          owner: meera
      pipeline_id: orders
  - tool: source_role_grants
    input: {pipeline_id: orders}
    summary: |-
      connector pg-orders-connector role devctl_setup_grant: exists=yes login=yes replication=no
      selectable tables: 0 of 1
      public.orders: selectable=no
    data:
      connector: pg-orders-connector
      connector_user: devctl_setup_grant
      connector_user_source: connector pg-orders-connector config database.user
      role_info:
        role: devctl_setup_grant
        exists: true
        can_login: true
        replication: false
        selectable:
          public.orders: false
  - tool: connect_status
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector (source): RUNNING on connect:8083.
      Task 0: FAILED:
      org.apache.kafka.connect.errors.ConnectException: An exception occurred in the change event producer. This connector will be stopped.
      Caused by: org.postgresql.util.PSQLException: ERROR: permission denied for table orders
    data:
      name: pg-orders-connector
      state: RUNNING
      tasks:
        - id: 0
          state: FAILED
          error: "org.apache.kafka.connect.errors.ConnectException: An exception occurred in the change event producer. This connector will be stopped.\nCaused by: org.postgresql.util.PSQLException: ERROR: permission denied for table orders"
      worker: connect:8083
  - tool: connect_config
    input: {connector: pg-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: postgres
      database.password: ***
      database.port: 5432
      database.user: devctl_setup_grant
      slot.name: debezium_orders
      table.include.list: public.orders
      topic.prefix: pg
    data:
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: postgres
      database.password: '***'
      database.port: "5432"
      database.user: devctl_setup_grant
      slot.name: debezium_orders
      table.include.list: public.orders
      topic.prefix: pg
  - tool: source_settings
    summary: |-
      wal_level=logical
      max_replication_slots=10
      max_wal_senders=10
      max_slot_wal_keep_size=-1
      wal_sender_timeout=60000 ms
    data:
      - {name: wal_level, value: logical}
      - {name: max_replication_slots, value: "10"}
      - {name: max_wal_senders, value: "10"}
      - {name: max_slot_wal_keep_size, value: "-1"}
      - {name: wal_sender_timeout, value: "60000", unit: ms}
  - tool: pg_replication_slots
    summary: |
      slot debezium_orders: not found in pg_replication_slots
    data: []
  - tool: source_table_replication
    input: {pipeline_id: orders}
    summary: |-
      tables=1 without_primary_key=0 replica_identity_nothing=0
      public.orders: has_primary_key=yes replica_identity=default
    data:
      - table: public.orders
        has_primary_key: true
        replica_identity: default
  - tool: pg_publication_tables
    input: {pipeline_id: orders}
    summary: |
      publication dbz_publication (connector user devctl_setup_grant)
      public.orders: in_publication=yes, selectable=no
    data:
      connector: pg-orders-connector
      connector_user: devctl_setup_grant
      connector_user_source: connector pg-orders-connector config database.user
      publication: dbz_publication
      publication_source: default
      publication_tables:
        - in_publication: true
          schema: public
          selectable: false
          table: orders
      source_tables:
