      1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=28.7 MiB
      2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
      4 group:order-sync [consumer, owner kabir] WARN lag=37864551 state=Empty
      5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=87.6h ts_column=updated_at
  - tool: connect_list_connectors
    summary: |-
      pg-orders-connector (source): RUNNING, 0 failed tasks
  - tool: connect_status
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector (source): RUNNING on connect-1:8083.
      Task 0: RUNNING
  - tool: connect_config
    input: {connector: pg-orders-connector}
    summary: |-
