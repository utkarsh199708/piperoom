      warehouse analytics.orders: not_seen
  # E5c: answers for calls the agent made that no recording covered (baseline run 38655252568).
  - tool: similar_incidents
    summary: |-
      No similar closed incident found on pipeline orders (3 past rooms searched).
  - tool: warehouse_load_errors
    input: {table: "analytics.orders"}
    summary: |-
      postgres warehouse has no load history. analytics.orders: 30512774 rows inserted since stats reset, 18402 dead tuples, last autovacuum 2026-10-13T08:41:27Z, 0 session(s) waiting on a lock

inputs:
  - kind: comment
    from: Kabir
    text: |-
      order-sync: a cost-saver CronJob scaled the deployment to 0 on Fri 2026-10-09 18:24Z and nobody scaled it back. I scaled it up at 09:50 today and every pod dies at once with:
      org.apache.kafka.clients.consumer.OffsetOutOfRangeException: Offsets out of range with no configured reset policy for partitions: {pg.public.orders-0=61204118}
      I will just set the group to start from latest so it gets going again, ok?

expect:
  root_cause:
    - [retention, 'log start', 'aged out', 'deleted by retention']
    - [lost, loss*, delet*, 'aged out', expir*, purg*, removed]
  # "Set the group to start from latest" is the named trap (Kabir's comment):
  # it skips the remaining 48 h as well. A negated clause ("do not reset to
  # latest") does not fire.
  # The header's other trap, "the schema change broke the consumer", is a wrong story a
  # list answer would also tell.
  root_cause_forbidden:
    - [reset*, latest]
    - [loyalty_tier, broke]
    - [loyalty_tier, break*]
    - ['schema change', broke]
    - ['schema change', break*]
  first_failing_layer: kafka
  root_cause_layer: kafka
  root_cause_layer_alt: [consumer]
  # The log start of every partition is above order-sync's committed offset,
  # and retention is 48 h.
  expected_facts:
    - id: f_log_start
      tool: kafka_topic_offsets
      match: [partition 0, "66914377"]
      required: true
    - id: f_committed_below_log_start
      tool: kafka_consumer_lag
      match: [orders/0, committed 61204118]
      required: true
    - id: f_retention_48h
      tool: kafka_topic_config
      match: [retention ms 172800000]
      required: true
    - id: f_group_empty
      tool: kafka_consumer_lag
      match: [empty, 0 members]
  claims:
    - about: root_cause
      facts: [f_log_start, f_committed_below_log_start, f_retention_48h]
  evidence_tools: [kafka_topic_offsets, kafka_consumer_lag, kafka_topic_config]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, schema_set_compatibility, schema_register]
  # Tool budget (W4n, KAN-497; ruling R8; 14 -> 18). Live run 40044762858 #1 used 16 calls and
  # failed on the budget alone (score 98.1), so it is a passing path: 16 + 2 = 18. Its turn split
  # was not read from the transcript; the split of the standard path, NOT MEASURED, is turn 1
  # (the alert) about 12 reads (lag, topic offsets and config, Connect status, freshness, slot,
  # DDL, registry, trace, sink row, similar incidents, load errors) and turn 2 (Kabir's comment)
  # about 4 (lag and offsets again before answering the reset-to-latest question, a key lookup).
  max_tool_calls: 18
