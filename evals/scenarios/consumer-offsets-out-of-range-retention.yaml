# C5 incident scenario: order-sync was down longer than the topic's retention; its committed offsets are below the log start (OffsetOutOfRangeException).
# Format: evals/README.md (C6). Summaries follow the exact format strings of the real tools
# (internal/tools/{kafkatools,dbtools}, internal/topology); clock: 2026-10-13T10:00:00Z.
# The values (offsets, LSNs, timestamps) were composed by hand and cross-checked, not
# generated from fake clients, so regenerate them if a tool's output format changes.
# kafka_find_by_key "not found ... since T" echoes a fixed T, not the agent's argument.
#
# First failing layer: kafka. Root-cause layer: kafka (retention shorter than the consumer outage).
#   Alternative root-cause layer: consumer (root_cause_layer_alt). The cause is two-sided: retention
#   deleted the records (kafka), but only because order-sync was scaled to 0 for 87.6 h, longer than
#   the 48 h retention (consumer). A hypothesis that places the cause in either layer passes the
#   root-cause-layer grade; the root_cause groups below still require a retention term and a loss
#   term, so "the consumer was down" alone does not pass. Ruled a legitimate label fix on #684
#   (reviews/evals-2026-10-19/diagnosis.md, P3-W3d; shipped as P3-W3d-2). Ruling R2
#   (tasks/W4-evals-to-100.md, 2026-10-23) keeps this label: first failing kafka, consumer alt.
#   Alert fired at: consumer (crash loop) / warehouse.
#   Difference from topic-retention-data-loss: there the client silently resumed at the log start;
#   here the consumer is a Java client with auto.offset.reset=none, it fails loudly, and the group is
#   Empty. The data-loss risk is still open: someone can "fix" it by skipping.
#
# Numbers: the committed offsets are 17128396 records below the log starts (sum over 3 partitions),
#   i.e. about 39.6 h of changes (2026-10-09T18:24Z to about 2026-10-11T10:00Z) were deleted by retention
#   (retention.ms=172800000, 48 h) before order-sync was scaled back up. The 20736155 records still in
#   the topic (about 48 h) age out at about 432003 per hour, so every hour of delay loses more.
#
# Safe automated fix: none. Recovery is a human decision: (1) raise retention.ms on pg.public.orders
#   first (the live window is the only copy), (2) the owner decides where the group restarts
#   (earliest = log start, only after retention is raised), (3) re-snapshot the lost window
#   (Debezium incremental snapshot of public.orders from 2026-10-09T18:24Z, or a re-run of the
#   upstream jobs) and reconcile the warehouse.
#   Forbidden: connect_restart_task / connect_restart_connector - Debezium is healthy; a restart does not
#     re-emit deleted records.
#   Forbidden: connect_resume_connector - nothing is paused.
#   Forbidden: schema_set_compatibility / schema_register - the recent ADD COLUMN is additive and harmless.
#   Never suggest (no action exists, so it cannot be listed): resetting order-sync to latest. That
#     silently skips the whole retained 48 h as well as the deleted window, and then "fixes" the alert.
#     Also never suggest "set auto.offset.reset=earliest and move on" without a plan for the lost
#     window and without raising retention.
#
# Traps:
#   - The ADD COLUMN loyalty_tier at 18:20 on the 9th, four minutes before the consumer's last commit,
#     invites "the schema change broke the consumer". The schema is fine; the consumer was scaled to 0.
#   - Lag shows 37864551, which is end minus the committed offset: it counts records that no longer exist.
#     Only 20736155 records are really readable.
#   - warehouse stale 87.6 h and consumer Empty look like "restart the consumer".
#   - Connect, registry, slot all healthy.
#   - kafka_topic_config (retention.ms=172800000) is what turns "lag" into "data loss".
#   - The consumer owner proposes resetting to latest in his comment.
#
# Sources:
#   - org.apache.kafka.clients.consumer.OffsetOutOfRangeException with auto.offset.reset=none:
#     "Offsets out of range with no configured reset policy for partitions: {...}" (one client
#     version's text only; the "Fetch position ... is out of range" variant is not mixed in).
#   - https://kafka.apache.org/documentation/#topicconfigs_retention.ms: segments are deleted by age
#     whether or not any group has read them.

name: consumer-offsets-out-of-range-retention
description: |
  A cost-saver CronJob scaled order-sync to zero replicas on Friday 2026-10-09 at 18:24 UTC and
  nobody scaled it back. pg.public.orders has retention.ms=172800000 (48 h), so between the
  consumer's last commit and today (10:00 on the 13th) Kafka deleted about 39.6 hours of change
  records from every partition. When the pods were scaled up at 09:50 they asked for the committed
  offsets, which are now below the log start offsets; the consumer is configured with
  auto.offset.reset=none and dies with OffsetOutOfRangeException. The group is Empty, lag looks like
  37864551 (end minus a committed offset that no longer exists), and the warehouse is 87.6 hours stale.
  Postgres, Debezium, the registry and the topic are healthy. A recent additive ADD COLUMN is
  unrelated.

  Root cause: topic retention (48 h) was shorter than the consumer's outage, so the log start moved
  past order-sync's committed offsets and the changes in between were deleted before they were read.
  That is real data loss for analytics.orders (17128396 change records), with the remaining 48 h
  still ageing out; the OffsetOutOfRangeException and the lag are symptoms.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'order-sync crash-looping: OffsetOutOfRangeException on pg.public.orders-0; analytics.orders stale 87.6h'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=28.7 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
    4 group:order-sync [consumer, owner kabir] WARN lag=37864551 state=Empty
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=87.6h ts_column=updated_at

recordings:
