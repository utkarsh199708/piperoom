  - tool: kafka_list_groups
    summary: |-
      order-sync: Empty
  - tool: kafka_consumer_lag
    input: {group: order-sync}
    summary: |-
      order-sync: Empty, 0 members, total lag 37864551
        pg.public.orders/0: committed 61204118, end 73831002, lag 12626884
        pg.public.orders/1: committed 60877540, end 73497830, lag 12620290
        pg.public.orders/2: committed 61512900, end 74130277, lag 12617377
  - tool: pg_replication_slots
    summary: |
      slot debezium_orders: active=true retained=28.7 MiB wal_status=reserved
  - tool: pg_recent_ddl
    summary: |
      2026-10-09T18:20:51Z ALTER TABLE public.orders | ALTER TABLE orders ADD COLUMN loyalty_tier varchar(16); | app_migrator
  - tool: pg_recent_ddl
