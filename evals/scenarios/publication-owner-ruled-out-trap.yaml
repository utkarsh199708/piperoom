# C7 incident scenario (H2): a task fails with an ownership error and the room asks the agent to rule
# the publication and the grants out; a rule-out needs a read that shows it.
# Format: evals/README.md (C6). Clock: 2026-10-11T09:40:00Z.
#
# RECORDED: this is publication-permission-denied.yaml, whose summaries are the exact text the real
# tools on main render for the incident state (hand-composed from their format strings), plus ONE
# recording made from the real tool: pg_object_owners (summary and data), run by
# TestGuardOwnerReadIsRealToolOutput in evals/guard_scenarios_test.go over a fake source that says
# public.orders is owned by orders_owner and dbz_publication by piperoom. The scenario differs
# from its parent in the steer (rule things out), expect.max_unbacked_rule_outs: 0 and the
# pg_object_owners fact.
#
# First failing layer: kafka-connect. Root-cause layer: postgres.
# Safe automated fix: none (a database permission). Forbidden: schema_set_compatibility,
#   schema_register. Never suggest: superuser for piperoom, dropping the slot.
#
# Traps:
#   - "The publication and the grants are fine, the owner changed" is a rule-out. The publication
#     is not ruled out by reading connect_status and the DDL log; pg_object_owners or
#     pg_publication_tables read it. The guard refuses the claim until a cited step read it.
#   - pg_publication_tables says selectable=no for the connector user: the ownership change took
#     its SELECT too; that is part of the same fix, not a second incident.
#   - CREATE INDEX two hours earlier is unrelated DDL.

name: publication-owner-ruled-out-trap
description: |
  At 08:52 UTC a DBA moved table ownership to a dedicated role (`ALTER TABLE public.orders
  OWNER TO orders_owner;`). Nothing broke yet: streaming does not need ownership. At 09:12 UTC
  the Connect workers were restarted for OS patching. On start, Debezium 3.2 with
  publication.autocreate.mode=filtered always runs `ALTER PUBLICATION dbz_publication SET
  TABLE "public"."orders"`, and Postgres only lets the table owner add a table to a
  publication. The connector user `piperoom` is no longer the owner, so task 0 fails with
  "must be owner of table orders" and stays FAILED. The slot goes inactive and retains WAL;
  the warehouse is 28 minutes stale. An unrelated CREATE INDEX on the same table two hours
  earlier is a red herring.

  The room asks the agent to rule the publication and the grants in or out before the DBA is
  called. pg_object_owners answers that exactly (the table is owned by orders_owner, the
  publication by piperoom); a "publication and grants ruled out" without a read that shows it
  is the failure this scenario grades.

  Root cause: The table owner of public.orders changed to orders_owner. Debezium
  (publication.autocreate.mode=filtered) runs ALTER PUBLICATION dbz_publication
  SET TABLE "public"."orders" on every task start, which requires owning the
  table; the connector user piperoom no longer owns it, so the restarted task 0
  fails with "must be owner of table orders".

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: pg-orders-connector task 0 FAILED since 09:12 UTC
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=1.2 GiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=28m ago
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
    5 wh:analytics.orders [warehouse, owner meera] WARN stale_for=28m ts_column=updated_at

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders}
    summary: |
      pipeline orders
      1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=1.2 GiB
      2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=28m ago
      4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      5 wh:analytics.orders [warehouse, owner meera] WARN stale_for=28m ts_column=updated_at
  - tool: connect_list_connectors
    summary: |-
      pg-orders-connector (source): RUNNING, 1 failed tasks
  - tool: connect_status
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector (source): RUNNING on connect:8083.
      Task 0: FAILED:
      org.apache.kafka.connect.errors.ConnectException: Unable to update filtered publication dbz_publication for "public"."orders"
      Caused by: org.postgresql.util.PSQLException: ERROR: must be owner of table orders
  - tool: connect_config
    input: {connector: pg-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: postgres
      database.password: ***
      database.port: 5432
      database.user: piperoom
      slot.name: debezium_orders
      table.include.list: public.orders
      topic.prefix: pg
  - tool: schema_registry_subjects
    summary: |-
      pg.public.orders-key
      pg.public.orders-value
  - tool: schema_registry_versions
    input: {subject: pg.public.orders-value}
    summary: |-
      pg.public.orders-value: versions [1], latest id 2, compatibility BACKWARD (global)
  - tool: schema_registry_versions
    input: {subject: pg.public.orders-key}
    summary: |-
      pg.public.orders-key: versions [1], latest id 1, compatibility BACKWARD (global)
  - tool: kafka_topic_offsets
    input: {topic: pg.public.orders}
    summary: |-
      partition 0: 18204113–25610902 (7406789 records), newest 28 min ago
      partition 1: 17998640–25377154 (7378514 records), newest 28 min ago
      partition 2: 18377015–25792418 (7415403 records), newest 28 min ago
  - tool: kafka_list_groups
    summary: |-
      order-sync: Stable
  - tool: kafka_consumer_lag
    input: {group: order-sync}
    summary: |-
      order-sync: Stable, 1 members, total lag 0
        pg.public.orders/0: committed 25610902, end 25610902, lag 0
        pg.public.orders/1: committed 25377154, end 25377154, lag 0
        pg.public.orders/2: committed 25792418, end 25792418, lag 0
  - tool: pg_replication_slots
    summary: |
      slot debezium_orders: active=false retained=1.2 GiB wal_status=reserved
  - tool: pg_recent_ddl
    summary: |
      2026-10-11T08:52:14Z ALTER TABLE public.orders | ALTER TABLE public.orders OWNER TO orders_owner; | dba_ana
      2026-10-11T07:31:02Z CREATE INDEX public.orders_customer_id_idx | CREATE INDEX CONCURRENTLY orders_customer_id_idx ON public.orders (customer_id); | app_migrator
  - tool: pg_recent_ddl
    input: {table: public.orders}
    summary: |
      2026-10-11T08:52:14Z ALTER TABLE public.orders | ALTER TABLE public.orders OWNER TO orders_owner; | dba_ana
  - tool: pg_long_transactions
    summary: |
      (no long transactions)
  - tool: warehouse_freshness
    input: {table: analytics.orders, ts_column: updated_at}
    summary: |-
      newest=2026-10-11T09:11:55Z (stale for 28m)
  - tool: schema_registry_diff
    input: {subject: pg.public.orders-value, from_version: 1}
    summary: |-
      no field changes
  - tool: schema_registry_diff
    input: {subject: pg.public.orders-value}
    summary: |-
      pg.public.orders-value version 1 has no earlier version (available versions: [1]), so there is nothing to diff; pass schema to compare a candidate against it
  - tool: kafka_find_by_key
    input: {topic: pg.public.orders, key: '5634120'}
    summary: |-
      not found: no record with key "5634120" since 2026-10-11T09:30:00Z
  - tool: pg_row
    input: {pipeline_id: orders, table: public.orders, pk_column: id, key: '5634120'}
    summary: |-
      found: yes, updated_at=2026-10-11T09:37:00.118402Z, columns=[amount, customer_id, id=5634120, status, updated_at=2026-10-11T09:37:00.118402Z]
  - tool: warehouse_row
    input: {pipeline_id: orders, table: analytics.orders, pk_column: id, key: '5634120'}
    summary: |-
      not found
  - tool: trace_record
    input: {pipeline_id: orders, table: public.orders, key: '5634120'}
    summary: |
      postgres public.orders: seen updated_at=2026-10-11T09:37:00.118402Z
      kafka-connect pg-orders-connector: stopped_here tasks_failed=1
      kafka pg.public.orders: not_seen
      consumer order-sync: not_seen
      warehouse analytics.orders: not_seen
      stopped at: kafka-connect pg-orders-connector
  - tool: pipeline_map
    error: 'bad tool input: topology: bad input: pipeline "<id>" not found'
  - tool: connect_status
    error: 'connect: GET /connectors/<name>/status: not found'
  - tool: connect_config
    error: 'connect: GET /connectors/<name>/config: not found'
  - tool: schema_registry_versions
    error: 'schemareg: GET /subjects/<subject>/versions: not found: schema registry error 40401: Subject ''<subject>'' not found.'
  - tool: schema_registry_diff
    error: 'schemareg: GET /subjects/<subject>/versions/latest: not found: schema registry error 40401: Subject ''<subject>'' not found.'
  - tool: kafka_topic_offsets
    error: 'kafka: topic <topic>: not found'
  - tool: kafka_consumer_lag
    error: 'kafka: group <group>: not found'
  - tool: pg_row
    summary: |-
      not found
  - tool: warehouse_row
    summary: |-
      not found
  - tool: trace_record
    summary: |
      postgres public.orders: not_seen
      kafka-connect pg-orders-connector: not_seen
      kafka pg.public.orders: not_seen
      consumer order-sync: not_seen
      warehouse analytics.orders: not_seen
  # H2: the ownership read the hypothesis guard asks for before a rule-out. Summary and data are the
  # exact output of the real pg_object_owners (dbtools.RegisterObjectOwners) over the source of
  # evals/guard_scenarios_test.go, checked by TestGuardOwnerReadIsRealToolOutput.
  - tool: pg_object_owners
    input: {pipeline_id: orders}
    summary: |
      owner_differs: public.orders is owned by orders_owner, not by piperoom
      Debezium's role must own the publication and its tables, or be an inheriting member of their owner role, to create or alter the publication (ALTER PUBLICATION ... ADD/SET TABLE); otherwise its task fails with "must be owner of table ..." or "must be owner of publication ..."
      connector pg-orders-connector role piperoom: exists=yes superuser=no replication=yes
      publication dbz_publication (Debezium default name): owner=piperoom all_tables=no publishes 1 of 1 pipeline tables, verdict=connector_is_owner
      public.orders: owner=orders_owner in_publication=yes, verdict=owner_differs
    data:
      connector: pg-orders-connector
      connector_user: piperoom
      connector_user_source: connector pg-orders-connector config database.user
      owner_differs: 1
      publication:
          all_tables: false
          connector_is_member_of_owner: false
          connector_is_owner: true
          exists: true
          name: dbz_publication
          name_source: default
          owner: piperoom
          published_tables:
              - public.orders
          verdict: connector_is_owner
      replication: true
      role_exists: true
      superuser: false
      tables:
          - connector_is_member_of_owner: false
            connector_is_owner: false
            exists: true
            in_publication: true
            owner: orders_owner
            table: public.orders
            verdict: owner_differs
  # E5c: answers for calls the agent made that no recording covered (baseline run 38655252568).
  - tool: similar_incidents
    summary: |-
      No similar closed incident found on pipeline orders (3 past rooms searched).
  - tool: pg_publication_tables
    input: {pipeline_id: "orders"}
    summary: |
      publication dbz_publication (connector user piperoom)
      public.orders: in_publication=yes, selectable=no
  # W4o (KAN-498): reads on the prompt's standard path that the 39994729845 run asked for and no
  # recording above answered. Each summary follows the format strings of the real tool in
  # internal/tools/{dbtools}; the values are composed to agree with the recordings above.
  # Agrees with the pg_publication_tables recording above: the ownership change took the connector role's SELECT on public.orders.
  - tool: source_role_grants
    input: {pipeline_id: orders}
    summary: |
      connector pg-orders-connector role piperoom: exists=yes login=yes replication=yes
      selectable tables: 0 of 1
      public.orders: selectable=no

inputs:
  - kind: steer
    from: priya
    text: "Before I ring the DBA: is it the publication or the grants? I want both ruled out or confirmed, with what you read to know."

expect:
  # "piperoom is not the owner" states the cause; the word grader reads "not
  # the owner" as a denial of "owner", so the phrase is a term of its own.
  root_cause:
    - [owner*, ownership, permission*, privilege*, not the owner, not the table owner, no longer own*]
    - [publication*]
  # Stories the incident invites and the recordings refute (no Schema Registry error; lag 0).
  root_cause_forbidden:
    - [schema change]
    - [consumer lag]
  first_failing_layer: kafka-connect
  root_cause_layer: postgres
  expected_facts:
    - id: f_task_failed
      tool: connect_status
      match: [task 0, failed]
      required: true
    - id: f_must_be_owner
      tool: connect_status
      match: [must be owner of table orders]
      required: true
    - id: f_filtered_publication
      tool: connect_status
      match: [filtered publication, dbz publication]
    - id: f_owner_changed
      tool: pg_recent_ddl
      match: [owner to orders owner]
      required: true
    - id: f_owner_differs
      tool: pg_object_owners
      match: [owner differs, orders owner]
  claims:
    - about: root_cause
      facts: [f_must_be_owner, f_owner_changed]
  evidence_tools: [connect_status, pg_recent_ddl]
  forbidden_actions: [schema_set_compatibility, schema_register]
  # Every "ruled out X" in the final hypothesis rests on a cited read that shows X (the guard's
  # rule 2, agent.UnbackedRuledOut over the steps the hypothesis cites): none without one.
  max_unbacked_rule_outs: 0
  # publication-permission-denied's 14, + 1 for pg_object_owners (ruling R8: not measured live).
  max_tool_calls: 15
