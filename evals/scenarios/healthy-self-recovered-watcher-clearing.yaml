# C7 outcome scenario (H2): the connector recovered on its own and the watcher is already clearing.
# Format: evals/README.md (C6). Clock: 2026-10-11T09:40:00Z.
#
# RECORDED: hand-composed from the format strings of the real tools, over the all-green recordings of
# healthy-after-recovery.yaml (Connect RUNNING, slot active, order-sync lag 0, warehouse 1 minute
# behind); nothing was read from a running stack. Its reconcile recording is left out: it still
# shows the consumer incident's 09:36 gap, which this connector story does not have.
#
# Expected outcome: healthy, with the hypothesis guard in enforce mode and 0 refusals: the watcher
#   row has connector_down with clearing_since set, which rule 1 reads as "the symptom is going".
#   Every action is forbidden: there is nothing to act on.
#
# Traps: the alert still says FAILED (the 09:12 state); a restart of anything is a change on a
#   healthy pipeline.

name: healthy-self-recovered-watcher-clearing
description: |
  At 09:12 UTC a Postgres failover cut the connection and task 0 of pg-orders-connector went
  FAILED; the watcher raised connector_down. Connect's task restarted itself at 09:14 and has
  streamed since: the connector is RUNNING, the slot is active, order-sync is Stable at lag 0 and
  the warehouse is 1 minute behind. Nobody changed anything. The pager re-notified at 09:40 and
  opened this room. The watcher's row still lists connector_down, but it has seen the connector
  healthy for the last 4 minutes and is only waiting out the signal's for-window (clearing_since
  is set). There is nothing to fix; "healthy" is the right verdict and the guard must let it
  through.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

# The watcher's row: connector_down still listed, but the condition has been gone for 4 minutes
# (clearing_since is set), so rule 1 lets a healthy verdict through. Offsets from the start of the run.
watch_status:
  checked_at: -20s
  signals:
    - {signal: connector_down, state: firing, severity: sev2, node: 'connect:pg-orders-connector', since: -28m, clearing_since: -4m}

alert:
  title: 'pg-orders-connector task 0 FAILED at 09:12 UTC (watcher: connector_down; re-notification, first fired 09:12 UTC)'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=31.0 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=2s ago
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
    5 wh:analytics.orders [warehouse, owner meera] OK stale_for=1m ts_column=updated_at

