expect:
  outcome: healthy
  expected_facts:
    - id: f_connect_running
      tool: connect_status
      match: [task 0, running]
      required: true
    - id: f_slot_active
      tool: pg_replication_slots
      match: [active true]
    - id: f_lag_zero
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
  evidence_tools: [connect_status]
  # Guard rule 1 passes: the watcher row is clearing (clearing_since set), so a healthy verdict is
  # not refused. Graded in enforce mode only (nothing is refused in log or off mode).
  guard_refusals: 0
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 10
