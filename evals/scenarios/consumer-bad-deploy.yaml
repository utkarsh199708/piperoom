inputs:
  - kind: comment
    from: kabir
    text: "order-sync 2.14.0 went out at 08:52Z and we stopped it at 09:31Z. 2.13.4 is ready to start again. The warehouse load is an upsert by id."
  - kind: steer
    text: "The consumer stays stopped until we agree. Propose what gets the missing orders into the warehouse."

expect:
  root_cause:
    - [deploy*, redeploy*, build, release, version, 2.14.0]
    - [commit*, offset*]
  # Wrong stories: a crash, a poison record or retention. Assertive phrases only.
  root_cause_forbidden:
    - ['poison pill']
    - ['retention deleted']
    - ['task failed']
    - ['consumer crashed']
  first_failing_layer: consumer
  root_cause_layer: consumer
  expected_facts:
    - id: f_group_empty
      tool: kafka_consumer_lag
      match: [empty, 0 members, total lag 0]
      required: true
    - id: f_sink_missing
      tool: reconcile
      match: [sink is missing 30 rows, consumer side]
    - id: f_trace_committed
      tool: trace_record
      match: [consumer order sync seen committed, stopped at warehouse]
  claims:
    - about: root_cause
      facts: [f_sink_missing, f_trace_committed]
  evidence_tools: [kafka_consumer_lag]
  fix: [[kafka_reset_consumer_offsets]]
  # `to` is left out of the target on purpose. The label allows `to: earliest` or `to: timestamp`
  # at or before 2026-10-18T08:52:00Z, and fix_targets matches equal values only (no bound on a
  # timestamp, no either-or), so no `to` value here would accept both. Pinning `earliest` would
  # fail evals/score_test.go's solved run (a timestamp of 08:50Z). Until C6 adds a one-of or a
  # timestamp bound to the fix_targets matcher, a reset `to: latest` or to a time after the
  # deploy passes the fix check; the header names both as never-suggest.
