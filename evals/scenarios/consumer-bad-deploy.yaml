# C7 incident scenario (P3g-1): a bad consumer build dropped create events but committed
# their offsets, so 30 new orders never reached the warehouse while lag reads 0. Format:
# evals/README.md (C6). Built on `devctl break consumer-bad-deploy` (dev/scenarios.md §10,
# PR #613).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# kafkatools, dbtools and topology code from main, run by a throwaway generator (not
# committed) over fake clients holding the state `devctl break consumer-bad-deploy` leaves on
# the dev stack, scoped by dev/owners.p3.yaml. Clock: 2026-10-18T09:40:00Z. Nothing was read
# from a running stack. The reconcile bucket labels (HH:MM) were relabelled from the
# generator's wall clock to the fixed clock; every other byte is the tools'. See
# evals/scenarios/README.md, "P3 scenarios (P3g-1)".
#
# First failing layer: consumer. Root-cause layer: consumer (the 08:52 deploy of order-sync).
#
# Expected fix (the label): kafka_reset_consumer_offsets {group: order-sync, topics:
#   [pg.public.orders], to: timestamp, timestamp: a time at or before 2026-10-18T08:52:00Z}
#   (consumer owner approves), or to: earliest (the load is an upsert by id, so a full replay
#   is safe; `devctl fix consumer-bad-deploy` does that). The group is Empty with 0 members, so
#   the action's Validate accepts it; then the good build starts and replays.
#   Graded since P3g-2 (expect.fix, fix_targets; `to` is left free). The action's Validate
#   reads the group from the kafka_consumer_lag recording (Empty, 0 members).
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector - the
#     source side is healthy; the topic holds all 30 orders.
#   Forbidden: schema_register, schema_set_compatibility - no schema changed.
#   Never suggest: starting the good build without a reset (it resumes after the committed
#     offsets and never sees the 30 creates), or a reset to latest.
#
# Traps:
#   - Lag is 0 and nothing errors: the bad build committed past what it skipped.
#   - The group is Empty because on-call stopped devconsumer at 09:31, not because it crashed.
#   - Updates loaded after the deploy, so only creates are missing; warehouse_freshness looks
#     like a quiet dev stack, not an outage.
#   - Only reconcile (sink lacks 30 rows the topic has: consumer side) and trace_record for a
#     missing id (seen in Kafka, committed past by order-sync, not in the warehouse) show it.
#
# Sources:
#   - cmd/devctl/scenarios_p3.go breakConsumerBadDeploy (#613): SKIP_OPS=c, 30 inserts, lag
#     back to 0, none of the ids in analytics.orders, then `docker compose stop devconsumer`.
#   - dev/scenarios.md §10: expected symptoms and the fix.
#   - internal/actions/kafka_reset_offsets.go: the group must have no active members; every
#     topic the group has offsets on must be listed.

name: consumer-bad-deploy
description: |
  At 08:52 UTC order-sync was redeployed with a build that drops create events but still
  commits their offsets (updates load). 30 orders inserted at 08:55 reached pg.public.orders,
  were consumed and committed, and never reached analytics.orders; lag went back to 0. On-call
  stopped the consumer at 09:31 when a reconciliation alert fired, so the group is Empty with
  0 members. Connect, the slot and the topic are healthy.

  Root cause: the 08:52 order-sync build skipped create events and committed offsets past
  orders it never loaded.

  Expected fix (label): kafka_reset_consumer_offsets for order-sync on pg.public.orders, to a
  time at or before the 08:52 deploy (or earliest), then start the good build.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders, public.devctl_refunds]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at
  watch:
    dlq_topics:
      - {topic: devctl.order-sync.dlq, written_by: order-sync}

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

# `devctl alert consumer-bad-deploy` posts this reconciliation alert; its description's facts
# (and a sample id a real reconciliation payload carries) are in the title, since
# agent.Alert.Raw never reaches the model (evals/README.md).
