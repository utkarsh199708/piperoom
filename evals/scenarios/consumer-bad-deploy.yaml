    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=1.1 MiB wal_status=reserved
    2 pg:public.devctl_refunds [postgres, owner priya] UNKNOWN slot=unknown
    3 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      from: pg:public.orders
    4 topic:pg.public.orders [kafka, owner arjun] OK newest_record=30m ago
      from: connect:pg-orders-connector
    5 group:order-sync [consumer, owner kabir] WARN lag=0 state=Empty
      from: topic:pg.public.orders
    6 dlq:devctl.order-sync.dlq [consumer, owner kabir] OK exists=false records=0 writer=order-sync
      from: group:order-sync
    7 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=30m ts_column=updated_at
      from: group:order-sync (unconfirmed)

