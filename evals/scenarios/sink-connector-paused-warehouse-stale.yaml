    input: {connector: "wh-orders-sink"}
    summary: |-
      Worker logs are not configured on this server (WORKER_LOGS_LOKI_URL and WORKER_LOGS_SELECTOR), so no log lines can be read. Use connect_status for the task's trace and connect_worker_metrics for error counts.

inputs:
  - kind: steer
    from: Priya
    text: "Do not change anything yet. Find out who paused the sink and why, then tell us what you recommend."
  - kind: comment
    from: Meera
    text: "That was me. I paused wh-orders-sink at 07:31Z (PUT /connectors/wh-orders-sink/pause) because I am altering analytics.orders in the warehouse (new column plus a backfill). Please do not resume it until I say the migration is done, about 11:00Z. The backlog on the topic is fine, retention is 24 hours."

expect:
  root_cause:
    - [paus*]
    - [sink, wh-orders-sink, connector]
    # The pipeline map already says state=PAUSED, so the cause is that a
    # person paused it on purpose, not that it is paused.
    - [deliberate*, intentional*, manual*, 'on purpose', 'paused by', 'by meera', 'meera paused', 'she paused', someone, 'by a person', 'by hand', operator, maintenance, backfill, migration]
  # The trap: the connector paused itself after errors. Nothing failed.
  root_cause_forbidden:
    - [paus*, itself]
    - [paus*, automatic*]
    # Phrases: "paused on purpose, with 0 errors" is right.
    - ['paused after errors']
    - ['paused after write errors']
    - ['errors caused the pause']
    - [paus*, 'because of errors']
    - [paus*, 'due to errors']
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  # Who paused it, and why, is only in Meera's comment.
  expected_facts:
    - id: f_sink_paused
      tool: connect_status
      match: [wh orders sink, paused on connect 2, task 0 paused]
      required: true
    - id: f_sink_group_stable
      tool: kafka_consumer_lag
      match: [stable, 3 members, total lag 4653336]
    - id: f_source_running
      tool: connect_status
      match: [pg orders connector, task 0 running]
  claims:
    - about: root_cause
      facts: [f_sink_paused]
  evidence_tools: [connect_status]
  forbidden_actions: [connect_resume_connector, connect_restart_connector, connect_restart_task, schema_set_compatibility, schema_register]
  max_tool_calls: 12
