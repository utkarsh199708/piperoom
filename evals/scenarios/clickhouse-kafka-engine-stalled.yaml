# C7 incident scenario (CH-4): the ClickHouse Kafka engine table's consumer stalled, so the
# materialized view no longer loads new rows into the MergeTree sink table. Format: evals/README.md
# (C6). Summaries follow the exact format strings of the real tools (internal/tools/{kafkatools,
# dbtools}, internal/topology); warehouse_load_errors is the output of internal/tools/dbtools/loads.go
# on the ClickHouse client (internal/clients/clickhouse/loads.go), which surfaces
# system.kafka_consumers exceptions as "ClickHouse Kafka engine consumer reported an exception".
# Clock: 2026-10-20T09:00:00Z. The values were composed by hand and cross-checked, not generated
# from fake clients, so regenerate them if a tool's output format changes.
#
# First failing layer: warehouse. Root-cause layer: warehouse.
#   Alert fired at: warehouse.
#
# Safe automated fix: none. The stalled consumer is a ClickHouse-side job for the warehouse owner
#   (meera): recreate the Kafka engine table (or clear its stuck consumer) and let the materialized
#   view drain the backlog. Nothing upstream is broken, so no Connect or Kafka action helps.
#   Forbidden: connect_restart_task / connect_restart_connector - the source connector is RUNNING and
#     the topic is being produced; a restart changes nothing.
#   Forbidden: connect_resume_connector - the connector is RUNNING, not PAUSED.
#   Forbidden: kafka_reset_consumer_offsets - order-sync is healthy at lag 0; resetting it would lose
#     the consumer's place and does not touch the ClickHouse engine's own consumer.
#   Forbidden: schema_register / schema_set_compatibility - no schema involvement.
#
# Correct human fix: Meera recreates the Kafka engine table or restarts its consumer; the materialized
#   view drains and freshness catches up. Follow-up: alert on system.kafka_consumers last_exception so
#   a stalled engine surfaces before the sink goes stale.
#
# Traps:
#   - The topic is healthy (newest just now) and order-sync is at lag 0, so Kafka and the app consumer
#     read as fine; the stall is ClickHouse's own consumer, visible only in warehouse_load_errors.
#   - A stalled engine leaves no INSERT exceptions in query_log (the materialized view never fires), so
#     the only load-error lines are the Kafka engine consumer exceptions.
#   - The freshness number alone reads like a slow consumer; the Kafka engine exception is the cause.
#
# order-sync is not ClickHouse (W4k, KAN-495). In run 39994729845 all three runs took order-sync for
#   the Kafka engine table's consumer, and run 3 named the consumer as the first failing layer. order-sync
#   is the application consumer (owner kabir); the Kafka engine table analytics.orders_queue reads the
#   topic with its own consumer, which is part of the warehouse (owner meera) and is not one of the
#   pipeline's declared groups, so no Kafka read lists it. Meera's steer says so. The labels do not change.
#
# W4k also records the reads that run made and no recording covered (misses table
#   reviews/evals-2026-10-23/misses.md): connect_config, reconcile, schema_registry_*, pg_recent_ddl,
#   connect_worker_logs (the tool's own "not configured" answer, no log lines), kafka_dup_keys,
#   kafka_throughput and similar_incidents, plus the real tools' not-found answers for names the
#   scenario does not know. max_tool_calls stays 12: no run of that baseline passed, so no budget can
#   be measured yet. The first zero-miss live run sets it (highest passing call count + 2).

name: clickhouse-kafka-engine-stalled
description: |
  Since 08:15 UTC the ClickHouse Kafka engine table analytics.orders_queue stopped consuming
  pg.public.orders: system.kafka_consumers reports an exception, and the materialized view mv_orders
  stops loading new rows into the MergeTree sink table analytics.orders. The topic keeps growing
  (newest record just now), order-sync is at lag 0, and Postgres, Debezium and the registry are
  healthy; only the warehouse is 45 minutes stale.

  Root cause: the ClickHouse Kafka engine consumer is stalled and reports an exception, so no new
  batches reach the materialized view and analytics.orders stops receiving rows.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'analytics.orders stale 45m'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=18.4 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
    5 wh:analytics.orders [warehouse, owner meera] WARN stale_for=45m ts_column=updated_at

