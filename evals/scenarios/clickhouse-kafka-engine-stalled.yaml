inputs:
  - kind: steer
    from: Meera
    text: "analytics.orders is 45 minutes stale but everything upstream looks fine. The ClickHouse Kafka engine table analytics.orders_queue reads pg.public.orders for the warehouse with its own consumer; order-sync is our application consumer, a different group. Find out why the ClickHouse warehouse stopped getting rows."

expect:
  root_cause:
    - [kafka engine]
    - [clickhouse, warehouse]
    - [stalled, stuck, stopped, failed, 'exception*', 'not consuming']
  root_cause_forbidden:
    - [order sync, 'crash*']
    - [poison pill]
    - [retention, 'delet*']
    - [broker, down]
    - [schema, incompatible]
  first_failing_layer: warehouse
  root_cause_layer: warehouse
  expected_facts:
    - id: f_kafka_engine_exception
      tool: warehouse_load_errors
      match: [kafka engine, consumer, exception]
      required: true
    - id: f_warehouse_stale
      tool: warehouse_freshness
      match: [stale]
      required: true
    - id: f_topic_healthy
      tool: kafka_topic_offsets
      match: [newest just now]
  claims:
    - about: root_cause
      facts: [f_kafka_engine_exception]
  evidence_tools: [warehouse_load_errors, warehouse_freshness]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, kafka_reset_consumer_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 12
