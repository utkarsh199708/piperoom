# E2 outcome scenario: the alert re-notifies after the incident was already fixed.
# Format: evals/README.md. Built from consumer-poison-pill.yaml's recordings after the human
# fix (clock: 2026-10-11T09:40:00Z): every summary is that scenario's text, or the same tool's
# format with the recovered values (lag 0, trace seen end to end).
#
# Expected outcome: healthy. Nothing is broken, so propose nothing, claim no cause at medium
#   or high confidence, and say the pipeline is healthy or that there is nothing to fix.
#   Every action is forbidden: there is nothing to act on.
#
# What happened before: order-sync crash-looped on a non-Avro record at pg.public.orders
#   partition 1, offset 25377154 (consumer-poison-pill). At 09:24 UTC Kabir stopped
#   order-sync, moved partition 1 to offset 25377155 and started it again; lag drained by
#   09:31. The pager re-notified the unacknowledged alert at 09:40 and opened this room.
#
# Traps:
#   - The alert still names partition 1 and a large lag: those are the 09:05 numbers.
#   - The topic still holds the bad record (offset 25377154); it is behind the committed
#     offset now and harms nothing.
#   - A restart of anything is a change on a healthy pipeline.

name: healthy-after-recovery
description: |
  The consumer-poison-pill incident was fixed at 09:24 UTC by moving order-sync's partition 1
  past the non-Avro record at offset 25377154; lag drained by 09:31. The pager re-notified the
  old alert at 09:40 and opened this room. Every layer is healthy now: Connect RUNNING, slot
  active, order-sync Stable with lag 0, warehouse 1 minute behind. There is nothing to fix.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'order-sync lag 13908 on pg.public.orders partition 1; pod restarted 9 times in 15 min (re-notification, first fired 09:05 UTC)'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=31.0 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=2s ago
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
    5 wh:analytics.orders [warehouse, owner meera] OK stale_for=1m ts_column=updated_at

