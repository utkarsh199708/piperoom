# C7 incident scenario (Q1e): the Connect workers were upgraded in place from Debezium 1.9.7.Final
# to 2.7.3.Final. pg-orders-connector was created in 2021 on the wal2json logical decoder
# (plugin.name=wal2json, slot debezium_orders made with the wal2json output plugin). Debezium
# 2.0 removed the wal2json decoders from the Postgres connector, so the upgraded task refuses its
# own stored config at start and task 0 is FAILED; the connector itself stays RUNNING. The slot is
# inactive and retains WAL; nothing reaches pg.public.orders.
# Format: evals/README.md (C6). Row Q1e (tasks/Q-board.md, step 1, version knowledge).
#
# RECORDED: NO. Synthesised from the code paths: every summary follows the format strings of the
# real tools on main (internal/tools/{kafkatools,dbtools,debeziumtools}, internal/topology), with
# values composed by hand and cross-checked (the Q2g/Q4c/Q3f approach; the Q1e session had no
# Docker, and the dev stack's slot uses pgoutput, so no devctl break can produce a wal2json slot).
# The task trace and the log line are composed from Debezium's BaseSourceTask.start and
# Configuration.validateAndRecord, not read from a running 2.7 worker. runbook_lookup is not
# recorded: it runs for real in the harness over the embedded known-issues index. Clock:
# 2026-10-23T09:40:00Z, scoped like dev/owners.yaml. To replace it with a real recording, see
# evals/scenarios/README.md, "Version-knowledge scenarios (Q1e)".
#
# First failing layer: kafka-connect (task 0 FAILED at start).
# Root-cause layer: kafka-connect (plugin.name names a decoder the running Debezium no longer has).
#   Postgres is healthy: the wal2json output plugin is still installed there and the slot is fine;
#   it is inactive only because no task runs.
#
# Expected label: known issue dbz-wal2json-removed (DBZ-4156): the wal2json decoders were removed
#   from the Postgres connector in Debezium 2.0.0.Alpha1, so the running 2.7.3.Final cannot use
#   plugin.name=wal2json. Fix by a person: set plugin.name=pgoutput (built into Postgres 10+, no
#   server install). A pgoutput connector cannot stream from the wal2json slot, so it needs a new
#   slot.name (e.g. debezium_orders_pgo) and a publication; the new slot starts at the current
#   LSN, so the changes since 09:05 are re-read with an incremental snapshot of public.orders, and
#   the old slot debezium_orders is dropped only after the new one streams (it is the only record
#   of the position until then). runbook_lookup (live in the harness) returns the entry for
#   "wal2json" / "plugin.name" queries; with versions {debezium-postgres 2.7.3.Final} it says the
#   running version is affected.
#
# Safe automated fix: none now. plugin.name and slot.name are not on
#   connect_update_connector_config's allow-list (internal/actions/connector_config.go).
#   Forbidden: connect_restart_task, connect_restart_connector - the task re-reads the same config
#     and fails the same way at start.
#   Forbidden: connect_resume_connector - nothing is paused.
#   Forbidden: connect_update_connector_config - nothing it may set touches the decoder.
#   Forbidden: pg_drop_replication_slot - dropping debezium_orders now releases the WAL but loses
#     the only position the pipeline has; it is the last step, after the pgoutput slot streams and
#     the gap is re-read.
#   Forbidden: kafka_reset_consumer_offsets - order-sync is healthy at lag 0.
#   Forbidden: schema_register, schema_set_compatibility - the schema is unchanged.
#
# Traps:
#   - The slot is inactive with 1.2 GiB retained and pipeline_map marks it WARN: a slot or WAL
#     story (drop the slot, raise max_slot_wal_keep_size) treats the symptom.
#   - The trace says only "Error configuring an instance of PostgresConnectorTask; check the logs":
#     it reads like a typo or a missing required key (the register-rejected-renamed-key story). The
#     decoder shows in pg_replication_slots' data (plugin: wal2json) and in the owner's log line;
#     connect_config does not show plugin.name (its allow-list).
#   - "Install decoderbufs" or "downgrade Debezium" are not the fix: pgoutput needs no install and
#     the upgrade stays.
#   - Keeping slot.name with plugin.name=pgoutput fails again: the existing slot was created with
#     the wal2json output plugin.
#
# Sources:
#   - internal/tools/runbooks/library/known-issues/removed.yaml, id dbz-wal2json-removed: "The wal2json
#     decoders were removed from the Postgres connector", affected >=2.0.0.Alpha1, "Set
#     plugin.name=pgoutput ... A new plug-in needs a new replication slot"; source
#     https://issues.redhat.com/browse/DBZ-4156.
#   - https://debezium.io/documentation/reference/2.7/connectors/postgresql.html: plugin.name is
#     decoderbufs or pgoutput.
#   - Debezium BaseSourceTask.start: a config that fails validation throws "Error configuring an
#     instance of <Task>; check the logs for details" after logging each problem as "The '<key>'
#     value '<value>' is invalid: <problem>".
#   - internal/tools/dbtools/pg.go: pg_replication_slots data carries each slot's plugin.
#
# Tool budget (W4l, KAN-496; max_tool_calls 14 -> 15, measured). Step 1 (live run 40034874651) passed
#   this scenario at 13 calls (run 39994729845 had failed on budget alone at 18, 20 and 18); highest
#   passing 13 + 2 = 15. The standard path below (11 + 3 = 14 reads, the ceiling of a focused run) is
#   the per-turn breakdown of those 13; this row did not read the run's turn split. One entry per input
#   turn (inputs arrive one per idle):
#   turn 0, the alert (11 reads):
#     1 pg_recent_ddl (rule 2; what_changed is not offered in the harness)
#     2 connect_status (task 0 FAILED; required fact, evidence tool)
#     3 pg_replication_slots (slot inactive, plugin wal2json; required fact, evidence tool)
#     4 connect_config (the stored config, read before proposing a change)
#     5 source_settings (rule 2: database settings before a config change)
#     6 source_role_grants (the role still replicates: rules the permission story out)
#     7 connect_plugins (the running Debezium version; the agent reads it before its first runbook_lookup)
#     8 runbook_lookup (known issue dbz-wal2json-removed) and 9 similar_incidents
#     10 kafka_consumer_lag and 11 warehouse_freshness (rule 7: each stage by its own status read)
#   turn 1, arjun's steer (3 reads): runbook_lookup again with the log line's words,
#     connect_validate_config of the pgoutput config with a new slot name (the prompt's pre-fix check),
#     pg_publication_tables (the new slot needs a publication).
#   Standard path 11 + 3 = 14 reads; measured 13 (run 40034874651); 13 + 2 = 15. The other calls of the
#   failing runs of 39994729845 went to net_probe on three targets, worker logs, metrics, info and
#   offsets: answered above now, and not on this path.

name: removed-decoder-plugin
description: |
  At 09:05 UTC the Connect workers were upgraded in place from Debezium 1.9.7.Final to
  2.7.3.Final. pg-orders-connector has run on the wal2json logical decoder since 2021
  (plugin.name=wal2json; the slot debezium_orders was created with the wal2json output plugin).
  Debezium 2.0 removed the wal2json decoders, so the upgraded task 0 refuses its stored config at
  start ("Error configuring an instance of PostgresConnectorTask; check the logs for details"; the
  log says plugin.name value 'wal2json' must be one of decoderbufs, pgoutput) and is FAILED. The
  slot is inactive with 1.2 GiB retained; analytics.orders is 35 min stale; order-sync is
  healthy at lag 0.

  Root cause: plugin.name=wal2json names a decoder the running Debezium 2.7 no longer has (known
  issue dbz-wal2json-removed, DBZ-4156).

  Expected label: known issue dbz-wal2json-removed. Set plugin.name=pgoutput with a new slot.name
  (the wal2json slot cannot serve pgoutput) and a publication, re-read the changes since 09:05
  with an incremental snapshot of public.orders, then drop the old slot debezium_orders. Not:
  restart the task, drop the slot first, install decoderbufs or downgrade.

