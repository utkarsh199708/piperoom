    1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=1.2 GiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=35m ago
      from: connect:pg-orders-connector
