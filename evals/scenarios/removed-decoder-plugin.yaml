inputs:
  - kind: steer
    from: arjun
    text: "I upgraded the Connect workers from Debezium 1.9.7.Final to 2.7.3.Final at 09:05; the other connectors came back. Task 0 of pg-orders-connector fails at start and the worker log has one ERROR before the trace: The 'plugin.name' value 'wal2json' is invalid: Value must be one of decoderbufs, pgoutput (io.debezium.connector.common.BaseSourceTask). This connector is from 2021. I own it: tell me what to change, and whether the slot has to change too."

expect:
  root_cause:
    - [wal2json]
    - [remov*, dropped, no longer, unsupported, not supported, pgoutput, dbz-wal2json-removed, DBZ-4156]
  # The stories a failed task and an inactive slot invite. A clause with a
  # negator is skipped ("the slot was not lost" is fine).
  root_cause_forbidden:
    - [slot was lost]
    - ['permission denied']
    - [schema registry]
    - [disk full]
    - [poison pill]
    - [database server name]
    - [connector, paused]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_task_config_error
      tool: connect_status
      match: [error configuring, check the logs]
      required: true
    - id: f_slot_inactive
      tool: pg_replication_slots
      match: [debezium orders, active false]
      required: true
    - id: f_topic_stale
      tool: kafka_topic_offsets
      match: [newest 35 min ago]
    - id: f_role_ok
      tool: source_role_grants
      match: [replication yes]
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
    - id: f_debezium_version
      tool: connect_plugins
      match: [2.7.3.final]
  claims:
    - about: root_cause
      facts: [f_task_config_error, f_slot_inactive]
  evidence_tools: [connect_status, pg_replication_slots]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, pg_drop_replication_slot, kafka_reset_consumer_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 15
