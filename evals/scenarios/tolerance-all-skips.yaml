inputs:
  - kind: steer
    from: arjun
    text: "Connect says RUNNING and there is no error on the task. We set the connector to tolerate errors last quarter so a bad row would not page us at night. Find out where the orders are going."

expect:
  root_cause:
    - [tolerance, tolerate*]
    - [skip*, drop*, discard*, silent*, swallow*, lost]
    - [amount*, decimal, numeric, schema*, serializ*, convert*, avro, "409", incompatib*]
  # The stories a green pipeline invites. A clause with a negator is skipped
  # ("the slot is not inactive" is fine).
  root_cause_forbidden:
    - [slot, inactive]
    - [consumer, crash*]
    - [poison pill]
    - [retention, delet*]
    - [connector, paused]
    - [snapshot, running]
    - [false alarm]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_tolerance_all
      tool: connect_config
      match: [errors tolerance all]
      required: true
    - id: f_events_seen
      tool: debezium_metrics
      match: [last event, events seen]
      required: true
    - id: f_topic_stale
      tool: kafka_topic_offsets
      match: [newest 28 min ago]
    - id: f_task_running
      tool: connect_status
      match: [task 0 running]
    - id: f_ddl_amount
      tool: pg_recent_ddl
      match: [alter column amount, numeric]
    - id: f_no_new_schema
      tool: schema_registry_versions
      match: [versions 1]
    - id: f_records_skipped
      tool: connect_worker_metrics
      match: [records skipped, errors tolerance all]
      required: true
  claims:
    - about: root_cause
      facts: [f_tolerance_all, f_events_seen, f_topic_stale]
  evidence_tools: [connect_config, debezium_metrics, connect_worker_metrics]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, kafka_reset_consumer_offsets, pg_drop_replication_slot, schema_register]
  max_tool_calls: 14
