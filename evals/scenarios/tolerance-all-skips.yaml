# C7 incident scenario (Q3f): pg-orders-connector runs with errors.tolerance=all, so after a
# column type change every new change event fails Avro serialization and Kafka Connect skips it
# instead of failing the task. The connector and task 0 stay RUNNING with no trace, Debezium keeps
# reading the WAL, the slot keeps advancing, and nothing new reaches pg.public.orders.
# Format: evals/README.md (C6). Row Q3f (tasks/Q-board.md, step 3, worker visibility).
#
# RECORDED: NO. Synthesised from the code paths: every summary follows the format strings of the
# real tools on main (internal/tools/{kafkatools,dbtools,debeziumtools}, internal/topology), with
# values composed by hand and cross-checked (the Q2g/Q4c approach; the Q3f session had no Docker
# and no devctl break exists for this incident). Clock: 2026-10-23T09:40:00Z, scoped like
# dev/owners.yaml. To replace it with a real recording, see evals/scenarios/README.md,
# "Worker-visibility scenarios (Q3f)".
#
# First failing layer: kafka-connect (records enter the task and never leave it).
# Root-cause layer: kafka-connect (errors.tolerance=all turns a serialization failure into silent
#   loss). The trigger is the 09:12 ALTER on Postgres (as in schema-change, which fails loudly
#   because there errors.tolerance is the default none); here the connector setting is why the
#   failure is silent and why the skipped events are gone, so it is the cause the room must fix.
#
# Expected label: the tool that shows the cause is connect_worker_metrics (Q3b):
#   "pg-orders-connector: FLAGS: <n> records skipped: errors.tolerance=all drops them unless a DLQ
#   is set. tasks total 1 (running 1, ...). task 0: <n> record errors, <n> record failures, <n>
#   skipped, ..." - Connect's own task-error-metrics (total-records-skipped). Since Q6d the harness
#   replays it: the connect_worker_metrics recording (input {connector: pg-orders-connector}) is
#   the tool's real summary over the scenario's numbers (Q batch 4 review), its skipped count is
#   the required fact f_records_skipped and the tool an evidence tool. The other replayed tools
#   agree: connect_config (errors.tolerance: all, no errors.log.enable), debezium_metrics (events
#   seen keep rising, last event seconds ago), kafka_topic_offsets (newest record 28 min ago) and
#   trace_record (the row reached Connect, not Kafka). connect_worker_logs is not recorded (a call
#   is a replay miss).
#
# Safe automated fix: none.
#   connect_update_connector_config with errors.log.enable=true is allowed (visibility only) but
#     brings nothing back. errors.tolerance is deliberately not on its allow-list.
#   Forbidden: connect_restart_task, connect_restart_connector - the task is RUNNING; a restart
#     skips the next events the same way and the skipped ones are not re-read (their offsets were
#     committed with the skip).
#   Forbidden: connect_resume_connector - nothing is paused.
#   Forbidden: kafka_reset_consumer_offsets - the consumer is healthy; the events never reached
#     the topic.
#   Forbidden: pg_drop_replication_slot - the slot is active and healthy.
#   Forbidden: schema_register - registering the rejected schema by hand bypasses the registry's
#     compatibility rule the consumer relies on.
#
# Correct human fix: set errors.tolerance=none (or route failures to visibility with
#   errors.log.enable=true while it is decided) so a failure stops the task instead of losing data;
#   resolve the schema incompatibility (amount int -> decimal) the way schema-change does; then
#   re-snapshot the rows changed since 09:12 (pg_snapshot_signal / pg_resnapshot_rows), because the
#   skipped change events are not in Kafka and Connect will not re-read them.
#
# Traps:
#   - Everything is green: connector RUNNING, task 0 RUNNING with no trace, slot active with little
#     WAL, consumer lag 0. "Nothing is broken, the table is quiet" is wrong: pg_row shows an order
#     updated a minute ago and Debezium counts events.
#   - schema_registry_versions shows only version 1 and connect_status no 409: unlike schema-change
#     the rejection never surfaces as a task error.
#   - The slot is active and retains little WAL, so it is not the slot story either: Connect commits
#     the source offset of a skipped record.
#
# Sources:
#   - Apache Kafka, Kafka Connect configs: errors.tolerance "all" skips problematic records;
#     errors.log.enable defaults to false (no log line for a skipped record). Kafka Connect's
#     WorkerSourceTask drops a record that fails conversion under errors.tolerance=all and counts it
#     in task-error-metrics total-records-skipped.
#   - internal/tools/runbooks/library/poison-pill.md: "errors.tolerance=all without a dead-letter
#     topic or logging drops bad records silently" (runbook_lookup runs live in the harness).
#   - internal/tools/debeziumtools/worker.go: the connect_worker_metrics summary and its skip flag.
#   - internal/tools/kafkatools/connect_tools.go: connect_config shows the errors.* keys.

name: tolerance-all-skips
description: |
  At 09:12 UTC a migration ran ALTER TABLE orders ALTER COLUMN amount TYPE numeric(12,2). Debezium's
  next value schema (amount int -> bytes decimal(12,2)) is not BACKWARD compatible, so the Avro
  converter cannot register it and every change event after 09:12 fails serialization. Because
  pg-orders-connector runs with errors.tolerance=all (and errors.log.enable unset), Kafka Connect
  skips each failed record and commits its offset: connector and task 0 stay RUNNING with no
  trace, Debezium keeps reading the WAL, the slot stays active, and nothing new has reached
  pg.public.orders for 28 minutes. order-sync is healthy at lag 0; analytics.orders is 28 min stale.

  Root cause: errors.tolerance=all on pg-orders-connector silently skips (drops) every change event
  whose new Avro value schema (the amount type change) the registry rejects; the skipped events are
  lost from Kafka.

  Expected label: the tool that shows the cause is connect_worker_metrics (task 0 records skipped,
  "errors.tolerance=all drops them unless a DLQ is set"). Fix by a person: errors.tolerance=none,
  resolve the schema change, re-snapshot the rows changed since 09:12.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'analytics.orders stale for 28m (threshold 15m); pg-orders-connector reports RUNNING'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=1.4 MiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=28m ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=28m ts_column=updated_at
      from: group:order-sync (unconfirmed)

