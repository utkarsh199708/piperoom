inputs:
  - kind: steer
    from: Priya
    # E7b: the steer names the read it wants (the import's open transaction on the source),
    # not only the question: "producing more than the pipeline can take" is also answered by
    # kafka_partition_rates, and all three live runs of 38717633575 read only that and missed
    # the pg_long_transactions evidence tool.
    text: "A bulk import started at 10:04. Check the import's open transaction on the source Postgres first, then tell me whether the source is producing more than the pipeline can take. Do that before anything else."
  - kind: comment
    from: Kabir
    text: |-
      order-sync pod logs, all three pods, last 10 minutes:
      [Consumer clientId=consumer-order-sync-2, groupId=order-sync] Member consumer-order-sync-2-5f0c1c3e-8a52-4a1e-9d2b-7c4f1e0a91b7 sending LeaveGroup request to coordinator kafka-2:9092 (id: 2147483645 rack: null) due to consumer poll timeout has expired. This means the time between subsequent calls to poll() was longer than the configured max.poll.interval.ms, which typically implies that the poll loop is spending too much time processing messages.
      [Consumer clientId=consumer-order-sync-1, groupId=order-sync] Request joining group due to: group is already rebalancing
      broker kafka-2 GroupCoordinator: Member consumer-order-sync-3-0c77e0f4-1b9d-4d51-8c0e-3e5a6f2d7a10 in group order-sync has failed, removing it from the group
      broker kafka-2 GroupCoordinator: Preparing to rebalance group order-sync in state PreparingRebalance with old generation 4318 (__consumer_offsets-37) (reason: removing member consumer-order-sync-3-0c77e0f4-1b9d-4d51-8c0e-3e5a6f2d7a10 on heartbeat expiration)
      The group generation was 61 at 05:00 UTC; it is 4318 now. Pods are at their 1 CPU limit since Monday's deploy.

expect:
  root_cause:
    # Plain "rebalancing" is left out on purpose: PreparingRebalance is in the data, so it is
    # the symptom; these name why the members keep leaving.
    - ['poll timeout', 'max.poll.interval', 'poll interval', 'session timeout', 'heartbeat*', 'leave group', 'removing member', 'rebalance storm', generation, throttl*, 'cpu limit', evict*, 'kicked out']
    - [consumer, group, member, order-sync]
  # The header's trap: "a source spike". Phrases, not [bulk import, caus*]: "the storm is caused
  # by CPU throttling, which the bulk import made worse" is right.
  root_cause_forbidden:
    - ['source spike']
    - ['bulk import caused']
    - ['bulk import is the cause']
    - ['caused by the bulk import']
    - ['due to the bulk import']
    - ['bulk import', 'caused the lag']
  first_failing_layer: consumer
  root_cause_layer: consumer
  # The evictions themselves are only in Kabir's pod logs; the tools show the
  # group rebalancing and records stopping at the consumer. The bulk import is
  # the red herring.
  expected_facts:
    - id: f_group_rebalancing
      tool: kafka_consumer_lag
      match: [preparing rebalance, 1 members, total lag 1913381]
      required: true
    - id: f_trace_stops_at_consumer
      tool: trace_record
      match: [consumer order sync, stopped here]
    - id: f_bulk_import
      tool: pg_long_transactions
      match: [orders bulk import, insert]
  claims:
    - about: root_cause
      facts: [f_group_rebalancing, f_trace_stops_at_consumer]
  evidence_tools: [kafka_consumer_lag, pg_long_transactions]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, schema_set_compatibility, schema_register]
  max_tool_calls: 14
