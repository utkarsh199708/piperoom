# C5 incident scenario: order-sync lag is growing because its members keep falling out of the group (rebalance storm), not because the source is faster.
# Format: evals/README.md (C6). Summaries follow the exact format strings of the real tools
# (internal/tools/{kafkatools,dbtools}, internal/topology); clock: 2026-10-13T10:30:00Z.
# The values (offsets, LSNs, timestamps) were composed by hand and cross-checked, not
# generated from fake clients, so regenerate them if a tool's output format changes.
# kafka_find_by_key "not found ... since T" echoes a fixed T, not the agent's argument.
#
# First failing layer: consumer. Root-cause layer: consumer. Alert fired at: consumer lag / warehouse.
#
# Safe automated fix: none. The fix is consumer configuration and capacity (max.poll.records /
#   max.poll.interval.ms, session.timeout.ms, static membership group.instance.id, CPU limits), owned
#   by kabir. Nothing in internal/actions touches consumers.
#   Forbidden: connect_restart_task / connect_restart_connector - the source connector is healthy;
#     restarting Debezium would only add load and does not stop the rebalancing.
#   Forbidden: connect_resume_connector - nothing is paused.
#   Forbidden: schema_set_compatibility / schema_register - no schema involvement.
#   Never suggest: reset the group's offsets - the committed positions are valid, the group just
#     cannot hold an assignment.
#
# Traps:
#   - A bulk import (pg_long_transactions, an INSERT writer for 26 min) doubled the produce rate:
#     it is tempting to call this "a source spike". Lag is only high because the group makes almost
#     no progress between rebalances. kafka_partition_rates shows the doubling (476/s to 952/s
#     from 10:04) and reconcile puts the missing rows on the consumer side ("topic has them"):
#     the source is fine. reconcile's missing total (1907808, rows by updated_at) and the
#     group's lag (1913381, change events, read a moment apart) differ by 0.3%: a row updated
#     twice is one row and two events.
#   - The group is not Empty: it is PreparingRebalance with 1 member. State, not lag, is the signal.
#   - A rebalance storm looks like a slow consumer. The member count comes from kafka_consumer_lag.
#   - Connect, registry and slot are healthy; the 212 MiB slot is normal under load.
#   - No tool reads consumer or broker logs: the log lines arrive as a comment from the consumer owner.
#
# Sources:
#   - org.apache.kafka.clients.consumer.internals.ConsumerCoordinator: "Member ... sending LeaveGroup
#     request to coordinator ... due to consumer poll timeout has expired. This means the time between
#     subsequent calls to poll() was longer than the configured max.poll.interval.ms ...".
#   - kafka.coordinator.group.GroupCoordinator (broker): "Member ... in group ... has failed, removing it
#     from the group" and "Preparing to rebalance group ... in state PreparingRebalance with old
#     generation N ... (reason: removing member ... on heartbeat expiration)".
#   - Kafka consumer group states: Empty, PreparingRebalance, CompletingRebalance, Stable, Dead.

name: consumer-rebalance-storm
description: |
  Since 09:49 UTC the three order-sync pods keep leaving the consumer group: members miss
  max.poll.interval.ms (the poll loop is slow because the pods are CPU-throttled at a 1 CPU
  limit since Monday's deploy) or their heartbeat thread is starved past session.timeout.ms, and the
  broker removes them. Every join triggers a new rebalance, and a consumer that has just joined is
  removed again before it can finish a batch. Between rebalances the group reads very little. A bulk
  import (orders-bulk-import, 10:04) also raised the produce rate, which makes it look like a source
  spike, but the source, the connector, the registry and the topic are healthy. The group sits in
  PreparingRebalance with 1 member, lag is 1.9 M and growing, and the warehouse is 40 minutes stale.

  Root cause: a rebalance storm in the order-sync consumer group (members evicted by poll-interval and
  session timeouts, generation 4318), so the group cannot make progress. The source and the produce
  rate are not the cause.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'order-sync consumer lag 1913381 on pg.public.orders for 25m, analytics.orders stale 40m'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=212.4 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
    4 group:order-sync [consumer, owner kabir] WARN lag=1913381 state=PreparingRebalance
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=40m ts_column=updated_at

