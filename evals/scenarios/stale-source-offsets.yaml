# C7 incident scenario (Q5f), built on `devctl break stale-source-offsets` (dev/scenarios.md §24,
# Q5e, cmd/devctl/scenarios_q5.go): pg-orders-connector was repointed at a freshly migrated
# database (devctl_orders_v2, with its own slot) but kept its name and topic.prefix, so Kafka
# Connect hands it the source offsets it stored for the OLD database. Debezium skips the snapshot
# of the new database (its offsets say it is done) and asks the new slot for an LSN from before the
# slot existed; task 0 fails. Format: evals/README.md (C6). Row Q5f (tasks/Q-board.md, step 5).
#
# RECORDED: NO. Synthesised from the code paths: every summary follows the format strings of the
# real tools on main (internal/tools/{kafkatools,dbtools,debeziumtools}, internal/topology), with
# values composed by hand from §24's break and cross-checked (the Q2g/Q4c approach; the Q5f session
# had no Docker, and §24 itself is not observed on the stack yet). The task's error is Debezium
# PostgreSQL's message for a stored LSN the server no longer has (the same mechanism as KAN-411 in
# §9). Clock: 2026-10-23T09:40:00Z, scoped like dev/owners.yaml. To replace it with a real
# recording, see evals/scenarios/README.md, "Stale source offsets (Q5f)".
#
# First failing layer: kafka-connect (task 0 FAILED). Root-cause layer: kafka-connect (the offsets
#   Connect stores under the connector's name belong to the old database).
#
# Expected label (the row's done-when): the fix is, in ONE proposal,
#   1. connect_stop_connector   {connector: pg-orders-connector}
#   2. connect_reset_source_offsets {connector: pg-orders-connector} to empty (no position)
# then a resume: with no stored offset Debezium snapshots the new database (snapshot.mode initial)
# and streams from the new slot. Both actions are Q5b's (PR #873): a running connector
# needs the stop step first in the same proposal, and the reset's Preview shows the stored offsets
# now (the rollback). The tool that shows the cause is connect_source_offsets (Q5a): partition
# {"server":"pg"}, offset {"lsn": <the orders database's LSN>}.
#
# Graded since Q6d: evals.LiveActions registers the Q5b actions on replay clients (writes are
#   recorded no-ops) and evals.LiveTools() offers connect_source_offsets, so expect has
#     fix: [[connect_stop_connector], [connect_reset_source_offsets]]
#   with fix_targets on the connector, and the connect_source_offsets recording (input {connector:
#   pg-orders-connector}; LSN{3D/4A11C920} = 263235684640) is the required fact f_stored_offset.
#   connect_config's recording carries the shown config as data, which the reset's Preview reads
#   (Q batch 4 review). The other replayed tools agree: connect_status (the task asks for
#   LSN{3D/4A11C920}, "no longer available"), connect_config (database.dbname and slot.name are
#   devctl_orders_v2) and pg_replication_slots (the new slot, the old one now outside the pipeline).
#
#   Forbidden: connect_restart_task, connect_restart_connector - a restart loads the same stored
#     offset and fails the same way.
#   Not forbidden: connect_resume_connector. After connect_stop_connector and the offset reset the
#     connector IS stopped, and the resume is the step that completes the fix (see the header); a
#     forbidden action is a wrong remedy in every ordering, never the completion of the expected fix.
#   Forbidden: connect_update_connector_config - its allow-list holds output settings only; and
#     pointing back at the old database undoes the migration.
#   Forbidden: pg_drop_replication_slot - it drops the connector's slot.name, the new slot
#     devctl_orders_v2, which is healthy; the old slot debezium_orders is outside the pipeline.
#   Forbidden: connect_snapshot_table, pg_snapshot_signal - a signal is read by a running task;
#     task 0 fails before it streams, and the offsets would still be stale.
#   Forbidden: kafka_reset_consumer_offsets - order-sync is caught up; nothing is wrong downstream.
#   Forbidden: schema_register, schema_set_compatibility - no schema is involved.
#
# Traps:
#   - "is no longer available on the server" reads like purged WAL or a lost slot (the
#     replication-slot-lost-failover and KAN-411 stories). The slot exists and is new; the LSN the
#     task asks for is older than the slot because it is the old database's position.
#   - pg_replication_slots shows the new slot inactive with almost no WAL: inactive because the
#     task failed, not the cause.
#   - The new database has rows the topic does not: Debezium skipped their snapshot because the
#     stored offset says the snapshot is done.
#
# Sources:
#   - dev/scenarios.md §24 (Q5e): the break, the expected symptoms and the fix (stop, then reset the
#     offsets to empty in one proposal).
#   - Apache Kafka KIP-875 / Kafka Connect: source offsets are keyed by connector name and source
#     partition; PUT /connectors/{name}/stop and DELETE /connectors/{name}/offsets (Kafka 3.6).
#   - Debezium PostgreSQL connector: "The connector is trying to read change stream starting at
#     <LSN>, but this is no longer available on the server. Reconfigure the connector to use a
#     snapshot when needed."
#   - internal/tools/dbtools/pg.go: pg_replication_slots shows the pipeline's slot only and counts
#     the others.

name: stale-source-offsets
description: |
  At 09:33 UTC pg-orders-connector was cut over to the migrated database devctl_orders_v2 (ten
  restored orders): database.dbname and slot.name changed to devctl_orders_v2, the connector name
  and topic.prefix pg stayed. Kafka Connect keys a source connector's offsets by connector name and
  source partition ({"server": "pg"}), so the connector started with the stored LSN of the OLD
  orders database. Debezium skipped the snapshot of devctl_orders_v2 (the offsets say it is done)
  and asked the new slot for LSN 3D/4A11C920, from before the slot existed: task 0 FAILED with
  "trying to read change stream starting at LSN{3D/4A11C920}, but this is no longer available on
  the server". The new slot is inactive, nothing new reaches pg.public.orders, and analytics.orders
  is 7 minutes stale. Kafka, the registry and order-sync are healthy.

  Root cause: the connector kept the stored source offsets of the old database after it was
  repointed at devctl_orders_v2, so its offset is stale for the new database and slot.

  Expected label: stop pg-orders-connector (connect_stop_connector), then reset its source offsets
  to empty (connect_reset_source_offsets), in one proposal; on resume Debezium snapshots the new
  database. connect_source_offsets is the tool that shows the stale offset.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: pg-orders-connector task 0 FAILED since 09:33 UTC; analytics.orders stale for 7 min
  pipeline_map: |
