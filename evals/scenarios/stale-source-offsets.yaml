      quiet: no source writes in 5s (slot "devctl_orders_v2", confirmed_flush_lsn 3D/5B0E2A50 unchanged, active=false); not a stall; connector pg-orders-connector state RUNNING; the slot is INACTIVE, so no walsender is streaming it

inputs:
  - kind: steer
    from: priya
    text: "At 09:33 we cut pg-orders-connector over to the migrated database devctl_orders_v2: I changed database.dbname and slot.name and kept the connector name and topic prefix so order-sync needs no change. The new slot was created fine. Why does task 0 fail, and what gets it streaming from the new database?"

expect:
  root_cause:
    - [offset*]
    - [old, previous, stale, original, orders database, other database, repoint*, migrat*, cut over, devctl_orders_v2]
  root_cause_forbidden:
    - [wal, purged]
    - [wal, removed]
    - [slot, lost]
    - [slot, dropped]
    - [failover]
    - [schema change]
    - [consumer, crash*]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_task_failed_lsn
      tool: connect_status
      match: [task 0 failed, change stream, no longer available]
      required: true
    - id: f_repointed
      tool: connect_config
      match: [database dbname devctl orders v2, slot name devctl orders v2]
      required: true
    - id: f_new_slot
      tool: pg_replication_slots
      match: [slot devctl orders v2, active false]
    - id: f_consumer_ok
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
    - id: f_stored_offset
      tool: connect_source_offsets
      match: [partition server pg, lsn 263235684640]
      required: true
  claims:
    - about: root_cause
      facts: [f_task_failed_lsn, f_repointed]
  evidence_tools: [connect_status, connect_config, connect_source_offsets]
  fix: [[connect_stop_connector], [connect_reset_source_offsets]]
  fix_targets:
    connect_stop_connector: {connector: pg-orders-connector}
    connect_reset_source_offsets: {connector: pg-orders-connector}
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_update_connector_config, pg_drop_replication_slot, connect_snapshot_table, pg_snapshot_signal, kafka_reset_consumer_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 12
