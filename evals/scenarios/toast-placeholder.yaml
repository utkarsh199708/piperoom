# C7 incident scenario (X1e): public.orders was switched from REPLICA IDENTITY FULL to DEFAULT;
# an update that leaves a TOASTed column unchanged makes Debezium emit its unavailable-value
# placeholder, and order-sync upserts that string over the real status. Counts match, lag is 0,
# timestamps match. Format: evals/README.md (C6). Built on `devctl break toast-placeholder`
# (X1g, dev/scenarios.md §17) and X1d's pg_toast_risk.
#
# RECORDED: NO (synthesised from the code paths). Every summary and data payload below is the
# exact output of the real kafkatools, dbtools and topology code at c71c4477, run by a throwaway
# generator (not committed) over fake clients holding the state the break leaves on an idle dev
# stack, scoped like dev/owners.yaml. Clock: 2026-10-21T09:40:00Z. Nothing was read from a
# running stack; it must be re-recorded there (evals/scenarios/README.md, "Silent-corruption
# scenarios (X1e)"). The reconcile answer was run on the fixed clock with an explicit window.
#
# Two assumptions about the stack, to check when re-recording:
#   - pg_stats.avg_width of orders.status is 7 B: autovacuum analysed the table when it held
#     only short statuses, and three out-of-line values (an 18-byte TOAST pointer each) among
#     ~1300 rows do not move it or trigger a new analyse. pg_toast_risk then lists no risk
#     ("no out-of-line or wide toastable column"): its out_of_line_values rule needs an average
#     of at least 18 B. If the stack's avg_width is >= 18 or unset (-1), the tool flags
#     orders.status with "placeholder seen 3 times" instead; regenerate then.
#   - The TOAST relation holds 3 pages (24 KiB) for the three 12.8 kB values.
#
# How the room opens: a data test, not the drift watcher. The generator ran the real watcher
# over this state from 09:24:30 to 11:40: it never fires. row_drift compares timestamp columns
# only (RowTimes), and the placeholder is in a text column whose rows have the right updated_at.
# dev/scenarios.md §17 expects row_drift; that does not hold for this code. The alert title is
# hand-written: the dbt accepted_values test a warehouse team runs on status.
#
# First failing layer: kafka-connect (Debezium emits the placeholder; Postgres serves as
# configured). Root-cause layer: postgres (the REPLICA IDENTITY DEFAULT change at 09:24:10Z).
#
# Expected fix: none automated (no action sets a replica identity). A human runs ALTER TABLE
#   public.orders REPLICA IDENTITY FULL, then rewrites status on the affected source rows so a
#   full event is emitted (`devctl fix toast-placeholder`). The events already on the topic keep
#   the placeholder.
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector - Connect
#     is RUNNING; a restart changes nothing about what the WAL carries.
#   Forbidden: schema_register, schema_set_compatibility, connect_update_connector_config - the
#     schema is unchanged; a config change cannot recover a value the WAL never carried.
#
# Traps:
#   - pg_toast_risk says "no TOAST truncation risk" (see the avg_width assumption above).
#   - Counts and timestamps match: reconcile shows no drift, warehouse_row matches updated_at.
#   - Only pg_recent_ddl (the ALTER) and trace_record (diff_columns=status) point at the cause;
#     the placeholder string is in the alert title.
#   - Not a consumer bug: order-sync loads what the event carries.
#
# Sources:
#   - cmd/devctl/scenarios_silent.go breakToastPlaceholder: ALTER TABLE public.orders REPLICA
#     IDENTITY DEFAULT, 3 orders (customer g, amount 300+g) with a 12.8 kB status, then UPDATE
#     amount + 1, updated_at = now() once they are in the warehouse.
#   - dev/postgres-init/01-orders.sql (REPLICA IDENTITY FULL by default), 02-ddl-audit.sql (the
#     audit row: command tag, object identity, query, session user).
#   - internal/tools/dbtools/toast.go toastRisks: the 18-byte rule.

name: toast-placeholder
description: |
  At 09:24:10 UTC public.orders was switched from REPLICA IDENTITY FULL to DEFAULT (an ALTER TABLE
  run as piperoom). Right after, three orders with a 12.8 kB status (stored out of line by TOAST)
  were inserted, loaded, and at 09:24:13 updated in amount and updated_at only. With identity
  DEFAULT the update's WAL record carries no value for the unchanged TOASTed status, so Debezium
  sent '__debezium_unavailable_value' in its place and order-sync upserted that string into
  analytics.orders.status. The source rows keep the real status. Counts and timestamps match,
  lag is 0, Connect and the slot are healthy. A dbt accepted_values test on
  analytics.orders.status opened the room.

  Root cause: REPLICA IDENTITY DEFAULT on public.orders, so updates that leave the TOASTed status
  unchanged carry no value for it and Debezium emits its unavailable-value placeholder.

  Expected fix: none automated; REPLICA IDENTITY FULL again, then rewrite the affected rows'
  status at the source.

