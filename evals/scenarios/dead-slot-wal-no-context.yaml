# C7 incident scenario (P3g-1): the control half of the #613 ruling. Same stack state as
# dead-slot-wal (the recordings are identical, from `devctl break dead-slot`, dev/scenarios.md
# §9), but nobody says the connector is retired: the alert is the watcher's slot_inactive
# title (internal/watch/signals.go slotInactiveReading). Format:
# evals/README.md (C6).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# kafkatools, dbtools and topology code from main, run by a throwaway generator (not
# committed) over fake clients holding the state `devctl break dead-slot` (plus `devctl load`)
# leaves on the dev stack, scoped by dev/owners.p3.yaml. Clock: 2026-10-18T09:40:00Z. Nothing
# was read from a running stack. See evals/scenarios/README.md, "P3 scenarios (P3g-1)".
#
# The #613 ruling: without the context that the connector is retired (or will be re-created
# with a snapshot), a STOPPED connector with an inactive slot is a connector someone forgot to
# resume, and the label is connect_resume_connector, as in slot-inactive-wal-growth. Dropping
# the slot would lose every change since 06:28Z and force a re-snapshot for nothing.
#
# First failing layer: kafka-connect (STOPPED). Root-cause layer: kafka-connect.
#
# Expected fix (the label): connect_resume_connector {connector: pg-orders-connector}
#   (kafka-connect owner approves). The connect_status recording carries state STOPPED as data,
#   so the replay's Validate accepts the resume. This label is graded today (expect.fix).
#   Forbidden: connect_restart_task, connect_restart_connector - a STOPPED connector has no
#     tasks; it stays STOPPED until resumed.
#   Forbidden: schema_register, schema_set_compatibility - Schema Registry is not involved.
#   Forbidden: pg_drop_replication_slot - without the retirement context, dropping the slot
#     loses the connector's position and forces a new snapshot.
#
# Traps: as dead-slot-wal and slot-inactive-wal-growth: nothing FAILED, order-sync is Stable
#   with lag 0, the warehouse is stale only because nothing is produced.
#
# Sources: as dead-slot-wal; dev/scenarios.md §5 (slot-inactive) and §9.
#
# W4k (KAN-495): run 39994729845 missed connect_source_offsets (all three runs), pg_streaming_liveness
#   and connect_worker_logs, and run 2 did not propose the resume because the stored offsets "could not
#   be read". They are recorded after the other reads (the real tools' output over this state; the
#   offsets sit at the slot's confirmed_flush_lsn, so the connector still holds its position, and
#   devctl load keeps writing, so pg_streaming_liveness says stuck with the connector STOPPED and the
#   slot INACTIVE). max_tool_calls stays 14: the passing runs made 10 and 11 calls, which the rule
#   (highest passing + 2) would put at 13; a budget is not lowered by a row that only records misses.

name: dead-slot-wal-no-context
description: |
  pg-orders-connector has been STOPPED since 06:28 UTC (`PUT /connectors/pg-orders-connector/stop`)
  and nobody resumed it. A stopped connector has no tasks, so its replication slot
  debezium_orders is inactive and Postgres keeps every WAL segment after its restart_lsn:
  1.4 GiB after 3.2 hours of `devctl load`, wal_status extended. The room has no information
  that the connector was retired.

  Root cause: pg-orders-connector is in the STOPPED target state, so the slot debezium_orders
  is inactive and retains all WAL.

  Expected fix (label): connect_resume_connector for pg-orders-connector.

