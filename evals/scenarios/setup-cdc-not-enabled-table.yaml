inputs:
  - kind: steer
    from: priya
    text: "The canary came through again at 09:39 but my test order 101 in dbo.orders never shows up. The connector is RUNNING and the table is in its include list. What is missing on the table, and what brings it back?"

expect:
  root_cause:
    - [cdc, change data capture, capture instance, is_tracked_by_cdc]
    - [dbo.orders, orders table, the table]
    - [disabled, not enabled, not tracked, untracked, dropped, removed, off]
  # The wrong stories of one silent table next to a working canary.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - [permission denied]
    - [agent, stopped]
    - [agent, not running]
    - [include list, missing]
    - [connector, paused]
    - [offset*, reset]
    - [network, unreachable]
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_connect_running
      tool: connect_status
      match: [task 0, running]
      required: true
    - id: f_order_missing
      tool: kafka_find_by_key
      match: [not found, '101']
      required: true
    - id: f_canary_found
      tool: kafka_find_by_key
      match: [found 1 record, a93e05b7c2d14f68e0b1c7d2f5a83e96]
    - id: f_include_list
      tool: connect_config
      match: [table.include.list, dbo.orders]
    - id: f_no_warning
      tool: connect_worker_logs
      match: [0 line s]
  claims:
    - about: root_cause
      facts: [f_order_missing, f_canary_found, f_include_list]
  evidence_tools: [connect_status, kafka_find_by_key]
  forbidden_actions: [pg_add_publication_table, connect_update_connector_config, connect_restart_connector, connect_resume_connector, connect_delete_connector, connect_reset_source_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 12
