inputs:
  - kind: steer
    from: arjun
    text: "The setup run stopped at the plugin check: it says the jars are all sitting loose in /kafka/connect. The connector was fine before the image upgrade. Tell me what to install and how to make the worker see it."

expect:
  root_cause:
    # The layout (flat jars) and what it costs: the class is not loaded.
    - [debezium, io.debezium.connector.postgresql.postgresconnector]
    - [plugin root, own directory, subdirectory*, one directory]
  # The wrong stories of a connector that will not load.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - [permission denied]
    - [disk full]
    - [retention, delet*]
    - [connector, paused]
    - [config, invalid]
    - [version, incompatible]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_class_not_found
      tool: connect_status
      match: [failed to find any class, postgres connector]
      required: true
    - id: f_type_unknown
      tool: connect_list_connectors
      match: [pg-orders-connector, failed, 0 failed tasks]
    - id: f_config_correct
      tool: connect_config
      match: [postgres connector, topic.prefix, pg]
    - id: f_slot_inactive
      tool: pg_replication_slots
      match: [debezium orders, active false]
    - id: f_consumer_idle
      tool: kafka_consumer_lag
      match: [total lag 0]
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
  claims:
    - about: root_cause
      facts: [f_class_not_found]
  evidence_tools: [connect_status]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_register, schema_set_compatibility, pg_drop_replication_slot]
  max_tool_calls: 12
