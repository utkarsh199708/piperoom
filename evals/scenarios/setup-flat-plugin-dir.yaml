# C7 setup scenario (U1-19): the Debezium Postgres plugin's jars sit directly in the Connect
# worker's plugin root instead of a directory of their own, so the worker's plugin scan finds no
# PostgresConnector and the connector the setup run registered cannot be loaded. The label names
# the failing check and the fixing op (tasks/U-board.md row U1-19, step 1). Format:
# evals/README.md (C6). Built on `devctl setup-break flat-plugin-dir` (dev/scenarios.md,
# "Setup breaks", PR #880).
#
# RECORDED: NO. Every summary and data payload is the exact output of the real connect_*,
# dbtools and kafkatools code from main, composed by hand from those tools' format strings and
# from the check text cmd/devctl/setupbreaks.go prints (the Q3f/Q4c approach; this session has no
# Docker). Clock: 2026-10-25T09:40:00Z, scoped like dev/owners.yaml. To re-record it on the dev
# stack, see evals/scenarios/README.md, "Setup scenarios (U1-19)".
#
# First failing layer: kafka-connect. Root-cause layer: kafka-connect (the worker's plugin
#   layout). The source, the topic and the consumer are healthy: the slot is inactive only
#   because no task runs.
#
# Expected label: failing check plugin-layout; fixing op plugin_install. `jar_list` reports the
#   layout the check reads: "<n> jar(s) directly in /kafka/connect; each connector needs its own
#   directory". plugin_install installs the pinned Debezium 3.2 Postgres plugin archive into
#   connect-plugins/debezium-connector-postgres (one plugin per directory; the download host is in
#   PIPEROOM_SETUP_PLUGIN_HOSTS and the digest is the knowledge index's), then the worker is
#   restarted (compose_restart connect) so its scan sees the new directory. The class cannot come
#   back any other way: a connector or task restart re-reads the same plugin path.
#   Neither op is replayable today: jar_list, plugin_install and compose_restart are runner ops
#   (internal/setup/ops, internal/setup/targets/compose), not room tools, and U1-20 adds the setup
#   replay. So this file proves the consequence from the replayed tools - connect_status's
#   "Failed to find any class ... PostgresConnector" (the class absent from the worker's
#   /connector-plugins list) and connect_list_connectors' empty type - and carries the check and
#   the op in this label and in the alert. No expect.fix: no registered action changes a plugin
#   directory.
#   Forbidden: connect_restart_task, connect_restart_connector - the class is still absent, so the
#     connector fails the same way; a worker restart alone (after the layout is fixed) is the
#     last step, not a fix.
#   Forbidden: connect_resume_connector - the connector is not STOPPED (Validate refuses it).
#   Forbidden: connect_update_connector_config - the config is correct; no setting names a plugin
#     directory.
#   Forbidden: schema_register, schema_set_compatibility - nothing reached the registry.
#   Forbidden: pg_drop_replication_slot - the slot holds the position the connector resumes from
#     once it can load.
#
# Traps:
#   - The alert says a plugin is missing from the worker, and the Q4c missing-plugin story says
#     "restore plugin.path". Here plugin.path is right and the jars are on disk: `jar_list` sees
#     them flat in the plugin root, which the worker's scan does not descend into as a plugin.
#   - The inactive slot with 1.2 MiB retained invites a slot_wal / dead-slot story.
#   - No DDL ran and the schema has one version: a schema-change story fails.
#
# Sources:
#   - cmd/devctl/setupbreaks.go: setupPluginRoot "/kafka/connect", setupConnectorDir
#     "/kafka/connect/debezium-connector-postgres", breakFlatPluginDir moves every jar of the
#     connector directory into the root; verifyPluginLayout fails while jars sit directly in the
#     root; the check name is plugin-layout.
#   - internal/setup/ops/envops.go: jar_list flags flat jars, two Debezium versions and missing
#     converter jars; internal/setup/targets/compose/plugin.go: plugin_install's pinned archive,
#     digest and one-plugin-per-directory rule.
#   - Kafka Connect: a plugin is a directory under plugin.path holding its jars; jars loose in the
#     path's root are not scanned as a plugin, so the class is absent from GET /connector-plugins
#     and a stored connector naming it fails at load with "Failed to find any class ...".
#   - internal/tools/kafkatools/connect_tools.go: connect_list_connectors renders an empty type as
#     "()" when Connect cannot name the connector's type.

name: setup/flat-plugin-dir
description: |
  The person re-ran piperoom-setup against the project after a Connect image upgrade. The run
  stopped at the source plugin step: check plugin-layout fails, because every jar of the Debezium
  Postgres plugin now sits directly in the worker's plugin root (/kafka/connect) instead of the
  debezium-connector-postgres directory the worker scans, so GET /connector-plugins has no
  io.debezium.connector.postgresql.PostgresConnector. pg-orders-connector is FAILED with "Failed
  to find any class that implements Connector and which name matches
  io.debezium.connector.postgresql.PostgresConnector", its slot debezium_orders is inactive with
  1.2 MiB retained, order-sync is Stable at lag 0 and analytics.orders is 33 minutes stale. The
  connector's config is correct and nothing changed in Postgres or the registry.

  Root cause: the Debezium Postgres plugin jars are flat in the Connect worker's plugin root, not
  in a directory of their own, so the worker's plugin scan does not load the connector class.

  Expected label: failing check plugin-layout; fixing op plugin_install (the pinned Debezium 3.2
  Postgres plugin into connect-plugins/debezium-connector-postgres, one plugin per directory),
  then compose_restart connect so the worker rescans the plugin path.

