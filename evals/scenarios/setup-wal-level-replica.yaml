        pg.public.orders/0: committed 1428, end 1428, lag 0
        pg.public.orders/1: committed 1417, end 1417, lag 0
        pg.public.orders/2: committed 1403, end 1403, lag 0
    data:
      group: order-sync
      members: 1
      state: Stable
      total_lag: 0
      worst_partitions:
        - committed: 1428
          end: 1428
          lag: 0
          partition: 0
          topic: pg.public.orders
        - committed: 1417
          end: 1417
          lag: 0
          partition: 1
          topic: pg.public.orders
        - committed: 1403
          end: 1403
          lag: 0
          partition: 2
          topic: pg.public.orders
  - tool: warehouse_freshness
    input: {table: analytics.orders, ts_column: updated_at}
    summary: |-
      newest=2026-10-25T08:59:06Z (stale for 41m)
    data:
      newest: "2026-10-25T08:59:06Z"
      stale_for: 41m
