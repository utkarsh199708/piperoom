      warehouse analytics.orders: not_seen

inputs:
  - kind: steer
    from: priya
    text: "I restarted the source database with the tuning change and the setup run now stops at its WAL check. The connector's task fails within seconds of every start. What do I set on the server, and does the connector need anything after it?"

expect:
  root_cause:
    - [wal level, wal_level]
    - [replica, override*, command line]
  # The wrong stories of a missing slot and a failed task.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - [permission denied]
    - [disk full]
    - [retention, delet*]
    - [slot, lost]
    - [connector, paused]
  first_failing_layer: kafka-connect
  root_cause_layer: postgres
  expected_facts:
    - id: f_wal_level_replica
      tool: source_settings
      match: [wal level replica]
      required: true
    - id: f_logical_decoding
      tool: connect_status
      match: [logical decoding requires wal level]
      required: true
    - id: f_no_slot
      tool: pg_replication_slots
      match: [not found in pg replication slots]
    - id: f_consumer_idle
      tool: kafka_consumer_lag
      match: [total lag 0]
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
  claims:
    - about: root_cause
      facts: [f_wal_level_replica, f_logical_decoding]
  evidence_tools: [source_settings, connect_status]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, pg_drop_replication_slot, schema_register, schema_set_compatibility]
  max_tool_calls: 12
