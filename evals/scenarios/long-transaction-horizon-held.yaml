    error: 'schemareg: GET /subjects/<subject>/versions: not found: schema registry error 40401: Subject ''<subject>'' not found.'
  - tool: pg_row
    summary: |-
      not found
  - tool: warehouse_row
    summary: |-
      not found
  - tool: trace_record
    summary: |
      postgres public.orders: not_seen
      kafka-connect pg-orders-connector: not_seen
      kafka pg.public.orders: not_seen
      consumer order-sync: not_seen
      warehouse analytics.orders: not_seen

inputs:
  - kind: steer
    from: priya
    text: "The connector looks fine to me, but the slot keeps holding WAL. I own the database: find out what is holding it and tell me who to ask. Do not restart anything."

expect:
  root_cause:
    # An open transaction (a writer with an xid) holds restart_lsn. A bare "slot"
    # or "wal" names every retained-WAL story.
    - [open transaction, idle in transaction, long transaction, writer, xid]
    - ['51877', pid]
    - [wal horizon, horizon, restart lsn]
  # The wrong stories of a healthy-looking pipeline with a growing slot.
  root_cause_forbidden:
    - [nothing to fix]
    - [no long transactions]
    - [connector, stopped]
    - [connector, failed]
    - [task, failed]
    - [slot, inactive]
    - [consumer lag]
    - [schema change]
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_horizon_held
      tool: pg_streaming_liveness
      match: [horizon held, pid 51877]
      required: true
    - id: f_oldest_open
      tool: pg_long_transactions
      match: [oldest open transaction, pid 51877, has xid yes, younger than]
      required: true
    - id: f_empty_list
      tool: pg_long_transactions
      match: [no long transactions]
    - id: f_connector_streams
      tool: connect_status
      match: [task 0, running]
  claims:
    - about: root_cause
      facts: [f_horizon_held, f_oldest_open]
  evidence_tools: [pg_streaming_liveness, pg_long_transactions]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, pg_drop_replication_slot, schema_register, schema_set_compatibility]
  # Not measured on a live run. 12 is the standard path (pipeline map, Connect status, slots,
  # streaming liveness, long transactions, blocking sessions, source offsets, topic, group,
  # warehouse, DDL, similar incidents); 14 leaves room for a re-read after the steer. Revisit
  # with the highest passing run + 2 (ruling R8) once a live run exists.
  max_tool_calls: 14
