# C7 incident scenario (H2): a young open transaction holds the WAL horizon of a healthy slot.
# Format: evals/README.md (C6). Clock: 2026-10-24T11:40:00Z, scoped by the pipeline below.
#
# RECORDED: the pg_long_transactions, pg_streaming_liveness, pg_replication_slots,
# connect_list_connectors, connect_status, connect_config, connect_source_offsets and
# source_blocking_sessions recordings are the exact summary and data of the real dbtools and
# kafkatools code (branch test/h1-live, a3/long-tx-horizon) over the world w4kHorizonHeld in
# evals/w4k_world_test.go; TestW4kRecordingsAreRealToolOutput fails when one drifts, and
# `go test ./evals -run TestW4kRecordingsAreRealToolOutput -update-w4k-recordings` rewrites the
# data of a drifted pg_* recording (review the diff; summaries are never rewritten). The Kafka,
# warehouse and not-found recordings after them are composed by hand from the tools' format
# strings, like the other C7 scenarios.
#
# First failing layer: postgres. Root-cause layer: postgres. Nothing downstream is broken: the
#   connector is RUNNING, its task streams, the topic is fresh, order-sync is Stable at lag 0 and
#   the warehouse is current. The one symptom is the slot: restart_lsn is flat while the source
#   writes, so retained WAL grows (204.7 MiB and rising 740 kB/s), even though
#   confirmed_flush_lsn advances 6 MiB in the 5 s window.
#
# Why it is hard: pid 51877 ("refund-backfill", idle in transaction, has_xid) has been open for
#   4 min 50 s, which is under pg_long_transactions' 5 min default, so its "long transaction"
#   list is empty ("(no long transactions on this pipeline's tables)"). Only the age-independent
#   block (oldest_open, open_writers) and pg_streaming_liveness' horizon_held verdict name it. An
#   agent that reads the empty list as "nothing holds the slot" has the wrong story.
#
# Proposed fix: none is graded. Ending a backfill that is still running is the postgres owner's
#   call (priya), not an automatic fix; the right answer names the transaction (pid, app, age),
#   says the WAL horizon moves when it commits or rolls back, and hands the decision to its owner.
#   Forbidden: connect_restart_task, connect_restart_connector (the connector is healthy and
#   streams; a restart changes nothing), connect_resume_connector (it is RUNNING),
#   pg_drop_replication_slot (loses the position for a transaction that will end by itself),
#   schema_register, schema_set_compatibility (Schema Registry is untouched).
#
# Traps:
#   - connect_status, the topic, the group and the warehouse are all healthy: "the pipeline is
#     fine, nothing to fix" is the tempting wrong answer.
#   - pg_long_transactions' list is empty (the writer is younger than the threshold).
#   - the slot is active and confirmed_flush_lsn advances, so the verdict is not "stuck"; restart_lsn
#     is the flat one.
#
# Fixture note: w4kSource has no open-transaction read by default (the tools then fall back to the
#   output shape they had before the a3/long-tx-horizon fields: no open_transactions, no
#   oldest_open). The dead-slot and slot-inactive recordings are on that fallback shape for the
#   open-transaction block and carry only the restart_lsn fields. This scenario's source
#   (w4kOpenSource) serves the read, so its recordings carry the full shape.

name: long-transaction-horizon-held
description: |
  At about 11:35 UTC a backfill job ("refund-backfill") opened a transaction on public.orders,
  wrote to it (it holds an xid) and has left it open, idle in transaction, for 4 min 50 s.
  A transaction holding an xid keeps the WAL horizon of every logical replication slot:
  restart_lsn of debezium_orders cannot move past it, so Postgres retains all WAL since then
  (204.7 MiB and growing about 740 kB/s). The connector itself is healthy: it is RUNNING, task 0
  streams, confirmed_flush_lsn advances, the topic is fresh, order-sync has no lag and the
  warehouse is current. Nothing FAILED.

  Root cause: an open transaction (pid 51877, app refund-backfill, has_xid, idle in
  transaction, 4m50s old) holds the WAL horizon, so restart_lsn is flat and the slot's retained
  WAL grows until it commits or rolls back. It is younger than pg_long_transactions' 5 minute
  threshold, so only oldest_open and the horizon_held verdict show it.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'orders-db: replication slot debezium_orders retains 204.7 MiB of WAL and it is growing (PostgresSlotRetainedWALGrowing on orders-db-primary; connector RUNNING)'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] WARN slot_active=true slot_retained=204.7 MiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=2s ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] OK stale_for=4s ts_column=updated_at
      from: group:order-sync (unconfirmed)

