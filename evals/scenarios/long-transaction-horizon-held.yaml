    input: {pipeline_id: orders}
    summary: |
      pipeline orders
      legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
      1 pg:public.orders [postgres, owner priya] WARN slot_active=true slot_retained=204.7 MiB wal_status=reserved
      2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
        from: pg:public.orders
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=2s ago
        from: connect:pg-orders-connector
      4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
        from: topic:pg.public.orders
      5 wh:analytics.orders [warehouse, owner meera] OK stale_for=4s ts_column=updated_at
        from: group:order-sync (unconfirmed)
  - tool: connect_list_connectors
    summary: |-
      pg-orders-connector (source): RUNNING, 0 failed tasks
    data:
      - failed_tasks: 0
        name: pg-orders-connector
        state: RUNNING
        type: source
  - tool: connect_status
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector (source): RUNNING on connect:8083.
      Task 0: RUNNING
    data:
      name: pg-orders-connector
      state: RUNNING
      tasks:
          - id: 0
            state: RUNNING
      worker: connect:8083
  - tool: connect_config
    input: {connector: pg-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: postgres
      database.password: ***
      database.port: 5432
      database.user: piperoom
      slot.name: debezium_orders
      table.include.list: public.orders
      topic.prefix: pg
    data:
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: postgres
      database.password: '***'
      database.port: "5432"
      database.user: piperoom
      slot.name: debezium_orders
      table.include.list: public.orders
      topic.prefix: pg
  - tool: pg_replication_slots
    summary: |
      slot debezium_orders: active=true retained=204.7 MiB wal_status=reserved
    data:
      - active: true
        confirmed_flush_lsn: 52/9A3C31D8
        name: debezium_orders
        plugin: pgoutput
        restart_lsn: 52/8D71B898
        retained_wal_bytes: 214600000
        wal_status: reserved
  - tool: pg_streaming_liveness
    input: {pipeline_id: orders}
    summary: |
      horizon_held: restart_lsn did not move while WAL advanced: an open transaction (or a stuck slot) holds the WAL horizon, so retained WAL grows until it ends — call pg_long_transactions (slot "debezium_orders": restart_lsn 52/8D71B898 did not move in 5s while the source WAL head advanced 3698000 bytes and retained WAL grew 3698000 bytes; confirmed_flush_lsn advanced 6291456 bytes; the connector still streams, so it is not broken; active=true, retains 208.2 MiB); connector pg-orders-connector state RUNNING
      held by the oldest open writer: pid=51877 app=refund-backfill on_pipeline_tables=yes same_database=yes state=idle in transaction age=4m (290s) has_xid=yes wait_type=Client (it holds an xid; the WAL horizon moves when it commits or rolls back)
    data:
      connector: pg-orders-connector
      connector_state: RUNNING
      connector_tasks:
          - 0:RUNNING
      elapsed_ms: 5000
      horizon_holder:
          age: 4m
          age_seconds: 290
          application_name: refund-backfill
          has_xid: true
          on_pipeline_tables: true
          pid: 51877
          same_database: true
          state: idle in transaction
          wait_event_type: Client
          xid_age: 3120
      note: restart_lsn 52/8D71B898 did not move in 5s while the source WAL head advanced 3698000 bytes and retained WAL grew 3698000 bytes; confirmed_flush_lsn advanced 6291456 bytes
      pipeline: orders
      slot:
          active: true
          confirmed_flush_advance_bytes: 6291456
          confirmed_flush_lsn: 52/9A3C31D8
          confirmed_flush_lsn_after: 52/9A9C31D8
          name: debezium_orders
          restart_advance_bytes: 0
          restart_lsn: 52/8D71B898
          restart_lsn_after: 52/8D71B898
          restart_lsn_moved: false
          retained_growth_bytes: 3698000
          retained_wal_bytes: 218298000
          retained_wal_bytes_before: 214600000
          source_wal_advance_bytes: 3698000
          verdict: horizon_held
          wal_status: reserved
      source: replication slot LSN (confirmed_flush_lsn vs restart_lsn + retained WAL)
      verdict: horizon_held
      window_seconds: 5
  - tool: pg_long_transactions
    summary: |
      open transactions of any age (all databases, not filtered by older_than_minutes): 1, 1 of them is a writer (has_xid)
      oldest open transaction: pid=51877 app=refund-backfill on_pipeline_tables=yes same_database=yes state=idle in transaction age=4m (290s) has_xid=yes wait_type=Client (it holds an xid: it holds back every logical slot's restart_lsn, the WAL horizon, until it ends; it is younger than the 5m threshold, so it is not in the long-transaction list below)
      (no long transactions on this pipeline's tables)
    data:
      oldest_open:
          age: 4m
          age_seconds: 290
          application_name: refund-backfill
          has_xid: true
          on_pipeline_tables: true
          pid: 51877
          same_database: true
          state: idle in transaction
          wait_event_type: Client
          xid_age: 3120
      open_transactions: 1
      open_writers: 1
      other_not_shown: 0
      other_writers: 0
      transactions: []
  - tool: source_blocking_sessions
    summary: |
      (no blocking sessions visible to this role; other sessions' transactions need pg_read_all_stats, and prepared transactions are not listed)
    data:
      []
  - tool: connect_source_offsets
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector partition server=pg: lsn=354781245912, lsn_commit=354781245912, lsn_proc=354781245912, messageType=UPDATE, ts_usec=1792841698000000, txId=6120344
    data:
      connectors:
          - connector: pg-orders-connector
            offsets:
              - offset:
                  lsn: 354781245912
                  lsn_commit: 354781245912
                  lsn_proc: 354781245912
                  messageType: UPDATE
                  ts_usec: 1792841698000000
                  txId: 6120344
                partition:
                  server: pg
  - tool: kafka_topic_offsets
    input: {topic: pg.public.orders}
    summary: |-
      partition 0: 0–2481903 (2481903 records), newest 2 s ago
      partition 1: 0–2476650 (2476650 records), newest 2 s ago
      partition 2: 0–2490117 (2490117 records), newest 2 s ago
    data:
      partitions:
        - end: 2481903
          last_timestamp: "2026-10-24T11:39:58Z"
          partition: 0
          start: 0
        - end: 2476650
          last_timestamp: "2026-10-24T11:39:58Z"
          partition: 1
          start: 0
        - end: 2490117
          last_timestamp: "2026-10-24T11:39:58Z"
          partition: 2
          start: 0
      topic: pg.public.orders
      total_records: 7448670
  - tool: kafka_list_groups
    summary: |-
      order-sync: Stable
    data:
      - group: order-sync
        state: Stable
  - tool: kafka_consumer_lag
    input: {group: order-sync}
    summary: |-
      order-sync: Stable, 1 members, total lag 0
        pg.public.orders/0: committed 2481903, end 2481903, lag 0
        pg.public.orders/1: committed 2476650, end 2476650, lag 0
        pg.public.orders/2: committed 2490117, end 2490117, lag 0
    data:
      group: order-sync
      members: 1
      state: Stable
      total_lag: 0
      worst_partitions:
        - committed: 2481903
          end: 2481903
          lag: 0
          partition: 0
          topic: pg.public.orders
        - committed: 2476650
          end: 2476650
          lag: 0
          partition: 1
          topic: pg.public.orders
