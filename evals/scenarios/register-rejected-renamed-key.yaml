inputs:
  - kind: steer
    from: arjun
    text: "I did the in-place upgrade. Task 0 failed, so I tried re-registering the connector from our 1.x export with PUT /connectors/pg-orders-connector/config, and Connect answered 400: Connector configuration is invalid and contains the following 1 error(s): The 'topic.prefix' value is invalid: A value is required. I own the connector: tell me which setting to change and I will re-register it the same way."

expect:
  root_cause:
    # Either key names the fix: the old one, or the new one Debezium 2.0 requires.
    - [database server name, topic prefix]
    - [rename*, replaced, removed, require*, instead]
  # The wrong stories of a connector that will not start. The Debezium
  # connector is itself a plugin, so the plugin row names a missing plugin.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - ['permission denied']
    - ['plugin is missing']
    - ['missing plugin']
    - ['plugin is not installed']
    - ['plugin isn t installed']
    - ['plugin not found']
    - ['plugin jar*']
    - ['plugin path']
    - ['slot was lost']
    - ['disk full']
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_task_config_error
      tool: connect_status
      match: [task 0, failed, error configuring, postgres connector task]
      required: true
    - id: f_old_key_in_config
      tool: connect_config
      match: [database server name, pg]
      required: true
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
    - id: f_one_schema_version
      tool: schema_registry_versions
      match: [versions 1, latest id 2]
    - id: f_validate_unknown_key
      tool: connect_validate_config
      match: [unknown key, database server name]
  claims:
    - about: root_cause
      facts: [f_old_key_in_config, f_task_config_error]
  evidence_tools: [connect_config, connect_status]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_register, schema_set_compatibility]
  max_tool_calls: 12
