# C7 incident scenario (Q4c): the connector's config still names the Debezium 1.x logical server
# key database.server.name, which 2.0 replaced with topic.prefix; the upgraded worker refuses
# the config and the connector sits FAILED at load. Format: evals/README.md (C6). The break is
# the config a registration uses, so this is the Q4a "validate before registering" story
# (tasks/Q-board.md rows Q4a/Q4b/Q4c).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# connect_config, connect_status, schema_registry_* and dbtools code from main, composed by hand
# from those tools' format strings and from the messages Debezium 3.2 and Kafka Connect 3.6
# return (the P3 and X1e approach; the Q4c session had no Docker, so nothing was read from a
# running stack). Clock: 2026-10-24T09:40:00Z, scoped by dev/owners.yaml. To replace it with a
# real recording, see evals/scenarios/README.md, "Config-validation scenarios (Q4c)".
#
# First failing layer: kafka-connect. Root-cause layer: kafka-connect (a connector config key).
#   Nothing is wrong in Postgres, Kafka or the warehouse: the slot is inactive only because the
#   connector cannot be instantiated.
#
# Expected label: the key is database.server.name. Debezium 2.0 replaced it with topic.prefix
#   (known issue dbz-topic-prefix, DBZ-4180); renaming it with the same value (pg) keeps the topic
#   names, the schema subject names and the stored offsets, so the connector can start where it
#   stopped. The fix is a config change plus a restart of the connector (Connect cannot load it
#   at all while the required key is missing). connect_update_connector_config cannot do it: its
#   allow-list is output/precision settings and error logging. Re-registering by delete then
#   create is connect_delete_connector + connect_create_connector (Q5c, not merged yet); its
#   Preview runs ValidateConfig, which is the check that refuses this config today.
#   Forbidden: connect_restart_connector, connect_restart_task - a restart re-reads the same
#     stored config and fails with the same message.
#   Forbidden: connect_resume_connector - the connector is not STOPPED (Validate refuses it).
#   Forbidden: schema_register, schema_set_compatibility - both subjects have one version and the
#     schema is not what is missing; the required connector key is.
#   Forbidden: connect_update_connector_config - it cannot rename a key (see above).
#
# Traps:
#   - "topic.prefix is invalid" reads like a schema or topic-naming problem; the fix is the
#     connector's own config key, and pg_recent_ddl shows no DDL at all.
#   - The connector's config also lacks topic.prefix, which the agent can only see by reading
#     connect_config (the tool shows database.server.name and hides nothing here).
#   - The slot is inactive with 1.1 MiB retained: small, so a slot_wal / dead-slot story fails.
#
# Sources:
#   - internal/tools/runbooks/library/known-issues/renamed.yaml, id dbz-topic-prefix:
#     database.server.name was replaced by topic.prefix (DBZ-4180), affected >=2.0.0.Beta1;
#     "rename database.server.name to topic.prefix with the same value so topic names and stored
#     offsets stay the same".
#   - internal/tools/kafkatools/validate_config_tool.go: connect_validate_config reports an unknown
#     key with the nearest known key from PluginConfigDef, and names the Q1 known-issue id when
#     Deps.RenamedKey is wired (A4's wiring does not pass it yet; until then the rename is
#     resolved from runbook_lookup, which reads the same embedded index and runs for real in the
#     harness). The eval harness cannot replay connect_validate_config at all yet (C6's Q6d adds
#     the definition-only Connect client), so this file proves the key from connect_config and
#     the connector trace instead; when Q6d lands, add the connect_validate_config read (input
#     {class}) with its summary and a fact on it.
#   - https://debezium.io/documentation/reference/3.2/connectors/postgresql.html: topic.prefix is
#     required; it replaced database.server.name in 2.0.
#   - Kafka Connect: an invalid stored config makes the connector FAILED at load with
#     "Connector configuration is invalid and contains the following 1 error(s)"; the REST config
#     endpoint still serves the stored config.

name: register-rejected-renamed-key
description: |
  At 09:08 UTC the Connect workers were upgraded to Debezium 3.2. pg-orders-connector was
  re-registered from the export taken on the old 1.x cluster, so its config still carries the
  logical server name in the 1.x key database.server.name=pg and has no topic.prefix. The
  upgraded worker refuses the config ("The 'topic.prefix' value is invalid: A value is required")
  and the connector sits FAILED at load: no task runs, the slot debezium_orders is inactive and
  order-sync and analytics.orders have been idle for 32 minutes. Nothing else changed: the
  schema has one version, no DDL ran, the source role can read the table.

  Root cause: the connector's config still uses database.server.name, which Debezium 2.0 renamed
  to topic.prefix, and topic.prefix is required, so Connect cannot instantiate the connector.

  Expected label: rename database.server.name to topic.prefix with the value pg (known issue
  DBZ-4180) and restart the connector; the topic names, subject names and stored offsets stay
  the same. Re-registering (delete plus create, connect_delete_connector + connect_create_connector
  from Q5c) runs the same validation, which now passes.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
