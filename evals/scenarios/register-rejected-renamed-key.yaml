# C7 incident scenario (Q4c): the connector's stored config still names the Debezium 1.x logical
# server key database.server.name, which 2.0 replaced with topic.prefix. After an in-place worker
# upgrade task 0 fails to configure itself, and re-registering the same 1.x config is refused by
# Connect's validation (HTTP 400, nothing stored). Format: evals/README.md (C6). The break is the
# config a registration uses, so this is the Q4a "validate before registering" story
# (tasks/Q-board.md rows Q4a/Q4b/Q4c).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# connect_config, connect_status, schema_registry_* and dbtools code from main, composed by hand
# from those tools' format strings and from the messages Debezium 3.2 and Kafka Connect 3.6
# return (the P3 and X1e approach; the Q4c session had no Docker, so nothing was read from a
# running stack). Clock: 2026-10-24T09:40:00Z, scoped by dev/owners.yaml. To replace it with a
# real recording, see evals/scenarios/README.md, "Config-validation scenarios (Q4c)".
#
# First failing layer: kafka-connect. Root-cause layer: kafka-connect (a connector config key).
#   Nothing is wrong in Postgres, Kafka or the warehouse: the slot is inactive only because task 0
#   cannot configure itself. The connector itself is RUNNING: Debezium's PostgresConnector.start
#   only keeps the properties; the task's start validates them and fails.
#
# Expected label: the key is database.server.name. Debezium 2.0 replaced it with topic.prefix
#   (known issue dbz-topic-prefix, DBZ-4180); renaming it with the same value (pg) keeps the topic
#   names, the schema subject names and the stored offsets, so the connector can start where it
#   stopped. The fix is a config change plus a restart of the connector and its task (the task
#   cannot start at all while the required key is missing). connect_update_connector_config cannot do it: its
#   allow-list is output/precision settings and error logging. Re-registering by delete then
#   create is connect_delete_connector + connect_create_connector (Q5c, not merged yet); its
#   Preview runs ValidateConfig, which is the check that refuses this config today.
#   Forbidden: connect_restart_connector, connect_restart_task - a restart re-reads the same
#     stored config and task 0 fails with the same message.
#   Forbidden: connect_resume_connector - the connector is RUNNING, not STOPPED (Validate
#     refuses it).
#   Forbidden: schema_register, schema_set_compatibility - both subjects have one version and the
#     schema is not what is missing; the required connector key is.
#   Forbidden: connect_update_connector_config - it cannot rename a key (see above).
#
# Traps:
#   - "topic.prefix is invalid" (the owner's steer) reads like a schema or topic-naming problem;
#     the fix is the connector's own config key, and pg_recent_ddl shows no DDL at all.
#   - Task 0's trace says only "Error configuring an instance of PostgresConnectorTask; check the
#     logs for errors": the field is in the worker log, which no tool reads. The agent has to
#     read connect_config (it shows database.server.name and no topic.prefix, and hides nothing
#     here) and tie it to the owner's 400 message or the dbz-topic-prefix known issue.
#   - The slot is inactive with 1.1 MiB retained: small, so a slot_wal / dead-slot story fails.
#
# Sources:
#   - internal/tools/runbooks/library/known-issues/renamed.yaml, id dbz-topic-prefix:
#     database.server.name was replaced by topic.prefix (DBZ-4180), affected >=2.0.0.Beta1;
#     "rename database.server.name to topic.prefix with the same value so topic names and stored
#     offsets stay the same".
#   - internal/tools/kafkatools/validate_config_tool.go: connect_validate_config reports an unknown
#     key with the nearest known key from PluginConfigDef, and names the Q1 known-issue id when
#     Deps.RenamedKey is wired (A4's wiring does not pass it yet; until then the rename is
#     resolved from runbook_lookup, which reads the same embedded index and runs for real in the
#     harness). Since Q6d the harness replays connect_validate_config: the recording below
#     (input {class}) is the tool's output for the stored config, with the fact
#     f_validate_unknown_key on it (not required: connect_config and task 0's trace prove the
#     key too). connect_create_connector's Preview reads the same recording.
#   - https://debezium.io/documentation/reference/3.2/connectors/postgresql.html: topic.prefix is
#     required; it replaced database.server.name in 2.0.
#   - Kafka Connect validates a config only on the REST create/update path (AbstractHerder
#     validateConnectorConfig): a PUT /connectors/<name>/config without topic.prefix is answered
#     HTTP 400 "Connector configuration is invalid and contains the following 1 error(s): The
#     'topic.prefix' value is invalid: A value is required ..." and nothing is stored. A config
#     already in the config topic is not re-validated when the worker starts: the connector
#     starts (RUNNING), and Debezium's BaseSourceTask.start validates the fields and throws
#     "Error configuring an instance of PostgresConnectorTask; check the logs for errors", so
#     task 0 is FAILED. connect_status keeps a trace's first line and its "Caused by:" lines
#     (internal/tools/kafkatools/connect_tools.go condenseTrace); this trace has no cause.

name: register-rejected-renamed-key
description: |
  At 09:08 UTC the Connect workers were upgraded in place to Debezium 3.2. pg-orders-connector's
  stored config dates from the 1.x cluster, so it still carries the logical server name in the
  1.x key database.server.name=pg and has no topic.prefix. The connector starts (RUNNING) but
  task 0 FAILED: "Error configuring an instance of PostgresConnectorTask; check the logs for
  errors". The owner then tried to re-register the 1.x export (PUT /connectors/.../config) and
  Connect refused it with HTTP 400 ("The 'topic.prefix' value is invalid: A value is required"),
  so the stored config is unchanged. The slot debezium_orders is inactive and order-sync and
  analytics.orders have been idle for 32 minutes. Nothing else changed: the schema has one
  version, no DDL ran, the source role can read the table.

  Root cause: the connector's config still uses database.server.name, which Debezium 2.0 renamed
  to topic.prefix, and topic.prefix is required, so task 0 cannot configure itself and Connect
  refuses the same config on re-registration.

  Expected label: rename database.server.name to topic.prefix with the value pg (known issue
  DBZ-4180) and restart the connector; the topic names, subject names and stored offsets stay
  the same. Re-registering (delete plus create, connect_delete_connector + connect_create_connector
  from Q5c) runs the same validation, which now passes.

