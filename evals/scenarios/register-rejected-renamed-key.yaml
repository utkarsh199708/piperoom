inputs:
  - kind: steer
    from: arjun
    text: "I did the upgrade and the re-register. The worker refuses the config - it says The 'topic.prefix' value is invalid: A value is required - and the connector will not start. I own the connector: tell me which setting to change and I will re-register it the same way."

expect:
  root_cause:
    - [database server name]
    - [topic prefix, rename*, replaced]
  # The wrong stories of a connector that will not start.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - ['permission denied']
    - ['plugin']
    - ['slot was lost']
    - ['disk full']
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_topic_prefix_required
      tool: connect_status
      match: [topic prefix, value is invalid]
      required: true
    - id: f_old_key_in_config
      tool: connect_config
      match: [database server name, pg]
      required: true
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
    - id: f_one_schema_version
      tool: schema_registry_versions
      match: [versions 1, latest id 2]
  claims:
    - about: root_cause
      facts: [f_topic_prefix_required, f_old_key_in_config]
  evidence_tools: [connect_config, connect_status]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_register, schema_set_compatibility]
  max_tool_calls: 12
