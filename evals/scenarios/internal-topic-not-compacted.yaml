inputs:
  - kind: steer
    from: kabir
    text: "order-sync is re-applying orders we loaded weeks ago and the lag is still climbing. Did Kafka replay the topic? Tell me why before anyone touches order-sync."
  - kind: comment
    from: arjun
    text: "We paused pg-orders-connector on Monday 18:00 for the warehouse move and resumed it at 09:05; nothing else changed on it. Connect's internal topics were created by the platform Terraform module in August, with the module's defaults, like the data topics."

expect:
  root_cause:
    - [offset*]
    - [compact*, cleanup*, retention, delet*, aged, expired, purged]
    - [snapshot*, resnapshot*, re-snapshot*, re-read*, re-emit*]
  root_cause_forbidden:
    - [topic, rewound]
    - [kafka, replayed]
    - [slot, lost]
    - [slot, dropped]
    - [consumer, crash*]
    - [schema change]
    - [poison pill]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  root_cause_layer_alt: [kafka]
  expected_facts:
    - id: f_snapshot_completed
      tool: debezium_snapshot_progress
      match: [last snapshot completed, 412880 rows]
      required: true
    - id: f_snapshot_rows
      tool: debezium_metrics
      match: [rows scanned, public orders, 412880]
    - id: f_module_default_delete
      tool: kafka_topic_config
      match: [cleanup policy delete, retention ms 86400000]
      required: true
    - id: f_lag
      tool: kafka_consumer_lag
      match: [total lag 388214]
    - id: f_task_running
      tool: connect_status
      match: [task 0 running]
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
    - id: f_offsets_not_compacted
      tool: connect_worker_info
      match: [connect offsets, cleanup policy delete]
      required: true
  claims:
    - about: root_cause
      facts: [f_snapshot_completed, f_snapshot_rows, f_module_default_delete]
  evidence_tools: [debezium_snapshot_progress, kafka_topic_config, connect_worker_info]
  forbidden_actions: [connect_restart_connector, connect_restart_task, connect_pause_connector, kafka_reset_consumer_offsets, pg_drop_replication_slot, schema_register, schema_set_compatibility]
  max_tool_calls: 14
