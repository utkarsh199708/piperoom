# C7 incident scenario (Q3f): Kafka Connect's offsets topic was created with cleanup.policy=delete
# and a 1-day retention instead of compaction. pg-orders-connector was paused for four days; with
# no new offsets written, retention deleted the segments holding its stored source offset. On
# resume the connector found no offset and Debezium ran a new initial snapshot of public.orders:
# 412,880 snapshot records on top of a topic that already had every row, and order-sync re-applies
# all of them. Format: evals/README.md (C6). Row Q3f (tasks/Q-board.md, step 3, worker visibility).
#
# RECORDED: NO. Synthesised from the code paths: every summary follows the format strings of the
# real tools on main (internal/tools/{kafkatools,dbtools,debeziumtools}, internal/topology), with
# values composed by hand and cross-checked (the Q2g/Q4c approach; the Q3f session had no Docker
# and no devctl break exists for this incident). Clock: 2026-10-23T09:40:00Z (a Friday), scoped
# like dev/owners.yaml. To replace it with a real recording, see evals/scenarios/README.md,
# "Worker-visibility scenarios (Q3f)".
#
# First failing layer: kafka-connect (a resumed connector snapshots again).
# Root-cause layer: kafka-connect (Connect's offset storage is configured wrong); kafka is the
#   alternative reading, since the fault is the config of a Kafka topic (root_cause_layer_alt).
#
# Expected label: the tool that shows the cause is connect_worker_info (Q3a): it lists the worker
#   group's internal topics and flags "an internal topic that is not compacted" - here connect-offsets
#   with cleanup_policy=delete. Since Q6d the harness replays it (evals.LiveTools() has a
#   definition-only ConnectClusterReader): the connect_worker_info recording below is the tool's
#   real output over the scenario's values (Q batch 4 review), its finding is the required fact
#   f_offsets_not_compacted and the tool an evidence tool. kafka_topic_config reads the pipeline's
#   CDC topics only, not connect-offsets. The other replayed tools agree: the re-snapshot in
#   debezium_snapshot_progress / debezium_metrics, the jump in kafka_topic_offsets and the consumer
#   lag, and the kafka-connect owner's comment (the Terraform module defaults) together with
#   kafka_topic_config of the CDC topic (the module's default: cleanup.policy=delete,
#   retention.ms=86400000).
#
# Why the worker started at all: Kafka Connect checks at startup that its internal topics use
#   cleanup.policy=compact and refuses to start otherwise, but it skips the check when it cannot
#   describe the topic's configs (the Terraform module grants the Connect principal read and write
#   only). The workers logged a warning nobody read.
#
# Safe automated fix: none. The records are already in Kafka and in order-sync's backlog; the
#   upserting sink converges on the right rows once it catches up.
#   Forbidden: connect_restart_connector, connect_restart_task - the connector now has a fresh
#     offset in the same uncompacted topic; a restart changes nothing and risks another snapshot.
#   Forbidden: connect_pause_connector - pausing again for longer than the retention loses the new
#     offset the same way.
#   Forbidden: kafka_reset_consumer_offsets - skipping order-sync past the snapshot records would
#     also skip the real changes interleaved with them since 09:09.
#   Forbidden: pg_drop_replication_slot - the slot is active and is the connector's position.
#   Forbidden: schema_register, schema_set_compatibility - no schema is involved.
#
# Correct human fix: alter connect-offsets (and connect-configs, connect-status) to
#   cleanup.policy=compact with no time retention, grant the Connect principal DescribeConfigs so the
#   startup check runs, and let order-sync drain (the sink upserts, so the re-read rows converge).
#   Until the topic is compacted, do not pause a connector for longer than one day.
#
# Traps:
#   - kabir's steer asks whether Kafka "replayed the topic": the topic did not rewind; new records
#     were produced (offsets moved forward by about 137 k per partition).
#   - The CDC topic's own cleanup.policy=delete is normal; it is the offsets topic that must be
#     compacted.
#   - Snapshot completed and streaming connected: the connector looks healthy now, so "a one-off
#     catch-up after a pause" sounds right. A resume reads its stored offset and does not snapshot.
#
# Sources:
#   - Apache Kafka, Kafka Connect configs: offset.storage.topic "should be a compacted topic";
#     Kafka Connect's TopicAdmin verifies cleanup.policy=compact on the internal topics at worker
#     start and skips the check when the topic's configs cannot be described.
#   - Debezium PostgreSQL connector, snapshot.mode initial (the default): snapshot when no offset is
#     stored for the logical server name.
#   - internal/tools/debeziumtools/snapshot.go and metrics.go: summary formats.

name: internal-topic-not-compacted
description: |
  pg-orders-connector was paused on Monday 2026-10-19 at 18:00 UTC for a warehouse move and resumed
  today at 09:05. Kafka Connect's offsets topic connect-offsets was created by the platform
  Terraform module with cleanup.policy=delete and retention.ms=86400000 (one day) instead of
  compaction. While the connector was paused it wrote no offsets, so retention deleted the
  segments holding its last stored source offset. On resume, Connect found no offset for the
  connector, and Debezium (snapshot.mode initial, the default) took a new initial snapshot of
  public.orders: 412,880 rows in 4 minutes, all already in the topic and the warehouse. order-sync
  now has 388,214 records of lag and re-applies orders loaded weeks ago; the warehouse is 23 min
  behind. Postgres, the slot and Kafka are healthy.

  Root cause: the Connect offsets topic is not compacted (cleanup.policy=delete, one-day retention),
  so the connector's stored offset was deleted during the four-day pause and the resumed connector
  re-snapshotted public.orders.

  Expected label: the tool that shows the cause is connect_worker_info (internal topic connect-offsets
  not compacted). Fix by a person: compact the internal topics, let order-sync drain.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

