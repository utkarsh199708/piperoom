    summary: |-
      connect-wh-orders-sink: Empty, 0 members, total lag 347879
        pg.public.orders/2: committed 42847389, end 42963512, lag 116123
        pg.public.orders/0: committed 42835240, end 42951330, lag 116090
        pg.public.orders/1: committed 42824611, end 42940277, lag 115666
  - tool: pg_replication_slots
    summary: |
      slot debezium_orders: active=true retained=212.4 MiB wal_status=reserved
  - tool: pg_recent_ddl
    summary: |
      2026-10-13T08:12:03Z ALTER TABLE public.orders | ALTER TABLE orders ADD COLUMN discount_code varchar(32); | app_migrator
      2026-10-09T14:20:11Z CREATE INDEX public.orders_status_idx | CREATE INDEX CONCURRENTLY orders_status_idx ON public.orders (status); | app_migrator
  - tool: pg_recent_ddl
