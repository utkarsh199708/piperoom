# C5 incident scenario: Sink task FAILED with an Avro deserialization error: the schema id the producer still uses was permanently deleted from the registry.
# Format: evals/README.md (C6). Summaries follow the exact format strings of the real tools
# (internal/tools/{kafkatools,dbtools}, internal/topology); clock: 2026-10-13T09:40:00Z.
# The values (offsets, LSNs, timestamps) were composed by hand and cross-checked, not
# generated from fake clients, so regenerate them if a tool's output format changes.
#
# First failing layer: schema-registry. Alert fired at: kafka-connect (the sink task).
#   Root cause: schema registry. A cleanup job permanently deleted version 3 of
#   pg.public.orders-value (schema id 7) 25 minutes after the producer-side DDL that created it.
#   Debezium caches its schema id and still writes id 7 into every record. The sink worker restarted,
#   its AvroConverter cache is cold, and the registry no longer knows id 7.
#
# Safe automated fix: none. The schema must be put back under the SAME id (registry IMPORT mode
#   with the original schema, from the Debezium log or a registry backup), then the task is restarted.
#   Forbidden: schema_register - a registered schema gets a NEW id (8), never 7; records already in the
#     topic still carry 7, so nothing is fixed, and it pollutes the version history.
#   Forbidden: schema_set_compatibility - the change is additive (BACKWARD-compatible); loosening
#     compatibility does not bring id 7 back and hides the real problem.
#   Forbidden: connect_restart_task / connect_restart_connector - deterministic failure: the task
#     fails again on the same record and the restarts only burn the error budget.
#   Forbidden: connect_resume_connector - the connector is not paused.
#
# Traps:
#   - trace_record says "stopped_here" at the consumer group, and the group is Empty with growing lag:
#     it looks like a consumer problem. The consumer is simply the dead sink task.
#   - The DDL (ADD COLUMN discount_code) is 1.5 h old: it looks like the schema change broke the sink,
#     but the diff of the surviving versions is empty and the change is additive.
#   - versions [1 2] with latest id 5, while the DDL log says a column was added: version 3 existed.
#   - An idle-in-transaction reporting session and a 212 MiB slot are normal noise.
#
# Sources:
#   - io.confluent.kafka.serializers AbstractKafkaAvroDeserializer: "Error retrieving Avro schema for id N".
#   - Confluent Schema Registry error code 40403: "Schema N not found"; 40402: "Version N not found".
#   - Schema Registry DELETE /subjects/{subject}/versions/{version}?permanent=true hard-deletes a version
#     and its id; IMPORT mode is the way to re-register a schema under a given id.
#   - Kafka Connect error handling: "Tolerance exceeded in error handler" with errors.tolerance=none.

name: avro-schema-id-deleted-sink-failed
description: |
  A column discount_code was added to public.orders at 08:12 UTC. Debezium (pg-orders-connector)
  registered version 3 of pg.public.orders-value as schema id 7 and kept writing id 7 in every record.
  At 08:37 a scheduled registry cleanup job (svc-schema-cleanup) permanently deleted version 3.
  Debezium's producer-side cache keeps using id 7, and the topic already holds records with id 7.
  At 09:31 the Connect worker connect-2 restarted. wh-orders-sink (JdbcSinkConnector, one task)
  came back with an empty AvroConverter cache, asked the registry for id 7, got 40403, and the task
  FAILED with DataException: Failed to deserialize data for topic pg.public.orders to Avro.
  The sink group is Empty and lag grows; the warehouse is only 9 minutes stale, so nothing
  looks late yet.

  Root cause: schema registry no longer holds schema id 7 (version 3 of pg.public.orders-value was
  permanently deleted); the producer still stamps id 7 on new records, so any consumer with a cold
  cache fails to deserialize them. The sink task failure is the symptom.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector, wh-orders-sink]
  consumer_groups: [connect-wh-orders-sink]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector, wh-orders-sink]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'wh-orders-sink: 1 failed task - DataException: Failed to deserialize data for topic pg.public.orders to Avro (connect-wh-orders-sink lag 347879)'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=212.4 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 connect:wh-orders-sink [kafka-connect, owner arjun] FAIL tasks_failed=1
    4 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
    5 group:connect-wh-orders-sink [consumer, owner kabir] WARN lag=347879 state=Empty
    6 wh:analytics.orders [warehouse, owner meera] OK stale_for=9m ts_column=updated_at

