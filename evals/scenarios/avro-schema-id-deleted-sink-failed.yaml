      Caused by: org.apache.kafka.connect.errors.DataException: Failed to deserialize data for topic pg.public.orders to Avro:
      Caused by: org.apache.kafka.common.errors.SerializationException: Error retrieving Avro schema for id 7
      Caused by: io.confluent.kafka.schemaregistry.client.rest.exceptions.RestClientException: Schema 7 not found; error code: 40403
  - tool: connect_config
    input: {connector: pg-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: postgres
      database.password: ***
      database.port: 5432
      database.user: piperoom
