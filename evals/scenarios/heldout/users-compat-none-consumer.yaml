inputs:
  - kind: comment
    from: Lena
    text: 'user-profile-sync log on every restart: RecordDeserializationException: Error deserializing key/value for partition usr.public.users-0 at offset 1184022. Caused by: org.apache.avro.AvroTypeException: Found string, expecting int'

# Terms are whole words that also match as substrings, so they grade the same before and
# after E2's word matching lands.
expect:
  outcome: diagnose
  # The root cause is the subject-level override, not the DDL (unlike source-column-dropped,
  # where the DDL is): the hypothesis must name compatibility NONE as an override.
  root_cause:
    - [none]
    - [compatib*, override]
    - [loyalty_tier]
  first_failing_layer: consumer
  root_cause_layer: schema-registry
  evidence_tools: [schema_registry_versions, kafka_consumer_lag]
  # f_consumer_stuck is only in kafka_consumer_lag's sequence: E2's fact check must read
  # sequence elements (recordingResults).
  expected_facts:
    - id: f_compat_none
      tool: schema_registry_versions
      match: [usr public users value, compatibility none]
      required: true
    - id: f_type_change
      tool: schema_registry_diff
      match: [loyalty tier, int, string]
    - id: f_consumer_stuck
      tool: kafka_consumer_lag
      match: [user profile sync, empty, 0 members]
      required: true
  claims:
    - about: root_cause
      facts: [f_compat_none, f_type_change]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_register]
  max_tool_calls: 12
