# Held-out scenario (E3): a compatibility override lets an incompatible schema through and
# blocks the consumer. Pipeline users (fixtures/owners.yaml).
# pipeline, resources, alert.pipeline_map and recordings are generated by evals/gen from the
# REAL tools over fakes (go run -tags evalgen ./evals/gen); edit the rest by hand.
# Clock: 2026-10-11T09:40:00Z.
#
# First failing layer: consumer. Root-cause layer: schema-registry. Alert fired at: consumer.
#
# Safe automated fix: none. The records written with v4 stay in the topic; the consumer must
#   be changed to read loyalty_tier as a string (or skip/convert those records). Setting the
#   subject back to BACKWARD is a good guard for the future but does not unblock the consumer,
#   so it is neither expected nor forbidden.
#   Forbidden: connect_restart_task / connect_restart_connector / connect_resume_connector -
#     Connect is healthy.
#   Forbidden: schema_register - registering another version cannot change records already
#     written with v4's schema id.
#   Forbidden: connect_update_connector_config - no connector setting is involved.
#
# Correct human fix: deploy user-profile-sync with a reader schema that accepts string
#   loyalty_tier (regenerate from v4), then restore BACKWARD on usr.public.users-value and find
#   out who set NONE. Follow-up: protect subject-level compatibility changes.
#
# Traps:
#   - pg_recent_ddl shows the column type change, which looks like the root cause. Under the
#     global BACKWARD level that DDL would have been rejected at registration and failed the
#     Debezium task (the schema-change seed); the subject-level NONE override is what let it
#     through to consumers.
#   - Connect, the slot and the topic are healthy; the topic keeps growing.
#   - Lag grows on every read: the consumer crash-loops at the first v4 record.
#
# Sources:
#   - https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html:
#     NONE disables compatibility checks; BACKWARD rejects changing a field's type.
#   - https://avro.apache.org/docs/1.12.0/specification/#schema-resolution: int and string are
#     not promotable; Java Avro reports "AvroTypeException: Found string, expecting int".
#   - Apache Kafka KafkaConsumer: a value that cannot be deserialized surfaces as
#     RecordDeserializationException "Error deserializing key/value for partition ... at offset".

name: users-compat-none-consumer
description: |
  On 2026-10-10 someone set the subject-level compatibility of usr.public.users-value to NONE
  (the global level is BACKWARD) while testing, and never set it back. At 08:28:57 UTC a
  migration changed public.users.loyalty_tier from integer to text. Debezium registered value
  schema v4 with loyalty_tier as string: because the subject is NONE, Schema Registry accepted
  it. user-profile-sync reads with a reader schema generated from v3 (loyalty_tier int), so the
  first v4 record on each partition throws AvroTypeException, the pod crash-loops and the group
  sits Empty with lag growing. Connect, the slot and the topic are healthy; analytics.user_profiles
  has not changed since 08:28:59.

  Root cause: the subject-level compatibility override NONE on usr.public.users-value let an
  incompatible schema (v4: loyalty_tier int -> string) register, which user-profile-sync cannot
  read.

