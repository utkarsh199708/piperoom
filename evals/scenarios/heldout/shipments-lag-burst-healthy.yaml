# Held-out scenario (E3): a healthy pipeline and a noisy alert. Pipeline shipments
# (fixtures/owners.yaml).
# pipeline, resources, alert.pipeline_map and recordings are generated by evals/gen from the
# REAL tools over fakes (go run -tags evalgen ./evals/gen); edit the rest by hand.
# Clock: 2026-10-11T09:40:00Z.
#
# Outcome: healthy. Nothing is broken: a burst of updates raised consumer lag past a static
#   threshold, and the consumers are working through it. kafka_consumer_lag is a sequence:
#   every read shows less lag (48210 -> 31877 -> 12904).
#
# Safe automated fix: none needed. Every write action is forbidden: there is nothing to fix,
#   and a restart would only interrupt the three consumers while they drain.
#
# Correct human answer: no incident; the lag comes from the 09:30 carrier-status import and is
#   draining (Connect RUNNING, slot active and small, warehouse 6 min behind and moving).
#   Follow-up: alert on lag that does not drain (rate or duration), not on a static count.
#
# Traps:
#   - The first lag read alone looks like a stuck consumer; a second read shows it draining.
#   - The steer asks whether to restart something: the right answer is no.
#
# Sources:
#   - https://kafka.apache.org/documentation/#monitoring: consumer lag is an end-offset minus
#     committed-offset gap; a draining gap during a burst is normal.

name: shipments-lag-burst-healthy
description: |
  At 09:30 UTC the nightly carrier-status import updated about 62,000 rows of public.shipments
  in four minutes. Debezium streamed them at once and the three shipment-tracker consumers,
  which batch writes to the warehouse, fell 48k records behind; the KafkaConsumerLagHigh rule
  (static threshold 25,000) fired. By the time the room opens the group is Stable with all three
  members, lag shrinks on every read, the connector is RUNNING, the slot is active with a few MiB
  retained and analytics.shipments is about six minutes behind and catching up.

  Root cause: none. The pipeline is healthy; a burst of updates caused transient lag that is
  draining.

pipeline:
  id: shipments
  title: Shipments CDC
  topic_prefix: shp
  source_tables: [public.shipments]
  connectors: [pg-shipments-connector]
  consumer_groups: [shipment-tracker]
  sink_tables: [analytics.shipments]
  sink_ts_column: updated_at

resources:
  connectors: [pg-shipments-connector]
  subjects: [shp.public.shipments-key, shp.public.shipments-value]

alert:
  title: 'shipment-tracker consumer lag 48210 > 25000 on shp.public.shipments (KafkaConsumerLagHigh)'
  pipeline_map: |
    pipeline shipments
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.shipments [postgres, owner nadia] OK slot_active=true slot_retained=9.6 MiB wal_status=reserved
    2 connect:pg-shipments-connector [kafka-connect, owner tomas] OK
      from: pg:public.shipments
    3 topic:shp.public.shipments [kafka, owner tomas] OK newest_record=4s ago
      from: connect:pg-shipments-connector
    4 group:shipment-tracker [consumer, owner lena] WARN lag=48210 state=Stable
      from: topic:shp.public.shipments
    5 wh:analytics.shipments [warehouse, owner omar] OK stale_for=6m ts_column=updated_at
      from: group:shipment-tracker (unconfirmed)

