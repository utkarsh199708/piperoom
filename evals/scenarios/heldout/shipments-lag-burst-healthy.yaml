inputs:
  - kind: steer
    text: Do we need to restart the consumer or the connector?

# outcome healthy has no root cause, layers, fix or claims (E2 rejects them). Until E2's
# scoring lands this build accepts the scenario but cannot pass a run on it.
expect:
  outcome: healthy
  evidence_tools: [kafka_consumer_lag]
  # f_group_stable is only in kafka_consumer_lag's sequence: E2's fact check must read
  # sequence elements (recordingResults).
  expected_facts:
    - id: f_group_stable
      tool: kafka_consumer_lag
      match: [shipment tracker, stable]
      required: true
    - id: f_connector_running
      tool: connect_status
      match: [pg shipments connector, running]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 10
