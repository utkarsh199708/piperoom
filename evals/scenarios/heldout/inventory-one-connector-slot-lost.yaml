# Terms are whole words that also match as substrings, so they grade the same before and
# after E2's word matching lands. Blaming pg-inventory-sites fails the root-cause groups,
# which need the stock connector or its slot.
expect:
  outcome: diagnose
  root_cause:
    - [debezium_inv_stock, pg-inventory-stock, stock_levels, stock connector]
    - [invalidated, lost, max_slot_wal_keep_size, no longer get changes]
  first_failing_layer: postgres
  root_cause_layer: postgres
  evidence_tools: [connect_status, pg_replication_slots]
  expected_facts:
    - id: f_slot_lost
      tool: pg_replication_slots
      match: [debezium inv stock, wal status lost]
      required: true
    - id: f_task_failed
      tool: connect_status
      match: [pg inventory stock, task 0, failed, no longer get changes]
      required: true
    - id: f_sites_running
      tool: connect_status
      match: [pg inventory sites, task 0, running]
  claims:
    - about: root_cause
      facts: [f_slot_lost, f_task_failed]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 12
