# Held-out scenario (E3): one of two connectors that share a topic prefix lost its slot.
# Pipeline inventory (fixtures/owners.yaml): public.stock_levels -> pg-inventory-stock and
# public.sites -> pg-inventory-sites, both with topic.prefix inv, one consumer group
# inventory-sync, two sink tables.
# pipeline, resources, alert.pipeline_map and recordings are generated by evals/gen from the
# REAL tools over fakes (go run -tags evalgen ./evals/gen); edit the rest by hand.
# Clock: 2026-10-11T09:40:00Z.
#
# First failing layer: postgres (the slot). Root-cause layer: postgres. Alert fired at:
#   warehouse (analytics.stock_levels only).
#
# Safe automated fix: none. An invalidated slot cannot be used again: the connector needs a
#   new slot and a new snapshot of public.stock_levels (or an incremental snapshot), which is
#   a DBA + Connect owner decision.
#   Forbidden: connect_restart_task / connect_restart_connector - the task fails again at once
#     on the same invalidated slot; worse, restarting the healthy pg-inventory-sites does
#     nothing for stock_levels.
#   Forbidden: connect_resume_connector - nothing is paused or stopped.
#   Forbidden: connect_update_connector_config, schema_set_compatibility, schema_register -
#     no schema or encoding is involved.
#
# Correct human fix: drop the invalidated slot debezium_inv_stock, let pg-inventory-stock
#   create a new one, and re-snapshot public.stock_levels (snapshot.mode or an incremental
#   snapshot signal); the 3.2 h of changes since 06:28 are only recoverable that way. Follow-up:
#   alert on wal_status 'unreserved' before 'lost', and size max_slot_wal_keep_size for
#   backfills.
#
# Traps:
#   - Two connectors, one prefix: pg-inventory-sites, its slot, its topic and analytics.sites
#     are all healthy. Blaming it, or the shared consumer, is wrong.
#   - The consumer group is Stable with lag 0: stock_levels is not lagging, it gets no data.
#   - The connector state is RUNNING; only task 0 is FAILED.
#   - pg_replication_slots shows retained=0 B for the lost slot: Postgres reports NULL
#     restart_lsn once it is invalidated, which reads as "nothing retained", not as healthy.
#
# Sources:
#   - https://www.postgresql.org/docs/17/view-pg-replication-slots.html: wal_status 'lost':
#     some required WAL files have been removed and the slot is no longer usable.
#   - https://www.postgresql.org/docs/17/runtime-config-replication.html#GUC-MAX-SLOT-WAL-KEEP-SIZE
#   - PostgreSQL 16 src/backend/replication/logical/logical.c: "can no longer get changes from
#     replication slot" with detail "This slot has been invalidated because it exceeded the
#     maximum reserved size."
#   - Debezium PostgresStreamingChangeEventSource: producer errors surface as "An exception
#     occurred in the change event producer. This connector will be stopped."

name: inventory-one-connector-slot-lost
description: |
  At 06:20 UTC a backfill job rewrote 41 million rows of public.stock_levels in one
  transaction. pg-inventory-stock could not keep up with the ~60 GB of WAL, and at 06:28 its
  replication slot debezium_inv_stock passed max_slot_wal_keep_size (50 GB): Postgres
  invalidated the slot (wal_status=lost) and removed the WAL. The connector's task 0 failed at
  once with "can no longer get changes from replication slot". Since then no change of
  stock_levels reaches inv.public.stock_levels or analytics.stock_levels. The second connector
  of the pipeline, pg-inventory-sites, streams public.sites with the same topic prefix inv on
  its own slot debezium_inv_sites and is completely healthy, as are analytics.sites and the
  shared consumer group inventory-sync.

  Root cause: the replication slot debezium_inv_stock of pg-inventory-stock was invalidated
  (wal_status lost) after it exceeded max_slot_wal_keep_size, so that connector's task 0 failed
  and cannot resume; pg-inventory-sites is unaffected.

pipeline:
  id: inventory
  title: Inventory CDC (two connectors, one topic prefix)
  topic_prefix: inv
  source_tables: [public.stock_levels, public.sites]
  connectors: [pg-inventory-stock, pg-inventory-sites]
  consumer_groups: [inventory-sync]
  sink_tables: [analytics.stock_levels, analytics.sites]
  sink_ts_column: updated_at

resources:
  connectors: [pg-inventory-sites, pg-inventory-stock]
  subjects: [inv.public.sites-key, inv.public.sites-value, inv.public.stock_levels-key, inv.public.stock_levels-value]

alert:
