          kind: source_table
          layer: postgres
          name: public.sites
          owner: nadia
        - facts:
            tasks_failed: "1"
          health: fail
          id: connect:pg-inventory-stock
          kind: connector
          layer: kafka-connect
          name: pg-inventory-stock
          owner: tomas
        - health: ok
