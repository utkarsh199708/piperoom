    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.stock_levels [postgres, owner nadia] FAIL slot_active=false slot_retained=unknown wal_status=lost
    2 pg:public.sites [postgres, owner nadia] OK slot_active=true slot_retained=4.2 MiB wal_status=reserved
    3 connect:pg-inventory-stock [kafka-connect, owner tomas] FAIL tasks_failed=1
      from: pg:public.stock_levels
    4 connect:pg-inventory-sites [kafka-connect, owner tomas] OK
      from: pg:public.sites
    5 topic:inv.public.stock_levels [kafka, owner tomas] OK newest_record=3.2h ago
      from: connect:pg-inventory-stock
    6 topic:inv.public.sites [kafka, owner tomas] OK newest_record=20s ago
      from: connect:pg-inventory-sites
    7 group:inventory-sync [consumer, owner lena] OK lag=1 state=Stable
      from: topic:inv.public.stock_levels, topic:inv.public.sites
    8 wh:analytics.stock_levels [warehouse, owner omar] FAIL stale_for=3.2h ts_column=updated_at
      from: group:inventory-sync (unconfirmed)
    9 wh:analytics.sites [warehouse, owner omar] OK stale_for=31s ts_column=updated_at
      from: group:inventory-sync (unconfirmed)

