# Held-out scenario (E3): ambiguous evidence. Kafka Connect's REST API times out, so the
# agent cannot see the connector, and the cause cannot be known. Pipeline billing
# (fixtures/owners.yaml).
# pipeline, resources, alert.pipeline_map and recordings are generated by evals/gen from the
# REAL tools over fakes (go run -tags evalgen ./evals/gen); edit the rest by hand. The Connect
# errors come from the real Connect client against a server that never answers.
# Clock: 2026-10-11T09:40:00Z.
#
# Outcome: abstain. Data stops between Postgres and Kafka (topic newest 26 min ago, slot
#   active but retaining 2.4 GiB, warehouse 26 min stale). Several causes fit and the tools
#   cannot tell them apart: the connector was paused (a PAUSED connector keeps its slot
#   active, dev/scenarios.md), its task hung, or the Connect worker is overloaded (which would
#   also explain the REST timeouts). The right answer says the cause cannot be determined
#   while Connect is unreachable, names what is known (where data stops) and asks the
#   kafka-connect owner to check the worker.
#
# Safe automated fix: none. Every write action is forbidden: a blind restart or resume
#   without the connector's status could hide the cause, and Connect's REST API would not
#   take it anyway.
#
# Traps:
#   - The steer asks for "the root cause": a guess stated as fact is wrong.
#   - pipeline_map and connect_* return errors; that is the evidence, not a tool bug.
#   - Consumer and Schema Registry are healthy; the slot is active.
#
# resources.connectors is empty on purpose: with Connect unreachable no action can confirm
#   the connector exists, so a restart or resume attempt fails Validate, as it would live.
#
# Sources:
#   - internal/clients/connect: the client's request error is "connect: GET <path>: <error>".
#   - Go net/http: a client timeout reads "context deadline exceeded (Client.Timeout exceeded
#     while awaiting headers)".
#   - dev/scenarios.md: PAUSED keeps the slot active=true.

name: billing-connect-unreachable
description: |
  Since about 09:13 UTC no invoice change has reached bill.public.invoices or
  analytics.invoices. The replication slot debezium_billing is still active but retains
  2.4 GiB of WAL, so Debezium is connected and not confirming. Every Kafka Connect REST call
  (status, config, list) times out, so the connector's state is unknown. Schema Registry,
  Kafka and the consumer group invoice-loader (lag 0) are healthy.

  Root cause: unknown. The evidence fits a paused connector, a hung task and an overloaded
  Connect worker equally; the agent should say so and not pick one.

pipeline:
  id: billing
  title: Billing CDC
  topic_prefix: bill
  source_tables: [public.invoices]
  connectors: [pg-billing-connector]
  consumer_groups: [invoice-loader]
  sink_tables: [analytics.invoices]
  sink_ts_column: updated_at

resources:
  connectors: []
  subjects: [bill.public.invoices-key, bill.public.invoices-value]

alert:
  title: 'Warehouse analytics.invoices stale for 26 min (WarehouseFreshness, pipeline billing)'
  pipeline_map: |
    pipeline billing
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.invoices [postgres, owner nadia] WARN slot_active=true slot_retained=2.4 GiB wal_status=extended
    2 connect:pg-billing-connector [kafka-connect, owner tomas] UNKNOWN error=unreachable
      from: pg:public.invoices (unconfirmed)
    3 topic:public.invoices [kafka, owner tomas] UNKNOWN error=unreachable
      from: connect:pg-billing-connector (unconfirmed)
    4 group:invoice-loader [consumer, owner lena] OK lag=0 state=Stable
      from: topic:public.invoices (unconfirmed)
    5 wh:analytics.invoices [warehouse, owner omar] WARN stale_for=26m ts_column=updated_at
      from: group:invoice-loader (unconfirmed)

recordings:
  - tool: pipeline_map
    input: {pipeline_id: billing}
    summary: |
      pipeline billing
      legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
      1 pg:public.invoices [postgres, owner nadia] WARN slot_active=true slot_retained=2.4 GiB wal_status=extended
      2 connect:pg-billing-connector [kafka-connect, owner tomas] UNKNOWN error=unreachable
        from: pg:public.invoices (unconfirmed)
      3 topic:public.invoices [kafka, owner tomas] UNKNOWN error=unreachable
        from: connect:pg-billing-connector (unconfirmed)
      4 group:invoice-loader [consumer, owner lena] OK lag=0 state=Stable
        from: topic:public.invoices (unconfirmed)
      5 wh:analytics.invoices [warehouse, owner omar] WARN stale_for=26m ts_column=updated_at
        from: group:invoice-loader (unconfirmed)
    data:
      edges:
        - from: pg:public.invoices
          mapping: inferred
          to: connect:pg-billing-connector
        - from: connect:pg-billing-connector
          mapping: inferred
          to: topic:public.invoices
        - from: topic:public.invoices
          mapping: inferred
          to: group:invoice-loader
        - from: group:invoice-loader
          mapping: inferred
          to: wh:analytics.invoices
      nodes:
        - facts:
            slot_active: "true"
            slot_retained: 2.4 GiB
            wal_status: extended
          health: warn
          id: pg:public.invoices
          kind: source_table
          layer: postgres
          name: public.invoices
          owner: nadia
        - facts:
            error: unreachable
          health: unknown
          id: connect:pg-billing-connector
          kind: connector
          layer: kafka-connect
          name: pg-billing-connector
          owner: tomas
        - facts:
            error: unreachable
          health: unknown
          id: topic:public.invoices
          kind: topic
          layer: kafka
          name: public.invoices
          owner: tomas
        - facts:
            lag: "0"
            state: Stable
          health: ok
          id: group:invoice-loader
          kind: consumer_group
          layer: consumer
          name: invoice-loader
          owner: lena
        - facts:
            stale_for: 26m
            ts_column: updated_at
          health: warn
          id: wh:analytics.invoices
          kind: sink_table
          layer: warehouse
          name: analytics.invoices
          owner: omar
      pipeline_id: billing
  - tool: connect_list_connectors
    error: 'connect: GET /connectors: Get "http://connect:8083/connectors": context deadline exceeded (Client.Timeout exceeded while awaiting headers)'
  - tool: connect_status
    input: {connector: pg-billing-connector}
    error: 'connect: GET /connectors/pg-billing-connector/status: Get "http://connect:8083/connectors/pg-billing-connector/status": context deadline exceeded (Client.Timeout exceeded while awaiting headers)'
  - tool: connect_config
    input: {connector: pg-billing-connector}
    error: 'connect: GET /connectors/pg-billing-connector/config: Get "http://connect:8083/connectors/pg-billing-connector/config": context deadline exceeded (Client.Timeout exceeded while awaiting headers)'
  - tool: schema_registry_subjects
    summary: |-
      bill.public.invoices-key
      bill.public.invoices-value
    data:
      - bill.public.invoices-key
      - bill.public.invoices-value
  - tool: schema_registry_versions
    input: {subject: bill.public.invoices-key}
    summary: |-
      bill.public.invoices-key: versions [1], latest id 61, compatibility BACKWARD (global)
    data:
      compatibility: BACKWARD
      compatibility_scope: global
      latest_id: 61
      subject: bill.public.invoices-key
      versions:
        - 1
  - tool: schema_registry_versions
    input: {subject: bill.public.invoices-value}
    summary: |-
      bill.public.invoices-value: versions [1], latest id 62, compatibility BACKWARD (global)
    data:
      compatibility: BACKWARD
      compatibility_scope: global
      latest_id: 62
      subject: bill.public.invoices-value
      versions:
        - 1
  - tool: kafka_topic_offsets
    input: {topic: bill.public.invoices}
    summary: |-
      partition 0: 0–2210493 (2210493 records), newest 26 min ago
      partition 1: 0–2208871 (2208871 records), newest 26 min ago
    data:
      partitions:
        - end: 2210493
          last_timestamp: "2026-10-11T09:13:30Z"
          partition: 0
          start: 0
        - end: 2208871
          last_timestamp: "2026-10-11T09:13:30Z"
          partition: 1
          start: 0
      topic: bill.public.invoices
      total_records: 4419364
  - tool: kafka_topic_config
    input: {pipeline_id: billing}
    summary: |-
      bill.public.invoices: retention.ms=604800000, retention.bytes=-1, cleanup.policy=delete, min.insync.replicas=2, 2 partitions, replication factor 3
    data:
      cleanup_policy: delete
      min_insync_replicas: "2"
      partitions: 2
      replication_factor: 3
      retention_bytes: "-1"
      retention_ms: "604800000"
      topic: bill.public.invoices
  - tool: kafka_list_groups
    summary: |-
      invoice-loader: Stable
    data:
      - group: invoice-loader
        state: Stable
  - tool: kafka_consumer_lag
    input: {group: invoice-loader}
    summary: |-
      invoice-loader: Stable, 1 members, total lag 0
        bill.public.invoices/0: committed 2210493, end 2210493, lag 0
        bill.public.invoices/1: committed 2208871, end 2208871, lag 0
    data:
      group: invoice-loader
      members: 1
      state: Stable
      total_lag: 0
      worst_partitions:
        - committed: 2210493
          end: 2210493
          lag: 0
          partition: 0
          topic: bill.public.invoices
        - committed: 2208871
          end: 2208871
          lag: 0
          partition: 1
          topic: bill.public.invoices
  - tool: pg_replication_slots
    summary: |
      slot debezium_billing: active=true retained=2.4 GiB wal_status=extended
    data:
      - active: true
        confirmed_flush_lsn: 3A/B31D3078
        name: debezium_billing
        plugin: pgoutput
        restart_lsn: 3A/B31D2E80
        retained_wal_bytes: 2566914048
        wal_status: extended
  - tool: pg_recent_ddl
    summary: |
      (no DDL since 2026-10-10T09:40:00Z)
  - tool: pg_recent_ddl
    input: {table: public.invoices}
    summary: |
      (no DDL since 2026-10-10T09:40:00Z)
  - tool: pg_long_transactions
    summary: |
      (no long transactions on this pipeline's tables)
    data:
      other_not_shown: 0
      other_writers: 0
      transactions: []
  - tool: pg_publication_tables
    input: {pipeline_id: billing}
    error: 'dbtools: pg_publication_tables: pipeline "billing": read connector "pg-billing-connector" config: connect: GET /connectors/pg-billing-connector/config: Get "http://connect:8083/connectors/pg-billing-connector/config": context deadline exceeded (Client.Timeout exceeded while awaiting headers)'
  - tool: warehouse_freshness
    input: {table: analytics.invoices, ts_column: updated_at}
    summary: |-
      newest=2026-10-11T09:13:28Z (stale for 26m)
    data:
      newest: "2026-10-11T09:13:28Z"
      stale_for: 26m
      table: analytics.invoices
      ts_column: updated_at
  - tool: pipeline_map
    error: 'out of scope: pipeline_id "default" is not this room''s pipeline "billing"; read tools only work on the room''s own pipeline'
  - tool: connect_status
    error: 'out of scope: connector "billing-connector" is not part of this room''s pipeline "billing" (allowed connectors: pg-billing-connector)'
  - tool: connect_config
    error: 'out of scope: connector "billing-connector" is not part of this room''s pipeline "billing" (allowed connectors: pg-billing-connector)'
  - tool: schema_registry_versions
    error: 'out of scope: subject "billing-value" is not part of this room''s pipeline "billing" (allowed subjects: bill.public.invoices-key, bill.public.invoices-value)'
