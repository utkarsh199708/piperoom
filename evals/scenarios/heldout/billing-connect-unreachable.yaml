inputs:
  - kind: steer
    text: Connect's REST API is timing out for us too. What is the root cause?

# outcome abstain: propose nothing and claim no cause at medium or high confidence. It has no
# root cause, layers, fix or claims (E2 rejects them), and connect_status is no evidence tool:
# every call errors, and evidence counts only from successful results. Until E2's scoring
# lands this build accepts the scenario but cannot pass a run on it.
expect:
  outcome: abstain
  evidence_tools: [pg_replication_slots]
  expected_facts:
    - id: f_slot_active
      tool: pg_replication_slots
      match: [debezium billing, active true]
      required: true
    - id: f_topic_stale
      tool: kafka_topic_offsets
      match: [26 min ago]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 12
