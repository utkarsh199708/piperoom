# Terms are whole words that also match as substrings, so they grade the same before and
# after E2's word matching lands.
expect:
  outcome: diagnose
  root_cause:
    - [risk_score]
    - [dead letter, dead-letter, dlq, errors.tolerance]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  evidence_tools: [connect_status, warehouse_freshness]
  expected_facts:
    - id: f_sink_running
      tool: connect_status
      match: [jdbc payments sink, task 0, running]
      required: true
    - id: f_ddl_risk_score
      tool: pg_recent_ddl
      match: [add column risk score]
      required: true
    - id: f_wh_stale
      tool: warehouse_freshness
      match: [stale for 47m]
      required: true
  claims:
    - about: root_cause
      facts: [f_ddl_risk_score, f_sink_running]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 14
