    3 connect:jdbc-payments-sink [kafka-connect, owner tomas] OK
    4 topic:pay.public.payments [kafka, owner tomas] OK newest_record=9s ago
    5 group:connect-jdbc-payments-sink [consumer, owner lena] OK lag=11 state=Stable
    6 wh:analytics.payments [warehouse, owner omar] FAIL stale_for=47m ts_column=updated_at

