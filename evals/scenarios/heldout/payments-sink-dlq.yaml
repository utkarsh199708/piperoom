# Held-out scenario (E3): a JDBC sink connector rejects every record and errors.tolerance=all
# hides it. Pipeline payments (fixtures/owners.yaml): Postgres -> Debezium pg-payments-source ->
# Kafka pay.public.payments -> JDBC sink connector jdbc-payments-sink -> analytics.payments.
# pipeline, resources, alert.pipeline_map and recordings are generated by evals/gen from the
# REAL tools over fakes (go run -tags evalgen ./evals/gen); edit the rest by hand.
# Clock: 2026-10-11T09:40:00Z.
#
# First failing layer: kafka-connect (the sink connector). Root-cause layer: kafka-connect.
#   Alert fired at: the dead-letter topic.
#
# Safe automated fix: none. The warehouse table needs the column (or the sink needs
#   schema.evolution=basic), and the dead-lettered records must be replayed after that. No
#   action does either: connect_update_connector_config allows only decimal.handling.mode,
#   time.precision.mode and tombstones.on.delete, and deliberately not errors.* keys.
#   Forbidden: connect_restart_task / connect_restart_connector - nothing failed; a restart
#     changes nothing and every new record still goes to the DLQ.
#   Forbidden: connect_resume_connector - nothing is paused or stopped.
#   Forbidden: connect_update_connector_config - none of its settings touches the cause.
#   Forbidden: schema_set_compatibility / schema_register - v4 is a valid, compatible schema;
#     loosening compatibility is the schema-change seed's fix, not this one's.
#
# Correct human fix: add risk_score numeric(5,2) to analytics.payments (or set the sink's
#   schema.evolution=basic), then replay dlq.jdbc-payments-sink into the sink. Follow-up: alert
#   on DLQ growth and on sink lag vs warehouse freshness; errors.tolerance=all without a DLQ
#   alarm turns every sink error into silent data loss.
#
# Traps:
#   - Everything a status check reads is green: both connectors RUNNING, no FAILED task,
#     consumer lag ~0, slot active. Only warehouse freshness and the DLQ show the problem.
#   - The DLQ topic is not a pipeline topic, so the Kafka tools refuse it (scope); the agent
#     must reason from the alert, the DDL and freshness, not read the DLQ.
#   - The DDL and schema v4 look like the schema-change seed, but v4 registered fine (adding
#     an optional field is BACKWARD compatible) and the source connector never failed.
#   - connect_config hides errors.* keys on main, so errors.tolerance is not visible.
#
# Sources:
#   - https://debezium.io/documentation/reference/stable/connectors/jdbc.html: schema.evolution
#     none (default) never alters the destination table; the sink then fails on a field the
#     table lacks.
#   - https://kafka.apache.org/documentation/#sinkconnectorconfigs_errors.tolerance: with
#     errors.tolerance=all failing records are skipped (and sent to errors.deadletterqueue.topic.name)
#     while the task keeps RUNNING.
#   - https://www.postgresql.org/docs/17/sql-insert.html: "column ... of relation ... does not
#     exist" is what the sink's INSERT gets for a missing column.

name: payments-sink-dlq
description: |
  At 08:52:48 UTC the payments team's migration ran `ALTER TABLE public.payments ADD COLUMN
  risk_score numeric(5,2)`. Debezium (pg-payments-source) picked up the new column and
  registered pay.public.payments-value v4 with an optional risk_score field, which is BACKWARD
  compatible, so nothing failed upstream. The Debezium JDBC sink connector jdbc-payments-sink
  writes the topic into analytics.payments with schema.evolution=none: the warehouse table has
  no risk_score column, so every INSERT/UPSERT since 08:52:48 fails. The sink runs with
  errors.tolerance=all and a dead-letter queue, so each failed record goes to
  dlq.jdbc-payments-sink, the offset is committed and the task stays RUNNING. Lag is ~0 and
  every status is green, but no payment has reached the warehouse for 47 minutes.

  Root cause: jdbc-payments-sink cannot write records that carry the new risk_score column
  (the warehouse table lacks it and schema.evolution is none), and errors.tolerance=all sends
  every failing record to the dead-letter queue instead of failing the task.

pipeline:
  id: payments
  title: Payments to warehouse (JDBC sink)
  topic_prefix: pay
  source_tables: [public.payments]
  connectors: [pg-payments-source, jdbc-payments-sink]
  consumer_groups: [connect-jdbc-payments-sink]
  sink_tables: [analytics.payments]
  sink_ts_column: updated_at

resources:
  connectors: [jdbc-payments-sink, pg-payments-source]
  subjects: [pay.public.payments-key, pay.public.payments-value]

alert:
  title: 'DLQ dlq.jdbc-payments-sink received 18204 records in 45 min (ConnectSinkDLQGrowth); analytics.payments newest row 47 min old; sample payment id 88123401'
