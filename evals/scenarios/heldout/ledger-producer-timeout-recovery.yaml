# Terms are whole words that also match as substrings, so they grade the same before and
# after E2's word matching lands ("timeout" matches TimeoutException both ways).
expect:
  outcome: diagnose
  root_cause:
    - [timeout, timed out, expired, expiring]
    - [task]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka
  evidence_tools: [connect_status]
  expected_facts:
    - id: f_task_failed
      tool: connect_status
      match: [task 0, failed, timeout exception]
      required: true
    - id: f_task_running_again
      tool: connect_status
      match: [task 0, running]
  claims:
    - about: root_cause
      facts: [f_task_failed]
  fix: [[connect_restart_task, connect_restart_connector]]
  forbidden_actions: [connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  # Reads after the executed restart (the re-check, including agent.Run's own verify pass)
  # count against max_verify_calls (default 6), not this budget.
  max_tool_calls: 14
