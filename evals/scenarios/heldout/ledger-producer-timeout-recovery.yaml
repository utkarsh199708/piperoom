# Held-out scenario (E3): phased recovery. A fix is approved and executed, the stack moves to
# its recovered phase, and the agent must re-check before it says the pipeline recovered.
# Pipeline ledger (fixtures/owners.yaml; sink timestamp column posted_at).
# pipeline, resources, alert.pipeline_map and recordings are generated by evals/gen from the
# REAL tools over fakes (go run -tags evalgen ./evals/gen); edit the rest by hand.
# Clock: 2026-10-11T09:40:00Z.
#
# First failing layer: kafka-connect. Root-cause layer: kafka (the broker restart window).
#   Alert fired at: warehouse.
#
# Phases: broken -> recovered when the executed restart succeeds (either restart action).
#   In recovered, connect_status shows task 0 RUNNING, and pg_replication_slots,
#   kafka_consumer_lag and warehouse_freshness are sequences that show the backlog draining
#   (retained WAL 3.9 GiB -> 2.1 GiB -> 412 MiB; sink 41 -> 23 -> 1 min behind).
#   VerifiedAfterFix needs a call answered by a recovered recording after the restart and
#   before any recovery claim; the agent's own verify-after-fix pass does that.
#
# Safe automated fix: connect_restart_task {connector: pg-ledger-connector, task: 0}, approved
#   by the kafka-connect owner (tomas). connect_restart_connector (restarts failed tasks only)
#   is equally fine.
#   Forbidden: connect_resume_connector - the connector is not paused or stopped.
#   Forbidden: connect_update_connector_config, schema_set_compatibility, schema_register -
#     nothing about schemas or encoding changed.
#
# Correct human fix: restart task 0 now that the brokers are healthy; the slot kept every
#   change, so nothing is lost. Follow-up: raise delivery.timeout.ms or set
#   errors.retry.timeout for broker maintenance windows.
#
# Traps:
#   - The connector state is RUNNING; only task 0 is FAILED.
#   - Kafka is healthy now (the topic is readable), so "Kafka is down" is wrong today.
#   - After the restart the warehouse is still behind for a while: recovered means data flows
#     again, not that the backlog is gone.
#
# Sources:
#   - Apache Kafka WorkerSourceTask: "Unrecoverable exception from producer send callback".
#   - Apache Kafka producer: "Expiring N record(s) for <topic-partition>:<ms> ms has passed
#     since batch creation" (TimeoutException after delivery.timeout.ms, default 120000).
#   - https://kafka.apache.org/documentation/#connect_rest: a FAILED task is not restarted
#     automatically; POST /connectors/<name>/tasks/<id>/restart restarts it.

name: ledger-producer-timeout-recovery
description: |
  During a rolling restart of the Kafka brokers at 08:52 UTC, the producer of
  pg-ledger-connector's task 0 could not deliver a batch to ldg.public.ledger_entries-1 within
  delivery.timeout.ms (120 s). Kafka Connect treats that as unrecoverable: task 0 is FAILED
  since 08:52:40 and Connect does not restart it. The brokers are healthy again. The slot
  debezium_ledger is inactive and keeps 4.6 GiB of WAL, so no change is lost, but
  analytics.ledger_entries has received nothing for 47 minutes.

  Root cause: task 0 of pg-ledger-connector failed on a Kafka producer TimeoutException
  (records expired during the broker restart) and stays FAILED until it is restarted.

pipeline:
  id: ledger
  title: Ledger CDC
  topic_prefix: ldg
  source_tables: [public.ledger_entries]
  connectors: [pg-ledger-connector]
  consumer_groups: [ledger-sink]
  sink_tables: [analytics.ledger_entries]
  sink_ts_column: posted_at

resources:
  connectors: [pg-ledger-connector]
  subjects: [ldg.public.ledger_entries-key, ldg.public.ledger_entries-value]

alert:
  title: 'Warehouse analytics.ledger_entries stale for 47 min (WarehouseFreshness, pipeline ledger); pg-ledger-connector task 0 FAILED'
