    pipeline ledger
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.ledger_entries [postgres, owner nadia] WARN slot_active=false slot_retained=4.6 GiB wal_status=extended
    2 connect:pg-ledger-connector [kafka-connect, owner tomas] FAIL tasks_failed=1
      from: pg:public.ledger_entries
    3 topic:ldg.public.ledger_entries [kafka, owner tomas] OK newest_record=47m ago
      from: connect:pg-ledger-connector
    4 group:ledger-sink [consumer, owner lena] OK lag=0 state=Stable
      from: topic:ldg.public.ledger_entries
    5 wh:analytics.ledger_entries [warehouse, owner omar] FAIL stale_for=47m ts_column=posted_at
      from: group:ledger-sink (unconfirmed)

phases: [broken, recovered]

transitions:
  - on: {action: connect_restart_task, ok: true}
    to: recovered
  - on: {action: connect_restart_connector, ok: true}
    to: recovered

