# Right and wrong root-cause wordings for the held-out scenarios whose term rows #332 will rewrite (#427).
# evals/heldout_corpus_test.go runs every entry through rootCauseMatches against the scenario's expect and,
# for a right answer without a gap, through one full evalOnce. The rows are origin/main's; this file pins
# main's grades so a row or denial-detection change shows exactly what it flips.
#
#   scenario         held-out scenario name
#   text             the hypothesis wording; reviewers' elisions are completed neutrally
#   want_root_cause  the CORRECT grade: true = a right answer, false = a trap that must fail
#   source           '#332' ticket, 'r1'..'r4' [LEAD-REVIEW] rounds 1..4 on PR #384
#   gap              set when main's rows grade this text WRONG. The test then asserts main's grade (the
#                    opposite of want_root_cause); when a change fixes it the test fails with
#                    'gap fixed: drop gap and keep want'. The value is the reason.
#
# Quoted fragments are verbatim; completions around them are neutral, except where a completion restores context
# from the reviewer's evidence (e.g. risk_score in the rebuilt r1 payments text, next to its verbatim quote).
#
# Add a reviewer's new text here FIRST, then change rows or denial detection. Gaps measured once,
# against origin/main af1b3148 (rows identical to this branch's).
