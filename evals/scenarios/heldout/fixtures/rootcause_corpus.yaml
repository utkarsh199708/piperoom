# Right and wrong root-cause wordings for the three held-out scenarios whose term rows #332 rewrote
# (#427). The test in evals/heldout_corpus_test.go runs every entry through rootCauseMatches against
# the scenario's expect and, for want_root_cause: true, through one full evalOnce.
#
# scenario        held-out scenario name
# text            the hypothesis wording, with reviewers' elisions filled in neutrally
# want_root_cause what the scorer must return for this text (for main_wrong entries: the CURRENT grade)
# main_wrong      true if origin/main's rows grade this text the same wrong way (a known gap)
# source          '#332' ticket, 'r1'..'r3' [LEAD-REVIEW] rounds 1..3 on PR #384
# gap             only on main_wrong entries: what the desired grade is and why it is not met
#
# Add a reviewer's new text here FIRST, then change the rows.
