# C7 setup scenario (U9d): supplemental logging was dropped on the source Oracle database after the
# setup run (the database-level minimal logging and the ALL COLUMNS log group of PIPEROOM.ORDERS),
# so the connector's task fails its start check. The label names the failing check and the fix with
# its tier (tasks/U-board.md rows U9a and U9d, step 9). Format: evals/README.md (C6). Built on
# `devctl setup-break no-supplemental-logging` (dev/oracle/README.md,
# cmd/devctl/setupbreaks_oracle.go, U9c).
#
# RECORDED: NO. Every summary and data payload is the exact output format of the real
# connect_status, connect_config, connect_worker_logs, kafkatools and dbtools code from main,
# composed by hand (the U1-19 approach; this session has no Docker, and the Oracle source driver,
# U9b, is not on main). The check name and its message are devctl's oracleSupplementalCheck on the
# U9a client's DatabaseInfo and TableSupplementalLogging; the task trace is Debezium's supplemental
# logging check wrapped by its change-event producer. Clock: 2026-10-28T09:40:00Z. Runner session:
# evals/setup/recordings/setup-no-supplemental-logging.json. To re-record both on the dev stack, see
# evals/scenarios/README.md, "Setup scenarios: Oracle (U9d)".
#
# Timeline: 09:20 the setup run registered ora-orders-connector; 09:22 the first verification was
#   green. 09:30 a DBA's redo-volume cleanup dropped the ALL COLUMNS log group of PIPEROOM.ORDERS and
#   the database-level minimal supplemental logging. 09:33 the person restarted task 0 because an
#   order had not arrived; it FAILED on Debezium's supplemental logging check. 09:39 the
#   re-verification stopped at tasks_running and canary_event. 09:40 the re-run of the prerequisite
#   checks: oracle-supplemental-logging failed.
#
# First failing layer: kafka-connect (task 0 FAILED; the database answers). Root-cause layer:
#   postgres (the source layer: the database's logging; owners.yaml has no oracle source_kind yet).
#
# Expected label: failing check oracle-supplemental-logging ("missing database-level minimal
#   supplemental logging (SUPPLEMENTAL_LOG_DATA_MIN=NO), an ALL COLUMNS supplemental log group on
#   PIPEROOM.ORDERS"); fix: ALTER DATABASE ADD SUPPLEMENTAL LOG DATA (a DBA step in the CDB root: the
#   U9a writer's CreatePublication adds only the table groups, and no setup op alters the
#   database's logging), source_create_publication {name: orders_ora, tables: [PIPEROOM.ORDERS]}
#   (T2: ALTER TABLE ... ADD SUPPLEMENTAL LOG DATA (ALL) COLUMNS), then connect_restart_task
#   {connector: ora-orders-connector, task: 0}. Changes written while the logging was off carry
#   incomplete redo, so the label notes a re-snapshot of the affected rows and does not grade it.
#   source_create_publication is a setup runner op, not a room action, so there is no expect.fix.
#   Forbidden: connect_update_connector_config - no connector key changes the database.
#   Forbidden: connect_restart_connector, connect_resume_connector - a restart fails the same way
#     until the database is fixed; the connector is not paused.
#   Forbidden: connect_delete_connector, connect_reset_source_offsets - the stored SCN is what lets
#     the task resume without a new snapshot.
#   Forbidden: schema_register, schema_set_compatibility - the registry is fine.
#
# Traps:
#   - The database is in ARCHIVELOG and C##DBZUSER holds its grants: an archive log or grant story
#     fails.
#   - The canary table keeps its own ALL COLUMNS group; only the database-level logging and the
#     captured table's group are gone.
#
# Sources:
#   - cmd/devctl/setupbreaks_oracle.go: breakOracleSupplementalLogging (drops the table's ALL
#     COLUMNS group, then the minimal logging), oracleSupplementalCheck's detail, check name
#     oracle-supplemental-logging.
#   - internal/clients/oracle/writer.go: CreatePublication runs ALTER TABLE ... ADD SUPPLEMENTAL LOG
#     DATA (ALL) COLUMNS per table and nothing at the database level.
#   - https://debezium.io/documentation/reference/3.2/connectors/oracle.html#_preparing_the_database:
#     minimal supplemental logging on the database, ALL COLUMNS on each captured table.

name: setup/no-supplemental-logging
description: |
  The Oracle pipeline orders-ora was set up at 09:20 and verified at 09:22. At 09:30 a DBA's
  redo-volume cleanup dropped the ALL COLUMNS supplemental log group of PIPEROOM.ORDERS and the
  database-level minimal supplemental logging. At 09:33 the person restarted task 0 of
  ora-orders-connector; it FAILED with "Supplemental logging not properly configured. Use: ALTER
  DATABASE ADD SUPPLEMENTAL LOG DATA". The re-verification at 09:39 stopped at tasks_running and
  canary_event. The re-run of the prerequisite checks fails oracle-supplemental-logging: "missing
  database-level minimal supplemental logging (SUPPLEMENTAL_LOG_DATA_MIN=NO), an ALL COLUMNS
  supplemental log group on PIPEROOM.ORDERS". The database is in ARCHIVELOG and the LogMiner grants
  are as they were.

  Root cause: supplemental logging was dropped on the source database (the minimal logging and the
  table's ALL COLUMNS group), so the redo lacks what LogMiner needs and Debezium refuses to stream.

  Expected label: failing check oracle-supplemental-logging; fix: ALTER DATABASE ADD SUPPLEMENTAL
  LOG DATA (a DBA step), source_create_publication for PIPEROOM.ORDERS (T2, the ALL COLUMNS group),
  then connect_restart_task for task 0.

setup:
  source_kind: oracle
  target: compose

pipeline:
  id: orders-ora
  title: Orders CDC (Oracle)
  topic_prefix: ora
  source_tables: [PIPEROOM.ORDERS]
  connectors: [ora-orders-connector]

resources:
  connectors: [ora-orders-connector]
  subjects: [ora.PIPEROOM.ORDERS-key, ora.PIPEROOM.ORDERS-value, ora.PIPEROOM.PIPEROOM_CANARY-key, ora.PIPEROOM.PIPEROOM_CANARY-value]

alert:
  # The title names the failed task and the check, not the check's message: the message states the
  # cause (it is in the description), and a title that hands the cause back must not pass.
  title: 'orders-ora setup: ora-orders-connector task 0 FAILED; prerequisite check oracle-supplemental-logging failed'
  pipeline_map: |
    pipeline orders-ora
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:PIPEROOM.ORDERS [postgres, owner priya] UNKNOWN
    2 connect:ora-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
      from: pg:PIPEROOM.ORDERS
    3 topic:ora.PIPEROOM.ORDERS [kafka, owner arjun] OK newest_record=18m ago
      from: connect:ora-orders-connector

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders-ora}
    summary: |
      pipeline orders-ora
      legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
      1 pg:PIPEROOM.ORDERS [postgres, owner priya] UNKNOWN
      2 connect:ora-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
        from: pg:PIPEROOM.ORDERS
      3 topic:ora.PIPEROOM.ORDERS [kafka, owner arjun] OK newest_record=18m ago
        from: connect:ora-orders-connector
    data:
      edges:
        - from: pg:PIPEROOM.ORDERS
          to: connect:ora-orders-connector
        - from: connect:ora-orders-connector
          to: topic:ora.PIPEROOM.ORDERS
      nodes:
        - health: unknown
          id: pg:PIPEROOM.ORDERS
          kind: source_table
          layer: postgres
          name: PIPEROOM.ORDERS
          owner: priya
        - facts:
            tasks_failed: "1"
          health: fail
          id: connect:ora-orders-connector
          kind: connector
          layer: kafka-connect
          name: ora-orders-connector
          owner: arjun
        - facts:
            newest_record: 18m ago
          health: ok
          id: topic:ora.PIPEROOM.ORDERS
          kind: topic
          layer: kafka
          name: ora.PIPEROOM.ORDERS
          owner: arjun
      pipeline_id: orders-ora
  - tool: connect_status
    input: {connector: ora-orders-connector}
    summary: |-
      ora-orders-connector (source): RUNNING on connect:8083.
      Task 0: FAILED:
      org.apache.kafka.connect.errors.ConnectException: An exception occurred in the change event producer. This connector will be stopped.
      Caused by: io.debezium.DebeziumException: Supplemental logging not properly configured. Use: ALTER DATABASE ADD SUPPLEMENTAL LOG DATA
    data:
      name: ora-orders-connector
      state: RUNNING
      tasks:
        - id: 0
          state: FAILED
          error: "org.apache.kafka.connect.errors.ConnectException: An exception occurred in the change event producer. This connector will be stopped.\nCaused by: io.debezium.DebeziumException: Supplemental logging not properly configured. Use: ALTER DATABASE ADD SUPPLEMENTAL LOG DATA"
      type: source
      worker: connect:8083
  - tool: connect_config
    input: {connector: ora-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.oracle.OracleConnector
      database.connection.adapter: logminer
      database.dbname: FREE
      database.hostname: oracle
      database.password: ***
      database.pdb.name: FREEPDB1
      database.port: 1521
      database.user: c##dbzuser
      schema.history.internal.kafka.bootstrap.servers: kafka:9092
      schema.history.internal.kafka.topic: schema-changes.orders-ora
      table.include.list: PIPEROOM.ORDERS,PIPEROOM.PIPEROOM_CANARY
      topic.prefix: ora
    data:
      connector.class: io.debezium.connector.oracle.OracleConnector
      database.connection.adapter: logminer
      database.dbname: FREE
      database.hostname: oracle
      database.password: '***'
      database.pdb.name: FREEPDB1
      database.port: "1521"
      database.user: c##dbzuser
      schema.history.internal.kafka.bootstrap.servers: kafka:9092
      schema.history.internal.kafka.topic: schema-changes.orders-ora
      table.include.list: PIPEROOM.ORDERS,PIPEROOM.PIPEROOM_CANARY
      topic.prefix: ora
  - tool: connect_worker_logs
    input: {connector: ora-orders-connector}
    summary: |-
      Worker log lines naming ora-orders-connector at WARN or above, 2026-10-28T08:40:00Z to 2026-10-28T09:40:00Z: 1 line(s), newest last (all of them in data).
      09:33:42.077 ERROR [connect:8083] WorkerSourceTask{id=ora-orders-connector-0} Task threw an uncaught and unrecoverable exception. Task is being killed and will not recover until manually restarted
          Caused by: io.debezium.DebeziumException: Supplemental logging not properly configured. Use: ALTER DATABASE ADD SUPPLEMENTAL LOG DATA
    data:
      bytes: 430
      connector: ora-orders-connector
      lines:
        - at: "2026-10-28T09:33:42.077Z"
          level: ERROR
          logger: org.apache.kafka.connect.runtime.WorkerTask
          text: "WorkerSourceTask{id=ora-orders-connector-0} Task threw an uncaught and unrecoverable exception. Task is being killed and will not recover until manually restarted\norg.apache.kafka.connect.errors.ConnectException: An exception occurred in the change event producer. This connector will be stopped.\nCaused by: io.debezium.DebeziumException: Supplemental logging not properly configured. Use: ALTER DATABASE ADD SUPPLEMENTAL LOG DATA"
          worker: connect:8083
      min_level: WARN
      since: "2026-10-28T08:40:00Z"
      summary_lines: 1
      until: "2026-10-28T09:40:00Z"
  - tool: kafka_topic_offsets
    input: {topic: ora.PIPEROOM.ORDERS}
    summary: |-
      partition 0: 0–100 (100 records), newest 18 min ago
    data:
      partitions:
        - end: 100
          last_timestamp: "2026-10-28T09:22:01Z"
          partition: 0
          start: 0
      topic: ora.PIPEROOM.ORDERS
      total_records: 100
  - tool: kafka_find_by_key
    input: {topic: ora.PIPEROOM.PIPEROOM_CANARY}
    summary: |-
      not found: no record with key "b19c7e4f0d2a83e6c5b1a9f7d3e08c24" since 2026-10-28T09:30:00Z
    data:
      found: false
      key: b19c7e4f0d2a83e6c5b1a9f7d3e08c24
      records: null
      topic: ora.PIPEROOM.PIPEROOM_CANARY
      truncated: false
  - tool: schema_registry_subjects
    summary: |-
      ora.PIPEROOM.ORDERS-key
      ora.PIPEROOM.ORDERS-value
      ora.PIPEROOM.PIPEROOM_CANARY-key
      ora.PIPEROOM.PIPEROOM_CANARY-value
  - tool: similar_incidents
    summary: |-
      No similar closed incident found on pipeline orders-ora (0 past rooms searched).
  # The room's source tools have no Oracle reader on main: the real tools' answer.
  - tool: source_settings
    error: 'dbtools: source_settings: the source client cannot read database settings'
  - tool: source_role_grants
    error: 'dbtools: source_role_grants: the source client cannot read database settings'
  - tool: source_table_replication
    error: 'dbtools: source_table_replication: the source client cannot read database settings'
  # Calls no recording above covers: the real tools' not-found answers.
  - tool: connect_status
    error: 'connect: GET /connectors/<name>/status: not found'
  - tool: connect_config
    error: 'connect: GET /connectors/<name>/config: not found'
  - tool: pipeline_map
    error: 'out of scope: pipeline_id "default" is not this room''s pipeline "orders-ora"; read tools only work on the room''s own pipeline'
  - tool: kafka_topic_offsets
    error: 'kafka: topic <topic>: not found'

inputs:
  - kind: steer
    from: priya
    text: "I restarted the connector task because an order had not shown up and now it fails right away. Archive logging is on, I checked. What else did the database lose, and what puts it back?"

expect:
  root_cause:
    - [supplemental]
    - [minimal, all columns, database level, log data]
    - [dropped, removed, off, disabled, lost]
  # The wrong stories of a failed task on a database that is in ARCHIVELOG.
  root_cause_forbidden:
    - [noarchivelog]
    - [logmining]
    - [insufficient privileges]
    - [network]
    - [password*]
    - [schema registry]
    - [offset*, reset]
  first_failing_layer: kafka-connect
  root_cause_layer: postgres
  expected_facts:
    - id: f_task_failed
      tool: connect_status
      match: [task 0, failed, supplemental logging not properly configured]
      required: true
    - id: f_task_killed
      tool: connect_worker_logs
      match: [task threw an uncaught and unrecoverable exception]
    - id: f_canary_missing
      tool: kafka_find_by_key
      match: [not found, b19c7e4f0d2a83e6c5b1a9f7d3e08c24]
  claims:
    - about: root_cause
      facts: [f_task_failed]
  evidence_tools: [connect_status]
  forbidden_actions: [connect_update_connector_config, connect_restart_connector, connect_resume_connector, connect_delete_connector, connect_reset_source_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 12
