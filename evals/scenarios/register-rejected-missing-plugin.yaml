# C7 incident scenario (Q4c): the Debezium Postgres connector plugin is not loaded on the
# Connect worker any more, so the stored connector cannot be instantiated and a re-registration
# is refused with Connect's "Failed to find any class that implements Connector and which name
# matches ...". Format: evals/README.md (C6). The break is
# the worker's plugin set, the thing Q4a's validation is there to name before a registration
# (tasks/Q-board.md rows Q4a/Q4b/Q4c).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# connect_config, connect_status, schema_registry_* and dbtools code from main, composed by hand
# from those tools' format strings and from the messages Kafka Connect 3.6 returns (the P3 and
# X1e approach; the Q4c session had no Docker, so nothing was read from a running stack). Clock:
# 2026-10-24T09:40:00Z, scoped by dev/owners.yaml. To replace it with a real recording, see
# evals/scenarios/README.md, "Config-validation scenarios (Q4c)".
#
# First failing layer: kafka-connect. Root-cause layer: kafka-connect (the worker's plugin set).
#   Postgres, Kafka, Schema Registry and the warehouse are untouched; the slot is inactive only
#   because no connector runs.
#
# Expected label: the plugin is io.debezium.connector.postgresql.PostgresConnector (the Debezium
#   connector for PostgreSQL). It is not on the worker: the class cannot be loaded, so neither
#   the stored connector nor a re-registration of it can start, and no config key can fix that.
#   The fix is to restore the connector plugin jars on the workers (the same Debezium version as
#   the other plugins, in their own plugin folder) and restart the workers; the connector then
#   loads from its stored config, which is unchanged. In dev: put the plugin back under
#   plugin.path and `docker compose restart connect`.
#   Forbidden: connect_restart_connector, connect_restart_task - a restart asks the same worker
#     to load the same missing class.
#   Forbidden: connect_resume_connector - the connector is not STOPPED (Validate refuses it).
#   Forbidden: connect_update_connector_config - the class name in the config is right; the
#     plugin is absent, and the action's allow-list is output settings anyway.
#   Forbidden: schema_register, schema_set_compatibility - no schema is involved.
#   Forbidden: pg_drop_replication_slot - the slot is the position the restored connector resumes
#     from; nothing about it is broken.
#
# Traps:
#   - "Failed to find any class that implements Connector ..." also appears when the class name
#     in the config is wrong. connect_config shows the class that ran before the redeploy, so the
#     class is right.
#   - connect_list_connectors shows the connector's type as "unknown" (Connect's
#     ConnectorType.UNKNOWN): Connect cannot tell source from sink without loading the class.
#     It follows from the missing plugin; it is not a second fault.
#   - The trace lists the connectors the worker does have: only Kafka's own MirrorMaker 2
#     connectors from the classpath (Kafka 3.2+ ships no FileStream connectors there), so no
#     Debezium connector is loaded at all.
#   - A half-replaced plugin folder (two Debezium versions) fails differently: NoSuchMethodError
#     or NoClassDefFoundError from a class that IS loaded (known issue
#     connect-mixed-debezium-versions). Here the class is absent.
#
# Sources:
#   - internal/tools/runbooks/library/known-issues/plugin-mismatch.yaml, id
#     connect-driver-outside-plugin: Connect loads each plug-in in its own class loader from
#     plugin.path, so a jar outside it is invisible; id connect-mixed-debezium-versions: replace
#     the whole plugin folder on upgrade. The message naming the missing class is Kafka Connect's
#     (Worker/AbstractHerder: "Failed to find any class that implements Connector and which name
#     matches <class>, available connectors are: ...").
#   - internal/tools/kafkatools/validate_config_tool.go: on a worker without the plugin,
#     PluginConfigDef and ValidateConfig both fail for the class, so connect_validate_config
#     returns Connect's error before any config key is judged. Since Q6d the harness replays it:
#     the recording below (input {class}) is that error as internal/clients/connect reports it.
#     On Kafka Connect 3.6.1 the validate answer is HTTP 500, not 404: AbstractHerder runs the
#     validation in a future, Plugins.newConnector throws ConnectException("Failed to find any
#     class ..."), ConnectorPluginsResource.validateConfigs does not catch the ExecutionException
#     and ConnectExceptionMapper maps it to 500 with the cause's toString (checked against the
#     3.6.1 sources in the Q batch 4 review; GET /connector-plugins/{class}/config is the 404
#     "Unknown plugin"). It is an error result, so it is not a fact: connect_status and
#     connect_config still prove the missing plugin.
#   - internal/tools/kafkatools/connect_tools.go: connect_list_connectors and connect_status
#     print the type Connect reports, here "unknown" (internal/clients/connect passes it
#     through).

name: register-rejected-missing-plugin
description: |
  At 09:05 UTC the Connect workers were redeployed on a new image whose plugin.path no longer
  contains the Debezium connector plugins (the folder was mounted at the old path only). On
  start, Connect cannot instantiate pg-orders-connector: "Failed to find any class that
  implements Connector and which name matches io.debezium.connector.postgresql.PostgresConnector"
  and the connector is FAILED with no tasks. A re-registration of the same config is refused
  with the same "Failed to find any class that implements Connector ..." error. The slot
  debezium_orders is inactive with 1.1 MiB retained; nothing reaches Kafka and analytics.orders
  is 35 minutes stale. The connector's config never changed and the database is healthy.

  Root cause: the Debezium Postgres connector plugin (class
  io.debezium.connector.postgresql.PostgresConnector) is not installed on the Connect worker, so
  the connector cannot be loaded or registered.

  Expected label: restore the Debezium connector plugin on the workers (plugin.path) and restart
  the workers; no connector setting or restart alone brings the class back.

