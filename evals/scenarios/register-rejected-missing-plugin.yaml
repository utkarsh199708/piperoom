inputs:
  - kind: steer
    from: arjun
    text: "I own the Connect workers. The config is the one that ran before the redeploy - I only changed the image. Re-registering it is refused. Tell me what is actually missing on the worker."

expect:
  root_cause:
    - [plugin]
    - [missing, not installed, not found, absent, removed, not loaded, not on the worker, classpath]
  # The wrong stories of a connector that cannot be loaded.
  root_cause_forbidden:
    - ['schema change']
    - ['database server name']
    - ['topic prefix']
    - ['permission denied']
    - ['slot was lost']
    - ['disk full']
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_plugin_class_missing
      tool: connect_status
      match: [failed to find any class, postgres connector]
      required: true
    - id: f_class_in_config
      tool: connect_config
      match: [connector class, postgres connector]
      required: true
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
    - id: f_source_role_ok
      tool: source_role_grants
      match: [selectable yes]
  claims:
    - about: root_cause
      facts: [f_plugin_class_missing]
  evidence_tools: [connect_status, connect_config]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_register, schema_set_compatibility, pg_drop_replication_slot]
  max_tool_calls: 12
