inputs:
  - kind: steer
    from: arjun
    text: "I upgraded the Connect workers from Debezium 1.9.7.Final to 2.7.3.Final at 08:57 and did the topic.prefix rename from the upgrade guide. Connect says RUNNING. The only thing in the worker log, every few seconds since 08:58, is: WARN [Producer clientId=connector-producer-pg-orders-connector-0] Error while fetching metadata with correlation id 4127 : {__debezium-heartbeat.pg=UNKNOWN_TOPIC_OR_PARTITION} (org.apache.kafka.clients.NetworkClient). We never had a topic with that name: the heartbeat topic we created for this connector is heartbeats.pg, and auto topic creation is off on this cluster. Please do not turn the heartbeat off, it is what keeps the slot moving at night."

expect:
  root_cause:
    - [heartbeat*]
    - [heartbeat.topics.prefix, topic.heartbeat.prefix, renam*, replaced, ignor*, dbz-topic-heartbeat-transaction, DBZ-4180]
  # The stories a green connector with a growing slot invites. A clause with a
  # negator is skipped ("the slot is not lost" is fine).
  root_cause_forbidden:
    - [slot, inactive]
    - ['permission denied']
    - [acl*]
    - [poison pill]
    - [schema registry]
    - [retention, delet*]
    - [connector, paused]
    - [broker*, down]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_task_running
      tool: connect_status
      match: [task 0 running]
      required: true
    - id: f_topic_stale
      tool: kafka_topic_offsets
      match: [newest 42 min ago]
      required: true
    - id: f_queue_full
      tool: debezium_metrics
      match: [last event 11 min ago]
    - id: f_slot_retained
      tool: pg_replication_slots
      match: [active true, retained 1.9]
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
  claims:
    - about: root_cause
      facts: [f_queue_full, f_topic_stale]
  evidence_tools: [connect_status, kafka_topic_offsets]
  forbidden_actions: [connect_update_connector_config, connect_restart_task, connect_restart_connector, connect_resume_connector, pg_drop_replication_slot, kafka_reset_consumer_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 14
