# C7 incident scenario (Q1e): the Connect workers were upgraded from Debezium 1.9.7.Final to
# 2.7.3.Final in place. The upgrade renamed database.server.name to topic.prefix, as the upgrade
# guide's first step says, but left heartbeat.topics.prefix=heartbeats in the stored config.
# Debezium 2.0 replaced that key with topic.heartbeat.prefix, so 2.7 ignores it and writes its
# heartbeats to the default topic __debezium-heartbeat.pg. Auto topic creation is off on this
# cluster, so the task's producer waits for that topic's metadata forever (Connect sets the
# producer's max.block.ms to Long.MAX_VALUE) and every change event queued behind the first
# heartbeat stays in the task. Connector and task 0 stay RUNNING with no trace.
# Format: evals/README.md (C6). Row Q1e (tasks/Q-board.md, step 1, version knowledge).
#
# RECORDED: NO. Synthesised from the code paths: every summary follows the format strings of the
# real tools on main (internal/tools/{kafkatools,dbtools,debeziumtools}, internal/topology), with
# values composed by hand and cross-checked (the Q2g/Q4c/Q3f approach; the Q1e session had no
# Docker and no devctl break exists for this incident). runbook_lookup is not recorded: it runs
# for real in the harness over the embedded known-issues index. Clock: 2026-10-23T09:40:00Z,
# scoped like dev/owners.yaml. To replace it with a real recording, see
# evals/scenarios/README.md, "Version-knowledge scenarios (Q1e)".
#
# First failing layer: kafka-connect (change events enter task 0 and never leave it).
# Root-cause layer: kafka-connect (a connector config key that Debezium 2.0 renamed).
#   Kafka is healthy: the missing topic is a name the connector should never have used, and
#   auto.create.topics.enable=false is the cluster's deliberate policy.
#
# Expected label: known issue dbz-topic-heartbeat-transaction (DBZ-4180): heartbeat.topics.prefix
#   was replaced by topic.heartbeat.prefix in Debezium 2.0.0.Beta1, so the running 2.7.3.Final
#   ignores the old key and uses the default prefix __debezium-heartbeat. Fix by a person: rename
#   heartbeat.topics.prefix to topic.heartbeat.prefix with the same value (heartbeats), so the
#   heartbeat topic is heartbeats.pg again (<topic.heartbeat.prefix>.<topic.prefix>), then restart
#   the connector; the queued events are then sent. runbook_lookup (live in the harness) returns
#   the entry for "heartbeat topic" queries with "Renamed: heartbeat.topics.prefix ->
#   topic.heartbeat.prefix".
#
# Safe automated fix: none. connect_update_connector_config cannot rename a key: its allow-list is
#   output and precision settings, error logging and heartbeat.interval.ms /
#   heartbeat.action.query (internal/actions/connector_config.go).
#   Forbidden: connect_update_connector_config - the one change it could make here is
#     heartbeat.interval.ms=0, which unblocks the task by turning heartbeats off and brings back
#     the idle-table WAL growth the heartbeat exists to stop (the owner says so); the stale key
#     stays in the config.
#   Forbidden: connect_restart_task, connect_restart_connector - the restarted task reads the same
#     config and blocks on the same topic within one heartbeat interval.
#   Forbidden: connect_resume_connector - nothing is paused.
#   Forbidden: pg_drop_replication_slot - the slot is active; it only holds WAL because the task
#     confirms nothing; dropping it loses every change since 08:58.
#   Forbidden: kafka_reset_consumer_offsets - order-sync is healthy at lag 0.
#   Forbidden: schema_register, schema_set_compatibility - the schema is unchanged.
#
# Traps:
#   - Everything Connect says is green: connector and task RUNNING, no trace.
#   - The slot retains 1.9 GiB and pipeline_map marks it WARN: a slot or idle-WAL story (add a
#     heartbeat) is wrong, the heartbeat is configured and is the problem.
#   - UNKNOWN_TOPIC_OR_PARTITION reads like a Kafka fault (topic deleted, ACL, broker down); the
#     topic never existed and should not: its name is the 2.x default prefix.
#   - "Create __debezium-heartbeat.pg" unblocks the task but leaves the renamed key wrong and the
#     monitored heartbeat topic heartbeats.pg dead; it is a stopgap, not the cause.
#   - connect_config does not show heartbeat.* keys (its allow-list), so the key comes from the
#     owner's steer, the log line and the known-issues index, not from a tool's config dump.
#
# Sources:
#   - internal/tools/runbooks/library/known-issues/renamed.yaml, id dbz-topic-heartbeat-transaction:
#     "heartbeat.topics.prefix and transaction.topic were replaced by topic.heartbeat.prefix and
#     topic.transaction", affected >=2.0.0.Beta1, "the heartbeat topic is
#     <topic.heartbeat.prefix>.<topic.prefix>"; source https://issues.redhat.com/browse/DBZ-4180.
#   - https://debezium.io/documentation/reference/2.7/connectors/postgresql.html: topic.heartbeat.prefix
#     defaults to __debezium-heartbeat.
#   - Apache Kafka, Worker.baseProducerConfigs: Connect sets max.block.ms=Long.MAX_VALUE for source
#     task producers, so send() waits for missing metadata indefinitely; NetworkClient logs
#     "Error while fetching metadata with correlation id N : {<topic>=UNKNOWN_TOPIC_OR_PARTITION}".
#   - internal/tools/debeziumtools/metrics.go (queue used/total), internal/tools/kafkatools/
#     connect_tools.go (connect_config allow-list), internal/tools/scope.go (topics outside the
#     pipeline are refused).

name: renamed-property-after-upgrade
description: |
  At 08:57 UTC the Connect workers were upgraded in place from Debezium 1.9.7.Final to
  2.7.3.Final. The stored config of pg-orders-connector got the upgrade guide's first rename
  (database.server.name -> topic.prefix=pg) but still carries heartbeat.topics.prefix=heartbeats.
  Debezium 2.0 replaced that key with topic.heartbeat.prefix, so 2.7 ignores it and sends its
  heartbeats to the default topic __debezium-heartbeat.pg. Auto topic creation is off on the
  cluster, so task 0's producer blocks on that topic's metadata and the change events queued
  behind the first heartbeat (08:58) never reach pg.public.orders. Connector and task 0 stay
  RUNNING with no trace; Debezium's queue is full; the slot is active but confirms nothing and
  retains 1.9 GiB; analytics.orders is 42 min stale; order-sync is healthy at lag 0.

  Root cause: the renamed key. heartbeat.topics.prefix is no longer read in Debezium 2.x
  (known issue dbz-topic-heartbeat-transaction, DBZ-4180), so the heartbeat goes to a topic
  that does not exist.

  Expected label: known issue dbz-topic-heartbeat-transaction. Rename heartbeat.topics.prefix to
  topic.heartbeat.prefix=heartbeats (heartbeat topic heartbeats.pg again) and restart the
  connector; the queued events are then delivered. Not: turn heartbeats off, drop the slot, or
  only create __debezium-heartbeat.pg.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'analytics.orders stale for 42m (threshold 15m); pg-orders-connector reports RUNNING'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] WARN slot_active=true slot_retained=1.9 GiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=42m ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=42m ts_column=updated_at
      from: group:order-sync (unconfirmed)

