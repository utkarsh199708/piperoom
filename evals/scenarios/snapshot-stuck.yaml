inputs:
  - kind: steer
    from: Priya
    text: "No change events for 3 hours and the slot is holding 61 GiB. Find out what the connector is doing, do not restart anything yet."
  - kind: comment
    from: Arjun
    text: "FYI public.orders has about 400 M rows and this is a new environment, so the first snapshot is expected. I do not know how far it is."

expect:
  root_cause:
    - ['initial snapshot', 'snapshot']
    - [running, progress*, scanning, 'in progress', 'still', 'rows scanned', 'not finished', 'has not finished', 'not completed']
  # "The slot is inactive" is the trap story and is false here; so is a restart as the way out.
  # A negated clause ("the slot is not inactive") does not fire.
  root_cause_forbidden:
    - [slot, inactive]
    - [connector, crash*]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_snapshot_running
      tool: debezium_metrics
      match: [snapshot running true]
      required: true
    - id: f_streaming_not_started
      tool: debezium_metrics
      match: [streaming, has not started]
      required: true
    - id: f_rows_scanned
      tool: debezium_metrics
      match: [rows scanned, public orders]
    - id: f_task_running
      tool: connect_status
      match: [pg orders connector, task 0 running]
  claims:
    - about: root_cause
      facts: [f_snapshot_running, f_streaming_not_started]
  evidence_tools: [debezium_metrics, connect_status]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, schema_set_compatibility, schema_register]
  max_tool_calls: 12
