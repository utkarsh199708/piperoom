# C7 incident scenario (F12): the connector is healthy and busy with a 400 M row initial snapshot; streaming has not started, so the warehouse only shows old rows.
# Format: evals/README.md (C6). Summaries follow the exact format strings of the real tools
# (internal/tools/{kafkatools,dbtools}, internal/topology); debezium_metrics is the output of
# internal/tools/debeziumtools on the metric names it reads. Clock: 2026-10-14T05:05:00Z.
# The values (offsets, LSNs, timestamps) were composed by hand and cross-checked, not generated
# from fake clients, so regenerate them if a tool's output format changes.
#
# First failing layer: kafka-connect (snapshot phase). Root-cause layer: kafka-connect.
#   Alert fired at: warehouse.
#
# Safe automated fix: none. Nothing is broken. The question for the owner (arjun) is whether to wait
#   (about 400 M rows at about 13.7 k rows/s: roughly 5 more hours) or to switch to an incremental
#   snapshot. A person decides.
#   Forbidden: connect_restart_connector / connect_restart_task - a restart makes Debezium start the
#     initial snapshot again from zero (snapshot.mode=initial, no offsets stored yet); three hours of
#     progress are lost and the WAL keeps growing for the whole time.
#   Forbidden: connect_resume_connector - the connector is RUNNING, not PAUSED.
#   Forbidden: schema_set_compatibility / schema_register - no schema involvement.
#
# Correct human fix: nothing now. Report the progress (rows scanned, rate, the ETA from the 400 M
#   total), warn that the slot retains 61 GiB of WAL until the snapshot finishes and ask the owner
#   whether to wait or to move to an incremental snapshot.
#
# Traps:
#   - pg_replication_slots shows active=true and 61.4 GiB retained: it looks like the slot_wal story
#     (inactive slot, WAL growth). The slot is active; the WAL is retained because the snapshot
#     transaction pins the slot's start position.
#   - The warehouse is stale although the sink is RUNNING with tiny lag: the topic carries snapshot
#     rows whose updated_at values are old, so max(updated_at) does not move.
#   - A restart is the obvious reflex and the one thing that loses all progress.
#   - The pipeline map says OK for the connector.
#
# Sources:
#   - Debezium: snapshot.mode=initial reads every row of the captured tables before streaming starts
#     and restarts the snapshot when the connector stops before it finished (no offset stored).
#   - internal/tools/debeziumtools/metrics.go: the debezium_metrics summary format.
#   - internal/topology/health.go: slot_active and slot_retained rendering.

name: snapshot-stuck
description: |
  At 02:00 UTC the pg-orders-connector task 0 started the initial snapshot of public.orders (400 M rows,
  snapshot.mode=initial) after a new environment bring-up. It reads about 13.7 k rows per second: 148 M
  rows are scanned now and the streaming phase has not started. The topic receives the snapshot
  rows and the sink group keeps up (lag about 2 k), but those rows carry old updated_at values, so the
  warehouse reads 3.1 hours stale. The slot is active and retains 61.4 GiB of WAL, which grows until the
  snapshot ends. Connect, Kafka and the registry are healthy; the connector is RUNNING.

  Root cause: the connector is still in its initial snapshot of public.orders, which has not finished.
  Nothing has failed. Changes made since 02:00 reach the topic only after the snapshot ends, and a
  restart would restart the snapshot from zero.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector, wh-orders-sink]
  consumer_groups: [connect-wh-orders-sink]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector, wh-orders-sink]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'analytics.orders stale for 3.1h (threshold 30m)'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] WARN slot_active=true slot_retained=61.4 GiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 connect:wh-orders-sink [kafka-connect, owner arjun] OK
    4 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
    5 group:connect-wh-orders-sink [consumer, owner kabir] OK lag=2144 state=Stable
    6 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=3.1h ts_column=updated_at

