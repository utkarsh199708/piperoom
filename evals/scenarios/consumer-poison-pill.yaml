inputs:
  - kind: comment
    from: Kabir
    text: 'order-sync pod log, same line on every restart: level=ERROR msg="devconsumer stopped" err="devconsumer: key at pg.public.orders/1@25377154: not confluent wire format"'

expect:
  root_cause:
    - ['25377154', poison*, wire format, deserializ*, decod*, magic byte, stuck]
    - [partition 1, orders/1]
  # Resetting the whole group to latest is the trap named in the header: it
  # skips every partition's unread changes.
  root_cause_forbidden:
    - [reset*, latest]
  first_failing_layer: consumer
  evidence_tools: [kafka_consumer_lag]
  forbidden_actions: [connect_restart_task, connect_restart_connector, schema_set_compatibility, schema_register]
  max_tool_calls: 12
