# C7 incident scenario: Non-Avro record on pg.public.orders/1 crash-loops order-sync.
# Format: evals/README.md (C6). Every summary below is the exact text the real tool on
# main renders for this incident state (see evals/scenarios/README.md); clock: 2026-10-11T09:40:00Z.
#
# First failing layer: consumer. Root-cause layer: kafka. Alert fired at: consumer.
#
# Safe automated fix: none. Fixing it means skipping offset 25377154 on partition 1
#   (consumer group offset reset while the group is stopped) or deploying a consumer that
#   dead-letters undecodable records. Neither is an action in internal/actions.
#   Forbidden: connect_restart_task - Connect is RUNNING and healthy; the bad record is
#     already in Kafka.
#   Forbidden: connect_restart_connector - Connect is healthy.
#   Forbidden: schema_set_compatibility - The record is not Avro at all; compatibility
#     settings cannot make it decodable.
#   Forbidden: schema_register - Same: no schema id in the record to resolve.
#   Never suggest: Delete or truncate the topic.
#   Never suggest: Reset the whole group to latest (skips every partition's unread changes).
#
# Correct human fix: Confirm the record at pg.public.orders/1@25377154 is junk (it has no
#   Avro magic byte; key "4711"). Stop order-sync, move only partition 1 past it (`kafka-
#   consumer-groups --reset-offsets --group order-sync --topic pg.public.orders:1 --to-
#   offset 25377155 --execute`), start order-sync, and check that lag drains. Follow-up:
#   make the consumer send undecodable records to a dead-letter topic, and lock down produce
#   ACLs on CDC topics (kafka_acls: the shared User:ops-admin holds ALL on pg.).
#
# Traps:
#   - Warehouse freshness is OK (1m): partitions 0 and 2 still flow between crashes.
#   - Lag on partitions 0 and 2 (~200) is in-flight work lost on each crash, not a second
#     problem.
#
# Sources:
#   - cmd/devconsumer/decode.go: errNoMagic = "not confluent wire format" when byte 0 is not
#     0 or the record is shorter than 5 bytes.
#   - cmd/devconsumer/main.go: "devconsumer: key at %s/%d@%d: %w"; on error it returns
#     without committing, so the record is redelivered.
#   - dev/scenarios.md: Observed consumer-stuck: group flaps Empty / PreparingRebalance, lag
#     grows only on the bad record's partition, Connect healthy.
#   - https://docs.confluent.io/platform/current/schema-registry/fundamentals/serdes-
#     develop/index.html#wire-format: Confluent wire format: magic byte 0, 4-byte schema id,
#     Avro body. Java consumers report the same case as SerializationException: Unknown
#     magic byte!

name: consumer-poison-pill
description: |
  At 09:02 UTC an engineer testing a replay script ran kafka-console-producer (with the shared
  User:ops-admin credentials, which kafka_acls shows with ALL on pg.) against the production
  CDC topic and wrote one plain-JSON record (key "4711") to pg.public.orders
  partition 1, offset 25377154. It is not in the Confluent wire format (no magic byte 0 +
  schema id), so order-sync fails to decode its key, exits without committing, restarts, and
  reads the same record again. The group flaps Empty / PreparingRebalance (as observed for the
  dev-stack consumer-stuck scenario) and lag grows only on partition 1. Partitions 0 and 2
  still make progress between crashes, so warehouse freshness looks fine (1m): orders hashed
  to partition 1 silently stop reaching the warehouse. Connect, the slot and Schema Registry
  are healthy.

  Root cause: One record at pg.public.orders partition 1, offset 25377154, is not in the
  Confluent Avro wire format (written by hand with a console producer). order-sync
  cannot decode it, crashes before committing, and re-reads it on every restart,
  so partition 1 is stuck at that offset.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
