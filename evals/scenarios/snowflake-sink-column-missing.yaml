# C7 incident scenario (F12): a new column reaches the topic schema but not the Snowflake table, so every load into the sink table fails.
# Format: evals/README.md (C6). Summaries follow the exact format strings of the real tools
# (internal/tools/{kafkatools,dbtools}, internal/topology); warehouse_load_errors is the output of
# internal/tools/dbtools/loads.go on Snowflake COPY_HISTORY rows. Clock: 2026-10-14T10:41:00Z.
# The values (offsets, LSNs, timestamps) were composed by hand and cross-checked, not generated
# from fake clients, so regenerate them if a tool's output format changes.
#
# First failing layer: kafka-connect (sink task 0 FAILED). Root-cause layer: warehouse.
#   Alert fired at: warehouse.
#
# Safe automated fix: none. The missing column must be added by the warehouse owner (meera).
#   Forbidden: connect_restart_task / connect_restart_connector - the task fails again on the same
#     COPY (the column is still missing); the restart only loses the time to the next failure.
#   Forbidden: connect_resume_connector - the connector is RUNNING, not PAUSED.
#   Forbidden: schema_register / schema_set_compatibility - the registry is right: version 4 is a
#     valid, backward compatible add, and nothing there needs to change. Registering or loosening
#     compatibility would not touch the warehouse table.
#
# Correct human fix: Meera runs ALTER TABLE analytics.orders ADD COLUMN risk_score DOUBLE (the type of
#   the new field), then restarts task 0 of wh-orders-sink; the backlog (about 1.5 M records) loads
#   afterwards. Follow-up: schema evolution of the sink tables needs an owner step in the migration
#   checklist.
#
# Traps:
#   - schema_registry_diff shows a clean, backward compatible add (+ Value.risk_score: [null,
#     double]); it reads like "a schema change broke the consumer" (the schema-change story), but
#     nothing is incompatible: the registry accepted it, and the warehouse did not get it.
#   - connect_status only says the load was rejected (see COPY_HISTORY); the actual message is in
#     warehouse_load_errors.
#   - The pg_recent_ddl line (ADD COLUMN risk_score on the source) is the trigger, not the cause.
#   - A restart is the obvious reflex and fails again.
#
# Sources:
#   - Snowflake: "SQL compilation error: error line 1 at position N invalid identifier 'COLUMN'" is
#     the error of a COPY transformation that names a column the table does not have; it is shown in
#     INFORMATION_SCHEMA.COPY_HISTORY (FIRST_ERROR_MESSAGE).
#   - internal/tools/dbtools/loads.go: the warehouse_load_errors summary format.

name: snowflake-sink-column-missing
description: |
  At 09:38 UTC a migration added the nullable column risk_score to public.orders; Debezium registered version
  4 of pg.public.orders-value (+ risk_score, backward compatible). Nobody added the column to the Snowflake
  table analytics.orders. From the first batch that carries the field, every COPY into analytics.orders fails
  with "invalid identifier 'RISK_SCORE'": task 0 of wh-orders-sink is FAILED, the group lag grows (1.5 M
  records) and the warehouse is 41 minutes stale. Postgres, Debezium, Kafka and the registry are healthy.

  Root cause: the sink table analytics.orders in Snowflake has no risk_score column, which the new schema
  version 4 added, so every load fails with invalid identifier 'RISK_SCORE'. The schema evolution was not
  applied to the warehouse.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector, wh-orders-sink]
  consumer_groups: [connect-wh-orders-sink]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector, wh-orders-sink]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'analytics.orders stale 41m; wh-orders-sink task 0 FAILED'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=40.2 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 connect:wh-orders-sink [kafka-connect, owner arjun] FAIL tasks_failed=1
    4 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
    5 group:connect-wh-orders-sink [consumer, owner kabir] WARN lag=1480221 state=Stable
    6 wh:analytics.orders [warehouse, owner meera] WARN stale_for=41m ts_column=updated_at

