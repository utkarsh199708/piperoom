  - tool: warehouse_freshness
    input: {table: analytics.orders, ts_column: updated_at}
    summary: |-
      newest=2026-10-14T10:00:12Z (stale for 41m)
  - tool: warehouse_load_errors
    input: {table: analytics.orders}
    summary: |-
      analytics.orders: 3 failed or partial load(s) since 2026-10-13T10:41:00Z; latest 2026-10-14T10:19:00Z LOAD_FAILED 0 of 12000 rows: SQL compilation error: error line 1 at position 214 invalid identifier 'RISK_SCORE'
      - 2026-10-14T10:19:00Z LOAD_FAILED rows=0 errors=12000 file=orders_0_0_1.csv.gz: SQL compilation error: error line 1 at position 214 invalid identifier 'RISK_SCORE'
      - 2026-10-14T10:11:00Z LOAD_FAILED rows=0 errors=11350 file=orders_0_0_0.csv.gz: SQL compilation error: error line 1 at position 214 invalid identifier 'RISK_SCORE'
      - 2026-10-14T10:03:00Z LOAD_FAILED rows=0 errors=11902 file=orders_0_0_9.csv.gz: SQL compilation error: error line 1 at position 214 invalid identifier 'RISK_SCORE'
  - tool: trace_record
    input: {pipeline_id: orders, table: public.orders, key: '5901233'}
    summary: |
      postgres public.orders: seen updated_at=2026-10-14T10:38:44.907113Z
      kafka-connect pg-orders-connector: seen
