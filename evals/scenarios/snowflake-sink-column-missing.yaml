      consumer connect-wh-orders-sink: not_seen
      warehouse analytics.orders: not_seen
  # E5c: answers for calls the agent made that no recording covered (baseline run 38655252568).
  - tool: similar_incidents
    input: {pipeline_id: "orders"}
    summary: |-
      No similar closed incident found on pipeline orders (3 past rooms searched).

inputs:
  - kind: steer
    from: Priya
    text: "wh-orders-sink task 0 is FAILED and the warehouse is 41 minutes stale. Find out why. Do not restart it until we know."

expect:
  root_cause:
    - ['risk score', 'risk_score']
    - [missing, absent, 'not exist*', 'invalid identifier', 'no column', 'not added', 'not applied', 'has no', lacks, unknown]
  # The trap story: an incompatible schema change. A negated clause ("the change is not
  # incompatible") does not fire.
  root_cause_forbidden:
    - [incompatible, schema]
    - [breaking, schema]
  first_failing_layer: kafka-connect
  root_cause_layer: warehouse
  expected_facts:
    - id: f_load_failed
      tool: warehouse_load_errors
      match: [load failed, invalid identifier, risk score]
      required: true
    - id: f_task_failed
      tool: connect_status
      match: [task 0, failed]
      required: true
    - id: f_schema_add
      tool: schema_registry_diff
      match: [risk score]
    - id: f_source_ddl
      tool: pg_recent_ddl
      match: [add column risk score]
  claims:
    - about: root_cause
      facts: [f_load_failed]
  evidence_tools: [warehouse_load_errors, connect_status]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, schema_set_compatibility, schema_register]
  max_tool_calls: 12
