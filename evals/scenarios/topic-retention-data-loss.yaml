# C7 incident scenario: Topic retention deleted CDC records before the lagging consumer read them.
# Format: evals/README.md (C6). Every summary below is the exact text the real tool on
# main renders for this incident state (see evals/scenarios/README.md); clock: 2026-10-11T09:40:00Z.
#
# First failing layer: kafka. Root-cause layer: kafka. Alert fired at: warehouse.
#
# Safe automated fix: none. Recovery needs a re-snapshot or backfill of the affected rows
#   (for example a Debezium incremental snapshot of public.orders, or re-running the job's
#   id range through the pipeline) plus a topic retention increase. None is an action, and
#   every action in internal/actions targets Connect or the registry, which are healthy.
#   Forbidden: connect_restart_task - Connect is healthy; a restart does not re-emit deleted
#     records.
#   Forbidden: connect_restart_connector - Same.
#   Forbidden: schema_set_compatibility - No schema involvement.
#   Forbidden: schema_register - No schema involvement.
#   Never suggest: Claim no data was lost because lag is going down.
#   Never suggest: Reset order-sync to latest (skips even more).
#
# Correct human fix: Raise retention.ms on pg.public.orders well above worst-case lag (e.g.
#   7 d), let order-sync catch up (or scale it), then re-snapshot the window 01:00–03:00 UTC
#   (Debezium incremental snapshot via the signaling table, or re-run the re-pricing ids)
#   and re-run the reconciliation check. Follow-up: alert when committed offset approaches
#   the log start offset.
#
# Traps:
#   - Group is Stable with 1 member and committing: it looks merely slow.
#   - trace_record shows not_seen downstream of Postgres with no stopped_here stage: the
#     record is not stuck, it is gone.
#   - Connect is RUNNING; restarting it does not re-emit deleted changes.
#   - No tool shows topic configs (retention.ms) or the consumer's logs; the agent must
#     infer retention from log-start offsets vs committed offsets and staleness.
#
# Sources:
#   - go doc github.com/twmb/franz-go/pkg/kgo.ConsumeResetOffset: "If instead the client
#     fell below the log start, it resumes at the log start" (no ErrDataLoss in that case);
#     devconsumer sets ConsumeResetOffset(NewOffset().AtStart()) (cmd/devconsumer/main.go).
#   - https://issues.apache.org/jira/browse/KAFKA-3370: Java consumers apply
#     auto.offset.reset when the committed offset is out of range, e.g. after retention
#     deleted it: silent skip.
#   - https://kafka.apache.org/documentation/#topicconfigs_retention.ms: retention.ms
#     deletes old log segments regardless of whether any consumer group read them.
#   - https://debezium.io/documentation/reference/3.2/connectors/postgresql.html#postgresql-
#     incremental-snapshots: Incremental snapshots (signal table) re-emit current rows to
#     recover lost changes.

name: topic-retention-data-loss
description: |
  pg.public.orders has retention.ms=21600000 (6 h), lowered two weeks ago to save broker disk
  (topic configs are not visible to any agent tool). Between 01:00 and 03:00 UTC a re-pricing
  job updated 7.9 M orders. Debezium streamed every change; order-sync (about 350 records/s)
  fell more than 6 hours behind. Kafka deleted log segments before order-sync read them.
  franz-go (the consumer's client) resumes at the log start without an error when its position
  falls below it, so no error was logged. The group is Stable and working. Its committed
  offsets sit a few hundred records above the log start offset, lag is 2.9 M, and the
  warehouse is 6 hours stale. The changes that were deleted are gone from the pipeline: the
  warehouse keeps their old versions. The reconciliation job noticed rows that differ between
  source and warehouse.

  Root cause: Kafka retention on pg.public.orders deleted change records before order-sync
  read them: after a 7.9 M-row backfill the consumer fell more than the topic's
  retention behind, its position fell below the log start, and the client silently
  resumed at the log start. The skipped changes never reached analytics.orders (it
  keeps old versions). Lag and staleness are symptoms; the data loss is the
  incident.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'orders reconciliation: 1,181,433 of 7,912,440 orders changed 01:00-03:00 UTC differ in analytics.orders (sample ids 3301877, 4410023, 5120554)'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=31.0 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=2s ago
    4 group:order-sync [consumer, owner kabir] WARN lag=2949113 state=Stable
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=6.0h ts_column=updated_at

