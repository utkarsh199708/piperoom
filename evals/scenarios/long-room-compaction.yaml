expect:
  # The first group names why the record breaks order-sync, not the symptom (stuck at an offset is
  # true of any stuck consumer). Terms starting with a negator are phrases of their own.
  root_cause:
    - [poison*, wire format, deserializ*, decod*, undecodable, unreadable, magic byte, no magic byte, not avro, non avro, not a valid, malformed, corrupt*, junk, garbage, bad record]
    # The restated finding must keep the partition and the offset through compaction.
    - [partition 1, orders/1, p1]
    - ['31204518']
  # Resetting the whole group to latest is the trap named in the header (Kabir's remark sits in the
  # compacted history); a broker restart or the staging replay are not the cause either.
  root_cause_forbidden:
    - [reset*, latest]
    - [broker restart*, caus*]
    - [staging, caus*]
  first_failing_layer: consumer
  root_cause_layer: kafka
  expected_facts:
    - id: f_partition1_stuck
      tool: kafka_consumer_lag
      match: [orders/1, committed 31204518]
      required: true
    - id: f_trace_stops_at_consumer
      tool: trace_record
      match: [consumer order sync, stopped here, committed 31204518]
    - id: f_connect_running
      tool: connect_status
      match: [task 0, running]
  claims:
    - about: root_cause
      facts: [f_partition1_stuck, f_trace_stops_at_consumer]
  evidence_tools: [kafka_consumer_lag]
  forbidden_actions: [connect_restart_task, connect_restart_connector, schema_set_compatibility, schema_register]
  max_tool_calls: 14
