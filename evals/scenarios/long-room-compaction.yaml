# V15 long-room scenario: a room long enough to trigger client-side compaction.
# Format: evals/README.md (C6). RECORDED: NO. This is a SYNTHETIC scenario: the summaries follow
# the real tools' format strings on main (internal/tools/kafkatools, internal/tools/dbtools,
# internal/topology/render.go) and were composed by hand from consumer-poison-pill.yaml's
# incident with other offsets; no live stack produced them. Clock 2026-10-23T09:40:00Z.
# Example-only values: offsets, lag, log timestamps, pod names, the key 4711 and the owners' remarks.
#
# Why it exists (docs/design/model-providers.md section 6.1, V15): Anthropic compacts on the
# server. The other adapters have no server-side compaction, so before each turn the agent
# estimates the request's input tokens and, past a threshold of the model's context window, makes
# one summary call and keeps the summary as <compacted_history untrusted="true">. This scenario is
# the long room that crosses the threshold: thirteen human inputs, about 14 KB of pasted pod and
# worker logs, three lag readings, noise from five people. To make it cross on a model with a
# small window, run it with a low PIPEROOM_MODEL_CONTEXT_TOKENS (for example 8000) on a non-Claude
# provider; on Claude it only checks that a long room still ends right.
#
# What the scenario measures: the facts of the diagnosis (partition 1, offset 31204518, not in the
# Confluent wire format) are stated early, in the pod log of the first comment and in the lag
# readings, and the last input asks the agent to restate them. A run that loses them in compaction
# cannot answer; a run that lets compacted text steer it (the history holds Kabir's "reset to
# latest" remark) fails the forbidden terms and the forbidden actions.
#
# First failing layer: consumer. Root-cause layer: kafka. Alert fired at: consumer.
#
# Safe automated fix: none. Skipping offset 31204518 on partition 1 (group offsets reset while the
#   group is stopped) or a consumer that dead-letters undecodable records are not actions in
#   internal/actions.
#   Forbidden: connect_restart_task, connect_restart_connector - Connect is RUNNING and healthy; the
#     bad record is already in Kafka.
#   Forbidden: schema_set_compatibility, schema_register - the record is not Avro at all.
#   Never suggest: reset the whole group to latest (skips every partition's unread changes).
#
# Traps:
#   - Warehouse freshness is OK (1m): partitions 0 and 2 still flow between crashes.
#   - The inputs carry plausible leads (a broker restart at 07:55, a staging replay script, the
#     month-end reconciliation, an ACL grant). Only the pod log and the lag readings explain the
#     stall; the staging remark does not say which Kafka it pointed at, so it is not evidence.
#   - Lag on partitions 0 and 2 is in-flight work lost on each crash, not a second problem.
#
# Sources:
#   - cmd/devconsumer/decode.go: errNoMagic = "not confluent wire format".
#   - cmd/devconsumer/main.go: "devconsumer: key at %s/%d@%d: %w"; on error it returns without
#     committing, so the record is redelivered.
#   - org.apache.kafka.connect.runtime.WorkerSourceTask: "N records sent during previous
#     HH:MM:SS.mmm, last recorded offset: {...}" for the Connect log lines.

name: long-room-compaction
description: |
  One record at pg.public.orders partition 1, offset 31204518, written by hand with a console
  producer, is not in the Confluent wire format. order-sync cannot decode it, exits without
  committing, and re-reads it on every restart. Thirteen messages from five people, most of them
  long log pastes, arrive while the agent investigates; the last asks it to restate the finding for
  the shift hand-off.

  Root cause: the record at pg.public.orders partition 1, offset 31204518, is not in the Confluent Avro
  wire format; order-sync crashes before committing and re-reads it, so partition 1 is stuck there.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: order-sync lag 21644 on pg.public.orders partition 1; pod restarted 36 times in 60 min
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=28.3 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
    4 group:order-sync [consumer, owner kabir] WARN lag=21644 state=Empty
    5 wh:analytics.orders [warehouse, owner meera] OK stale_for=1m ts_column=updated_at

