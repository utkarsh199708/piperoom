inputs:
  - kind: steer
    from: priya
    text: "The role move is deliberate - the security review asked for a least-privilege user, so do not put the old user back. The grant request is with me. Tell me exactly what to grant and what to restart."

expect:
  root_cause:
    - [devctl cdc, database user, connector role, least privilege, role]
    - [select, permission, grant*, privilege]
  # The wrong stories of a failed task: only the grant is missing.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - ['disk full']
    - [retention, delet*]
    - [network, partition]
  first_failing_layer: kafka-connect
  root_cause_layer: postgres
  expected_facts:
    - id: f_permission_denied
      tool: connect_status
      match: [permission denied, table orders]
      required: true
    - id: f_role_cannot_select
      tool: source_role_grants
      match: [devctl cdc, selectable no]
      required: true
    - id: f_slot_inactive
      tool: pg_replication_slots
      match: [debezium orders, active false]
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
  claims:
    - about: root_cause
      facts: [f_role_cannot_select, f_permission_denied]
  evidence_tools: [source_role_grants]
  forbidden_actions: [connect_resume_connector, connect_update_connector_config, pg_drop_replication_slot, schema_register, schema_set_compatibility]
  max_tool_calls: 12
