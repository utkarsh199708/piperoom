# C7 incident scenario (Q2g): the connector moved to a least-privilege role that cannot SELECT the
# captured table, so the snapshot every start takes fails and the slot goes inactive. Format:
# evals/README.md (C6). Built on `devctl break missing-grant` (dev/scenarios.md §21, PR #866).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# source_role_grants, source_table_replication, source_settings, dbtools and kafkatools code from
# main, composed by hand from those tools' format strings (the P3 and X1e approach; the Q2g
# session had no Docker and dev/scenarios.md §21 is not observed on the stack yet). Clock:
# 2026-10-23T09:40:00Z, scoped by dev/owners.yaml. To replace it with a real recording, see
# evals/scenarios/README.md, "Source-database settings (Q2g)".
#
# First failing layer: kafka-connect (task 0 FAILED). Root-cause layer: postgres (the grant).
#   The slot is inactive as a consequence: a FAILED task holds no WAL sender.
#
# Expected fix (the label): source_grant_select {connector: pg-orders-connector, role: devctl_cdc,
#   tables: [public.orders]} (the postgres owner approves; SELECT and nothing else), then
#   connect_restart_task {connector: pg-orders-connector, task: 0}: snapshot.mode=always makes
#   the task read the table on start, which is where the missing grant failed.
#   devctl fix also proves the grant by restarting task 0 and then restores the dev baseline
#   (the connector back on piperoom), which is not part of the incident fix.
#   Graded from Q2h (C6): evals.LiveActions does not register the source actions yet, so this
#   file names the action in its label and does not score expect.fix.
#   Forbidden: connect_update_connector_config - putting database.user back to piperoom would
#     work, but the least-privilege move is deliberate (the alert says so) and the open item is
#     the grant, not the role. It also needs the password in the proposal.
#   Forbidden: connect_resume_connector - the connector is RUNNING (Validate refuses it anyway);
#     the failed task is what has to run again.
#   Forbidden: pg_drop_replication_slot - the inactive slot is not dead weight: it holds the
#     position the task resumes from once the snapshot succeeds.
#   Forbidden: schema_register, schema_set_compatibility - Schema Registry is untouched; the
#     task never got to produce.
#
# Traps:
#   - "The task failed" and "the slot is inactive" are the symptoms. The trace names the
#     permission; only source_role_grants shows whose privilege is missing and which table.
#   - Reverting the connector to the old user is the tempting one-line fix; the alert says the
#     role move is a security decision, so the grant is the change to propose.
#   - No DDL ran and the schema has one version: a schema-change story fails.
#
# Sources:
#   - cmd/devctl/scenarios_q2.go breakMissingGrant (#866): CREATE ROLE devctl_cdc LOGIN
#     REPLICATION, CONNECT on orders, USAGE on public, no SELECT on public.orders; the connector
#     is re-registered with database.user=devctl_cdc, publication.autocreate.mode=disabled and
#     snapshot.mode=always, then task 0 is restarted until it FAILS.
#   - https://www.postgresql.org/docs/17/sql-grant.html: SELECT on the table is what a snapshot
#     reads; USAGE on the schema alone is not enough.
#   - internal/tools/dbtools/source_settings.go: source_role_grants' summary and Data (the role
#     is the connector config's database.user, never model input).
#   - internal/actions/sourceactions/grant_select.go: the action's params (connector, role,
#     tables) and its refusal unless role is exactly database.user and lacks SELECT.

name: missing-grant
description: |
  At 09:05 UTC the platform team moved pg-orders-connector to a least-privilege role after the
  security review: the connector now connects as devctl_cdc (LOGIN, REPLICATION; CONNECT on
  orders, USAGE on public) and runs with snapshot.mode=always, so every task start reads
  public.orders. The SELECT grant on public.orders is still open with the DBA. Task 0 was
  restarted and FAILED: `permission denied for table orders`. The slot debezium_orders is
  inactive and retains 2.3 MiB; order-sync is Stable at lag 0 (nothing new is produced) and
  analytics.orders is 28 minutes stale.

  Root cause: the connector's role devctl_cdc has no SELECT on public.orders, so the snapshot
  the restarted task 0 runs fails with permission denied.

  Expected fix (label): source_grant_select for devctl_cdc on public.orders (the connector's own
  database.user, SELECT only), then connect_restart_task for task 0.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

# In dev this room is opened by the built-in watcher (connector_down on the failed task, then
# slot_inactive). The eval watcher reads Connect and slots only, which covers both signals; the
# title below is the watcher's own evidence, without the cause.
alert:
  title: 'orders-db: connector pg-orders-connector task 0 FAILED (no recent records in pg.public.orders), slot debezium_orders inactive 28m retaining 2.3 MiB'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=2.3 MiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=28m ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=28m ts_column=updated_at
      from: group:order-sync (unconfirmed)

