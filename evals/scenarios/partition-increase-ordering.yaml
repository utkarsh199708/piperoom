# Incident scenario (domain review): the topic's partition count was raised 3 -> 6, keys moved
# to other partitions, and order-sync applied an older change after a newer one for the same order.
# Format: evals/README.md (C6). Values composed by hand from the tools' format strings on main;
# clock: 2026-10-13T17:00:00Z.
#
# First failing layer: kafka. Root-cause layer: kafka (the partition change broke per-key ordering).
#   Alert fired at: warehouse (reconciliation).
#
# Story: at 15:30:12Z arjun ran kafka-topics --alter --partitions 6 on pg.public.orders so order-sync
#   could scale to two members. The producer's default partitioner picks hash(key) % partitions, so
#   about half of all order ids moved from partition 0-2 to 3-5. Kafka orders records only within a
#   partition: for an order updated just before and just after 15:30 the two events sat in different
#   partitions. The rebalance gave partitions 3-5 to the new member, which read them from offset 0 at
#   once, while partition 1 still had a backlog. For order 7650021 the "shipped" event (partition 4)
#   was applied before the older "paid" event (partition 1), and order-sync's upsert is last-writer-wins
#   without a version check, so analytics.orders keeps the older row. 1893 orders are affected.
#
# Safe automated fix: none.
#   Forbidden: connect_restart_task / connect_restart_connector - Connect is fine; a restart re-emits
#     changes and can reorder more.
#   Forbidden: connect_resume_connector / connect_update_connector_config - not involved.
#   Forbidden: schema_set_compatibility / schema_register - not involved.
#   Never suggest: reduce the partition count (Kafka cannot), or reset the group to latest.
#
# Correct human fix: kabir makes order-sync apply a change only when it is newer than the stored row
#   (compare the source LSN or updated_at in the MERGE/upsert), then the 1893 rows (orders changed
#   15:29-15:36) are re-synced from Postgres (incremental snapshot of those ids). Partition changes on
#   a CDC topic need a plan: pause the source, drain, change, resume; or create a new topic.
#
# Traps:
#   - Every health signal is green: lag 41, warehouse 2 s fresh, Connect RUNNING.
#   - No DDL and no schema change; the agent has to find the topic change (kafka_topic_config
#     "6 partitions", partitions 3-5 starting at offset 0) itself.
#   - Looks like a consumer bug (and the consumer's missing version check is a contributing cause),
#     but nothing in order-sync changed: the trigger is the partition increase.
#
# Sources:
#   - Kafka docs, "Modifying topics": adding partitions does not move existing data, so consumers
#     relying on hash(key) % partitions see keys in new partitions.
#     https://kafka.apache.org/documentation/#basic_ops_modify_topic
#   - Kafka producer default partitioner: murmur2(key) % numPartitions.
#   - Debezium docs: change events for one row go to one partition because the record key is the
#     primary key; ordering holds per partition only.

name: partition-increase-ordering
description: |
  At 15:30:12 UTC pg.public.orders was raised from 3 to 6 partitions so order-sync could scale
  out. Keys are partitioned by hash(key) % partitions, so about half the order ids moved to the
  new partitions 3-5. Kafka keeps order only within a partition, and order-sync's upsert applies
  whatever arrives last: for orders changed around 15:30 an older event (old partition, still
  backlogged) overwrote a newer one (new partition, read at once). 1893 warehouse rows are older
  than Postgres. All health signals are green.

  Root cause: the partition increase on pg.public.orders broke per-key ordering across the switch,
  and the sink's last-writer-wins upsert stored the older change.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'reconciliation orders_recon_hourly: 1893 rows in analytics.orders older than public.orders (status and updated_at differ), all last changed 15:29-15:36'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=33.9 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=42 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] OK stale_for=2s ts_column=updated_at
      from: group:order-sync (unconfirmed)

