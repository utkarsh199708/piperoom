    error: 'bad tool input: from_version or schema is required'
  - tool: kafka_topic_offsets
    input: {topic: pg.public.orders}
    summary: |-
      partition 0: 18930117–25901433 (6971316 records), newest just now
      partition 1: 18921884–25887610 (6965726 records), newest just now
      partition 2: 18942306–25915942 (6973636 records), newest just now
      partition 3: 0–44210 (44210 records), newest just now
      partition 4: 0–43871 (43871 records), newest just now
      partition 5: 0–44502 (44502 records), newest just now
  - tool: kafka_topic_config
    input: {pipeline_id: orders}
    summary: |-
      pg.public.orders: retention.ms=604800000, retention.bytes=-1, cleanup.policy=delete, min.insync.replicas=2, 6 partitions, replication factor 3
  - tool: kafka_list_groups
    summary: |-
      order-sync: Stable
  - tool: kafka_consumer_lag
    input: {group: order-sync}
    summary: |-
      order-sync: Stable, 2 members, total lag 42
        pg.public.orders/3: committed 44199, end 44210, lag 11
        pg.public.orders/0: committed 25901424, end 25901433, lag 9
        pg.public.orders/4: committed 43864, end 43871, lag 7
