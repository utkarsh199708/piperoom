  - tool: pg_recent_ddl
    input: {table: public.orders}
    summary: |
      (no DDL since 2026-10-12T17:00:00Z)
  - tool: pg_long_transactions
    summary: |
      (no long transactions on this pipeline's tables)
  - tool: warehouse_freshness
    input: {table: analytics.orders, ts_column: updated_at}
    summary: |-
      newest=2026-10-13T16:59:57.31884Z (stale for 2s)
  - tool: kafka_find_by_key
    input: {topic: pg.public.orders, key: '7650021'}
    summary: |-
      found 3 record(s) with key "7650021"
        partition 1, offset 25873310, 2026-10-13T15:29:58Z
        partition 4, offset 112, 2026-10-13T15:30:41Z
        partition 4, offset 2207, 2026-10-13T15:31:07Z
  - tool: pg_row
    input: {pipeline_id: orders, table: public.orders, pk_column: id, key: '7650021'}
    summary: |-
      found: yes, updated_at=2026-10-13T15:31:07.442918Z, columns=[amount, customer_id, id=7650021, status, updated_at=2026-10-13T15:31:07.442918Z]
  - tool: warehouse_row
    input: {pipeline_id: orders, table: analytics.orders, pk_column: id, key: '7650021'}
    summary: |-
      found: yes, updated_at=2026-10-13T15:29:58.10377Z

inputs:
  - kind: comment
    from: Meera
    text: 'Example: order 7650021 is shipped in Postgres since 15:31:07, but analytics.orders still says paid (updated_at 15:29:58).'

expect:
  root_cause:
    - ['partition*']
    - ['increas*', added, 6 partitions, six partitions, 3 to 6, partition count, 'repartition*', new partitions]
    - [ordering, out of order, 'reorder*', per key, older change, older event, 'overwr*']
  first_failing_layer: kafka
  root_cause_layer: kafka
  expected_facts:
    - id: f_six_partitions
      tool: kafka_topic_config
      match: [6 partitions]
      required: true
    - id: f_key_in_two_partitions
      tool: kafka_find_by_key
      match: [found 3 record, partition 1, partition 4]
    - id: f_new_partitions
      tool: kafka_topic_offsets
      match: [partition 5]
  claims:
    - about: root_cause
      facts: [f_six_partitions, f_key_in_two_partitions]
  evidence_tools: [kafka_topic_config]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 12
