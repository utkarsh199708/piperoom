# C7 incident scenario (Q6c): a new network policy on the database subnet rejects the Kafka Connect
# workers' subnet, so pg-orders-connector cannot reach orders-db.internal:5432 while Piperoom, the
# applications and Postgres itself are fine. Task 0 FAILED with "Connection ... refused".
# Format: evals/README.md (C6). Row Q6c (tasks/Q-board.md, step 6, network and TLS probes), Jira KAN-250.
#
# RECORDED: NO. Synthesised from the code paths: every summary follows the format strings of the real
# tools on main (internal/tools/{kafkatools,dbtools}, internal/topology), with values composed by hand
# and cross-checked (the Q2g/Q3f approach; the Q6c session had no Docker and no devctl break exists for
# this incident). Clock: 2026-10-23T09:40:00Z, scoped like dev/owners.yaml. To replace it with a real
# recording, see evals/scenarios/README.md, "Network-probe scenarios (Q6c)".
#
# Network positions: Postgres (orders-db.internal = 10.20.6.31) is on the data subnet 10.20.6.0/24;
# the applications on 10.20.2.0/24; Piperoom on the ops VMs (10.20.8.0/24); the Connect workers on
# 10.20.12.0/24. At 09:05 the network team rolled out a segmentation policy on the data subnet that
# allows the app and ops subnets on 5432 and rejects (TCP reset) everything else, the Connect subnet
# included.
#
# First failing layer: kafka-connect (task 0 FAILED: Connection to orders-db.internal:5432 refused).
# Root-cause layer: postgres (the network access into the database changed: the data subnet's new policy
#   rejects the Connect workers). Alt: kafka-connect (the workers' network position); the room's fix is
#   the same either way, a rule for 10.20.12.0/24 on 5432.
#
# Expected label: the failing step of net_probe (Q6a, internal/tools/nettools) for target source is
#   `connect_view`: Piperoom's own dns and tcp steps to orders-db.internal:5432 pass, and Kafka Connect,
#   validating the running config of pg-orders-connector, reports the refused connection on
#   database.hostname (Debezium's PostgresConnector.validate puts a connection failure there as "Error
#   while validating connector config: <message>"). Composed from tool.go/connectview.go/probe.go:
#     net_probe source (orders-db.internal:5432): 1 of 4 checks failed
#     - connect_view fail: Connect cannot use the database as configured: database.hostname: Error while validating connector config: Connection to orders-db.internal:5432 refused. ... (connector pg-orders-connector); fix: make the database reachable from every Connect worker (DNS, the advertised host, the port and its firewall) and re-run the probe
#     - dns orders-db.internal:5432 ok: 10.20.6.31
#     - tcp orders-db.internal:5432 ok: TCP connected
#     - tls orders-db.internal:5432 skip: not configured with TLS
#   The eval harness cannot replay net_probe yet: evals.LiveTools() does not register nettools (C6's Q6d
#   adds it), and a recording naming an unregistered tool fails -validate. Until then the file proves the
#   cause from what the replayed tools show: connect_status (Connection to orders-db.internal:5432
#   refused), the Postgres reads that succeed from Piperoom (pg_replication_slots, pg_row,
#   pg_long_transactions: the database is up and writing), connect_config (the same host and port
#   Piperoom uses, errors.max.retries 5) and the Postgres owner's steer about the 09:05 policy. When Q6d
#   lands, add a net_probe recording (input {target: source}) with the summary above, a required fact
#   {id: f_connect_view_fails, tool: net_probe, match: [connect view fail, refused, dns, tcp connected]},
#   add it to the root-cause claim and make net_probe an evidence tool.
#
# Safe automated fix: none. The fix is a network rule outside every system Piperoom acts on.
#   Forbidden: connect_restart_task, connect_restart_connector - the restarted task is refused the same
#     way and fails again after its retries.
#   Forbidden: connect_update_connector_config - repointing database.hostname (an IP, another name) goes
#     through the same policy; the host and port are right.
#   Forbidden: connect_resume_connector - nothing is paused.
#   Forbidden: pg_drop_replication_slot - the slot is inactive only because the task is down; dropping
#     it loses every change since 09:05 and forces a re-snapshot.
#   Forbidden: kafka_reset_consumer_offsets - order-sync is healthy at lag 0; nothing new reached the topic.
#
# Correct human fix: the Postgres owner (priya) asks the network team to allow 10.20.12.0/24 (the
#   Connect workers) to 10.20.6.31:5432 in the data-subnet policy; then the connector owner (arjun)
#   restarts task 0, checks the slot is active again and that order-sync drains the backlog. Watch the
#   slot's retained WAL until then (it grows with the order traffic).
#
# Traps:
#   - "Connection refused ... check that the postmaster is accepting TCP/IP connections" reads as
#     "Postgres is down". Piperoom reads the slot, the long transactions and a row updated a minute ago:
#     the database is up and the applications write.
#   - No password or pg_hba story: a refused TCP connection never reaches authentication.
#   - The slot is inactive with growing WAL (a slot_wal story); it is the effect of the dead task.
#   - The same host and port work from Piperoom, so "wrong database.hostname" is wrong too.
#
# Sources:
#   - PostgreSQL JDBC (PgJDBC): PSQLException "Connection to <host>:<port> refused. Check that the
#     hostname and port are correct and that the postmaster is accepting TCP/IP connections.", caused by
#     java.net.ConnectException "Connection refused" on a TCP reset.
#   - Debezium: "An exception occurred in the change event producer. This connector will be stopped."
#     (ErrorHandler) after errors.max.retries retriable failures; PostgresConnector.validate reports a
#     connection failure on database.hostname as "Error while validating connector config: ...".
#   - internal/tools/nettools/{tool.go,connectview.go,probe.go}: the net_probe summary and the
#     connect_view, dns and tcp check texts.

name: db-unreachable-from-connect
description: |
  At 09:05 UTC the network team rolled out a segmentation policy on the database subnet. It allows the
  application and ops subnets to reach orders-db.internal:5432 and rejects every other subnet, including
  the one the Kafka Connect workers run on. Debezium's replication connection was reset, every reconnect
  was refused, and after 5 retries task 0 of pg-orders-connector FAILED with "Connection to
  orders-db.internal:5432 refused". Postgres is up and the applications keep writing; Piperoom (on the
  ops subnet) reads the database normally. The slot debezium_orders is inactive and retains 418.7 MiB,
  nothing new has reached pg.public.orders for 35 minutes, order-sync is healthy at lag 0.

  Root cause: the new network policy on the database subnet rejects the Kafka Connect workers'
  connections to Postgres (orders-db.internal:5432), so the connector cannot reach a database that is up
  and reachable from Piperoom.

  Expected label: the failing step of net_probe target source is `connect_view` (Connect's validation of
  the running config reports the refused connection on database.hostname, while Piperoom's dns and tcp
  steps pass). Fix by a person: allow the Connect subnet to 5432 in the policy, then restart task 0.

