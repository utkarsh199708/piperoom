inputs:
  - kind: steer
    from: priya
    text: "The orders database is up and the apps are writing. Network rolled out the new segmentation policy on the database subnet at 09:05; they say the app and ops subnets are allowed. Find out why the connector is down before anyone touches the slot."

expect:
  root_cause:
    - [connect*, worker*, debezium]
    - [firewall*, segmentation, subnet*, network*, polic*]
    - [refus*, reject*, block*, reach*, unreachable, "not allowed"]
  # The stories a refused connection invites. A clause with a negator is skipped
  # ("Postgres is not down" is fine).
  root_cause_forbidden:
    - [database, down]
    - [postgres, down]
    - [postmaster, down]
    - [password*]
    - [authenticat*]
    - [pg_hba]
    - [slot, dropped]
    - [max_connections]
  first_failing_layer: kafka-connect
  root_cause_layer: postgres
  expected_facts:
    - id: f_conn_refused
      tool: connect_status
      match: [task 0, failed, connection to orders db internal 5432 refused]
      required: true
    - id: f_source_reachable
      tool: pg_replication_slots
      match: [debezium orders, active false]
      required: true
    - id: f_source_writing
      tool: pg_row
      match: [found yes]
    - id: f_same_host
      tool: connect_config
      match: [database hostname orders db internal, database port 5432]
  claims:
    - about: root_cause
      facts: [f_conn_refused, f_source_reachable, f_source_writing]
  evidence_tools: [connect_status, pg_replication_slots]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_update_connector_config, connect_resume_connector, pg_drop_replication_slot, kafka_reset_consumer_offsets]
  max_tool_calls: 14
