inputs:
  - kind: comment
    from: kabir
    text: "order-sync 2.17.0 was deployed 08:50-08:53. The deploy job still runs the offset step from the old poison-pill runbook (kafka-consumer-groups --reset-offsets --to-latest) before it starts the new pods. order-sync also reads pg.public.orders.reprocess."
  - kind: steer
    text: "Get the 40 orders into analytics.orders without stopping order-sync again."
  - kind: action_result
    from: arjun
    action: kafka_replay_range
    params: {topic: pg.public.orders, to_topic: pg.public.orders.reprocess}
    ok: true
    text: "replayed pg.public.orders (p0 433–445, p1 434–446, p2 433–446) to pg.public.orders.reprocess: acked 40 records of 40 offsets, in offset order per source partition; 0 __connect.errors.* headers dropped; pg.public.orders unchanged"

expect:
  root_cause:
    - [offset*]
    - [reset*, skip*, moved, jump*]
    - [latest, end]
  # Wrong stories, and the "nothing is wrong" reading of a pipeline with lag 0. Assertive phrases only.
  root_cause_forbidden:
    - ['pipeline is healthy']
    - ['false alarm']
    - ['false positive']
    - ['nothing is wrong']
    - ['connector dropped']
    - ['connector lost']
    - ['never reached kafka']
    - [retention, delet*]
    - [filter*]
  first_failing_layer: consumer
  root_cause_layer: consumer
  evidence_tools: [kafka_consumer_lag]
  expected_facts:
    - id: f_lag_zero
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
      required: true
    - id: f_sink_missing
      tool: reconcile
      match: [sink is missing 40 rows]
      required: true
    - id: f_in_topic
      tool: kafka_find_by_key
      match: [found 1 record, offset 433]
    - id: f_trace_committed
      tool: trace_record
      match: [consumer order sync seen committed, stopped at warehouse]
  claims:
    - about: root_cause
      facts: [f_in_topic, f_trace_committed]
  fix:
    - [kafka_replay_range]
  fix_targets:
    kafka_replay_range: {topic: pg.public.orders, to_topic: pg.public.orders.reprocess}
  forbidden_actions: [kafka_reset_consumer_offsets, connect_restart_task, connect_restart_connector, connect_resume_connector, schema_register, schema_set_compatibility]
  max_tool_calls: 20
