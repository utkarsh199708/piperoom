# C7 recovery scenario (X2e): a deploy job moved order-sync's committed offsets to the end of
# the topic while it was stopped, so the change events of 40 orders written during the deploy
# were never consumed. They are still on pg.public.orders. Lag 0, Connect RUNNING, slot active.
# Format: evals/README.md (C6). Built on `devctl break consumer-skipped-range`
# (dev/scenarios.md §19).
#
# RECORDED: NO (synthesised from the code paths). Every summary and data payload below is the
# exact output of the real kafkatools, dbtools and topology code at bcee33c9, run by a throwaway
# generator (not committed; the X1e generator, extended with a log start per partition) over
# fake clients holding the state the break leaves, scoped like dev/owners.recovery.yaml. Clock:
# 2026-10-22T09:40:00Z. Nothing was read from a running stack; it must be re-recorded there
# (evals/scenarios/README.md, "Recovery scenarios (X2e)"). The reconcile answers ran on the fixed
# clock with an explicit window; the second is the same tool over 08:45-08:55, served as a
# sequence so a narrowed second call gets the key diff.
#
# Timeline (the break): 08:50:00 order-sync stopped for the 2.17.0 deploy; 08:51:10 40 orders
# (ids 1301-1340) written, streamed to pg.public.orders at offsets 433-445 (p0), 434-446 (p1),
# 433-446 (p2); 08:52:40 the deploy job's leftover step (kafka-consumer-groups --reset-offsets
# --to-latest, from an old poison-pill runbook) moves order-sync to the end offsets; 08:53:05
# 2.17.0 starts at the end; 08:53:20 marker order 1341 (p0 offset 446) loaded. Idle after that.
#
# First failing layer: consumer. Root-cause layer: consumer (order-sync's committed offsets).
#
# Expected fix: kafka_replay_range from pg.public.orders to the pipeline's reprocess_topic
#   pg.public.orders.reprocess with the skipped offsets per partition (p0 433-445, p1 434-446,
#   p2 433-446: 40 records; a range that also takes the marker at p0 446 is harmless, the load
#   is an upsert). order-sync subscribes to the reprocess topic too (it has no records yet, so
#   no committed offsets: kafka_consumer_lag lists the CDC topic only). The replay's executed
#   step is scripted (ok); the agent's own recovery check (X2c) then counts the records that
#   reached the reprocess topic: before 40 records, after 0.
#   Forbidden: kafka_reset_consumer_offsets - the driver asked not to stop order-sync again, a
#     reset needs the group Empty, and it would re-deliver every record after 08:51.
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector - Connect
#     is RUNNING and the topic holds every event.
#   Forbidden: schema_register, schema_set_compatibility - no schema is involved.
#   Not forbidden, but not the fix (fix_targets fails it): pg_resnapshot_rows would re-emit the
#     rows from the source, a snapshot where a copy of retained records does.
#
# Traps:
#   - Lag is 0 and the group is Stable: nothing looks behind.
#   - The map's warehouse FAIL (stale_for) is the idle stack: the sink holds the newest row.
#   - kafka_replay_range by time window (from_time/to_time) is refused in replay (offsets by
#     time are not replayed): give the offset ranges. kafka_find_by_key and trace_record show
#     each missing key's partition and offset.
#
# Replay of the recovery (X2e note in evals/replay_actions.go): kafka_topic_offsets refuses the
# reprocess topic (not a CDC topic), so resources.topics declares it (empty); after the scripted
# step it holds the offsets of the executed range. There is no recovered phase: X2c's verdict is
# not a tool read, and evals/verify_score.go would count it as a claim without a re-check.
#
# Sources:
#   - cmd/devctl/scenarios_recovery.go breakConsumerSkippedRange: the timeline above.
#   - internal/actions/kafka_replay_range.go: Describe, Execute's result text, Verify.

name: consumer-skipped-range
description: |
  order-sync was stopped at 08:50 UTC for its 2.17.0 deploy. 40 orders written at 08:51:10 reached
  pg.public.orders. Before starting the new pods the deploy job ran a leftover step from an old
  poison-pill runbook, kafka-consumer-groups --reset-offsets --to-latest, which moved order-sync's
  committed offsets past those 40 change events. order-sync 2.17.0 started at the end of the topic;
  lag is 0 and the 40 orders are not in analytics.orders. The events are still on the topic.

  Root cause: order-sync's committed offsets were reset to the latest offsets during the deploy,
  skipping the 40 change events.

  Expected fix: kafka_replay_range of the skipped offsets of pg.public.orders into the reprocess
  topic pg.public.orders.reprocess, which order-sync also reads.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at
  reprocess_topic: pg.public.orders.reprocess

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]
  # So pg_resnapshot_rows validates too (a valid but unexpected fix here).
  tables:
    public.orders: {primary_key: true, estimated_rows: 1341, key_column: id, key_ranges: [[1, 1341]]}
    public.devctl_signal: {primary_key: true, signal_columns: true}
  publications:
    dbz_publication: [public.orders, public.devctl_signal]
  topics:
    pg.public.orders.reprocess: {partitions: 3}

