inputs:
  - kind: comment
    from: kabir
    text: "order-sync 2.15.0 went out at 08:43Z with stricter validation of orders.status. The shop launched gift orders this morning (status 'gift'), which 2.15.0 does not know. 2.15.1 accepts 'gift' and is live since 09:36Z; new gift orders load again."
  - kind: steer
    text: "Get the rejected orders into the warehouse. Propose it, I'll get the approvals."

expect:
  root_cause:
    - [validat*, reject*, strict*]
    - [gift, status]
  root_cause_forbidden:
    - ['poison pill']
    - ['task failed']
    - ['consumer crashed']
  first_failing_layer: consumer
  root_cause_layer: consumer
  expected_facts:
    - id: f_dlq_records
      tool: dlq_peek
      match: [20 records, devconsumer validation error]
      required: true
    - id: f_sink_missing
      tool: reconcile
      match: [sink is missing 20 rows, consumer side]
    - id: f_lag_zero
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
  claims:
    - about: root_cause
      facts: [f_dlq_records, f_sink_missing]
  evidence_tools: [dlq_peek]
  fix: [[dlq_replay]]
  fix_targets:
    dlq_replay: {dlq_topic: devctl.order-sync.dlq, to_topic: pg.public.orders}
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, schema_register, schema_set_compatibility]
  max_tool_calls: 14
