# C7 incident scenario (P3g-1): a strict consumer release routes valid orders (a new status
# value) to its dead-letter topic; lag stays 0 and the warehouse looks fresh. Format:
# evals/README.md (C6). Built on `devctl break dlq-backlog` (dev/scenarios.md §11, PR #613).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# kafkatools, dbtools and topology code from main, run by a throwaway generator (not
# committed) over fake clients holding the state `devctl break dlq-backlog` leaves on the dev
# stack, scoped by dev/owners.p3.yaml (which declares the DLQ in watch.dlq_topics; dlq_peek
# got the in-process watcher's count, as in cmd/server). Clock: 2026-10-18T09:40:00Z. Nothing
# was read from a running stack. The reconcile bucket labels (HH:MM) were relabelled from the
# generator's wall clock to the fixed clock; every other byte is the tools'. See
# evals/scenarios/README.md, "P3 scenarios (P3g-1)".
#
# First failing layer: consumer. Root-cause layer: consumer (the strict release).
#
# Expected fix (the label): dlq_replay {dlq_topic: devctl.order-sync.dlq, to_topic:
#   pg.public.orders, count: 20, partition: 0} (kafka owner approves), AFTER the cause is fixed:
#   the comment and steer below say the build that accepts 'gift' is live, so replayed
#   records load instead of being dead-lettered again. The pipeline block declares the DLQ in
#   watch.dlq_topics, which dlq_replay's CheckScope requires.
#   Graded since P3g-2 (expect.fix, fix_targets; count and partition are left free). The
#   action's Validate reads the DLQ offsets from the dlq_peek recording and the target topic's
#   from kafka_topic_offsets.
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector -
#     Connect is healthy; the records are in the topic and in the DLQ.
#   Forbidden: schema_register, schema_set_compatibility - status is a string field; no schema
#     changed and none would make the consumer accept the value.
#   Never suggest: replaying before the accepting build is live (the records go straight back
#     to the DLQ), or resetting order-sync's offsets (it would reprocess everything to fix 20).
#
# Traps:
#   - Lag is 0, the group is Stable, the warehouse is 2 minutes fresh: rejected records are
#     committed. Only dlq_peek, the DLQ node of pipeline_map (WARN, records=20) and reconcile
#     (sink lacks 20 rows the topic has) show the loss.
#   - dlq_peek runs in the default `classes` header mode: it shows devconsumer.ValidationError
#     but not the message (unknown status "gift"); the value 'gift' comes from the consumer
#     owner's comment. No tool reads consumer logs (evals/scenarios/README.md, tool gaps).
#   - The records carry no connector.name header (devconsumer is not Connect), so dlq_peek
#     warns that they may belong to another connector; the DLQ is declared as order-sync's.
#
# Sources:
#   - cmd/devctl/scenarios_p3.go breakDLQBacklog (#613): the DLQ topic (1 partition),
#     REJECT_STATUS=gift, 20 gift orders.
#   - cmd/devconsumer/badbuild.go dlqRecord: the five __connect.errors.* headers it writes,
#     exception class devconsumer.ValidationError.
#   - internal/watch/dlq_signals.go: the dlq_growth title, "<pipeline>: DLQ <topic> +N in 1h,
#     first HH:MMZ, N present".
#   - dev/scenarios.md §11: expected symptoms; fix the cause, then dlq_replay.

name: dlq-backlog
description: |
  At 08:43 UTC order-sync 2.15.0 went out with strict validation of orders.status. The shop
  started selling gift orders (status 'gift') that morning; 2.15.0 does not know the value and
  sends each such order to its dead-letter topic devctl.order-sync.dlq with a
  devconsumer.ValidationError header, then commits it. The 20 gift orders inserted at 08:44 are
  in pg.public.orders and in the DLQ, not in analytics.orders. Lag is 0 and the warehouse is
  fresh. 2.15.1, which accepts 'gift', is live since 09:36.

  Root cause: order-sync's new status validation rejects the valid status 'gift' and routes
  those orders to the DLQ.

  Expected fix (label): dlq_replay of the 20 records from devctl.order-sync.dlq back to
  pg.public.orders, now that the accepting build is live.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders, public.devctl_refunds]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at
  watch:
    dlq_topics:
      - {topic: devctl.order-sync.dlq, written_by: order-sync}

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

