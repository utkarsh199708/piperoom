inputs:
  - kind: steer
    from: arjun
    text: "Task 0 keeps bouncing between the workers since about 08:40 and restarting it by hand did not stick. Nothing changed on the prod workers or the connector. Platform brought up the new staging Connect cluster this morning on the same Kafka cluster, from a copy of our worker config. What is going on?"

expect:
  root_cause:
    - [rebalanc*]
    - [staging, group.id, group id, same group, shared group, second cluster, two clusters, other cluster]
  root_cause_forbidden:
    - [slot, lost]
    - [slot, dropped]
    - [schema change]
    - [broker, down]
    - [consumer, crash*]
    - [order-sync, rebalanc*]
    - [poison pill]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_unassigned
      tool: connect_status
      match: [task 0 unassigned]
      required: true
    - id: f_reassigned
      tool: connect_status
      match: [running on connect 3, task 0 running]
    - id: f_counters_reset
      tool: debezium_metrics
      match: [events seen, behind source]
    - id: f_kafka_healthy
      tool: kafka_cluster_health
      match: [0 under replicated, 0 offline]
    - id: f_consumer_stable
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
    - id: f_rebalancing
      tool: connect_worker_metrics
      match: [rebalancing true]
      required: true
    - id: f_staging_workers
      tool: connect_worker_info
      match: [5 workers, connect stg]
  claims:
    - about: root_cause
      facts: [f_unassigned, f_reassigned]
  evidence_tools: [connect_status, connect_worker_metrics]
  forbidden_actions: [connect_restart_connector, connect_restart_task, connect_pause_connector, connect_resume_connector, pg_drop_replication_slot, kafka_reset_consumer_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 14
