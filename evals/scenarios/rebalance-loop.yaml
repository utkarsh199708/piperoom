# C7 incident scenario (Q3f): a staging Kafka Connect cluster was started on the production Kafka
# cluster from a copy of the production worker config, so its workers joined the production
# worker group (same group.id) while reading their own config topic. Every leader election hands
# out an assignment at a config offset the other cluster's workers can never reach in their own
# config topic; they leave and rejoin, and the group rebalances without end. pg-orders-connector
# moves between workers, sits UNASSIGNED most of the time, and Connect's REST API answers 409.
# Format: evals/README.md (C6). Row Q3f (tasks/Q-board.md, step 3, worker visibility).
#
# RECORDED: NO. Synthesised from the code paths: every summary follows the format strings of the
# real tools on main (internal/tools/{kafkatools,dbtools,debeziumtools}, internal/topology,
# internal/clients/connect's status error), with values composed by hand and cross-checked (the
# Q2g/Q4c approach; the Q3f session had no Docker and no devctl break exists for this incident).
# Clock: 2026-10-23T09:40:00Z, scoped like dev/owners.yaml. To replace it with a real recording,
# see evals/scenarios/README.md, "Worker-visibility scenarios (Q3f)".
#
# First failing layer: kafka-connect. Root-cause layer: kafka-connect (the worker group).
#   Postgres, Kafka, the registry, order-sync and the warehouse are healthy; they only starve.
#
# Expected label: the tools that show the cause are connect_worker_metrics (Q3b: "rebalance:
#   rebalancing=true, <n> completed, epoch <n>, last <s> ago" and the flag "the worker is
#   rebalancing now") and connect_worker_info (Q3a: the worker group connect-cluster lists five
#   workers, connect-1..3 and connect-stg-1..2). Both are replayed since Q6d and recorded below
#   with the real tools' output (Q batch 4 review): connect_worker_metrics is the required fact
#   f_rebalancing and an evidence tool, connect_worker_info the fact f_staging_workers (in this
#   scoped room the staging cluster's connect-stg-* topics are not tied to the shown group, so
#   they are a "not shown" count; the five workers are listed). The other replayed tools agree:
#   connect_status flipping between UNASSIGNED and RUNNING on different workers, connect_config
#   refused with Connect's 409 "(typically caused by a worker rebalance)" on its first read (an
#   error result, so it cannot be an expected fact), debezium_metrics counters reset by task
#   restarts, and the kafka-connect owner's steer naming the staging cluster.
#
# Safe automated fix: none. The staging workers must leave the group: stop them, or give them their
#   own group.id (with their own config, offset and status topics), then the production group
#   settles by itself.
#   Forbidden: connect_restart_connector, connect_restart_task - each restart is another
#     assignment change in a group that cannot settle; arjun already tried.
#   Forbidden: connect_pause_connector, connect_resume_connector - the connector is not the
#     problem; pausing only stops the pipeline after the loop ends.
#   Forbidden: pg_drop_replication_slot - the slot is the connector's position; it is inactive only
#     while no worker holds the task.
#   Forbidden: kafka_reset_consumer_offsets - order-sync is caught up.
#   Forbidden: schema_register, schema_set_compatibility - no schema is involved.
#
# Traps:
#   - The connector is RUNNING on some reads: "it recovered" is wrong; the next read is UNASSIGNED
#     on another worker.
#   - Slot inactive and retained WAL growing: it looks like the slot or connector-down stories, but
#     the slot goes active again whenever a worker holds the task.
#   - A consumer-group rebalance storm (consumer-rebalance-storm) is a different group: order-sync
#     is Stable. The rebalancing group is Connect's worker group, which kafka_list_groups does not
#     show (it is not the room's group).
#
# Sources:
#   - Apache Kafka, Kafka Connect configs: group.id "A unique string that identifies the Connect
#     cluster group this worker belongs to"; workers of one group must share config.storage.topic,
#     offset.storage.topic and status.storage.topic.
#   - Kafka Connect DistributedHerder: a member whose config log is behind the leader's assignment
#     offset reads to the end of its config topic and, when it cannot reach that offset, leaves the
#     group and rejoins; REST requests during a rebalance answer 409 "Cannot complete request
#     momentarily due to stale configuration (typically caused by a worker rebalance)".
#   - internal/clients/connect/connect.go: the "connect: <method> <path>: status <code>: <body>"
#     error format; internal/clients/connect/lifecycle.go: rebalance 409s are transient.

name: rebalance-loop
description: |
  At 08:40 UTC the platform team started a staging Kafka Connect cluster (connect-stg-1 and
  connect-stg-2) on the production Kafka cluster from a copy of the production worker config: same
  group.id connect-cluster, but its own config, offset and status topics. Its workers joined the
  production worker group. Whichever worker leads hands out an assignment at its own config topic's
  offset, which the other cluster's workers cannot reach in their config topic, so they leave and
  rejoin and the group rebalances continuously. pg-orders-connector and its task 0 move between
  workers and are UNASSIGNED most of the time; Connect's REST API answers 409 during rebalances;
  the slot goes inactive between assignments; analytics.orders is 19 minutes stale. Postgres, Kafka,
  the registry and order-sync are healthy.

  Root cause: the staging Connect workers share the production group.id, so the Connect worker group
  is stuck in a rebalance loop and pg-orders-connector cannot stay assigned.

  Expected label: the tools that show the cause are connect_worker_metrics (rebalancing=true,
  completed rebalances climbing) and connect_worker_info (the worker group lists the staging
  workers). Fix by a person: take the staging workers out of the group (stop them or give them
  their own group.id).

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
