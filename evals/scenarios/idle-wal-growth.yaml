# C7 incident scenario (Q2g): an ACTIVE replication slot that confirms nothing, because the
# captured table is idle while another database on the same server writes; the slot retains every
# WAL segment. Format: evals/README.md (C6). Built on `devctl break idle-wal-growth`
# (dev/scenarios.md §23, PR #866) and scoped like dev/owners.q2.yaml (the baseline pipeline plus a
# 32 MiB slot_wal threshold; the heartbeat table is deliberately not a source_table, see below).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# source_settings, source_blocking_sessions, dbtools and kafkatools code from main, composed by
# hand from those tools' format strings (the P3 and X1e approach; the Q2g session had no Docker
# and dev/scenarios.md §23 is not observed on the stack yet). Clock: 2026-10-23T09:40:00Z. To
# replace it with a real recording, see evals/scenarios/README.md, "Source-database settings
# (Q2g)".
#
# First failing layer: postgres (a slot that never advances). Root-cause layer: postgres.
#   Nothing FAILED: pg-orders-connector and task 0 are RUNNING, the slot is active, order-sync is
#   Stable at lag 0. Only the slot's retained WAL grows.
#
# Expected fix (the label): source_create_heartbeat_table {connector: pg-orders-connector,
#   table: public.devctl_heartbeat}, then the follow-up steps the action's preview lists:
#   heartbeat.action.query and heartbeat.interval.ms on the connector, and the table added to the
#   filtered publication dbz_publication. The preview says the config keys are set through
#   connect_update_connector_config "when its allow-list admits these keys; otherwise a Connect
#   admin sets them", and in this wave the allow-list does not admit heartbeat.*, so a Connect
#   admin applies them (A2's allow-list can grow later). In dev the fix adds the publication
#   member with its own ALTER PUBLICATION: pg_add_publication_table accepts only the pipeline's
#   source_tables, and source_create_heartbeat_table refuses a heartbeat table that is one of
#   them, so the table is not declared in dev/owners.q2.yaml (in production it is added to
#   owners.yaml after it is created). Each heartbeat is then a change Debezium receives and
#   confirms, and retained WAL falls below slot_wal.clear within one Connect offset flush (60 s).
#   Graded from Q2h (C6): evals.LiveActions does not register the source actions yet, so this
#   file names the action in its label and does not expect.fix.
#   Forbidden: pg_drop_replication_slot - the slot is healthy and holds the position; dropping it
#     forces a new slot and a re-snapshot of every table.
#   Forbidden: connect_restart_task, connect_restart_connector - nothing failed, and a restart
#     with snapshot.mode=initial neither re-reads the table nor makes the connector confirm an
#     idle source.
#   Forbidden: connect_pause_connector - pausing stops the WAL sender, which makes the slot
#     inactive: retention continues and nothing confirms.
#   Forbidden: connect_update_connector_config alone - its allow-list is output/precision
#     settings and error logging; it cannot turn heartbeats on.
#   Forbidden: schema_register, schema_set_compatibility - no schema is involved.
#
# Traps:
#   - Everything green except WAL: no failed task, no inactive slot, lag 0, and the warehouse is
#     only stale because the source is quiet, not because the consumer is behind (reconcile shows
#     sink == source and the last order is in both).
#   - source_settings shows max_slot_wal_keep_size=-1: "no cap" is the reason the WAL is not
#     released by Postgres, not the cause of the growth. Setting a cap would drop the slot and
#     lose the position.
#   - The inactive-slot stories (slot-inactive-wal-growth, dead-slot-wal) do not apply: this slot
#     is active with a running walsender, so resume/drop are wrong.
#   - pg_long_transactions and source_blocking_sessions show nothing: no transaction holds the
#     slot back. It is the absent traffic that does.
#
# Sources:
#   - cmd/devctl/scenarios_q2.go breakIdleWALGrowth (#866): CREATE DATABASE devctl_batch, then up
#     to four 50 MB inserts into devctl_wal_filler until debezium_orders retains >= 32 MiB
#     (slot_wal.fire on dev/owners.q2.yaml) and the slot is still active.
#   - https://debezium.io/documentation/reference/3.2/connectors/postgresql.html: heartbeat.
#     interval.ms sends a heartbeat record that advances confirmed_flush_lsn even when no table
#     changes; heartbeat.action.query makes the connector write to a table so the change is
#     captured too.
#   - https://www.postgresql.org/docs/17/runtime-config-replication.html: max_slot_wal_keep_size
#     caps retained WAL and can invalidate (drop) the slot; -1 means no cap.
#   - internal/actions/sourceactions/heartbeat_table.go: the params (connector, table) and the
#     preview's follow-up steps (publication member, heartbeat.action.query).

name: idle-wal-growth
description: |
  Since 09:02 UTC the source server's other database devctl_batch (the nightly batch) has been
  writing while public.orders is idle: no order change has been captured for 38 minutes.
  Logical decoding is per database, so Debezium receives nothing, commits no offset and never
  confirms the WAL the batch writes: the slot debezium_orders is ACTIVE (a walsender is
  attached) and retains 34.6 MiB and growing, past the pipeline's 32 MiB slot_wal threshold.
  max_slot_wal_keep_size is -1, so Postgres does not cap it. Nothing failed: connector and task
  0 RUNNING, order-sync Stable at lag 0, and the warehouse is stale only because the source is
  quiet.

  Root cause: the captured table is idle, so the connector confirms nothing and the active slot
  retains every WAL segment; there is no long transaction and no inactive slot.

  Expected fix (label): source_create_heartbeat_table for the connector (a heartbeat table plus
  heartbeat.interval.ms and heartbeat.action.query, and the table in dbz_publication), so each
  heartbeat advances the slot.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at
  # dev/owners.q2.yaml: the slot_wal signal fires at 32 MiB here, not the 1 GiB default a dev
  # disk never reaches.
  watch:
    enabled: true
    signals:
      connector_down: {for: 30s}
      slot_inactive: {for: 30s}
      slot_wal: {fire: 32MiB, clear: 16MiB, for: 30s}

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

