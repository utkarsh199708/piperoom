inputs:
  - kind: steer
    from: priya
    text: "I own the database and I do not want the slot dropped - it holds three years of history. The batch database on the same server is not going to stop. Tell me how to get the slot confirming again and propose it."

expect:
  root_cause:
    - [slot, replication slot]
    - [idle, quiet, nothing to decode, nothing to confirm, no changes to capture, confirms nothing, no changes]
    - [wal, retained, hold*]
  # The wrong stories of WAL growth: nothing failed and nothing is behind.
  root_cause_forbidden:
    - ['task failed']
    - ['connector failed']
    - ['schema change']
    - ['consumer is behind']
    - ['lag is growing']
    - ['disk full']
    - ['slot was lost']
    - [retention, delet*]
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_slot_active_retaining
      tool: pg_replication_slots
      match: [debezium orders, active true, wal status reserved]
      required: true
    - id: f_no_cap
      tool: source_settings
      match: [max slot wal keep size]
      required: true
    - id: f_no_blockers
      tool: source_blocking_sessions
      match: [no blocking sessions]
    - id: f_no_long_transactions
      tool: pg_long_transactions
      match: [no long transactions]
    - id: f_no_row_loss
      tool: reconcile
      match: [no drift]
    - id: f_source_quiet
      tool: pg_streaming_liveness
      match: [quiet, no source writes]
  claims:
    - about: root_cause
      facts: [f_slot_active_retaining, f_source_quiet, f_no_blockers]
  evidence_tools: [pg_replication_slots, source_settings, source_blocking_sessions]
  forbidden_actions: [pg_drop_replication_slot, connect_restart_task, connect_restart_connector, connect_pause_connector, schema_register, schema_set_compatibility]
  max_tool_calls: 14
