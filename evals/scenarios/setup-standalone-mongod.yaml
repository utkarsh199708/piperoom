# C7 setup scenario (U7d): the source mongod came back as a standalone (its container was recreated
# without --replSet), so it serves no change streams and the connector's driver, which asks for
# replica set rs0, finds no member and times out: task 0 FAILED. The trace reads like a network
# problem; the setup check says what the server is. The label names the failing check and the fix
# with its tier (tasks/U-board.md rows U7b and U7d, step 7). Format: evals/README.md (C6). Built on
# `devctl setup-break standalone-mongod` (dev/mongo/README.md, cmd/devctl/setupbreaks_mongo.go,
# U7c).
#
# RECORDED: NO. Every summary and data payload is the exact output format of the real
# connect_status, connect_config, connect_worker_logs, kafkatools and dbtools code from main,
# composed by hand (the U1-19 approach; this session has no Docker, and the MongoDB source driver,
# U7b, is not on main). The check name and its message are devctl's verifyMongoChangeStreams, which
# reads the U7a client's ChangeStreamSupport. The task trace is composed from the MongoDB Java
# driver's server-selection timeout (a replica set URI against a STANDALONE server, which the driver
# drops from its cluster view) and Debezium's change-event-producer wrapper. Clock:
# 2026-10-27T09:40:00Z. Runner session: evals/setup/recordings/setup-standalone-mongod.json. To
# re-record both on the dev stack, see evals/scenarios/README.md, "Setup scenarios: MongoDB (U7d)".
#
# Timeline: 09:20 the setup run registered mongo-orders-connector (snapshot of inventory.orders, 3
#   documents); 09:22 the first verification was green. 09:30 the person recreated the mongo
#   container from an old compose file whose command lacks --replSet rs0; mongod started on the same
#   volume as a standalone. 09:31 task 0 FAILED after the driver's 30 s server selection. 09:39 the
#   re-verification stopped at tasks_running and canary_event. 09:40 the re-run of the prerequisite
#   checks: mongo-change-streams failed.
#
# First failing layer: kafka-connect (task 0 FAILED; mongod still answers, so it is not the first
#   failing component). Root-cause layer: postgres (the source layer: the server's mode; owners.yaml
#   has no mongodb source_kind yet, so the source layer is named postgres).
#
# Expected label: failing check mongo-change-streams ("change streams not supported: standalone
#   mongod has no change streams"); fix: run mongod as a replica set member again. U7b: a standalone
#   mongod is a check whose fix is T1 only when this room created it (by receipt); this mongod is the
#   person's own container, so the fix is a documented ask: restart it with --replSet rs0 on the same
#   volume (the member's replica set config is still there, so it elects itself primary; a mongod
#   that never was a member also needs rs.initiate()). Then connect_restart_task
#   {connector: mongo-orders-connector, task: 0}: the task resumes from its stored resume token,
#   which is still in the oplog on the volume. No room action restarts mongod, so there is no
#   expect.fix.
#   Forbidden: connect_update_connector_config - dropping replicaSet from mongodb.connection.string
#     would reach the standalone and fail on its missing change streams instead; no connector key
#     gives a standalone an oplog.
#   Forbidden: connect_restart_connector, connect_resume_connector - a restart fails the same way
#     until mongod is a member again; the connector is not paused.
#   Forbidden: connect_delete_connector, connect_reset_source_offsets - the stored resume token is
#     what lets the task resume without a new snapshot.
#   Forbidden: schema_register, schema_set_compatibility - the registry is fine.
#
# Traps:
#   - MongoTimeoutException with servers=[] reads like DNS or a network route. The server answers;
#     the driver removed it from its view because it is a STANDALONE, not a member of rs0.
#   - The capture user and its roles are unchanged: an authentication or role story fails.
#
# Sources:
#   - cmd/devctl/setupbreaks_mongo.go: breakStandaloneMongod (the service recreated without
#     --replSet, same start script, keyFile and volume), verifyMongoChangeStreams' detail "change
#     streams not supported: <reason>", check name mongo-change-streams; internal/clients/mongodb
#     status.go: ChangeStreamSupport's reason "standalone mongod has no change streams".
#   - dev/mongo/README.md: the URI on the compose network carries replicaSet=rs0; the fix recreates the
#     service from the base file and the member elects itself primary again.
#   - tasks/U-board.md U7b: "a standalone mongod is a check whose fix is T1 only when this room
#     created it (by receipt)".
#   - https://www.mongodb.com/docs/manual/changeStreams/: change streams need a replica set or a
#     sharded cluster.

name: setup/standalone-mongod
description: |
  The MongoDB pipeline orders-mongo was set up at 09:20 and verified at 09:22. At 09:30 the person
  recreated the mongo container from an old compose file whose command lacks --replSet rs0, so
  mongod started on the same data volume as a standalone. At 09:31 task 0 of mongo-orders-connector
  FAILED with com.mongodb.MongoTimeoutException (server selection timed out, cluster type
  REPLICA_SET, servers=[]). The re-verification at 09:39 stopped at tasks_running and canary_event.
  The re-run of the prerequisite checks fails mongo-change-streams: "change streams not supported:
  standalone mongod has no change streams". The capture user and the connector config are as they
  were.

  Root cause: the source mongod runs as a standalone instead of a member of replica set rs0, so it
  serves no change streams, and the connector's driver, which asks for rs0, finds no member.

  Expected label: failing check mongo-change-streams; fix: restart mongod with --replSet rs0 (a
  documented ask: the person's own mongod; T1 only when this room created it), then
  connect_restart_task for task 0.

setup:
  source_kind: mongodb
  target: compose

pipeline:
  id: orders-mongo
  title: Orders CDC (MongoDB)
  topic_prefix: mongo
  source_tables: [inventory.orders]
  connectors: [mongo-orders-connector]

resources:
  connectors: [mongo-orders-connector]
  subjects: [mongo.inventory.orders-key, mongo.inventory.orders-value, mongo.inventory.piperoom_canary-key, mongo.inventory.piperoom_canary-value]

alert:
  # The title names the failed task and the check, not the check's message: the message states the
  # cause (it is in the description), and a title that hands the cause back must not pass.
  title: 'orders-mongo setup: mongo-orders-connector task 0 FAILED (MongoTimeoutException); prerequisite check mongo-change-streams failed'
  pipeline_map: |
    pipeline orders-mongo
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:inventory.orders [postgres, owner priya] UNKNOWN
    2 connect:mongo-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
      from: pg:inventory.orders
    3 topic:mongo.inventory.orders [kafka, owner arjun] OK newest_record=20m ago
      from: connect:mongo-orders-connector

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders-mongo}
    summary: |
      pipeline orders-mongo
      legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
      1 pg:inventory.orders [postgres, owner priya] UNKNOWN
      2 connect:mongo-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
        from: pg:inventory.orders
      3 topic:mongo.inventory.orders [kafka, owner arjun] OK newest_record=20m ago
        from: connect:mongo-orders-connector
    data:
      edges:
        - from: pg:inventory.orders
          to: connect:mongo-orders-connector
        - from: connect:mongo-orders-connector
          to: topic:mongo.inventory.orders
      nodes:
        - health: unknown
          id: pg:inventory.orders
          kind: source_table
          layer: postgres
          name: inventory.orders
          owner: priya
        - facts:
            tasks_failed: "1"
          health: fail
          id: connect:mongo-orders-connector
          kind: connector
          layer: kafka-connect
          name: mongo-orders-connector
          owner: arjun
        - facts:
            newest_record: 20m ago
          health: ok
          id: topic:mongo.inventory.orders
          kind: topic
          layer: kafka
          name: mongo.inventory.orders
          owner: arjun
      pipeline_id: orders-mongo
  - tool: connect_status
    input: {connector: mongo-orders-connector}
    summary: |-
      mongo-orders-connector (source): RUNNING on connect:8083.
      Task 0: FAILED:
      org.apache.kafka.connect.errors.ConnectException: An exception occurred in the change event producer. This connector will be stopped.
      Caused by: com.mongodb.MongoTimeoutException: Timed out after 30000 ms while waiting for a server that matches ReadPreferenceServerSelector{readPreference=primary}. Client view of cluster state is {type=REPLICA_SET, servers=[]
    data:
      name: mongo-orders-connector
      state: RUNNING
      tasks:
        - id: 0
          state: FAILED
          error: "org.apache.kafka.connect.errors.ConnectException: An exception occurred in the change event producer. This connector will be stopped.\nCaused by: com.mongodb.MongoTimeoutException: Timed out after 30000 ms while waiting for a server that matches ReadPreferenceServerSelector{readPreference=primary}. Client view of cluster state is {type=REPLICA_SET, servers=[]"
      type: source
      worker: connect:8083
  - tool: connect_config
    input: {connector: mongo-orders-connector}
    summary: |-
      capture.mode: change_streams_update_full
      collection.include.list: inventory.orders,inventory.piperoom_canary
      connector.class: io.debezium.connector.mongodb.MongoDbConnector
      mongodb.connection.string: ***
      topic.prefix: mongo
    data:
      capture.mode: change_streams_update_full
      collection.include.list: inventory.orders,inventory.piperoom_canary
      connector.class: io.debezium.connector.mongodb.MongoDbConnector
      mongodb.connection.string: '***'
      topic.prefix: mongo
  - tool: connect_worker_logs
    input: {connector: mongo-orders-connector}
    summary: |-
      Worker log lines naming mongo-orders-connector at WARN or above, 2026-10-27T08:40:00Z to 2026-10-27T09:40:00Z: 1 line(s), newest last (all of them in data).
      09:31:14.208 ERROR [connect:8083] WorkerSourceTask{id=mongo-orders-connector-0} Task threw an uncaught and unrecoverable exception. Task is being killed and will not recover until manually restarted
          Caused by: com.mongodb.MongoTimeoutException: Timed out after 30000 ms while waiting for a server that matches ReadPreferenceServerSelector{readPreference=primary}. Client view of cluster state is {type=REPLICA_SET, servers=[]
    data:
      bytes: 525
      connector: mongo-orders-connector
      lines:
        - at: "2026-10-27T09:31:14.208Z"
          level: ERROR
          logger: org.apache.kafka.connect.runtime.WorkerTask
          text: "WorkerSourceTask{id=mongo-orders-connector-0} Task threw an uncaught and unrecoverable exception. Task is being killed and will not recover until manually restarted\norg.apache.kafka.connect.errors.ConnectException: An exception occurred in the change event producer. This connector will be stopped.\nCaused by: com.mongodb.MongoTimeoutException: Timed out after 30000 ms while waiting for a server that matches ReadPreferenceServerSelector{readPreference=primary}. Client view of cluster state is {type=REPLICA_SET, servers=[]"
          worker: connect:8083
      min_level: WARN
      since: "2026-10-27T08:40:00Z"
      summary_lines: 1
      until: "2026-10-27T09:40:00Z"
  - tool: kafka_topic_offsets
    input: {topic: mongo.inventory.orders}
    summary: |-
      partition 0: 0–3 (3 records), newest 20 min ago
    data:
      partitions:
        - end: 3
          last_timestamp: "2026-10-27T09:20:05Z"
          partition: 0
          start: 0
      topic: mongo.inventory.orders
      total_records: 3
  - tool: kafka_find_by_key
    input: {topic: mongo.inventory.piperoom_canary}
    summary: |-
      not found: no record with key "c81f4e09b2a7d35e6f1a0c9d4b8e2f76" since 2026-10-27T09:30:00Z
    data:
      found: false
      key: c81f4e09b2a7d35e6f1a0c9d4b8e2f76
      records: null
      topic: mongo.inventory.piperoom_canary
      truncated: false
  - tool: schema_registry_subjects
    summary: |-
      mongo.inventory.orders-key
      mongo.inventory.orders-value
      mongo.inventory.piperoom_canary-key
      mongo.inventory.piperoom_canary-value
  - tool: similar_incidents
    summary: |-
      No similar closed incident found on pipeline orders-mongo (0 past rooms searched).
  # The room's source tools have no MongoDB reader on main: the real tools' answer.
  - tool: source_settings
    error: 'dbtools: source_settings: the source client cannot read database settings'
  - tool: source_role_grants
    error: 'dbtools: source_role_grants: the source client cannot read database settings'
  - tool: source_table_replication
    error: 'dbtools: source_table_replication: the source client cannot read database settings'
  # Calls no recording above covers: the real tools' not-found answers.
  - tool: connect_status
    error: 'connect: GET /connectors/<name>/status: not found'
  - tool: connect_config
    error: 'connect: GET /connectors/<name>/config: not found'
  - tool: pipeline_map
    error: 'out of scope: pipeline_id "default" is not this room''s pipeline "orders-mongo"; read tools only work on the room''s own pipeline'
  - tool: kafka_topic_offsets
    error: 'kafka: topic <topic>: not found'

inputs:
  - kind: steer
    from: priya
    text: "I recreated the mongo container from our compose file and since then the connector's task times out finding a server. The database is up, I can connect to it. What is wrong, and what do I change?"

expect:
  root_cause:
    - [standalone, replset]
    - [mongod, change stream*, replica set]
  # The wrong stories of a server-selection timeout on a database that answers.
  root_cause_forbidden:
    - [network]
    - [dns]
    - [firewall*]
    - [password*]
    - [authenticat*]
    - [oplog, role]
    - [schema registry]
    - [offset*, reset]
  first_failing_layer: kafka-connect
  root_cause_layer: postgres
  expected_facts:
    - id: f_task_failed
      tool: connect_status
      match: [task 0, failed, mongo timeout exception]
      required: true
    - id: f_cluster_view
      tool: connect_status
      match: [type replica set, servers]
    - id: f_task_killed
      tool: connect_worker_logs
      match: [task threw an uncaught and unrecoverable exception]
    - id: f_canary_missing
      tool: kafka_find_by_key
      match: [not found, c81f4e09b2a7d35e6f1a0c9d4b8e2f76]
  claims:
    - about: root_cause
      facts: [f_task_failed, f_cluster_view]
  evidence_tools: [connect_status]
  forbidden_actions: [connect_update_connector_config, connect_restart_connector, connect_resume_connector, connect_delete_connector, connect_reset_source_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 12
