      2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
        from: pg:public.orders
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1m ago
        from: connect:pg-orders-connector
      4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
        from: topic:pg.public.orders
      5 wh:analytics.orders [warehouse, owner meera] OK stale_for=1m ts_column=updated_at
        from: group:order-sync (unconfirmed)
    data:
      edges:
        - from: pg:public.orders
          to: connect:pg-orders-connector
        - from: connect:pg-orders-connector
          to: topic:pg.public.orders
        - from: topic:pg.public.orders
          to: group:order-sync
        - from: group:order-sync
          mapping: inferred
