# C7 incident scenario (Q2g): every UPDATE and DELETE on the captured table fails on the source,
# because a migration set REPLICA IDENTITY NOTHING on public.orders and the publication publishes
# updates. Format: evals/README.md (C6). Built on `devctl break no-replica-identity`
# (dev/scenarios.md §20, PR #866).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# source_table_replication, source_settings, dbtools and kafkatools code from main, composed by
# hand from those tools' format strings (same approach as the P3 and X1e files; the Q2g session
# had no Docker and dev/scenarios.md §20 is not observed on the stack yet). Clock:
# 2026-10-23T09:40:00Z, scoped by dev/owners.yaml (source_tables: public.orders). To replace it
# with a real recording, see evals/scenarios/README.md, "Source-database settings (Q2g)".
#
# First failing layer: postgres (the source table refuses the write). Root-cause layer:
#   postgres. Nothing FAILS in the pipeline: pg-orders-connector and task 0 are RUNNING, the
#   slot is active, order-sync has lag 0 and analytics.orders is current - inserts and updates
#   of other tables still stream, so no consumer or warehouse symptom appears.
#
# Expected fix (the label): pg_set_replica_identity {table: public.orders, mode: full} (the
#   postgres owner approves; the dev baseline is FULL, dev/postgres-init/01-orders.sql). mode
#   default also restores writes (public.orders has a primary key), and devctl fix uses FULL.
#   The ALTER takes a brief ACCESS EXCLUSIVE lock and FULL adds the old row to the WAL of every
#   UPDATE and DELETE, which the action's preview sizes from the table size.
#   Graded from Q2h (C6): evals.LiveActions does not register the source actions yet, so this
#   file names the action in its label and does not score expect.fix.
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector -
#     nothing failed in Connect; a restart re-reads the same table and the application's UPDATE
#     still fails.
#   Forbidden: connect_update_connector_config - no connector setting turns a replica identity
#     on; message.key.columns changes what a record carries, not what Postgres allows.
#   Forbidden: schema_register, schema_set_compatibility - the schema is unchanged (no DDL on
#     any captured column) and the events that do flow deserialize.
#
# Traps:
#   - The alert is the application's error, so "the app is broken" or "the consumer rejects the
#     write" is the nearby wrong story. Inserts still reach analytics.orders: the pipeline is
#     not stalled.
#   - pg_recent_ddl shows the migration's ALTER TABLE ... REPLICA IDENTITY NOTHING, which reads
#     like the schema-change demo; no column changed, and schema_registry_diff shows nothing.
#   - The slot is active with little retained WAL, so a slot_wal / dead-slot story fails.
#
# Sources:
#   - cmd/devctl/scenarios_q2.go breakNoReplicaIdentity (#866): ALTER TABLE public.orders
#     REPLICA IDENTITY NOTHING, then a no-op UPDATE that must fail with "does not have a
#     replica identity", then a marker order that proves inserts still stream.
#   - https://www.postgresql.org/docs/17/sql-altertable.html: REPLICA IDENTITY NOTHING records
#     no old key; with a publication that publishes UPDATE or DELETE, Postgres refuses the
#     write: "cannot update table ... because it does not have a replica identity and publishes
#     updates".
#   - internal/tools/dbtools/source_settings.go: source_table_replication's summary and Data
#     (replica_identity=nothing, primary_key=yes).
#   - internal/actions/sourceactions/replica_identity.go: pg_set_replica_identity's params and
#     preview.

name: no-replica-identity
description: |
  At 08:58 UTC a migration copied from a table that Debezium does not capture ran
  `ALTER TABLE public.orders REPLICA IDENTITY NOTHING`. dbz_publication publishes updates, so
  from 09:02 UTC every application UPDATE and DELETE on public.orders fails with `cannot
  update table "orders" because it does not have a replica identity and publishes updates`;
  inserts still succeed and still reach Kafka. Nothing in the pipeline failed:
  pg-orders-connector and task 0 are RUNNING, the slot debezium_orders is active with 1.2 MiB
  retained, order-sync is Stable at lag 0 and analytics.orders is current.

  Root cause: public.orders has REPLICA IDENTITY NOTHING while dbz_publication publishes
  updates, so Postgres refuses every UPDATE and DELETE on the table.

  Expected fix (label): pg_set_replica_identity for public.orders with mode full (the table has
  a primary key, so mode default also restores the writes).

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

# devctl alert no-replica-identity posts this alert (source: app); its description's facts are
# in the title, since agent.Alert.Raw never reaches the model (evals/README.md).
alert:
  title: 'orders: updates to public.orders failing in the orders service (cannot update table "orders" because it does not have a replica identity and publishes updates; inserts still succeed)'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=1.2 MiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1m ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] OK stale_for=1m ts_column=updated_at
      from: group:order-sync (unconfirmed)

