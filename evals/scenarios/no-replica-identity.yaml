inputs:
  - kind: steer
    from: priya
    text: "The app team says every UPDATE on orders fails but inserts work. I own the database: tell me what to change on the table and propose it."

expect:
  root_cause:
    - [replica identity]
    # "omits the old tuple" is the positive phrasing of NOTHING: an answer that
    # states it with a cause term stays out of the ambiguous set (no negation).
    - [nothing, not recorded, no old key, no key, omits the old tuple]
  # The wrong stories of a source write failure: the pipeline stages are healthy.
  root_cause_forbidden:
    - ['task failed']
    - ['connector failed']
    - ['consumer rejected']
    - ['schema change']
    - [slot, inactive]
    - [slot, lost]
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_replica_identity_nothing
      tool: source_table_replication
      match: [public orders, replica identity nothing]
      required: true
    - id: f_connector_running
      tool: connect_status
      match: [task 0, running]
    - id: f_slot_active
      tool: pg_replication_slots
      match: [debezium orders, active true]
    - id: f_no_schema_change
      tool: schema_registry_diff
      match: [no field changes]
  claims:
    - about: root_cause
      facts: [f_replica_identity_nothing]
  evidence_tools: [source_table_replication]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_register, schema_set_compatibility]
  max_tool_calls: 12
