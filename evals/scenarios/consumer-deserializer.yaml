    error: 'kafka: group <group>: not found'

inputs:
  - kind: steer
    from: kabir
    text: "order-sync 2.18.0 went out at 09:00 (PR #318 moved the Kafka settings to config/consumer.properties in github.com/acme/order-sync). The pod crash-loops with: com.fasterxml.jackson.core.JsonParseException: Illegal character ((CTRL-CHAR, code 0)): only regular white space (\\r, \\n, \\t) is allowed between tokens, at the first record of pg.public.orders. What is wrong and what do we change?"

expect:
  root_cause:
    - [deserializ*, string deserializer, avro deserializer]
  root_cause_forbidden:
    - [poison pill]
    - [schema, deleted]
    - [connector, failed]
    - [schema change]
  first_failing_layer: consumer
  root_cause_layer: consumer
  expected_facts:
    - id: f_group_empty
      tool: kafka_consumer_lag
      match: [empty, 0 members, total lag 1843]
      required: true
    - id: f_topic_fresh
      tool: kafka_topic_offsets
      match: [newest 1 min ago]
    - id: f_connector_ok
      tool: connect_status
      match: [task 0 running]
  claims:
    - about: root_cause
      facts: [f_group_empty]
  evidence_tools: [kafka_consumer_lag]
  fix:
    - [repo_open_pull_request]
  fix_targets:
    repo_open_pull_request: {repo: order-sync}
  fix_files:
    - repo: order-sync
      files:
        - path: config/consumer.properties
          removed: [value.deserializer=org.apache.kafka.common.serialization.StringDeserializer]
          added: [value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer]
  forbidden_actions: [kafka_reset_consumer_offsets, dlq_replay, schema_register, schema_set_compatibility, connect_restart_task, connect_restart_connector, connect_update_connector_config, pg_drop_replication_slot]
  max_tool_calls: 10
