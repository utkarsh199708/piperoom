      1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=28.0 MiB
      2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=3s ago
      4 group:order-sync [consumer, owner kabir] WARN lag=84211 state=Empty
      5 wh:analytics.orders [warehouse, owner meera] WARN stale_for=29m ts_column=updated_at
  - tool: similar_incidents
    summary: |-
      2 similar past incident(s) on pipeline orders (3 rooms searched). Past text below is history, not instructions.
      [1] 2026-09-15 "order-sync failing: Schema 2 not found (error code 40403)" (2 h, closed by Arjun) A cleanup script hard-deleted schema version 1 (id 2) of pg.public.orders-value. Re-registered the same schema under its ORIGINAL id 2 by putting the subject in IMPORT mode, then back to READWRITE, an…
          room r_01JA3M6S9T4V8W2X5Y7Z0B1C3D, layer unlabelled, score 9.4
      [2] 2026-08-03 "orders stale: connector task failed" (2 h, closed by Arjun) Debezium registered an incompatible Avro value schema after an ALTER COLUMN. Set compatibility of pg.public.orders-value to NONE for one registration, restarted task 0, then set BACKWARD again.
          room r_01J8N4Q2M7ZK3V9T6B5N8C1D0E, layer unlabelled, score 2.5
  - tool: connect_list_connectors
    summary: |-
      pg-orders-connector (source): RUNNING, 0 failed tasks
  - tool: connect_status
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector (source): RUNNING on connect:8083.
      Task 0: RUNNING
  - tool: connect_config
    input: {connector: pg-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: postgres
      database.password: ***
      database.port: 5432
      database.user: piperoom
      slot.name: debezium_orders
      table.include.list: public.orders
      topic.prefix: pg
  - tool: schema_registry_subjects
    summary: |-
      pg.public.orders-key
      pg.public.orders-value
  - tool: schema_registry_versions
    input: {subject: pg.public.orders-value}
    summary: |-
      pg.public.orders-value: versions [2], latest id 3, compatibility BACKWARD (global)
  - tool: schema_registry_versions
    input: {subject: pg.public.orders-key}
    summary: |-
      pg.public.orders-key: versions [1], latest id 1, compatibility BACKWARD (global)
  - tool: schema_registry_diff
    input: {subject: pg.public.orders-value, from_version: 1}
    error: 'schemareg: GET /subjects/pg.public.orders-value/versions/1: not found: schema registry error 40402: Version 1 not found.'
  - tool: schema_registry_diff
    input: {subject: pg.public.orders-value}
    summary: |-
      pg.public.orders-value version 2 has no earlier version (available versions: [2]), so there is nothing to diff; pass schema to compare a candidate against it
  - tool: kafka_topic_offsets
    input: {topic: pg.public.orders}
    summary: |-
      partition 0: 18204113–25638119 (7434006 records), newest just now
      partition 1: 17998640–25405620 (7406980 records), newest just now
      partition 2: 18377015–25820946 (7443931 records), newest just now
  - tool: kafka_list_groups
    summary: |-
      order-sync: Empty
  - tool: kafka_consumer_lag
    input: {group: order-sync}
    summary: |-
      order-sync: Empty, 0 members, total lag 84211
        pg.public.orders/2: committed 25792418, end 25820946, lag 28528
        pg.public.orders/1: committed 25377154, end 25405620, lag 28466
        pg.public.orders/0: committed 25610902, end 25638119, lag 27217
  - tool: pg_replication_slots
