  # E5c: answers for calls the agent made that no recording covered (baseline run 38655252568).
  - tool: kafka_partition_rates
    summary: |-
      pg.public.orders last 5m: 15000 records (50/s); p2 5082 (33%), p1 5070, p0 4848; median 5070, max 5082, max/median 1.0x → even
  - tool: kafka_partition_rates
    input: {window: "15m"}
