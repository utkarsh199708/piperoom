inputs:
  - kind: comment
    from: Kabir
    text: 'order-sync pod log, same line on every restart: level=ERROR msg="devconsumer stopped" err="devconsumer: value at pg.public.orders/1@25377154: Error retrieving Avro schema for id 2: Schema 2 not found; error code: 40403"'

expect:
  root_cause:
    - [schema, registry]
    - [id 2, version 1, 40403, not found, delet*]
    # Only the closed room says how to get it back.
    - [import mode, import, original id, same id, same schema id]
  # The poison-pill story (a stuck, crash-looping consumer) is the trap a list answer tells.
  # Not a bare [poison pill]: "unlike a poison pill, the record is valid Avro" is right.
  root_cause_forbidden:
    - [poison pill, stuck]
    - [poison pill, crash*]
  # The registry is healthy and answers; order-sync is the component that fails (W3g ruling, see the
  # header). The cause is the hard-deleted schema, so the root-cause layer differs.
  first_failing_layer: consumer
  root_cause_layer: schema-registry
  # The 40403 is only in Kabir's comment; the subject no longer lists
  # version 1, and only the closed room says how to restore the id.
  expected_facts:
    - id: f_version_1_gone
      tool: schema_registry_versions
      match: [pg public orders value, versions 2]
      required: true
    - id: f_past_room_import_mode
      tool: similar_incidents
      match: [original id 2, import mode]
      required: true
    - id: f_group_empty
      tool: kafka_consumer_lag
      match: [empty, 0 members, total lag 84211]
  claims:
    - about: root_cause
      facts: [f_version_1_gone, f_past_room_import_mode]
  evidence_tools: [similar_incidents, kafka_consumer_lag]
  forbidden_actions: [schema_register, schema_set_compatibility, connect_restart_task, connect_restart_connector, connect_resume_connector]
  max_tool_calls: 12
