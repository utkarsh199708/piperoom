# N4 incident scenario: a past closed room is the key hint. Schema id 2 was hard-deleted from
# Schema Registry again. Format: evals/README.md (C6). Facts and tool output formats follow the
# other scenarios (clock: 2026-10-11T09:40:00Z). Example-only values: every id, offset, count and
# age, and the two past rooms.
#
# First failing layer: consumer. Root-cause layer: schema-registry. Alert fired at: consumer.
#   The registry still answers every request (the subject lists version 2, id 3, and is healthy);
#   the consumer group order-sync crash-loops on "Schema 2 not found (40403)" and is the most
#   upstream component that is broken, so it is the first failing layer. The deleted schema is the
#   cause, so the root-cause layer stays schema-registry. Same split as the README's example (a
#   schema change fails in Connect first, but the cause is a Postgres DDL) and the #677 rule that a
#   root cause which does not break its own layer is not the first failing layer. Ruled on W3g
#   (2026-10-19); relabelled in P3-W3d-2.
#
# What the live tools show: order-sync is Empty with lag on all partitions, Connect, the slot and
# the topic are healthy, and pg.public.orders-value has only version 2 (id 3). The consumer owner
# posts the log line: "Schema 2 not found; error code: 40403". So the agent can see WHICH schema
# is missing, but not that someone deleted it, and not how to get it back. The room store can:
# last month the same hard delete was fixed by re-registering the schema under its ORIGINAL id
# (IMPORT mode). That is the fix the hypothesis must name.
#
# similar_incidents recording: the exact summary of the real tool over the two fixture rooms in
# evals/similar_fixture_test.go (TestSimilarIncidentsRecordings fails when it drifts). The
# recording has no input, so it answers any query the model writes.
#
# Traps:
#   - schema_register: a normal register of the old schema gets a NEW id (4), so records written
#     with id 2 stay unreadable. Forbidden. (Re-registering under id 2 is an IMPORT-mode call that
#     no action here does; the correct fix is a human one.)
#   - schema_set_compatibility: not a compatibility problem.
#   - Connect restarts: Connect is healthy; restarting it changes nothing.
#   - Calling the consumer a poison pill: that is the other past room in the result, and it is
#     the wrong one (the record is valid Avro; its schema is missing).
#
# Correct fix: restore schema id 2 under its original id (set the subject to IMPORT mode,
# register the same schema with id 2, set READWRITE again), then restart order-sync. Nothing is
# lost: the records are intact.
#
# Sources: the error text is the Confluent client's, as in the recorded past room;
#   internal/tools/kafkatools for every format string.

name: recurring-schema-deleted
description: |
  At 03:10 UTC a cleanup job hard-deleted version 1 of pg.public.orders-value, which is Schema
  Registry id 2. order-sync kept working from its in-memory schema cache. At 09:12 it was
  redeployed, the cache was empty, and the first record written with id 2 fails with "Schema 2
  not found; error code: 40403". The pod restarts, lag grows on all partitions and the warehouse
  goes stale. Connect, the replication slot and the topic are healthy. The same hard delete
  happened last month and is in a closed room.

  Root cause: schema id 2 (version 1 of pg.public.orders-value) was hard-deleted from Schema
  Registry, so order-sync cannot decode records written with it. Restore it under its original
  id (IMPORT mode) and restart the consumer.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'order-sync lag 84211 on pg.public.orders; pod restarted 7 times in 15 min'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=28.0 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=3s ago
    4 group:order-sync [consumer, owner kabir] WARN lag=84211 state=Empty
    5 wh:analytics.orders [warehouse, owner meera] WARN stale_for=29m ts_column=updated_at

