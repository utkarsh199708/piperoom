# C7 incident scenario (P3g-1): the orders connector was RETIRED (Connect REST stop) and its
# replication slot is now dead weight that keeps every WAL segment. Format: evals/README.md
# (C6). Built on `devctl break dead-slot` (dev/scenarios.md §9, PR #613).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# kafkatools, dbtools and topology code from main, run by a throwaway generator (not
# committed) over fake clients holding the state `devctl break dead-slot` (plus `devctl load`)
# leaves on the dev stack, scoped by dev/owners.p3.yaml. Clock: 2026-10-18T09:40:00Z. Nothing
# was read from a running stack. See evals/scenarios/README.md, "P3 scenarios (P3g-1)".
#
# The #613 ruling: the stack state of this scenario and of dead-slot-wal-no-context is the same
# (the recordings are identical); the decision depends only on human context. Here the alert
# says the connector is retired and the orders feed will be re-created later with a new
# snapshot, so nobody will read this slot again and the fix that protects the database is to
# drop it: the label is pg_drop_replication_slot. Without that context (the other file) the
# right fix is connect_resume_connector, as in slot-inactive-wal-growth.
#
# First failing layer: postgres (an orphaned slot retaining WAL). Root-cause layer: postgres.
#   The connector is STOPPED on purpose; Connect is not broken.
#
# Expected fix (the label): pg_drop_replication_slot {connector: pg-orders-connector, slot:
#   debezium_orders} (postgres owner approves). The slot is inactive and the connector is not
#   RUNNING, so the action's Validate accepts it; wal_status is extended, not lost, so no force.
#   Not reversible: the re-created connector starts from a new snapshot, which the alert says
#   is the plan.
#   expect.fix cannot name pg_drop_replication_slot yet: evals.LiveActions registers only
#   actions.Register's seven, so -validate rejects it as an unknown action. P3g-2 (C6)
#   registers the P3 actions on replay clients; then set `fix: [[pg_drop_replication_slot]]`.
#   Until then the run is graded on root cause, layers, facts and the forbidden actions below.
#   Forbidden: connect_resume_connector - brings a retired connector back: it would start
#     streaming into pg.public.orders again from a position nobody wants (this is the trap).
#   Forbidden: connect_restart_task, connect_restart_connector - a STOPPED connector has no
#     tasks; nothing to restart, and the connector is meant to stay off.
#   Forbidden: schema_register, schema_set_compatibility - Schema Registry is not involved.
#
# Traps:
#   - The state is exactly slot-inactive-wal-growth's shape (STOPPED, slot inactive, WAL
#     growing), where resume is right. An agent that pattern-matches the state and ignores the
#     alert's context proposes the resume.
#   - Nothing FAILED: no failed task, no trace, no DDL. order-sync is Stable with lag 0.
#   - The warehouse is 3.2 h stale; that is expected for a retired feed, not a fault to fix.
#
# Sources:
#   - cmd/devctl/scenarios_p3.go breakDeadSlot (#613): Connect REST stop until the slot is
#     inactive, then a 100-row insert proves retained WAL grows.
#   - dev/scenarios.md §9: "That the connector is retired is human context the room gets from
#     people; the C7 eval scenario (dead-slot-wal.yaml, P3g-1) has to state it in its alert or a
#     steer, or 'resume' is the right answer there too."
#   - internal/actions/pgactions/drop_replication_slot.go: drops only the slot named in a
#     pipeline connector's slot.name, refused while active, force only for wal_status lost.
#   - https://www.postgresql.org/docs/17/view-pg-replication-slots.html: wal_status extended.
#
# The context is in the alert title, not a steer: inputs arrive only when the agent goes idle,
# and a resume proposed in the first turn (before any steer) would be right without the context.

name: dead-slot-wal
description: |
  At 06:28 UTC the platform team retired pg-orders-connector (`PUT
  /connectors/pg-orders-connector/stop`; the config stays for the record): the orders feed will
  be re-created later as a new connector with a new initial snapshot. Its replication slot
  debezium_orders was left behind. With no WAL sender the slot is inactive, and Postgres keeps
  every WAL segment after its restart_lsn: 1.4 GiB after 3.2 hours of `devctl load`,
  wal_status extended. Nothing failed; Kafka and order-sync are idle.

  Root cause: the retired connector's replication slot debezium_orders is orphaned and retains
  all WAL; nobody will read it again.

  Expected fix (label): pg_drop_replication_slot for debezium_orders (connector
  pg-orders-connector).

