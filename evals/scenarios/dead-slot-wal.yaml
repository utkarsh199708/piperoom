inputs:
  - kind: steer
    from: priya
    text: "The disk is what worries me. Propose the change that frees the WAL; the connector is gone for good."

expect:
  root_cause:
    # Not retire*: the alert title says retired, and a hypothesis that only repeats it must
    # not pass; the cause is the slot left behind.
    - [orphan*, left behind, leftover, dead, abandon*, unused, nobody, no longer used, no longer needed]
    - [slot*]
    - [wal, retain*]
  # The state shows "0 failed tasks"; a right answer may quote it, so only assertive phrases.
  root_cause_forbidden:
    - ['task failed']
    - ['task 0 failed']
    - ['failed task']
    - ['connector failed']
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_slot_inactive
      tool: pg_replication_slots
      match: [debezium orders, active false]
      required: true
    - id: f_connector_stopped
      tool: connect_status
      match: [stopped]
      required: true
    - id: f_wal_retained
      tool: pg_replication_slots
      match: [retained 1.4, wal status extended]
  claims:
    - about: root_cause
      facts: [f_slot_inactive, f_wal_retained]
  evidence_tools: [pg_replication_slots]
  # P3g-2: fix: [[pg_drop_replication_slot]] (see the header).
  forbidden_actions: [connect_resume_connector, connect_restart_task, connect_restart_connector, schema_register, schema_set_compatibility]
  max_tool_calls: 14
