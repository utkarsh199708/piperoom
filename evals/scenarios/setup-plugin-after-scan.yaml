inputs:
  - kind: steer
    from: arjun
    text: "The plugin step reported success and the files are in connect-plugins, but the connector still says it cannot find the Postgres class. The first install worked this way. The worker has been up since 08:55 and the install finished at 09:31. Read what the worker itself logged before you tell me what to run."

expect:
  root_cause:
    # The worker's scan is older than the install, so it does not know the class.
    - [worker, connect]
    - [scan*, rescan*, restart*, start*, before]
  # The wrong stories of a connector that will not load.
  root_cause_forbidden:
    - ['schema change']
    - [schema registry]
    - [permission denied]
    - [disk full]
    - [retention, delet*]
    - [connector, paused]
    - [config, invalid]
    - [version, incompatible]
    - [jars, flat]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_class_not_found
      tool: connect_status
      match: [failed to find any class, postgres connector]
      required: true
    - id: f_worker_log_error
      tool: connect_worker_logs
      match: [failed to start connector, pg-orders-connector]
      required: true
    - id: f_plugins_listed
      tool: connect_plugins
      match: [4 plugins, file stream source connector]
    - id: f_config_correct
      tool: connect_config
      match: [postgres connector, topic.prefix, pg]
    - id: f_slot_inactive
      tool: pg_replication_slots
      match: [debezium orders, active false]
    - id: f_consumer_idle
      tool: kafka_consumer_lag
      match: [total lag 0]
    - id: f_no_ddl
      tool: pg_recent_ddl
      match: [no ddl]
  claims:
    - about: root_cause
      facts: [f_class_not_found, f_worker_log_error]
  evidence_tools: [connect_status, connect_worker_logs]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_register, schema_set_compatibility, pg_drop_replication_slot]
  max_tool_calls: 12
