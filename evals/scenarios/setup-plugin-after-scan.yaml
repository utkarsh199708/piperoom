# C7 setup scenario (U5c): plugin_install put the Debezium Postgres plugin where the worker expects
# it, in its own directory, but the Connect worker was already running and had scanned its plugin
# path before the files existed, so the class is still unknown to it. The evidence is in the
# container's own log, not in the executor's one-line error. The label names the log line class
# (row U5c, Jira KAN-366, step 5). Format: evals/README.md (C6).
#
# RECORDED: NO. Every summary and data payload is the exact output of the real connect_*, dbtools
# and kafkatools code from main, composed by hand from those tools' format strings (the
# U4d/U7d/U9d approach; this session has no Docker). The room-tool log read is connect_worker_logs
# (Q3c), the log tool the eval harness registers: container_logs (U5a) is a setup-room tool that
# is not in evals.LiveTools, so its read is recorded in the runner session only
# (evals/setup/recordings/setup-plugin-after-scan.json, U5a's format over Kafka Connect's
# plugin-scan messages). Clock:
# 2026-10-25T09:40:00Z, scoped like dev/owners.yaml. To re-record it on the dev stack, see
# evals/scenarios/README.md, "Setup scenarios: logs (U5c)".
#
# First failing layer: kafka-connect. Root-cause layer: kafka-connect (a worker that has not
#   rescanned its plugin path). The source, the topic and the consumer are healthy: the slot is
#   inactive because the person deleted the old connector at 09:07 to replace its plugin.
#
# Expected label: log line class scan-before-install. The last "Finished scanning for plugins"
#   line of the connect container (runner session, container_logs) is 08:55:40, the install landed
#   at 09:31 (jar_list: one plugin directory, 12 jars, layout fine) and no "Loading plugin from:
#   /kafka/connect/..." line follows the scan; the 09:34 ERROR line (connect_worker_logs, replayed
#   here) is the consequence, and its "available connectors" list holds the bundled classes only. Fixing op: compose_restart connect (T1) so
#   the worker rescans; plugin_install is not repeated. U5b makes the runner read container_logs
#   or connect_worker_logs before it re-plans after a failed step, so the second plan cites the log.
#   Neither op is replayable as a room action today (runner ops, no room action), so the file
#   proves the consequence from the replayed tools and the log read, and carries the op in this
#   label and in the alert. No expect.fix.
#   Forbidden: connect_restart_task, connect_restart_connector - the worker still has no class, so
#     the connector fails the same way; only a worker restart rescans.
#   Forbidden: connect_resume_connector - the connector is not STOPPED (Validate refuses it).
#   Forbidden: connect_update_connector_config - the config is right; no setting names a rescan.
#   Forbidden: schema_register, schema_set_compatibility - nothing reached the registry.
#   Forbidden: pg_drop_replication_slot - the slot holds the position the connector resumes from.
#
# Traps:
#   - The error text matches setup/flat-plugin-dir ("Failed to find any class ..."), whose fix is
#     plugin_install. Here jar_list is clean and the plugin is installed: repeating plugin_install
#     changes nothing.
#   - The inactive slot with 1.2 MiB retained invites a slot_wal / dead-slot story.
#   - No DDL ran and the schema has one version: a schema-change story fails.
#
# Sources:
#   - Kafka Connect: plugin.path is scanned when the worker starts; a plugin installed afterwards is
#     not loaded until the worker restarts, and a stored connector naming its class fails at load
#     with "Failed to find any class ...".
#   - internal/setup/targets/compose/logs.go: container_logs (T0; 200 lines, newest last);
#     internal/agent/replan.go: the runner's own reads after a failed step (U5b).

name: setup/plugin-after-scan
description: |
  The person upgraded the Debezium Postgres plugin on a running stack with piperoom-setup. They
  deleted the old pg-orders-connector at 09:07, plugin_install put the 3.2 plugin into
  connect-plugins/debezium-connector-postgres at 09:31 (jar_list sees one plugin directory with 12
  jars, layout fine) and the connector was created again at 09:34. It is FAILED with "Failed to
  find any class that implements Connector and which name matches
  io.debezium.connector.postgresql.PostgresConnector"; GET /connector-plugins lists only the
  bundled file connectors and converters. The connect container has been up since 08:55 and its
  log shows the plugin scan finishing at 08:55:40, long before the install, and no later scan.
  The connector's config is correct, its slot debezium_orders is inactive with 1.2 MiB retained,
  order-sync is Stable at lag 0 and analytics.orders is 33 minutes stale. Nothing changed in
  Postgres or the registry.

  Root cause: the worker scanned its plugin path at start, before the plugin was installed, and
  has not rescanned: the files are right, the process does not know them.

  Expected label: log line class scan-before-install (the connect log's last plugin scan is older
  than the install); fixing op compose_restart connect.

