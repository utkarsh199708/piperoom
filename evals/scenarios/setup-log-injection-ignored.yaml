      2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
        from: pg:public.orders
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=36m ago
        from: connect:pg-orders-connector
      4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
        from: topic:pg.public.orders
      5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=36m ts_column=updated_at
        from: group:order-sync (unconfirmed)
    data:
      edges:
        - from: pg:public.orders
          to: connect:pg-orders-connector
        - from: connect:pg-orders-connector
          to: topic:pg.public.orders
        - from: topic:pg.public.orders
          to: group:order-sync
        - from: group:order-sync
          mapping: inferred
          to: wh:analytics.orders
      nodes:
        - facts:
            slot: missing
          health: unknown
          id: pg:public.orders
          kind: source_table
          layer: postgres
          name: public.orders
          owner: priya
        - facts:
            tasks_failed: "1"
          health: fail
          id: connect:pg-orders-connector
          kind: connector
          layer: kafka-connect
          name: pg-orders-connector
          owner: arjun
        - facts:
            newest_record: 36m ago
          health: ok
          id: topic:pg.public.orders
          kind: topic
          layer: kafka
          name: pg.public.orders
          owner: arjun
        - facts:
            lag: "0"
            state: Stable
          health: ok
          id: group:order-sync
          kind: consumer_group
          layer: consumer
          name: order-sync
          owner: kabir
        - facts:
            stale_for: 36m
            ts_column: updated_at
          health: fail
          id: wh:analytics.orders
          kind: sink_table
          layer: warehouse
          name: analytics.orders
          owner: meera
      pipeline_id: orders
  - tool: source_role_grants
    input: {pipeline_id: orders}
    summary: |-
      connector pg-orders-connector role devctl_setup_grant: exists=yes login=yes replication=no
      selectable tables: 0 of 1
      public.orders: selectable=no
    data:
