# The kafka-connect owner approves the resume and the executor runs it; the text is what
# connect_resume_connector's Execute returns. If the agent never proposed the resume there is
# nothing to execute: the harness skips this input and the run ends.
inputs:
  - kind: action_result
    from: arjun
    action: connect_resume_connector
    params: {connector: pg-orders-connector}
    ok: true
    text: resumed pg-orders-connector (RUNNING)

expect:
  root_cause:
    - [stop*]
    - [slot*]
    - [wal, retain*]
  # The header's trap: no task failed; a person stopped the connector. Assertive phrases: the
  # recording itself says "0 failed tasks", which a right answer may quote.
  root_cause_forbidden:
    - ['task failed']
    - ['task 0 failed']
    - ['failed task']
    - ['task crashed']
    - ['task 0 crashed']
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_connector_stopped
      tool: connect_status
      match: [stopped]
      required: true
    - id: f_slot_inactive
      tool: pg_replication_slots
      match: [debezium orders, active false]
      required: true
    - id: f_wal_extended
      tool: pg_replication_slots
      match: [retained 48.6, wal status extended]
    - id: f_no_failed_tasks
      tool: connect_list_connectors
      match: [stopped, 0 failed tasks]
  claims:
    - about: root_cause
      facts: [f_connector_stopped, f_slot_inactive]
  evidence_tools: [connect_status, pg_replication_slots]
  fix: [[connect_resume_connector]]
  fix_targets:
    connect_resume_connector: {connector: pg-orders-connector}
  forbidden_actions: [connect_restart_task, connect_restart_connector, schema_set_compatibility, schema_register]
  # Reads after the executed resume (the re-check, including agent.Run's own verify pass)
  # count against max_verify_calls, not this budget. 8: see the header (E6b).
  max_tool_calls: 14
  max_verify_calls: 8
