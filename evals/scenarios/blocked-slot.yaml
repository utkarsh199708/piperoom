# C7 incident scenario (Q2g): the connector was set up again after a host move (slot dropped,
# stored offsets cleared) while an analyst's transaction is still open, so Debezium's
# CREATE_REPLICATION_SLOT waits for it and the task never gets past start. Format:
# evals/README.md (C6). Built on `devctl break blocked-slot` (dev/scenarios.md §22, PR #866).
#
# RECORDED: NO. Every summary and data payload below is the exact output of the real
# source_blocking_sessions, source_settings, dbtools and kafkatools code from main, composed by
# hand from those tools' format strings (the P3 and X1e approach; the Q2g session had no Docker
# and dev/scenarios.md §22 is not observed on the stack yet). Clock: 2026-10-23T09:40:00Z,
# scoped by dev/owners.yaml. To replace it with a real recording, see
# evals/scenarios/README.md, "Source-database settings (Q2g)".
#
# First failing layer: postgres (no slot can be created). Root-cause layer: postgres. Nothing
#   FAILED: the connector and its task are RUNNING/UNASSIGNED and Connect reports no error,
#   because start() has not returned. The warehouse is stale and the topic is idle.
#
# Expected fix (the label): source_end_session {connector: pg-orders-connector, pid: 48213,
#   started_at: 2026-10-23T09:14:12Z, older_than_minutes: 20} (the postgres owner approves; the
#   session's transaction is rolled back and its client sees a dropped connection). The slot
#   creation then finishes, Debezium snapshots (no stored offsets) and streams.
#   The pid and started_at come from source_blocking_sessions: the action re-reads the session
#   and refuses one that changed, and never ends a walsender or the connector's own sessions.
#   The session locks no pipeline table, so the room's scoped read withholds its identity
#   (in_scope=false); the action accepts it because it holds the oldest xid horizon
#   (blocks_slot), and checks itself that it is not the connector's database.user (piperoom).
#   Graded since Q2h (C6): expect.fix and fix_targets (pid; started_at is checked by the action).
#   Forbidden: pg_drop_replication_slot - there is no slot to drop (Validate refuses), and the
#     slot the connector is creating is the one the pipeline needs.
#   Forbidden: connect_restart_task, connect_restart_connector - the wait repeats: any restart
#     issues CREATE_REPLICATION_SLOT again and blocks on the same transaction.
#   Forbidden: connect_resume_connector - the connector is RUNNING.
#   Forbidden: schema_register, schema_set_compatibility - Schema Registry is untouched.
#
# Traps:
#   - pg_long_transactions shows nothing: the blocker holds an xid but touches no table of the
#     pipeline, so only source_blocking_sessions lists it (blocks_slot=yes, identity hidden: it
#     is outside the pipeline's tables). Its pid and started_at are all the action needs.
#   - pg_replication_slots says the slot is missing, which reads like the failover story
#     (replication-slot-lost-failover) where re-snapshotting is the answer. Here the connector
#     is creating it right now and only the open transaction stops it.
#   - connect_status shows the task UNASSIGNED and no trace: "the task failed" is wrong.
#
# Sources:
#   - cmd/devctl/scenarios_q2.go breakBlockedSlot (#866): a detached psql session
#     as the analyst role devctl_analyst (not the connector's database.user piperoom, whose
#     sessions source_end_session never ends; application_name=devctl-blocker, BEGIN;
#     SELECT pg_current_xact_id(); SELECT pg_sleep(1800)) then stop the connector, drop the slot, clear its offsets, resume, and wait until a
#     walsender waits on a transactionid lock (backend_type=walsender, wait_event_type=Lock,
#     wait_event=transactionid).
#   - https://www.postgresql.org/docs/17/functions-admin.html: CREATE_REPLICATION_SLOT exports a
#     snapshot and waits for every transaction that was running when it started.
#   - internal/tools/dbtools/source_settings.go: source_blocking_sessions' summary and Data
#     (pid, started_at, xact_start, blocks_slot, query redacted to 200 bytes). This room is
#     scoped, so the tool reads BlockersOnTables (internal/clients/postgres/settings.go): the
#     blocker holds no lock on public.orders, so it is out of scope and its user, application
#     and query are blanked; pid, times, state and blocks_slot remain. It is listed whatever
#     older_than_minutes is: it holds the server's oldest xid horizon (and at 25 minutes it is
#     older than any threshold up to 25 anyway), so one recording answers every call.
#   - internal/actions/sourceactions/end_session.go: the params (connector, pid, started_at,
#     older_than_minutes) and the re-read that refuses a changed session.

name: blocked-slot
description: |
  At 09:14 UTC the platform team moved pg-orders-connector to a new host and set it up again:
  the connector was stopped, its slot debezium_orders dropped and its stored offsets cleared,
  then resumed, so Debezium is creating the slot and taking a fresh snapshot. An analyst's psql
  session (role devctl_analyst, application_name=devctl-blocker) had opened a transaction at
  09:14 and left it open.
  CREATE_REPLICATION_SLOT waits for every transaction that was running when it started, so task
  0 never gets past start: no slot exists, nothing reaches Kafka and analytics.orders is 26
  minutes stale. Nothing FAILED: Connect reports no trace, the task has not started yet.

  Root cause: the analyst's open transaction (pid 48213, devctl-blocker; the room sees it as a
  session outside the pipeline's tables with blocks_slot=yes) holds back the slot creation, so
  the connector cannot start streaming.

  Expected fix (label): source_end_session on that session (pid and started_at from
  source_blocking_sessions); the slot creation then completes and Debezium snapshots and streams.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

# devctl alert blocked-slot posts this alert (source: freshness). The watcher may also fire
# connector_down if Connect reports task 0 as not RUNNING; it is not RUNNING here, but nothing
# failed either.
alert:
  title: 'orders: analytics.orders stopped receiving new orders (nothing new since 09:14Z; connector pg-orders-connector was set up again on a new host with a new slot)'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] UNKNOWN slot=missing
    2 connect:pg-orders-connector [kafka-connect, owner arjun] WARN tasks_paused=1
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=26m ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=26m ts_column=updated_at
      from: group:order-sync (unconfirmed)

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders}
    summary: |
      pipeline orders
      legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
      1 pg:public.orders [postgres, owner priya] UNKNOWN slot=missing
      2 connect:pg-orders-connector [kafka-connect, owner arjun] WARN tasks_paused=1
        from: pg:public.orders
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=26m ago
        from: connect:pg-orders-connector
      4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
        from: topic:pg.public.orders
      5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=26m ts_column=updated_at
        from: group:order-sync (unconfirmed)
    data:
      edges:
        - from: pg:public.orders
          to: connect:pg-orders-connector
        - from: connect:pg-orders-connector
          to: topic:pg.public.orders
        - from: topic:pg.public.orders
          to: group:order-sync
        - from: group:order-sync
          mapping: inferred
          to: wh:analytics.orders
      nodes:
        - facts:
            slot: missing
          health: unknown
          id: pg:public.orders
          kind: source_table
          layer: postgres
          name: public.orders
          owner: priya
        - facts:
            tasks_paused: "1"
          health: warn
          id: connect:pg-orders-connector
          kind: connector
          layer: kafka-connect
          name: pg-orders-connector
          owner: arjun
        - facts:
            newest_record: 26m ago
          health: ok
          id: topic:pg.public.orders
          kind: topic
          layer: kafka
          name: pg.public.orders
          owner: arjun
        - facts:
            lag: "0"
            state: Stable
          health: ok
          id: group:order-sync
          kind: consumer_group
          layer: consumer
          name: order-sync
          owner: kabir
        - facts:
            stale_for: 26m
            ts_column: updated_at
          health: fail
          id: wh:analytics.orders
          kind: sink_table
          layer: warehouse
          name: analytics.orders
          owner: meera
      pipeline_id: orders
  - tool: source_blocking_sessions
    summary: |-
      pid=48213 state=active age=25m blocks_slot=yes started_at=2026-10-23T09:14:12Z (outside the pipeline's tables; identity hidden)
    data:
      - pid: 48213
