inputs:
  - kind: steer
    from: priya
    text: "I own the database. The re-setup was planned; the new slot is not appearing. Tell me what is holding it and propose ending it - the analyst's session is expendable."

expect:
  root_cause:
    # The blocker is an open transaction; a bare "session" or "query" names
    # any slot story ("the connector's session could not create the slot").
    - [transaction, blocker, blocking session, idle session, xid, open transaction, idle in transaction, '48213']
    - [slot, replication slot]
    - [wait*, block*, hold*, creat*]
  # The wrong stories of a stale warehouse with a RUNNING connector, and the
  # wrong blockers: the consumer and a full slot table.
  root_cause_forbidden:
    - [order sync, block*]
    - [order sync, hold*]
    - [restart*, consumer]
    - ['max replication slots']
    - [slot*, exhaust*]
    - ['task failed']
    - ['connector failed']
    - ['schema change']
    - ['slot was lost']
    - ['slot is lost']
    - ['slot is gone']
    - ['lost the slot']
    - ['consumer lag']
    - ['network']
  first_failing_layer: postgres
  root_cause_layer: postgres
  expected_facts:
    - id: f_blocker
      tool: source_blocking_sessions
      match: [pid 48213, blocks slot yes, identity hidden]
      required: true
    - id: f_no_slot
      tool: pg_replication_slots
      match: [debezium orders, not found]
      required: true
    - id: f_task_not_failed
      tool: connect_status
      match: [task 0, unassigned]
    - id: f_no_long_transactions
      tool: pg_long_transactions
      match: [no long transactions]
  claims:
    - about: root_cause
      facts: [f_blocker, f_no_slot]
  evidence_tools: [source_blocking_sessions]
  fix: [[source_end_session]]
  fix_targets:
    source_end_session: {connector: pg-orders-connector, pid: 48213}
  forbidden_actions: [pg_drop_replication_slot, connect_restart_task, connect_restart_connector, connect_resume_connector, schema_register, schema_set_compatibility]
  max_tool_calls: 12
