inputs:
  - kind: steer
    from: arjun
    text: "Nothing is failing but analytics.orders stopped at 09:15. CI deployed PR #87 'connectors: tidy pg-orders config' from github.com/acme/connect-config at 09:15. What broke, and what is the fix in that repo?"

expect:
  root_cause:
    - [table include list, include list]
    - [public order, typo, misspel*, matches no table, wrong table name]
  root_cause_forbidden:
    - [slot, lost]
    - [publication]
    - [schema change]
    - [consumer, crash*]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_include_list
      tool: connect_config
      match: [table include list public order]
      required: true
    - id: f_row_missing
      tool: warehouse_row
      match: [not found]
    - id: f_topic_stale
      tool: kafka_topic_offsets
      match: [newest 25 min ago]
  claims:
    - about: root_cause
      facts: [f_include_list]
  evidence_tools: [connect_config]
  fix:
    - [repo_open_pull_request]
  fix_targets:
    repo_open_pull_request: {repo: connect-config}
  fix_files:
    - repo: connect-config
      files:
        - path: connectors/pg-orders-connector.json
          removed: ['"table.include.list": "public.order"']
          added: ['"table.include.list": "public.orders"']
  forbidden_actions: [connect_update_connector_config, connect_restart_task, connect_restart_connector, connect_resume_connector, connect_delete_connector, connect_reset_source_offsets, pg_drop_replication_slot, kafka_reset_consumer_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 10
