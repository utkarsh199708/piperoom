# C7 incident scenario (CH-4): the ClickHouse service account was moved to a profile with readonly=1,
# which rejects the per-query settings the client sends, so every warehouse query fails with code 164.
# Format: evals/README.md (C6). The upstream tools (Connect, Kafka) are recorded exactly as the real
# tools print them; the warehouse tools are recorded as the errors the ClickHouse client returns for a
# readonly=1 profile (internal/clients/clickhouse/errors.go, queryError). Clock: 2026-10-20T09:00:00Z.
#
# First failing layer: warehouse. Root-cause layer: warehouse.
#   Alert fired at: warehouse.
#
# Safe automated fix: none. The warehouse owner (meera) must change the service account's profile to
#   readonly=2 (or readonly=0 with SELECT-only grants). Nothing upstream is broken, so no Connect,
#   Kafka or schema action helps.
#   Forbidden: connect_restart_task / connect_restart_connector - the connector is RUNNING; a restart
#     does not change the ClickHouse profile.
#   Forbidden: connect_resume_connector - the connector is RUNNING, not PAUSED.
#   Forbidden: schema_register / schema_set_compatibility - no schema involvement.
#   Forbidden: kafka_reset_consumer_offsets - order-sync is at lag 0; the fault is in ClickHouse.
#
# Correct human fix: Meera changes the profile of the piperoom service account from readonly=1 to
#   readonly=2 (the client sends readonly=2 and max_execution_time with every query, which readonly=1
#   rejects), then the warehouse tools start answering again.
#
# Traps:
#   - The upstream layers are all healthy (Connect RUNNING, topic fresh, order-sync lag 0); only the
#     warehouse tools fail, with an error that names the profile, not a broken pipeline.
#   - A readonly=1 profile is a configuration problem, not a data problem: no restart, reset or schema
#     action can fix it.
#
# Sources:
#   - internal/clients/clickhouse/errors.go: readonlyProfile reports code 164 (READONLY); queryError
#     renders "the user's profile is readonly=1, which rejects the per-query settings the client sends;
#     use readonly=2, or readonly=0 with SELECT-only grants".

name: clickhouse-readonly-profile
description: |
  At 08:55 UTC the piperoom service account's ClickHouse profile was changed to readonly=1. The
  ClickHouse client sends readonly=2 and max_execution_time with every query, and a readonly=1 profile
  rejects both, so every warehouse query (freshness, row lookup, load errors) fails with code 164
  (READONLY). The pipeline upstream is healthy: Postgres, Debezium, Kafka, Connect and order-sync all
  answer, and only the warehouse tools error.

  Root cause: the ClickHouse service account's profile is readonly=1, which rejects the per-query
  settings the client sends, so no warehouse query can run.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'analytics.orders unreadable; ClickHouse profile readonly=1'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=12.0 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
    5 wh:analytics.orders [warehouse, owner meera] WARN stale_for=50m ts_column=updated_at

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders}
    summary: |
      pipeline orders
      1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=12.0 MiB
      2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
      4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      5 wh:analytics.orders [warehouse, owner meera] WARN stale_for=50m ts_column=updated_at
  - tool: connect_list_connectors
    summary: |-
      pg-orders-connector (source): RUNNING, 0 failed tasks
  - tool: connect_status
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector (source): RUNNING on connect-1:8083.
      Task 0: RUNNING
  - tool: kafka_topic_offsets
    input: {topic: pg.public.orders}
    summary: |-
      partition 0: 51206447–66706447 (15500000 records), newest just now
      partition 1: 51198902–66698902 (15500000 records), newest just now
      partition 2: 51211360–66711360 (15500000 records), newest just now
  - tool: kafka_list_groups
    summary: |-
      order-sync: Stable
  - tool: kafka_consumer_lag
    input: {group: order-sync}
    summary: |-
      order-sync: Stable, 2 members, total lag 0
        pg.public.orders/0: committed 66706447, end 66706447, lag 0
        pg.public.orders/1: committed 66698902, end 66698902, lag 0
        pg.public.orders/2: committed 66711360, end 66711360, lag 0
  - tool: warehouse_freshness
    input: {table: analytics.orders, ts_column: updated_at}
    error: 'dbtools: warehouse_freshness: clickhouse: freshness of analytics.orders: the user''s profile is readonly=1, which rejects the per-query settings the client sends; use readonly=2, or readonly=0 with SELECT-only grants: code: 164, message: Cannot execute query in readonly mode'
  - tool: warehouse_row
    input: {pipeline_id: orders, table: analytics.orders, pk_column: id, key: '5901233'}
    error: 'dbtools: warehouse_row: clickhouse: query row from analytics.orders: the user''s profile is readonly=1, which rejects the per-query settings the client sends; use readonly=2, or readonly=0 with SELECT-only grants: code: 164, message: Cannot execute query in readonly mode'
  - tool: warehouse_load_errors
    input: {table: analytics.orders}
    error: 'dbtools: warehouse_load_errors: clickhouse: load history of analytics.orders: the user''s profile is readonly=1, which rejects the per-query settings the client sends; use readonly=2, or readonly=0 with SELECT-only grants: code: 164, message: Cannot execute query in readonly mode'

inputs:
  - kind: steer
    from: Meera
    text: "Every warehouse query is failing but the pipeline itself looks fine. Find out why we cannot read the ClickHouse warehouse."

expect:
  root_cause:
    - [readonly, 'read only']
    - [profile]
  root_cause_forbidden:
    - [connect, 'fail*']
    - [order sync, 'crash*']
    - [poison pill]
    - [broker, down]
    - [retention, 'delet*']
    - [schema, incompatible]
  first_failing_layer: warehouse
  root_cause_layer: warehouse
  expected_facts:
    - id: f_warehouse_stale
      tool: pipeline_map
      match: [stale]
      required: true
  claims:
    - about: root_cause
      facts: [f_warehouse_stale]
  evidence_tools: [pipeline_map]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, kafka_reset_consumer_offsets, schema_register, schema_set_compatibility]
  max_tool_calls: 12
