    1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=1.1 MiB wal_status=reserved
    2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL state=FAILED tasks_failed=0
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=35m ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] OK lag=0 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=35m ts_column=updated_at
      from: group:order-sync (unconfirmed)

