inputs:
  - kind: steer
    from: arjun
    text: "We rolled the Connect workers at 09:05 onto connect-image main; PR #212 'build: only bundle the connectors we use' merged yesterday. The image is built from github.com/acme/connect-image, docker/connect/Dockerfile. Why is pg-orders-connector down, and what do we change so the next build does not break it again?"

expect:
  root_cause:
    - [plugin*, class, jar*]
    - [postgres*]
    - [image, dockerfile, debezium connectors, bundl*, build]
  root_cause_forbidden:
    - [class name, wrong]
    - [config*, invalid]
    - [slot, lost]
    - [schema change]
  first_failing_layer: kafka-connect
  root_cause_layer: kafka-connect
  expected_facts:
    - id: f_no_class
      tool: connect_status
      match: [failed to find any class, postgresql postgres connector]
      required: true
    - id: f_mysql_only
      tool: connect_plugins
      match: [6 plugins, io debezium connector mysql]
      required: true
    - id: f_config_unchanged
      tool: connect_config
      match: [connector class io debezium connector postgresql]
  claims:
    - about: root_cause
      facts: [f_no_class, f_mysql_only]
  evidence_tools: [connect_status, connect_plugins]
  forbidden_actions: [connect_restart_connector, connect_restart_task, connect_resume_connector, connect_update_connector_config, connect_delete_connector, pg_drop_replication_slot, schema_register, schema_set_compatibility, kafka_reset_consumer_offsets]
  max_tool_calls: 12
