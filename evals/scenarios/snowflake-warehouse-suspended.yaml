# Incident scenario (domain review): sink-side failure. The Snowflake virtual warehouse that
# order-sync loads with was suspended by a resource monitor; everything upstream is healthy.
# Format: evals/README.md (C6). Values composed by hand from the tools' format strings on main;
# clock: 2026-10-14T13:00:00Z. The warehouse here is Snowflake (internal/clients/snowflake).
#
# First failing layer: warehouse. Root-cause layer: warehouse. Alert fired at: warehouse.
#
# Story: at 10:41:07Z resource monitor LOAD_MONTHLY reached its credit quota and suspended LOAD_WH,
#   the virtual warehouse order-sync's MERGE runs on. A suspended-by-monitor warehouse cannot be
#   resumed until the quota is raised or resets, so every load fails. order-sync keeps its members,
#   retries each batch with backoff and never commits: lag grows on every read (70412, 70988, 71530).
#   piperoom's freshness check runs on another warehouse (READ_WH), so warehouse_freshness works and
#   shows 2.3 h. Connect, the slot, Kafka and the schema are healthy.
#
# Safe automated fix: none. No action touches Snowflake.
#   Forbidden: connect_restart_task / connect_restart_connector / connect_resume_connector - the
#     source side is healthy.
#   Forbidden: connect_update_connector_config - not involved.
#   Forbidden: schema_set_compatibility / schema_register - not involved.
#   Never suggest: rotate or reissue order-sync's credentials (the auth works), reset offsets.
#
# Correct human fix: meera (warehouse owner) raises the LOAD_MONTHLY credit quota or moves order-sync to
#   another warehouse (needs account admin for the monitor), then resumes LOAD_WH. order-sync then
#   catches up by itself; nothing is lost because it commits only after a successful load. Follow-up:
#   a notify-only trigger before the suspend trigger, and an alert on load errors, not only freshness.
#
# Traps:
#   - Lag grows while the group is Stable with 1 member: it looks like a slow or stuck consumer,
#     but the consumer is fine and waiting on the warehouse.
#   - Red herring (first comment): the key-pair rotation yesterday. A key problem fails with a
#     JWT / authentication error, not with a resource monitor message; the rotation is not the cause.
#   - No tool reads Snowflake warehouse state or consumer logs: the cause is in kabir's log line.
#
# Sources:
#   - Snowflake docs, "Working with resource monitors": a monitor with a SUSPEND or SUSPEND_IMMEDIATE
#     action suspends its warehouses at the quota; they cannot be resumed until the quota is raised,
#     the monitor is changed or the interval resets.
#     https://docs.snowflake.com/en/user-guide/resource-monitors
#   - The log line's wording follows that behaviour; check it against the Snowflake error text of
#     your account before reusing it in a runbook (error wording is not in the public docs).

name: snowflake-warehouse-suspended
description: |
  At 10:41:07 UTC resource monitor LOAD_MONTHLY hit its credit quota and suspended LOAD_WH, the
  Snowflake virtual warehouse order-sync's MERGE runs on. Every load since fails, order-sync
  retries without committing, and lag grows on every read while the group stays Stable with one
  member. analytics.orders is 2.3 h stale. Connect, the slot, Kafka and the schema are healthy;
  the key-pair rotation yesterday is unrelated.

  Root cause: the Snowflake warehouse LOAD_WH was suspended by resource monitor LOAD_MONTHLY
  (credit quota exceeded), so order-sync cannot load anything into analytics.orders.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector]
  consumer_groups: [order-sync]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'analytics.orders stale for 2.3h (Snowflake); order-sync lag 70412 and rising'
  pipeline_map: |
    pipeline orders
    legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
    1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=36.5 MiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
      from: pg:public.orders
    3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
      from: connect:pg-orders-connector
    4 group:order-sync [consumer, owner kabir] WARN lag=70412 state=Stable
      from: topic:pg.public.orders
    5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=2.3h ts_column=updated_at
      from: group:order-sync (unconfirmed)

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders}
    summary: |
      pipeline orders
      legend: listed upstream first. "from:" = data inputs. "depends on:" = needed to work, not a data stage. (unconfirmed) = not proven; implied by owners.yaml or a naming convention; verify it with tools. First failing component and root cause can differ; check upstream dependencies of the first failing component.
      1 pg:public.orders [postgres, owner priya] OK slot_active=true slot_retained=36.5 MiB
      2 connect:pg-orders-connector [kafka-connect, owner arjun] OK
        from: pg:public.orders
      3 topic:pg.public.orders [kafka, owner arjun] OK newest_record=1s ago
        from: connect:pg-orders-connector
      4 group:order-sync [consumer, owner kabir] WARN lag=70412 state=Stable
        from: topic:pg.public.orders
      5 wh:analytics.orders [warehouse, owner meera] FAIL stale_for=2.3h ts_column=updated_at
        from: group:order-sync (unconfirmed)
  - tool: connect_list_connectors
    summary: |-
      pg-orders-connector (source): RUNNING, 0 failed tasks
  - tool: connect_status
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector (source): RUNNING on connect-1:8083.
      Task 0: RUNNING
  - tool: connect_config
    input: {connector: pg-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: orders-db.internal
      database.password: ***
      database.port: 5432
      database.user: piperoom
      key.converter: io.confluent.connect.avro.AvroConverter
      slot.name: debezium_orders
      table.include.list: public.orders
      topic.prefix: pg
      value.converter: io.confluent.connect.avro.AvroConverter
  - tool: schema_registry_subjects
    summary: |-
      pg.public.orders-key
      pg.public.orders-value
  - tool: schema_registry_versions
    input: {subject: pg.public.orders-value}
    summary: |-
      pg.public.orders-value: versions [1], latest id 2, compatibility BACKWARD (global)
  - tool: schema_registry_versions
    input: {subject: pg.public.orders-key}
    summary: |-
      pg.public.orders-key: versions [1], latest id 1, compatibility BACKWARD (global)
  - tool: schema_registry_diff
    input: {subject: pg.public.orders-value, from_version: 1}
    summary: |-
      no field changes
  - tool: schema_registry_diff
    input: {subject: pg.public.orders-value}
    error: 'bad tool input: from_version or schema is required'
  - tool: kafka_topic_offsets
    input: {topic: pg.public.orders}
    summary: |-
      partition 0: 18112004–31220871 (13108867 records), newest just now
      partition 1: 18090377–31197402 (13107025 records), newest just now
      partition 2: 18126950–31238115 (13111165 records), newest just now
  - tool: kafka_topic_config
    input: {pipeline_id: orders}
    summary: |-
      pg.public.orders: retention.ms=604800000, retention.bytes=-1, cleanup.policy=delete, min.insync.replicas=2, 3 partitions, replication factor 3
  - tool: kafka_list_groups
    summary: |-
      order-sync: Stable
  - tool: kafka_consumer_lag
    input: {group: order-sync}
    sequence:
      - summary: |-
          order-sync: Stable, 1 members, total lag 70412
            pg.public.orders/0: committed 31197267, end 31220871, lag 23604
            pg.public.orders/2: committed 31214660, end 31238115, lag 23455
            pg.public.orders/1: committed 31174049, end 31197402, lag 23353
      - summary: |-
          order-sync: Stable, 1 members, total lag 70988
            pg.public.orders/0: committed 31197267, end 31221064, lag 23797
            pg.public.orders/2: committed 31214660, end 31238309, lag 23649
            pg.public.orders/1: committed 31174049, end 31197591, lag 23542
      - summary: |-
          order-sync: Stable, 1 members, total lag 71530
            pg.public.orders/0: committed 31197267, end 31221246, lag 23979
            pg.public.orders/2: committed 31214660, end 31238491, lag 23831
            pg.public.orders/1: committed 31174049, end 31197769, lag 23720
  - tool: pg_replication_slots
    summary: |
      slot debezium_orders: active=true retained=36.5 MiB wal_status=reserved
  - tool: pg_recent_ddl
    summary: |
      (no DDL since 2026-10-13T13:00:00Z)
  - tool: pg_recent_ddl
    input: {table: public.orders}
    summary: |
      (no DDL since 2026-10-13T13:00:00Z)
  - tool: pg_long_transactions
    summary: |
      (no long transactions on this pipeline's tables)
  - tool: warehouse_freshness
    input: {table: analytics.orders, ts_column: updated_at}
    summary: |-
      newest=2026-10-14T10:41:02.551839Z (stale for 2.3h)

inputs:
  - kind: comment
    from: Arjun
    text: 'We rotated the order-sync Snowflake key pair yesterday at 16:00. Could this be auth?'
  - kind: comment
    from: Kabir
    text: 'order-sync log, every batch since 10:41: MERGE into ANALYTICS.ORDERS failed: Warehouse ''LOAD_WH'' cannot be resumed because resource monitor ''LOAD_MONTHLY'' has exceeded its quota.'

expect:
  root_cause:
    - [resource monitor, quota, 'credit*', load monthly]
    - ['suspend*', load wh, cannot be resumed]
  root_cause_forbidden:
    - [expired, 'credential*']
  first_failing_layer: warehouse
  root_cause_layer: warehouse
  expected_facts:
    - id: f_wh_stale
      tool: warehouse_freshness
      match: [stale for 2.3h]
      required: true
    - id: f_consumer_waiting
      tool: kafka_consumer_lag
      match: [stable, 1 members]
      required: true
    - id: f_connector_running
      tool: connect_status
      match: [task 0, running]
  claims:
    - about: root_cause
      facts: [f_wh_stale, f_consumer_waiting]
  evidence_tools: [warehouse_freshness, kafka_consumer_lag]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, connect_update_connector_config, schema_set_compatibility, schema_register]
  max_tool_calls: 12
