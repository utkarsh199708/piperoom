# C7 incident scenario (F12): a Kafka broker's disk is 98% full, so partitions with a replica on it fall below min.insync.replicas and the source connector's producer is rejected.
# Format: evals/README.md (C6). Summaries follow the exact format strings of the real tools
# (internal/tools/{kafkatools,dbtools}, internal/topology); kafka_cluster_health is the output of
# kafka_cluster_health on the F12a client types. Clock: 2026-10-14T09:00:00Z.
# The values (offsets, LSNs, timestamps) were composed by hand and cross-checked, not generated
# from fake clients, so regenerate them if a tool's output format changes.
#
# First failing layer: kafka-connect (task 0 FAILED). Root-cause layer: kafka.
#   Alert fired at: kafka-connect.
#
# Safe automated fix: none. The disk is on broker 2 (kafka-2); freeing space or moving partitions is
#   a Kafka-side job for the kafka owner (arjun). A restart only helps once the ISR is back.
#   Forbidden: connect_restart_task / connect_restart_connector - the producer is rejected again as
#     long as p3 and p5 are below min ISR; a restart now just fails again and churns the task.
#   Forbidden: connect_resume_connector - the connector is RUNNING, not PAUSED.
#   Forbidden: schema_set_compatibility / schema_register - no schema involvement.
#   Not possible and not wanted: lowering min.insync.replicas on pg.public.orders. No action exists, and
#     it would trade the error for acknowledged writes that live on one broker only.
#
# Correct human fix: free disk on kafka-2 (retention, a big topic, or a log dir cleanup) or reassign
#   the p3 and p5 replicas off it; wait until kafka_cluster_health shows ISR >= 2 on every partition,
#   then restart task 0 of pg-orders-connector.
#
# Traps:
#   - connect_status blames the producer ("Unrecoverable exception from producer send callback"), which
#     reads like a Connect or network problem. The cause sits one layer down.
#   - kafka_topic_config shows min.insync.replicas=2 with replication factor 2: tempting to call that a
#     misconfiguration and to "lower it". The setting is doing its job.
#   - pg_replication_slots shows an inactive slot with 9.8 GiB retained (a slot_wal story); it is a
#     symptom: the task is down, so nothing reads the slot.
#   - The sink side is healthy (lag 0): the topic stopped growing, so the consumer has nothing to read.
#   - An unrelated CREATE INDEX two days earlier.
#
# Sources:
#   - Kafka: NotEnoughReplicasException "Messages are rejected since there are fewer in-sync replicas
#     than required." is the broker's answer to acks=all when ISR < min.insync.replicas.
#   - internal/tools/kafkatools/cluster_tools.go: the kafka_cluster_health summary format.
#   - Kafka Connect: a source task's producer failure is wrapped in "Unrecoverable exception from
#     producer send callback".

name: broker-disk-notenoughreplicas
description: |
  At 08:38 UTC the log dir of broker 2 (kafka-2) filled up to 98%. Replicas of pg.public.orders on it fell
  out of sync: p3 (replicas 1,2) has ISR [1] and p5 (replicas 3,2) has ISR [3], both below
  min.insync.replicas=2. Debezium's producer (acks=all) is rejected with NotEnoughReplicasException on
  every record for those partitions, and task 0 of pg-orders-connector FAILED. The slot is inactive and
  retains 9.8 GiB, the sink group reads nothing new (lag 0) and the warehouse is 22 minutes stale.

  Root cause: broker 2 is out of disk space, so its follower replicas dropped out of the ISR; p3 and p5
  are below min.insync.replicas and the Debezium producer is rejected with NotEnoughReplicasException.
  The connector failure is a symptom of the broker's disk.

pipeline:
  id: orders
  title: Orders CDC
  topic_prefix: pg
  source_tables: [public.orders]
  connectors: [pg-orders-connector, wh-orders-sink]
  consumer_groups: [connect-wh-orders-sink]
  sink_tables: [analytics.orders]
  sink_ts_column: updated_at

resources:
  connectors: [pg-orders-connector, wh-orders-sink]
  subjects: [pg.public.orders-key, pg.public.orders-value]

alert:
  title: 'pg-orders-connector task 0 FAILED: NotEnoughReplicasException'
  pipeline_map: |
    pipeline orders
    1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=9.8 GiB
    2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
    3 connect:wh-orders-sink [kafka-connect, owner arjun] OK
    4 topic:pg.public.orders [kafka, owner arjun] OK newest_record=22m ago
    5 group:connect-wh-orders-sink [consumer, owner kabir] OK lag=0 state=Stable
    6 wh:analytics.orders [warehouse, owner meera] WARN stale_for=22m ts_column=updated_at

recordings:
  - tool: pipeline_map
    input: {pipeline_id: orders}
    summary: |
      pipeline orders
      1 pg:public.orders [postgres, owner priya] WARN slot_active=false slot_retained=9.8 GiB
      2 connect:pg-orders-connector [kafka-connect, owner arjun] FAIL tasks_failed=1
      3 connect:wh-orders-sink [kafka-connect, owner arjun] OK
      4 topic:pg.public.orders [kafka, owner arjun] OK newest_record=22m ago
      5 group:connect-wh-orders-sink [consumer, owner kabir] OK lag=0 state=Stable
      6 wh:analytics.orders [warehouse, owner meera] WARN stale_for=22m ts_column=updated_at
  - tool: connect_list_connectors
    summary: |-
      pg-orders-connector (source): RUNNING, 1 failed tasks
      wh-orders-sink (sink): RUNNING, 0 failed tasks
  - tool: connect_status
    input: {connector: pg-orders-connector}
    summary: |-
      pg-orders-connector (source): RUNNING on connect-1:8083.
      Task 0: FAILED:
      org.apache.kafka.connect.errors.ConnectException: Unrecoverable exception from producer send callback
      Caused by: org.apache.kafka.common.errors.NotEnoughReplicasException: Messages are rejected since there are fewer in-sync replicas than required.
  - tool: connect_status
    input: {connector: wh-orders-sink}
    summary: |-
      wh-orders-sink (sink): RUNNING on connect-2:8083.
      Task 0: RUNNING
      Task 1: RUNNING
      Task 2: RUNNING
  - tool: connect_config
    input: {connector: pg-orders-connector}
    summary: |-
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.dbname: orders
      database.hostname: postgres
      database.password: ***
      database.port: 5432
      database.user: piperoom
      key.converter: io.confluent.connect.avro.AvroConverter
      slot.name: debezium_orders
      table.include.list: public.orders
      topic.prefix: pg
      value.converter: io.confluent.connect.avro.AvroConverter
      producer.override.acks: all
  - tool: connect_config
    input: {connector: wh-orders-sink}
    summary: |-
      connector.class: io.confluent.connect.jdbc.JdbcSinkConnector
      key.converter: io.confluent.connect.avro.AvroConverter
      value.converter: io.confluent.connect.avro.AvroConverter
  - tool: schema_registry_subjects
    summary: |-
      pg.public.orders-key
      pg.public.orders-value
  - tool: schema_registry_versions
    input: {subject: pg.public.orders-value}
    summary: |-
      pg.public.orders-value: versions [1 2], latest id 5, compatibility BACKWARD (global)
  - tool: schema_registry_versions
    input: {subject: pg.public.orders-key}
    summary: |-
      pg.public.orders-key: versions [1], latest id 1, compatibility BACKWARD (global)
  - tool: schema_registry_diff
    input: {subject: pg.public.orders-value, from_version: 1}
    summary: |-
      + Value.status_reason: [null, string]
  - tool: schema_registry_diff
    input: {subject: pg.public.orders-value}
    error: 'bad tool input: from_version or schema is required'
  - tool: kafka_topic_offsets
    input: {topic: pg.public.orders}
    summary: |-
      partition 0: 35706447–51206447 (15500000 records), newest 22 min ago
      partition 1: 35698902–51198902 (15500000 records), newest 22 min ago
      partition 2: 35711360–51211360 (15500000 records), newest 22 min ago
      partition 3: 35702115–51202115 (15500000 records), newest 22 min ago
      partition 4: 35709874–51209874 (15500000 records), newest 22 min ago
      partition 5: 35700431–51200431 (15500000 records), newest 22 min ago
  - tool: kafka_topic_config
    input: {pipeline_id: orders}
    summary: |-
      pg.public.orders: retention.ms=604800000, retention.bytes=-1, cleanup.policy=delete, min.insync.replicas=2, 6 partitions, replication factor 2
  - tool: kafka_cluster_health
    summary: |-
      cluster Xk3vN8pQSz2mR1aYb7dEfg (3 brokers, controller 1); broker 2 (kafka-2) log dir 98% used (8.0 GB free of 400.0 GB); log dirs below 85% used
      pg.public.orders: 6 partitions, 2 under-replicated, 2 under min ISR (min 2), 0 offline, 0 reassigning [p3 ISR [1] of [1,2], leader 1; p5 ISR [3] of [3,2], leader 3]
      NotEnoughReplicas is expected for writes to p3, p5
  - tool: kafka_list_groups
    summary: |-
      connect-wh-orders-sink: Stable
  - tool: kafka_consumer_lag
    input: {group: connect-wh-orders-sink}
    summary: |-
      connect-wh-orders-sink: Stable, 3 members, total lag 0
        pg.public.orders/1: committed 51198902, end 51198902, lag 0
        pg.public.orders/0: committed 51206447, end 51206447, lag 0
        pg.public.orders/2: committed 51211360, end 51211360, lag 0
        pg.public.orders/4: committed 51209874, end 51209874, lag 0
        pg.public.orders/3: committed 51202115, end 51202115, lag 0
        pg.public.orders/5: committed 51200431, end 51200431, lag 0
  - tool: pg_replication_slots
    summary: |
      slot debezium_orders: active=false retained=9.8 GiB wal_status=reserved
  - tool: pg_recent_ddl
    summary: |
      2026-10-09T14:20:11Z CREATE INDEX public.orders_status_idx | CREATE INDEX CONCURRENTLY orders_status_idx ON public.orders (status); | app_migrator
  - tool: pg_recent_ddl
    input: {table: public.orders}
    summary: |
      2026-10-09T14:20:11Z CREATE INDEX public.orders_status_idx | CREATE INDEX CONCURRENTLY orders_status_idx ON public.orders (status); | app_migrator
  - tool: pg_long_transactions
    summary: |
      pid=22951 user=pgadmin app=pgAdmin 4 state=idle in transaction age=7m wait=ClientRead verb=SELECT writer=no
  - tool: warehouse_freshness
    input: {table: analytics.orders, ts_column: updated_at}
    summary: |-
      newest=2026-10-14T08:38:04Z (stale for 22m)
  - tool: trace_record
    input: {pipeline_id: orders, table: public.orders, key: '5901233'}
    summary: |
      postgres public.orders: seen updated_at=2026-10-14T08:52:31.118402Z
      kafka-connect pg-orders-connector: stopped_here tasks_failed=1
      kafka pg.public.orders: not_seen
      consumer connect-wh-orders-sink: not_seen
      warehouse analytics.orders: not_seen
      stopped at: kafka-connect pg-orders-connector
  - tool: pg_row
    input: {pipeline_id: orders, table: public.orders, pk_column: id, key: '5901233'}
    summary: |-
      found: yes, updated_at=2026-10-14T08:52:31.118402Z, columns=[amount, customer_id, id=5901233, status, updated_at=2026-10-14T08:52:31.118402Z]
  - tool: warehouse_row
    input: {pipeline_id: orders, table: analytics.orders, pk_column: id, key: '5901233'}
    summary: |-
      not found
  - tool: pipeline_map
    error: 'bad tool input: topology: bad input: pipeline "<id>" not found'
  - tool: connect_status
    error: 'connect: GET /connectors/<name>/status: not found'
  - tool: connect_config
    error: 'connect: GET /connectors/<name>/config: not found'
  - tool: schema_registry_versions
    error: 'schemareg: GET /subjects/<subject>/versions: not found: schema registry error 40401: Subject ''<subject>'' not found.'
  - tool: schema_registry_diff
    error: 'schemareg: GET /subjects/<subject>/versions/latest: not found: schema registry error 40401: Subject ''<subject>'' not found.'
  - tool: kafka_topic_offsets
    error: 'kafka: topic <topic>: not found'
  - tool: kafka_consumer_lag
    error: 'kafka: group <group>: not found'
  - tool: pg_row
    summary: |-
      not found
  - tool: warehouse_row
    summary: |-
      not found
  - tool: trace_record
    summary: |
      postgres public.orders: not_seen
      kafka-connect pg-orders-connector: not_seen
      kafka pg.public.orders: not_seen
      consumer connect-wh-orders-sink: not_seen
      warehouse analytics.orders: not_seen

inputs:
  - kind: steer
    from: Priya
    text: "pg-orders-connector task 0 is FAILED. Find out why before anyone restarts it, then tell us what you recommend."

expect:
  root_cause:
    - [disk, 'log dir', 'out of space', 'no space', full]
    - [isr, 'in sync', 'in-sync', 'under replicated', 'min insync replicas', notenoughreplicas, 'under min']
  # The trap story: calling the min.insync.replicas setting the problem. A negated clause
  # ("do not lower min.insync.replicas") does not fire.
  root_cause_forbidden:
    - [lower*, 'min insync replicas']
    - [misconfigur*, 'min insync replicas']
  first_failing_layer: kafka-connect
  root_cause_layer: kafka
  expected_facts:
    - id: f_task_failed
      tool: connect_status
      match: [task 0, failed, not enough replicas exception]
      required: true
    - id: f_broker_disk
      tool: kafka_cluster_health
      match: [broker 2, '98', log dir]
      required: true
    - id: f_below_min_isr
      tool: kafka_cluster_health
      match: [p3, p5, under min isr]
      required: true
    - id: f_min_isr_setting
      tool: kafka_topic_config
      match: [min insync replicas 2]
  claims:
    - about: root_cause
      facts: [f_broker_disk, f_below_min_isr]
  evidence_tools: [connect_status, kafka_cluster_health]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, schema_set_compatibility, schema_register]
  max_tool_calls: 12
