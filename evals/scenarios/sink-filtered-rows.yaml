        name: public.orders
        status: not_seen
      - layer: kafka-connect
        name: pg-orders-connector
        status: not_seen
      - layer: kafka
        name: pg.public.orders
        status: not_seen
      - layer: consumer
        name: order-sync
        status: not_seen
      - layer: warehouse
        name: analytics.orders
        status: not_seen
  - tool: similar_incidents
