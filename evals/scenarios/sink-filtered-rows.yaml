  # dlq_peek refuses a topic the pipeline does not declare in watch.dlq_topics (tools.Scope.CheckDLQTopic).
  - tool: dlq_peek
    input: {topic: pg.public.orders.dlq}
    error: 'out of scope: DLQ topic "pg.public.orders.dlq" is not part of this room''s pipeline "orders" (none declared (use connector for a sink''s DLQ))'
  - tool: warehouse_load_errors
    input: {table: analytics.orders}
    summary: |-
      postgres warehouse has no load history. analytics.orders: 6218804 rows inserted since stats reset, 2411 dead tuples, last autovacuum 2026-10-21T08:44:09Z, 0 session(s) waiting on a lock

inputs:
  - kind: comment
    from: kabir
    text: "order-sync 2.16.0 went out at 08:29Z. It logs no errors and its lag is 0. The 08:31 backfill import wrote 40 orders with status 'backfill'."
  - kind: steer
    text: "What is keeping these orders out of analytics.orders, and what gets them in?"

expect:
  root_cause:
    - [order-sync, consumer, 2.16.0, release, build, deploy*]
    - [skip*, filter*, drop*, discard*, ignor*, exclud*]
  # Wrong stories, and the "nothing is wrong" reading of a green pipeline. Assertive phrases only.
  root_cause_forbidden:
    - ['pipeline is healthy']
    - ['pipeline healthy']
    - ['false positive']
    - ['false alarm']
    - ['nothing is wrong']
    - ['working as expected']
    - ['connector side']
    - ['slot was lost']
    - [retention, delet*]
    - ['poison pill']
    - [rebalanc*]
    - [schema registry, reject*]
  first_failing_layer: consumer
  root_cause_layer: consumer
  evidence_tools: [reconcile]
  expected_facts:
    - id: f_lag_zero
      tool: kafka_consumer_lag
      match: [stable, total lag 0]
      required: true
    - id: f_sink_missing
      tool: reconcile
      match: [sink is missing 40 rows]
      required: true
    - id: f_keys_missing
      tool: reconcile
      match: [missing 40]
    - id: f_trace_committed
      tool: trace_record
      match: [consumer order sync seen committed, stopped at warehouse]
  claims:
    - about: root_cause
      facts: [f_sink_missing, f_trace_committed]
  forbidden_actions: [connect_restart_task, connect_restart_connector, connect_resume_connector, schema_register, schema_set_compatibility, connect_update_connector_config]
  max_tool_calls: 14
