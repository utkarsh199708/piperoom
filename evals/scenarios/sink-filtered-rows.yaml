# C7 incident scenario (X1e): a consumer release filters out a class of orders without loading
# them and commits past them. Nothing fails: Connect RUNNING, slot active, order-sync Stable with
# lag 0, the warehouse fresh. Only the source-versus-sink count shows it. Format: evals/README.md
# (C6). Built on `devctl break sink-filtered-rows` (X1g, dev/scenarios.md §14).
#
# RECORDED: NO (synthesised from the code paths). Every summary and data payload below is the
# exact output of the real kafkatools, dbtools and topology code at c71c4477, run by a throwaway
# generator (not committed) over fake clients holding the state the break leaves on the dev stack
# while `devctl load --rate 1` runs (see "Why load" below), scoped like dev/owners.yaml. Clock:
# 2026-10-21T09:40:00Z. Nothing was read from a running stack; it must be re-recorded there
# (evals/scenarios/README.md, "Silent-corruption scenarios (X1e)"). The reconcile answers were run
# on the fixed clock with an explicit window (no relabelling); the second is the same tool over
# 08:30-08:40, served as a sequence so a narrowed second call gets the key diff.
#
# How the room opens: the drift watcher (X1b). The alert title is the exact title the real
# internal/watch code wrote when the generator ran it over the same state (checks at 09:25:00,
# hold, and 09:40:00, breach; count_drift needs two failing checks in a row). The room's
# evidence would carry: count_drift sev2, table public.orders, window 08:00-09:00Z, source 2689,
# sink 2649, missing 40. It opens with `alert` here, not `start: watcher`: the eval watcher
# (evals/watcher_start.go, C6) reads Connect and slots only and accepts connector_down,
# slot_inactive and slot_wal; it cannot see a drift signal yet.
#
# Why load: on an idle dev stack the watcher never fires on this break. count_drift and
# row_drift shift their windows back by the sink's lag, measured from the sink's newest
# updated_at; the break's marker order is that newest row, so every window ends before the 40
# skipped rows (generator probe: no room from 09:22 to 12:40). With 1 change/s the lag is ~0 and
# the hour 08:00-09:00 holds 2689 rows: 40 missing is 1.5%, over the 0.5% tolerance.
#
# First failing layer: consumer. Root-cause layer: consumer (the 08:29Z order-sync release).
#
# Expected fix: none automated. A human rolls order-sync back to a build without the filter,
#   then replays the topic from before 08:31Z (the load is an upsert by id; `devctl fix
#   sink-filtered-rows` does that). kafka_reset_consumer_offsets needs the group Empty, and a
#   replay while the filtering build runs drops the rows again.
#   Forbidden: connect_restart_task, connect_restart_connector, connect_resume_connector - Connect
#     is RUNNING and the topic holds every event.
#   Forbidden: schema_register, schema_set_compatibility, connect_update_connector_config - no
#     schema or connector config is involved.
#
# Traps:
#   - Every health signal is green: lag 0, Stable, warehouse in sync (lag 0s), no DDL, no
#     duplicates, no TOAST risk.
#   - reconcile says the side is unproven (the topic carried 641 events for 497 rows: updates
#     too); only a missing key traced through the topic and the committed offset (trace_record,
#     kafka_find_by_key) puts the loss after Kafka.
#   - The status 'backfill' is in no tool output (row tools never show values); it arrives in
#     the consumer owner's comment.
#
# Sources:
#   - cmd/devctl/scenarios_silent.go breakSinkFilteredRows: DEVCONSUMER_SKIP_WHERE=status=backfill,
#     40 orders (customer g, amount 900+g) in one INSERT, then the marker order (77, 4200).
#   - cmd/devctl/status.go load: 1/3 updates of a random 'placed' order, 2/3 inserts.
#   - internal/watch/drift.go countVerdict: the title and evidence.

name: sink-filtered-rows
description: |
  `devctl load --rate 1` writes orders all morning. At 08:29:40 UTC order-sync 2.16.0 went out
  with a new filter that drops every order in status 'backfill' without loading it and still
  commits its offset. At 08:31:12 a backfill import wrote 40 such orders; they are in
  public.orders and in pg.public.orders, were consumed and committed, and are not in
  analytics.orders. Lag is 0, the warehouse is fresh, Connect and the slot are healthy. The drift
  watcher's count_drift opened the room at 09:40: source 2689 rows, sink 2649 in 08:00-09:00.

  Root cause: the order-sync 2.16.0 release filters out (skips) the backfill orders and commits
  past them, so they never reach the warehouse.

  Expected fix: none automated; roll order-sync back to a build without the filter, then replay
  pg.public.orders from before 08:31Z.

