name: Fuzz

# Not on push to main: every merge already ran Fuzz on its PR, and a push-to-main
# run is never cancelled, so six merges in an hour queued six full fuzz fan-outs
# against the free plan's 20 concurrent jobs. The nightly run still fuzzes main.
on:
  pull_request:
  schedule:
    - cron: "50 3 * * *"   # nightly, 03:50 UTC
  # Manual runs (e.g. re-running a single target after a crasher is fixed).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Discover every fuzz target without hard-coding names, so a new Fuzz*
  # function anywhere in the repo is fuzzed on the next run.
  discover:
    name: Discover fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Discover fuzz targets
        id: discover
        env:
          FUZZ_SHARDS: "3"
        run: |
          set -euo pipefail

          # One `go test -list` over every package (a build error fails the
          # step instead of silently dropping that package's targets). Each
          # package prints its Fuzz* names, then an `ok <pkg> ...` line, so the
          # awk below pairs names with the package that follows them.
          list="$(go test -list '^Fuzz' ./...)"
          matrix="$(printf '%s\n' "$list" | awk '
            /^Fuzz/ { names[n++] = $1; next }
            /^ok[ \t]/ { for (i = 0; i < n; i++) printf "{\"pkg\":\"%s\",\"fuzz\":\"%s\"}\n", $2, names[i]; n = 0; next }
            { n = 0 }
          ' | jq -sc '.')"

          if [ "$(echo "$matrix" | jq 'length')" = "0" ]; then
            echo "::error::no Fuzz* targets discovered; the discovery step is broken"
            exit 1
          fi
          echo "Discovered fuzz targets:"
          echo "$matrix" | jq -r '.[] | "  \(.pkg) -> \(.fuzz)"'
          # Targets are dealt round-robin into FUZZ_SHARDS jobs: each job pays
          # checkout + Go setup + build once and fuzzes its targets in turn,
          # instead of one job (one slot, one build) per target.
          shards="$(echo "$matrix" | jq -c --argjson n "$FUZZ_SHARDS" '
            [ range(0; ([length, $n] | min)) as $s
              | {shard: $s, targets: [to_entries[] | select(.key % $n == $s) | .value]} ]')"
          echo "matrix=$shards" >> "$GITHUB_OUTPUT"

  # A few shards in parallel, each fuzzing its targets one after another
  # (fail-fast: false so a crasher in one shard does not cancel the others).
  # A shard runs at most ceil(targets / shards) x 30 s of fuzzing, well under
  # the budget even with a cold build cache.
  fuzz:
    name: Fuzz shard ${{ matrix.shard }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Fuzz this shard's targets for 30 s each
        # The target list goes through the environment, not the script text.
        env:
          TARGETS: ${{ toJson(matrix.targets) }}
        run: |
          set -uo pipefail
          # Run every target even when one fails, so one run reports all crashers.
          failed=0
          while IFS=$'	' read -r pkg fuzz; do
            echo "::group::Fuzz $fuzz ($pkg)"
            if ! go test -run='^$' -fuzz="^${fuzz}$" -fuzztime=30s "$pkg"; then
              echo "::error::fuzz target $fuzz failed"
              failed=1
            fi
            echo "::endgroup::"
          done < <(echo "$TARGETS" | jq -r '.[] | [.pkg, .fuzz] | @tsv')
          exit "$failed"
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-shard-${{ matrix.shard }}
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 7
