name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs only: this is the trigger for the e2e job (OIDC against Keycloak).
  workflow_dispatch:

permissions:
  contents: read

# R0: owned by the leads. R6/R7 (C1) do not touch this block.
#
# A pull request shares one group per PR (refs/pull/N/merge), so a new push
# cancels the run of the old head: only the latest head matters.
#
# Every other run (a push to main, a manual workflow_dispatch) gets a group of
# its own (the run id), so nothing cancels or replaces it. A shared group is
# not enough even with cancel-in-progress false: GitHub keeps one running and
# ONE pending run per group, and a newer run replaces the pending one. When
# several PRs merge within minutes, the merges in between were cancelled
# without ever running (2026-10-14: #91, #94, #97, #112, #113, #115, #121, #124
# and others), so a red main could not be traced to the merge that broke it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet (integration-tagged files; compile only, these need the dev stack to run)
        run: go vet -tags integration ./...
      - name: go vet (claude-tagged files; compile only, these need ANTHROPIC_API_KEY to run)
        # evals and evals/cmd/evalrun hold claude-tagged files too (the LLM judge).
        run: go vet -tags claude ./internal/agent/... ./evals/...
      - name: go vet (evalgen- and e2e-tagged files; compile only, nothing else builds them)
        run: go vet -tags evalgen,e2e ./...
      - name: go vet (warehouse-tagged files; compile only, these need a real BigQuery or Databricks)
        # Tags of their own (not integration), so no other vet step builds
        # them. Databricks is vetted once its package lands (P4e).
        run: |
          go vet -tags bigquery_integration ./internal/clients/bigquery/
          if [ -d internal/clients/databricks ]; then
            go vet -tags databricks_integration ./internal/clients/databricks/
          fi
      - name: go build
        run: go build ./...
      - name: go test (unit only; integration tests are build-tagged and need the dev stack)
        run: go test ./...
      - name: eval scenarios (validate only; no model calls, no API key, no network)
        run: go run ./evals/cmd/evalrun -validate
      - name: "evals: generated files are current"
        # LEAD-ARCH rule: a PR that changes tool output regenerates the eval
        # files in the same PR. -check lists the stale files and exits 1.
        run: |
          if ! go run -tags evalgen ./evals/gen -check; then
            echo "::error::Generated eval files are stale (listed above). Regenerate and commit: go run -tags evalgen ./evals/gen"
            exit 1
          fi

  fullstack:
    name: Go integration (full dev stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The room-database tests (store, room, ws: migrations and hundreds of
    # schemas) write hundreds of MB of WAL. Against the dev stack's own Postgres
    # that WAL sits behind the Debezium slot and the smoke's devctl health
    # rightly fails on it, so they get a separate server (host port 5433, the
    # dev stack publishes 5432), as the old Postgres-only job had.
    services:
      roomdb:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: piperoom
          # CI-only throwaway database on the job's own network; not a secret.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: piperoom
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U piperoom -d piperoom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The state the integration tests expect: owner of the stack lock, so
      # testenv.Require does not skip on a lock held by someone else.
      PIPEROOM_STACK_OWNER: ci
      # The default lock dir (a sibling of the checkout) does not exist on a runner.
      PIPEROOM_STACK_LOCK: /tmp/piperoom-ci/stack.lock
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Start the dev stack (postgres, kafka, schema registry, connect, devconsumer)
        # No --wait: wait-for-stack.sh polls Connect's REST API itself, with a
        # bounded timeout, and dumps the container logs when it gives up.
        run: docker compose -f dev/docker-compose.yml up -d --build
      - name: Wait until Connect and the Schema Registry answer
        run: .github/scripts/wait-for-stack.sh 300
      - name: Register the connector (devctl up is idempotent)
        run: |
          mkdir -p "$(dirname "$PIPEROOM_STACK_LOCK")"
          go run ./cmd/devctl lock --owner ci
          go run ./cmd/devctl up --owner ci
      - name: go test -tags integration ./internal/... ./cmd/...
        env:
          PIPEROOM_DB_URL: postgres://piperoom:ci-only@127.0.0.1:5433/piperoom?sslmode=disable
        run: |
          set +e
          go test -count=1 -timeout 25m -json -tags integration ./internal/... ./cmd/... > test.json
          rc=$?
          set -e
          # Readable failures in the log: the whole output of every failed
          # test (assertion messages included); the full stream is the artifact.
          jq -rs '
            ([.[] | select(.Action == "fail" and (.Test // "") != "") | "\(.Package) \(.Test)"]) as $failed
            | .[] | select(.Action == "output" and (.Test // "") != ""
                           and (("\(.Package) \(.Test)") as $k | $failed | index($k)))
            | .Output' test.json | grep -v '^$' || true
          exit "$rc"
      - name: Skipped integration tests are failures
        if: success() || failure()
        run: .github/scripts/fail-on-skips.sh test.json
      # The dev-stack smoke, on the stack that is already up (the integration
      # tests clean up after themselves). It mirrors scenario schema-change in
      # tasks/A1-devstack.md: break waits for task 0 FAILED, fix waits for the
      # schema, RUNNING and compatibility BACKWARD.
      - name: devctl status
        if: success()
        run: go run ./cmd/devctl status
      - name: devctl health (healthy end to end before the break)
        if: success()
        run: .github/scripts/wait-healthy.sh 180
      - name: Break and fix the schema-change scenario
        if: success()
        run: |
          go run ./cmd/devctl break --owner ci schema-change
          go run ./cmd/devctl fix --owner ci schema-change
      - name: devctl health (rows reach the warehouse again after the fix)
        if: success()
        run: .github/scripts/wait-healthy.sh 180
      - name: Dump stack logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs --no-color --tail=300
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fullstack-test-json
          path: test.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose -f dev/docker-compose.yml down -v --remove-orphans

  # P1c-2: the README's "Quickstart (5 minutes)" path, timed. `make quickstart`
  # runs discover, builds the UI and starts `server --quickstart` against the
  # dev stack; the job fails unless /healthz answers within the budget with
  # write_mode "off" and the printed URL answers 200. The clock starts at
  # `make quickstart`: the dev stack and the Go/Node toolchains are the
  # README's prerequisites, not part of the five minutes.
  quickstart:
    name: Quickstart (read-only, 5-minute budget)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PIPEROOM_STACK_OWNER: ci
      PIPEROOM_STACK_LOCK: /tmp/piperoom-ci/stack.lock
      QUICKSTART_DIR: /tmp/piperoom-quickstart
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the dev stack (postgres, kafka, schema registry, connect, devconsumer)
        run: docker compose -f dev/docker-compose.yml up -d --build
      - name: Wait until Connect and the Schema Registry answer
        run: .github/scripts/wait-for-stack.sh 300
      - name: Register the connector (discover finds pipelines through it)
        run: |
          mkdir -p "$(dirname "$PIPEROOM_STACK_LOCK")"
          go run ./cmd/devctl lock --owner ci
          go run ./cmd/devctl up --owner ci
      - name: make quickstart, timed to /healthz OK (budget 300 s)
        timeout-minutes: 7
        env:
          BUDGET_SECONDS: "300"
          # No ANTHROPIC_API_KEY: the server starts without one. As in
          # internal/testenv (quickstartEnv), the model endpoint is a closed
          # loopback port, so nothing in this job can reach a real model API.
          ANTHROPIC_BASE_URL: http://127.0.0.1:1
        run: |
          mkdir -p "$QUICKSTART_DIR"
          start=$SECONDS
          # setsid: make, go run and the server share one new process group,
          # so the tear-down stops all of them, not only make.
          setsid make quickstart >"$QUICKSTART_DIR/stdout.log" 2>"$QUICKSTART_DIR/stderr.log" &
          echo $! >"$QUICKSTART_DIR/pgid"
          url=""
          until [ -n "$url" ] && curl -fsS --max-time 5 -o /dev/null "${url%/}/healthz"; do
            if ! kill -0 "$(cat "$QUICKSTART_DIR/pgid")" 2>/dev/null; then
              echo "::error::make quickstart exited before /healthz answered"
              exit 1
            fi
            if (( SECONDS - start >= BUDGET_SECONDS )); then
              echo "::error::/healthz did not answer within ${BUDGET_SECONDS}s of make quickstart (URL: ${url:-none printed})"
              exit 1
            fi
            if [ -z "$url" ]; then
              url="$(grep -m1 -E '^http://' "$QUICKSTART_DIR/stdout.log" || true)"
            fi
            sleep 2
          done
          elapsed=$((SECONDS - start))
          echo "quickstart: $url, /healthz OK ${elapsed}s after make quickstart (budget ${BUDGET_SECONDS}s)"
          echo "### Quickstart: /healthz OK in ${elapsed}s (budget ${BUDGET_SECONDS}s)" >>"$GITHUB_STEP_SUMMARY"
          echo "$url" >"$QUICKSTART_DIR/url"
      - name: /healthz reports write_mode off
        run: |
          url="$(cat "$QUICKSTART_DIR/url")"
          body="$(curl -fsS --max-time 10 "${url%/}/healthz")"
          echo "$body"
          if ! jq -e '.status == "ok" and .write_mode == "off"' <<<"$body" >/dev/null; then
            echo "::error::/healthz = $body, want status ok and write_mode off"
            exit 1
          fi
      - name: The printed URL answers 200
        run: |
          url="$(cat "$QUICKSTART_DIR/url")"
          code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$url")"
          echo "GET $url: $code"
          if [ "$code" != 200 ]; then
            echo "::error::GET $url returned $code, want 200"
            exit 1
          fi
      - name: Dump quickstart and stack logs
        if: failure()
        run: |
          for f in stdout stderr; do
            echo "::group::make quickstart $f"
            cat "$QUICKSTART_DIR/$f.log" 2>/dev/null || echo "(no $f.log)"
            echo "::endgroup::"
          done
          echo "::group::owners.yaml"
          cat owners.yaml 2>/dev/null || echo "(no owners.yaml)"
          echo "::endgroup::"
          docker compose -f dev/docker-compose.yml logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: |
          if [ -f "$QUICKSTART_DIR/pgid" ]; then
            kill -TERM -- "-$(cat "$QUICKSTART_DIR/pgid")" 2>/dev/null || true
          fi
          docker compose -f dev/docker-compose.yml down -v --remove-orphans

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: go test -race
        run: go test -race -count=1 ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # setup-go (v6+) exports GOTOOLCHAIN=local to every later step: `go` never
      # downloads another toolchain. A tool pinned below whose go.mod needs a Go
      # newer than go.mod's here fails to install; bump the toolchain in go.mod first.
      - name: Install govulncheck (built with the same Go as the other jobs)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck (fails on reachable findings not in the reviewed allowlist)
        # The JSON mode always exits 0, so the gate script reads the findings
        # and compares them with .github/govulncheck-allow.txt (ID, reason,
        # owner, review-by date). A new reachable vulnerability, or an entry
        # past its review-by date, fails the job.
        run: |
          set -o pipefail
          govulncheck -format json ./... > govulncheck.json
          .github/scripts/govulncheck-gate.sh govulncheck.json .github/govulncheck-allow.txt

  deploy:
    name: Deploy manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: No dev auth in the release image or the pilot compose default
        run: .github/scripts/check-no-dev-auth.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # setup-go (v6+) exports GOTOOLCHAIN=local to every later step: `go` never
      # downloads another toolchain. A tool pinned below whose go.mod needs a Go
      # newer than go.mod's here fails to install; bump the toolchain in go.mod first.
      - name: Install helm and kubeconform (pinned, built from source by the Go module proxy)
        run: |
          go install helm.sh/helm/v3/cmd/helm@v3.16.3
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: helm lint
        # The chart with its default values must lint too (a user installs it
        # with only their own overrides), then each CI values file.
        run: |
          helm lint deploy/helm/piperoom
          for f in deploy/helm/piperoom/ci/*.yaml; do
            helm lint deploy/helm/piperoom -f "$f"
          done
      - name: helm template | kubeconform
        run: |
          for f in deploy/helm/piperoom/ci/*.yaml; do
            echo "== $f"
            helm template piperoom deploy/helm/piperoom -f "$f" | kubeconform -strict -summary -kubernetes-version 1.30.0
          done
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff deploy/terraform
      - name: terraform init and validate (deploy/terraform/gcp)
        working-directory: deploy/terraform/gcp
        # -backend=false: no state or credentials. init reads the committed
        # .terraform.lock.hcl, so the google provider version is fixed.
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  e2e-oidc:
    name: OIDC end-to-end (manual)
    # Not on pull requests or pushes: it builds the image and starts Keycloak,
    # Caddy and the app. Run it from the Actions tab (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Run test/e2e/oidc/run.sh
        run: test/e2e/oidc/run.sh
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidc-e2e-logs
          path: test/e2e/oidc/.logs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (all install scripts disabled, except esbuild's)
        # esbuild's postinstall fetches its matching platform binary and is required;
        # every other package's install/postinstall/preinstall script is skipped. This
        # allowlists exactly esbuild instead of a blanket --ignore-scripts=false. See
        # README.md "Web tooling" for why.
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run
