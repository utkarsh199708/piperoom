name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-progress runs for PR pushes. On push to main, every run is a
  # distinct merge and its result matters even if a newer merge follows fast.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet (integration-tagged files; compile only, these need the dev stack to run)
        run: go vet -tags integration ./...
      - name: go vet (claude-tagged files; compile only, these need ANTHROPIC_API_KEY to run)
        run: go vet -tags claude ./internal/agent/...
      - name: go build
        run: go build ./...
      - name: go test (unit only; integration tests are build-tagged and need the dev stack)
        run: go test ./...
      - name: eval scenarios (validate only; no model calls, no API key, no network)
        run: go run ./evals/cmd/evalrun -validate

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (all install scripts disabled, except esbuild's)
        # esbuild's postinstall fetches its matching platform binary and is required;
        # every other package's install/postinstall/preinstall script is skipped. This
        # allowlists exactly esbuild instead of a blanket --ignore-scripts=false. See
        # README.md "Web tooling" for why.
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run
