name: evals-live

# Live agent evals against the hosted model (evals/README.md, "CI (evals-live)").
# This repository is public, so:
#  - never pull_request_target: a PR must not run with the secret on code the
#    base branch has not reviewed;
#  - PR runs only for branches of this repository (a fork gets no secret and
#    must not spend ours);
#  - the secret lives in the GitHub Environment "evals" with required reviewers,
#    so no PR run spends money without approval;
#  - only the report of the committed synthetic scenarios is uploaded. The
#    learned set stays in a private store and is never passed with -learned.

on:
  workflow_dispatch:
    inputs:
      make_baseline:
        description: "Write the report as the baseline-default artifact (commit it as evals/baseline/default.json in a later PR); no comparison"
        type: boolean
        default: false
      only:
        description: "Comma-separated scenario names, or all (GitHub replaces an empty value with the default)"
        type: string
        default: "schema-change"
      runs:
        description: "Runs per scenario (3 for a comparable baseline; 1 to save money)"
        type: string
        default: "1"
      max_turns:
        description: "Agent turns per episode (caps the cost of a runaway episode)"
        type: string
        default: "25"
      set:
        description: "Scenario set: default (evals/scenarios) or heldout (evals/scenarios/heldout: report only, no baseline comparison, never tune prompts on it)"
        type: choice
        options:
          - default
          - heldout
        default: default
      judge_fill:
        description: "Refill evals/judgecache verdicts for the dispatched branch (PAID, ~$0.01 per call) and push the cache back to that branch; runs no episodes"
        type: boolean
        default: false
  # Nightly full run (75 episodes) is off while the API budget is small; turn it
  # back on, or make it a cheap canary, once the cost per episode is measured.
  # schedule:
  #   - cron: "17 3 * * *"
  pull_request:
    paths:
      - "internal/agent/**"
      - "internal/wiring/model.go"
      - "internal/config/config.go"
      - "evals/scenarios/**"

permissions:
  contents: read

# A second push to the same ref cancels the running eval.
concurrency:
  group: evals-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals-live:
    name: evals-live
    runs-on: ubuntu-latest
    # 75 episodes (25 scenarios x 3 runs) at 6 in parallel take about 40 minutes.
    timeout-minutes: 60
    environment: evals
    # The pull_request path stays off until evals/baseline/default.json is on
    # main (tasks/L1-learn-from-rooms.md, L1c): without a baseline a PR run has
    # nothing to compare with and would only spend money. A later C1 PR removes
    # the `false &&`. A judge_fill dispatch runs the judge-fill jobs below
    # instead of episodes.
    if: >-
      (github.event_name != 'pull_request' && !inputs.judge_fill) ||
      (false && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set in the evals environment; skipping the live evals."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.key.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        if: steps.key.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # setup-go exports GOTOOLCHAIN=local: the Go of go.mod is the only one used.
      - name: Run evals
        id: run
        if: steps.key.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_BASELINE: ${{ inputs.make_baseline }}
          SET: ${{ github.event_name == 'workflow_dispatch' && inputs.set || 'default' }}
          # Manual runs choose scope; the nightly run uses the full set, 3 runs.
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
          RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || '3' }}
          MAX_TURNS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_turns || '25' }}
        run: |
          case "$SET" in default|heldout) ;; *) echo "::error::set must be default or heldout"; exit 1;; esac
          if [ "$SET" = "heldout" ] && [ "$MAKE_BASELINE" = "true" ]; then
            echo "::error::make_baseline is refused with set=heldout: the held-out set has no baseline file and must never get one."
            exit 1
          fi
          case "$RUNS" in ''|*[!0-9]*) echo "::error::runs must be a whole number"; exit 1;; esac
          case "$MAX_TURNS" in ''|*[!0-9]*) echo "::error::max_turns must be a whole number"; exit 1;; esac
          # A name may be a path under evals/scenarios (setup/<x>), so "/" is allowed.
          # The character class cannot tell "../x" or "a//b" from a name, so a ".."
          # segment, an empty segment and a leading "/" are refused by the second case.
          case "$ONLY" in *[!a-z0-9,/-]*) echo "::error::only takes scenario names separated by commas"; exit 1;; esac
          case ",$ONLY," in *..*|*//*|*,/*|*/,*) echo "::error::only names must not contain .., empty or leading / segments"; exit 1;; esac
          # USD per million tokens (docs/design/cost.md), so the report carries
          # cost_per_run_usd. cache_write is the 5-minute write price (1.25x input).
          cat > "$RUNNER_TEMP/prices.json" <<'JSON'
          {
            "claude-opus-5-5":   {"input": 4.00, "output": 20.00, "cache_write": 5.00,  "cache_read": 0.20},
            "claude-sonnet-5-5": {"input": 2.00, "output": 10.00, "cache_write": 2.50,  "cache_read": 0.20},
            "claude-haiku-5-5":  {"input": 0.10, "output": 0.50,  "cache_write": 0.125, "cache_read": 0.01}
          }
          JSON
          # Episodes run 6 at a time with a 10-minute cap each; one at a time
          # (the evalrun default) cannot finish 75 episodes inside the job limit.
          args=(-runs "$RUNS" -max-turns "$MAX_TURNS" -parallel 6 -timeout 10m -prices "$RUNNER_TEMP/prices.json" -label ci -out cand.json)
          if [ "$SET" = "heldout" ]; then
            args+=(-set heldout)
          fi
          if [ -n "$ONLY" ] && [ "$ONLY" != "all" ]; then
            args+=(-only "$ONLY")
            n_scenarios="$(printf '%s' "$ONLY" | tr ',' '\n' | grep -c .)"
          elif [ "$SET" = "heldout" ]; then
            # -set heldout reads evals/scenarios/heldout/*.yaml (fixtures/ is a subdirectory).
            n_scenarios="$(find evals/scenarios/heldout -maxdepth 1 -name '*.yaml' | wc -l)"
          else
            # Ask evalrun for the set it will run: -list prints one runnable name
            # per line and leaves out pending_harness scenarios, so the cost and
            # judge caps do not count episodes that never start.
            n_scenarios="$(go run ./evals/cmd/evalrun -list | grep -c .)"
          fi
          # Live judge calls: at most 2 per episode (an episode judges root cause
          # and layer). The evalrun default of 50 ran out after ~77 of 90 episodes.
          judge_cap=$((2 * n_scenarios * RUNS))
          echo "::notice::${n_scenarios} scenario(s) x ${RUNS} run(s): -judge-max-calls ${judge_cap}"
          args+=(-judge-max-calls "$judge_cap" -transcripts transcripts)
          if [ "$SET" = "heldout" ]; then
            echo "::notice::set=heldout: report only; no comparison with evals/baseline/default.json (that is the default set)."
          elif [ "$MAKE_BASELINE" = "true" ]; then
            echo "::notice::make_baseline: no comparison; the report is uploaded as baseline-default."
          elif [ -f evals/baseline/default.json ]; then
            args+=(-baseline evals/baseline/default.json -fail-on-regression)
          else
            echo "::notice::evals/baseline/default.json does not exist yet; running without a comparison."
          fi
          # Keep the exit code so the report is uploaded even when the run
          # regressed; the Gate step fails the job. Never -learned: that set is private.
          # Build first: `go run` reports any non-zero child exit as 1, which
          # hid evalrun's "regressed" exit code 2 from the Gate step.
          # -tags claude links the live LLM judge; the default -judge auto needs it
          # for ambiguous hypotheses with no verdict in evals/judgecache.
          go build -tags claude -o "$RUNNER_TEMP/evalrun" ./evals/cmd/evalrun
          set +e
          "$RUNNER_TEMP/evalrun" "${args[@]}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      # The default set's report. A held-out run uploads its report only as
      # heldout-<sha> below: the cand and transcripts artifacts are what rows
      # read to tune scenarios, and nobody tunes on held-out answers (KAN-489).
      - name: Upload report
        if: steps.key.outputs.run == 'true' && inputs.set != 'heldout' && hashFiles('cand.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cand
          path: cand.json
          retention-days: 14
      # The held-out reference for the W4j comparison (KAN-510); never committed
      # as a baseline file. W4j reads results only, so no transcript of a
      # held-out run is uploaded.
      - name: Upload held-out report
        if: steps.key.outputs.run == 'true' && inputs.set == 'heldout' && hashFiles('cand.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heldout-${{ github.sha }}
          path: cand.json
          retention-days: 14
      # Each run's transcript and result (replayed synthetic tool output and the
      # agent's text). The API key is only in the environment of the process and
      # is never part of a transcript.
      - name: Upload transcripts
        if: steps.key.outputs.run == 'true' && inputs.set != 'heldout' && hashFiles('transcripts/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcripts
          path: transcripts
          retention-days: 14
      - name: Upload baseline candidate
        if: steps.key.outputs.run == 'true' && inputs.make_baseline == true && hashFiles('cand.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-default
          path: cand.json
          retention-days: 14
      - name: Gate
        if: steps.key.outputs.run == 'true'
        env:
          RC: ${{ steps.run.outputs.rc }}
          MAKE_BASELINE: ${{ inputs.make_baseline }}
          SET: ${{ github.event_name == 'workflow_dispatch' && inputs.set || 'default' }}
        run: |
          if [ "$RC" = "2" ]; then
            echo "::error::A scenario regressed against evals/baseline/default.json (see the comparison above)."
            exit 1
          elif [ "$RC" = "3" ]; then
            echo "::error::evalrun stopped on an API error (billing/auth); not a regression."
            exit 1
          elif [ "$RC" != "0" ]; then
            echo "::error::evalrun failed (exit ${RC:-unknown}) before it could compare."
            exit 1
          fi
          # The held-out set is gated on evalrun errors only (above), never on a
          # comparison with the default set's baseline.
          if [ "$SET" = "heldout" ] || [ "$MAKE_BASELINE" = "true" ] || [ ! -f evals/baseline/default.json ]; then
            exit 0
          fi
          # Misses (tool calls the scenario had no recording for) growing means
          # the agent left the recorded path; fail on that. Cost is only printed.
          # Compare misses per run over the scenarios both reports ran: an -only
          # run covers a subset of the baseline, and a report sums the misses of
          # all its runs, so the overall totals of two reports do not compare.
          read -r n_shared base_miss cand_miss < <(jq -n -r \
            --slurpfile b evals/baseline/default.json --slurpfile c cand.json '
            def rate(s): (s | map(.misses) | add // 0) / ([(s | map(.runs) | add // 0), 1] | max);
            ($c[0].scenarios // [] | map(.name)) as $cand
            | ($b[0].scenarios // [] | map(select(.name | IN($cand[])))) as $bs
            | ($bs | map(.name)) as $shared
            | ($c[0].scenarios // [] | map(select(.name | IN($shared[])))) as $cs
            | "\($shared | length) \(rate($bs)) \(rate($cs))"')
          base_cost="$(jq '.overall.usage.cost_per_run_usd.mean // empty' evals/baseline/default.json)"
          cand_cost="$(jq '.overall.usage.cost_per_run_usd.mean // empty' cand.json)"
          echo "misses per run over ${n_shared} shared scenario(s): baseline ${base_miss}, candidate ${cand_miss}"
          if [ -n "$base_cost" ] && [ -n "$cand_cost" ]; then
            jq -n --argjson b "$base_cost" --argjson c "$cand_cost" \
              '"cost per run: baseline $\($b), candidate $\($c), delta $\($c - $b) (informational; cost alone never fails the job)"' -r
          else
            echo "cost per run: not priced in one of the reports (set PIPEROOM_MODEL_PRICES to see it)"
          fi
          if [ "$n_shared" = "0" ]; then
            echo "::notice::no scenario of this run is in the baseline; misses not compared."
          elif jq -n -e --argjson b "$base_miss" --argjson c "$cand_miss" '$c > $b' >/dev/null; then
            echo "::error::misses per run grew from ${base_miss} to ${cand_miss} over ${n_shared} shared scenario(s)."
            exit 1
          fi

  # judge_fill: record the LLM-judge verdicts a label change needs
  # (evals/cmd/evalrun/judgefill.go), because the API key exists only in the
  # "evals" environment. Two jobs, so the API key and a write token are never in
  # the same job: this one holds the key and a read-only token and hands the
  # cache over as an artifact; push-judgecache holds the write token and no secret.
  judge-fill:
    name: judge-fill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: evals
    if: github.event_name == 'workflow_dispatch' && inputs.judge_fill
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      tests_ok: ${{ steps.test.outputs.ok }}
      # The commit the fill was tested on; push-judgecache pushes only onto it.
      sha: ${{ github.sha }}
    steps:
      # The cache is pushed back to the dispatched ref: only a branch, never main
      # (main changes only through a reviewed merge).
      - name: Check the ref
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main) echo "::error::judge_fill refuses main; dispatch it on the branch whose labels changed."; exit 1;;
            refs/heads/?*) ;;
            *) echo "::error::judge_fill needs a branch, not ${REF}."; exit 1;;
          esac
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set in the evals environment; skipping the judge fill."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.key.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        if: steps.key.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # The dry run makes no call and needs no key: the log shows how many
      # verdicts are missing and what they cost before any money is spent.
      - name: Estimate the fill
        if: steps.key.outputs.run == 'true'
        run: go run ./evals/cmd/evalrun -judge-fill evals/judgecache/ambiguous.json -dry-run
      # A relabel of a few scenarios needs tens of judge calls; the hard cap of
      # 60 bounds what one approved run can spend. A bigger refill is dispatched
      # again: each run fills only the verdicts still missing.
      - name: Fill the judge cache
        if: steps.key.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          go build -tags claude -o "$RUNNER_TEMP/evalrun" ./evals/cmd/evalrun
          "$RUNNER_TEMP/evalrun" -judge-fill evals/judgecache/ambiguous.json -judge-max-calls 60
      # Keep the result instead of failing here: a refill often changes which
      # texts the known-judge-miss pins must list, and the pins can only be
      # updated after seeing the verdicts. The paid cache is still uploaded and
      # pushed; the Gate step fails the job after the upload.
      - name: Test the evals
        id: test
        if: steps.key.outputs.run == 'true'
        run: |
          set +e
          go test ./evals/...
          if [ "$?" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for new verdicts
        id: diff
        if: steps.key.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain evals/judgecache)" ]; then
            git status --porcelain evals/judgecache
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::evals/judgecache is unchanged; nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the judge cache
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: judgecache
          path: evals/judgecache/
          retention-days: 3
      - name: Gate
        if: steps.key.outputs.run == 'true'
        env:
          TESTS_OK: ${{ steps.test.outputs.ok }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            echo "::error::go test ./evals/... failed after the fill; the cache is pushed to the branch anyway (if it changed): update the known-judge-miss pins from the test log above before merging."
            exit 1
          fi

  # Pushes the filled cache to the dispatched branch. No environment and no
  # secret: this job sees only the artifact and a contents:write token.
  # It runs even when judge-fill failed on its tests (run 39320779238 dropped
  # 18 paid verdicts that way): the branch's own CI is the merge gate, so a
  # cache that fails the tests on a non-main branch is safe. It never runs when
  # the fill itself failed: the steps after it then skip, "Check for new
  # verdicts" included, so `changed` is empty and this condition is false.
  push-judgecache:
    name: push-judgecache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: judge-fill
    if: ${{ !cancelled() && needs.judge-fill.outputs.changed == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Check the ref
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main) echo "::error::judge_fill refuses to push to main."; exit 1;;
            refs/heads/?*) ;;
            *) echo "::error::judge_fill needs a branch, not ${REF}."; exit 1;;
          esac
      # The token stays in the checkout for the push below; this is the only
      # job of the workflow that can write.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      # The verdicts were tested on judge-fill's commit. Pushing only onto that
      # commit makes the push a fast-forward of what was tested; a concurrent
      # push to the branch makes the run fail instead of clobbering it.
      - name: Check the branch did not move
        env:
          TESTED: ${{ needs.judge-fill.outputs.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$TESTED" ]; then
            echo "::error::${GITHUB_REF_NAME} moved from ${TESTED} to ${head} during the fill; dispatch judge_fill again"
            exit 1
          fi
      - name: Download the judge cache
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: judgecache
          path: evals/judgecache/
      # The commit must hold recorded verdicts only: anything else would land
      # on the branch without review.
      - name: Check the changed paths
        id: paths
        run: |
          git add -A
          others="$(git diff --cached --name-only | grep -v '^evals/judgecache/' || true)"
          if [ -n "$others" ]; then
            echo "::error::the judgecache artifact changes paths outside evals/judgecache/:"
            printf '%s\n' "$others"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::notice::the branch already has these verdicts; nothing to push."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.paths.outputs.push == 'true'
        env:
          TESTS_OK: ${{ needs.judge-fill.outputs.tests_ok }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          msg=(-m "evals: refill judge verdicts (evals-live judge_fill)")
          if [ "$TESTS_OK" != "true" ]; then
            note="go test ./evals/... failed after this fill; update the known-judge-miss pins from the judge-fill log before merging."
            echo "::warning::${note}"
            msg+=(-m "$note")
          fi
          git commit "${msg[@]}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # A push made with GITHUB_TOKEN starts no workflow run.
          echo "::notice::Pushed the refilled judge cache to ${GITHUB_REF_NAME}. A GITHUB_TOKEN push triggers no CI: re-run CI on the branch (or the next push runs it)."
