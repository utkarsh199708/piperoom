name: Live evals

# Runs the agent against the real model on the eval scenarios (replayed tools,
# no dev stack) and gates on regressions against the last nightly report on
# main. It spends API tokens, so it runs nightly and only on pull requests that
# touch the agent, the tools or the evals themselves.
on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "internal/agent/**"
      - "internal/tools/**"
      - "evals/**"
      - ".github/workflows/evals-live.yml"
      - ".github/scripts/eval-gate.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-live-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    name: Live eval gate
    runs-on: ubuntu-latest
    # Worst case, step "Budget": ceil(episodes / EVAL_PARALLEL) * EVAL_TIMEOUT_MIN.
    #   nightly: 20 scenarios x 2 runs = 40 episodes -> 10 waves x 8 min = 80 min
    #   pull request: 5 scenarios x 2 runs = 10 episodes -> 3 waves x 8 min = 24 min
    # 100 minutes leaves room for setup and the report. The Budget step fails
    # the job when scenarios or runs grow past it, so the two stay in step.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read   # download the last nightly report from main as the baseline
    env:
      # Empty on forks and on pull requests from forks: GitHub does not pass
      # secrets there. The steps below skip instead of failing in that case.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Cost is stated, not left to server defaults: at most episodes x
      # EVAL_MAX_TURNS model turns on EVAL_MODEL (nightly: 40 x 40 = 1600 turns,
      # pull request: 10 x 40 = 400). Sonnet by default; set the repository
      # variable EVAL_MODEL to evaluate another model.
      EVAL_MODEL: ${{ vars.EVAL_MODEL || 'claude-sonnet-5-5' }}
      EVAL_MAX_TURNS: ${{ vars.EVAL_MAX_TURNS || '40' }}
      EVAL_RUNS: "2"
      EVAL_PARALLEL: "4"
      EVAL_TIMEOUT_MIN: "8"
      EVAL_JOB_BUDGET_MIN: "100"
      # A pull request runs the core scenarios; the nightly run is the full set.
      EVAL_ONLY: ${{ github.event_name == 'pull_request' && 'schema-change,source-column-dropped,consumer-poison-pill,injection-ddl-comment,unclear-driver-intent' || '' }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not available here (fork or secret not set): live evals skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Budget (worst case must fit the job timeout)
        if: steps.key.outputs.present == 'true'
        run: |
          if [ -n "$EVAL_ONLY" ]; then
            scenarios="$(awk -F, '{print NF}' <<<"$EVAL_ONLY")"
          else
            scenarios="$(find evals/scenarios -maxdepth 1 -name '*.yaml' | wc -l)"
          fi
          episodes=$((scenarios * EVAL_RUNS))
          waves=$(((episodes + EVAL_PARALLEL - 1) / EVAL_PARALLEL))
          worst=$((waves * EVAL_TIMEOUT_MIN))
          echo "scenarios=$scenarios runs=$EVAL_RUNS episodes=$episodes parallel=$EVAL_PARALLEL -> worst case ${worst} min of ${EVAL_JOB_BUDGET_MIN} (job timeout 100)"
          echo "model=$EVAL_MODEL max_turns=$EVAL_MAX_TURNS: at most $((episodes * EVAL_MAX_TURNS)) model turns"
          if [ $((worst + 10)) -gt "$EVAL_JOB_BUDGET_MIN" ]; then
            echo "::error::worst case ${worst} min plus 10 min setup exceeds the ${EVAL_JOB_BUDGET_MIN} min budget: lower EVAL_RUNS, raise EVAL_PARALLEL, or raise timeout-minutes and EVAL_JOB_BUDGET_MIN together"
            exit 1
          fi
      - name: Baseline (the newest successful nightly report on main)
        id: base
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow evals-live.yml --branch main \
                  --event schedule --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$id" ] && gh run download "$id" --repo "$GITHUB_REPOSITORY" --name live-evals --dir baseline \
               && [ -s baseline/report.json ]; then
            echo "baseline: report.json from nightly run $id"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no nightly report on main yet: regression comparison is advisory-only (skipped) until the first nightly succeeds"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: evalrun (real model)
        if: steps.key.outputs.present == 'true'
        run: |
          args=(-runs "$EVAL_RUNS" -parallel "$EVAL_PARALLEL" -timeout "${EVAL_TIMEOUT_MIN}m"
                -model "$EVAL_MODEL" -max-turns "$EVAL_MAX_TURNS"
                -label "${GITHUB_EVENT_NAME}-${GITHUB_SHA::7}"
                -out report.json -md report.md -transcripts transcripts)
          if [ -n "$EVAL_ONLY" ]; then args+=(-only "$EVAL_ONLY"); fi
          go run -tags claude ./evals/cmd/evalrun "${args[@]}"
      - name: Report
        if: steps.key.outputs.present == 'true' && always()
        run: |
          if [ -s report.md ]; then
            { echo '### Live evals'; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Hard checks (no errored run, schema-change passes every run)
        if: steps.key.outputs.present == 'true'
        run: .github/scripts/eval-gate.sh report.json
      - name: Regressions against the baseline
        if: steps.key.outputs.present == 'true' && steps.base.outputs.found == 'true'
        run: |
          set -o pipefail   # keep evalrun's exit code 2 (regression) through tee
          # The baseline is the full nightly set; narrow it to the scenarios this
          # run covered, or every other scenario would count as "missing from
          # candidate" and regress.
          jq --slurpfile cand report.json '
               ($cand[0].scenarios | map(.name)) as $names
               | .scenarios |= map(select(.name | IN($names[])))' \
             baseline/report.json > baseline-subset.json
          # Built, not `go run`, so a regression exits 2 (not a generic 1).
          go build -o "$RUNNER_TEMP/evalrun" ./evals/cmd/evalrun
          "$RUNNER_TEMP/evalrun" -compare baseline-subset.json,report.json -fail-on-regression \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload report and transcripts
        if: steps.key.outputs.present == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-evals
          path: |
            report.json
            report.md
            transcripts
          if-no-files-found: ignore
          retention-days: 14
