name: Live evals

# Runs the agent against the real model on the eval scenarios (replayed tools,
# no dev stack) and gates on the pass rate. It spends API tokens, so it runs
# nightly and only on pull requests that touch the agent, the tools or the
# evals themselves.
on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "internal/agent/**"
      - "internal/tools/**"
      - "evals/**"
      - ".github/workflows/evals-live.yml"
      - ".github/scripts/eval-gate.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-live-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    name: Live eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Empty on forks and on pull requests from forks: GitHub does not pass
      # secrets there. The steps below skip instead of failing in that case.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # A pull request runs the core scenarios once; the nightly run is the
      # full set, three runs each, which is what the pass rate is meaningful on.
      EVAL_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
      EVAL_ONLY: ${{ github.event_name == 'pull_request' && 'schema-change,source-column-dropped,consumer-poison-pill,injection-ddl-comment,unclear-driver-intent' || '' }}
      EVAL_MIN_PASS_RATE: ${{ vars.EVAL_MIN_PASS_RATE || '0.70' }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not available here (fork or secret not set): live evals skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: evalrun (real model)
        if: steps.key.outputs.present == 'true'
        run: |
          args=(-runs "$EVAL_RUNS" -parallel 2 -label "${GITHUB_EVENT_NAME}-${GITHUB_SHA::7}"
                -out report.json -md report.md -transcripts transcripts)
          if [ -n "$EVAL_ONLY" ]; then args+=(-only "$EVAL_ONLY"); fi
          go run -tags claude ./evals/cmd/evalrun "${args[@]}"
      - name: Report
        if: steps.key.outputs.present == 'true' && always()
        run: |
          if [ -s report.md ]; then
            { echo '### Live evals'; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Gate (pass rate, errors, seed scenario)
        if: steps.key.outputs.present == 'true'
        run: .github/scripts/eval-gate.sh report.json
      - name: Upload report and transcripts
        if: steps.key.outputs.present == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-evals
          path: |
            report.json
            report.md
            transcripts
          if-no-files-found: ignore
          retention-days: 14
