name: Release image

# Builds the pilot image (Dockerfile). On a v* tag it pushes to GHCR and records
# the digest, which is what deployments should pin (image@sha256:...). On pull
# requests that touch the image inputs it only builds, so a broken Dockerfile
# fails before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "cmd/server/**"
      - "web/package*.json"
      - ".github/workflows/release-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/piperoom
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Image name and tags
        id: name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/piperoom"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            printf 'tags=%s:%s\n' "$image" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=piperoom:ci" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: steps.name.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.name.outputs.push == 'true' }}
          load: ${{ steps.name.outputs.push != 'true' }}
          tags: ${{ steps.name.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the digest
        if: steps.name.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no image digest from the build"; exit 1;; esac
          echo "$IMAGE@$DIGEST" | tee image-digest.txt
          {
            echo '### Release image'
            echo
            echo "Tag: \`$GITHUB_REF_NAME\`"
            echo
            echo "Pin deployments to the digest:"
            echo
            echo '```'
            cat image-digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload digest
        if: steps.name.outputs.push == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 90
