name: Release image

# Builds the pilot image (Dockerfile). On a v* tag it pushes to GHCR and records
# the digest, which is what deployments should pin (image@sha256:...). On pull
# requests that touch the image inputs it only builds, so a broken Dockerfile
# fails before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    # A cost trade-off: only PRs that touch the image inputs run these builds.
    # Both images build on every trigger (the devconsumer image is validated but
    # never published). A change under internal/** or web/src/** is built at the
    # next tag (and by any PR that also touches one of these paths).
    paths:
      - "Dockerfile"
      - "cmd/devconsumer/Dockerfile"
      - "go.mod"
      - "go.sum"
      - "cmd/server/**"
      # The image also ships piperoom-setup (cmd/setup, U1-22): a change there
      # must build the image too.
      - "cmd/setup/**"
      - "web/package*.json"
      - ".github/workflows/release-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/piperoom
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Image name and tags
        id: name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/piperoom"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            printf 'tags=%s:%s\n' "$image" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=piperoom:ci" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: steps.name.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.name.outputs.push == 'true' }}
          load: ${{ steps.name.outputs.push != 'true' }}
          tags: ${{ steps.name.outputs.tags }}
          # Names the build in GET /healthz and the start-up log (internal/version;
          # Dockerfile ARG VERSION). A tag build reports the tag, others the short sha.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.sha) }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Both binaries, unchanged entrypoint (U1-22)
        # A pull-request build is loaded into the daemon (load: true above), so
        # the binaries can be run here; a tag build pushes and keeps no local
        # copy. This is what makes "the image ships piperoom-setup and the old
        # entrypoint still works" a check, not a claim.
        if: steps.name.outputs.push != 'true'
        run: |
          set -euo pipefail
          entrypoint="$(docker image inspect --format '{{json .Config.Entrypoint}}' piperoom:ci)"
          echo "entrypoint: $entrypoint"
          # deploy/*.yml, the chart and the HEALTHCHECK run the image with no
          # command: the server must stay the entrypoint.
          if [ "$entrypoint" != '["/piperoom"]' ]; then
            echo "::error::the image entrypoint is no longer /piperoom: $entrypoint"
            exit 1
          fi
          # The entrypoint binary runs: --version needs no config and exits 0.
          version="$(docker run --rm piperoom:ci --version)"
          echo "server version: $version"
          [ -n "$version" ] || { echo "::error::/piperoom --version printed nothing"; exit 1; }
          # /piperoom-setup (cmd/setup, the setup runner) is the second binary.
          # --help exits 1 by design; the usage text is what proves it runs.
          # 125/126/127 are Docker's own "did not start" codes.
          rc=0
          docker run --rm --entrypoint /piperoom-setup piperoom:ci --help > setup-help.txt 2>&1 || rc=$?
          cat setup-help.txt
          case "$rc" in
            125|126|127) echo "::error::/piperoom-setup did not start (docker exit $rc)"; exit 1 ;;
          esac
          grep -q -- " -standalone" setup-help.txt || {
            echo "::error::/piperoom-setup --help did not print its flags"; exit 1; }
      - name: Record the digest
        if: steps.name.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no image digest from the build"; exit 1;; esac
          echo "$IMAGE@$DIGEST" | tee image-digest.txt
          {
            echo '### Release image'
            echo
            echo "Tag: \`$GITHUB_REF_NAME\`"
            echo
            echo "Pin deployments to the digest:"
            echo
            echo '```'
            cat image-digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload digest
        if: steps.name.outputs.push == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 90

  # Builds (but never publishes) the devconsumer image from its own Dockerfile,
  # so a PR that breaks cmd/devconsumer/Dockerfile fails here rather than at the
  # next tag. Read-only: no login, no push, contents read only.
  devconsumer:
    name: Build devconsumer image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build devconsumer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/devconsumer/Dockerfile
          push: false
          load: true
          tags: piperoom-devconsumer:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
