# dev/owners.yaml plus the MySQL pipeline of the `mysql` compose profile (Q8a,
# docs/design/mysql-source.md §10.1; dev/scenarios.md §25-§28). Start the server
# with OWNERS_FILE=dev/owners.mysql.yaml to run the MySQL breaks.
#
# It loads only once Q8d merges: `source_kind:` and the `mysql` layer are Q8d's
# owners code (design §4.2). Until then owners.Load refuses the file, and
# TestOwnersMySQLFile checks the rest of it against today's parser.
#
# Keep the rest in step with dev/owners.yaml: TestOwnersMySQLMatchesBaseline
# fails when they drift.
pipelines:
  - id: orders
    title: Orders CDC
    topic_prefix: pg # Debezium topic.prefix of pg-orders-connector (topics span pg.public.orders)
    source_tables: [public.orders]
    connectors: [pg-orders-connector]
    consumer_groups: [order-sync]
    sink_tables: [analytics.orders]
    sink_ts_column: updated_at
    # Short `for` so `devctl break ...` trips the watcher within a few intervals.
    # slot_wal stays at the defaults (fire 1GiB): a healthy dev slot retains
    # 0.8-1.1 MB under load (dev/scenarios.md), so any small fire would warn forever.
    watch:
      enabled: true
      signals:
        connector_down: {for: 30s}
        slot_inactive: {for: 30s}
  - id: daily-revenue
    title: Daily revenue (Airflow + dbt)
    kind: batch
    dags: [revenue_daily]
    dbt_project: dev/batch/dbt/analytics
    models: [stg_orders, fct_revenue]
    sink_tables: [analytics.fct_revenue]
    sink_ts_column: loaded_at
    # The batch layers are not in the top-level `layers:` map (that map stays the
    # six CDC layers, which TestExistingFilesStayValid pins), so they are owned
    # here per-pipeline.
    owners:
      orchestrator: {approvers: priya}
      transform: {approvers: priya}
      warehouse: {approvers: meera}
  # The MySQL pipeline: Debezium MySQL connector orders-mysql on the `mysql`
  # profile. No consumer or sink: the breaks are on the source and Connect side.
  - id: orders-mysql
    title: Shop orders CDC (MySQL)
    source_kind: mysql
    topic_prefix: shop # topic.prefix of orders-mysql (topics span shop.shop.orders)
    source_tables: [shop.orders, shop.order_items] # db.table
    connectors: [orders-mysql]
    # Only connector_down: a MySQL pipeline has no slot, and Q8d refuses the
    # slot signals on it.
    watch:
      enabled: true
      signals:
        connector_down: {for: 30s}
    # The source layer of a MySQL pipeline is `mysql`, not `postgres` (design
    # §4.1). Per pipeline, so the top-level map stays the six CDC layers.
    owners:
      mysql: {approvers: priya}
layers:
  postgres: priya
  kafka-connect: arjun
  schema-registry: priya
  kafka: arjun
  consumer: kabir
  warehouse: meera
