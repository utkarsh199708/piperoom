# dev/owners.yaml plus what the P3 scenarios need (dev/scenarios.md §8-§11:
# missed-table, dead-slot, consumer-bad-deploy, dlq-backlog). Start the server
# with OWNERS_FILE=dev/owners.p3.yaml to run them. Kept apart from the baseline
# because evals/gen derives fixtures from dev/owners.yaml.
# Keep the rest in step with dev/owners.yaml: TestOwnersP3MatchesBaseline fails
# when they drift.
pipelines:
  - id: orders
    title: Orders CDC
    topic_prefix: pg # Debezium topic.prefix of pg-orders-connector (topics span pg.public.orders)
    # public.devctl_refunds exists only while `devctl break missed-table` is
    # active; it is listed so pg_add_publication_table and
    # connect_snapshot_table accept it. Keep orders first.
    source_tables: [public.orders, public.devctl_refunds]
    connectors: [pg-orders-connector]
    consumer_groups: [order-sync]
    sink_tables: [analytics.orders]
    sink_ts_column: updated_at
    # Short `for` so `devctl break ...` trips the watcher within a few intervals.
    # slot_wal stays at the defaults (fire 1GiB): a healthy dev slot retains
    # 0.8-1.1 MB under load (dev/scenarios.md), so any small fire would warn forever.
    watch:
      enabled: true
      signals:
        connector_down: {for: 30s}
        slot_inactive: {for: 30s}
        dlq_growth: {for: 30s}
      # devconsumer's DLQ (dev/docker-compose.yml DLQ_TOPIC); `devctl break
      # dlq-backlog` creates the topic and `fix` deletes it.
      dlq_topics:
        - {topic: devctl.order-sync.dlq, written_by: order-sync}
  - id: daily-revenue
    title: Daily revenue (Airflow + dbt)
    kind: batch
    dags: [revenue_daily]
    dbt_project: dev/batch/dbt/analytics
    models: [stg_orders, fct_revenue]
    sink_tables: [analytics.fct_revenue]
    sink_ts_column: loaded_at
    # The batch layers are not in the top-level `layers:` map (that map stays the
    # six CDC layers, which TestExistingFilesStayValid pins), so they are owned
    # here per-pipeline.
    owners:
      orchestrator: {approvers: priya}
      transform: {approvers: priya}
      warehouse: {approvers: meera}
layers:
  postgres: priya
  kafka-connect: arjun
  schema-registry: priya
  kafka: arjun
  consumer: kabir
  warehouse: meera
