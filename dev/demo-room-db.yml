# Postgres for the Piperoom server during the live demo (docs/demo/schema-change.md).
#
# Why a separate project: `devctl reset` runs `docker compose down -v` on the
# piperoom-dev project, which deletes the dev Postgres, including the `piperoom`
# room database. The demo resets the pipeline while the server is running, so
# the server's rooms must live somewhere reset does not touch. This file has its
# own project name and volume, so reset leaves it alone.
#
#   docker compose -f dev/demo-room-db.yml up -d --wait
#   docker compose -f dev/demo-room-db.yml down -v      # forget all demo rooms
#
# Local use only; the credentials are the dev ones (AGENTS.md section 3).
name: piperoom-demo-room

services:
  room-db:
    image: postgres:17
    environment:
      POSTGRES_USER: piperoom
      POSTGRES_PASSWORD: piperoom-dev
      POSTGRES_DB: piperoom
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - room-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "piperoom", "-d", "piperoom"]
      interval: 5s
      retries: 20

volumes:
  room-data:
