# Same as owners.yaml plus a `staging:` block on the orders pipeline (X8, docs/api.md "X8 staging").
# Start the server with OWNERS_FILE=dev/owners.staging.yaml and the staging profile up
# (`devctl up --staging`, dev/README.md "Staging profile"), with write mode on, to use
# "Try in staging". internal/owners TestExistingFilesStayValid loads it. Keep the rest in step
# with dev/owners.yaml: TestOwnersStagingMatchesOwners fails when they drift.
pipelines:
  - id: orders
    title: Orders CDC
    topic_prefix: pg # Debezium topic.prefix of pg-orders-connector (topics span pg.public.orders)
    source_tables: [public.orders]
    connectors: [pg-orders-connector]
    consumer_groups: [order-sync]
    sink_tables: [analytics.orders]
    sink_ts_column: updated_at
    # X8: the second Connect + Schema Registry of the staging profile. The URLs are the host
    # ports (a server run on the host, `go run ./cmd/server`); a server inside the compose
    # network uses http://connect-staging:8083 and http://schema-registry-staging:8081.
    # They must differ from production (CONNECT_URL / SCHEMA_REGISTRY_URL and every pipeline's
    # connections:): the server refuses to start otherwise (owners.CheckStagingOverlap). kafka_brokers is left out: staging shares the dev Kafka and
    # its own topics are only read through the staging Connect.
    staging:
      connections:
        connect_url: {value: "http://localhost:18083"}
        schema_registry_url: {value: "http://localhost:18081"}
    # Uncomment once an action implements actions.Stager (X8b): approving it then needs a
    # healthy stage first.
    # require_staging: [connect_update_connector_config]
    # Short `for` so `devctl break ...` trips the watcher within a few intervals.
    # slot_wal stays at the defaults (fire 1GiB): a healthy dev slot retains
    # 0.8-1.1 MB under load (dev/scenarios.md), so any small fire would warn forever.
    watch:
      enabled: true
      signals:
        connector_down: {for: 30s}
        slot_inactive: {for: 30s}
  - id: daily-revenue
    title: Daily revenue (Airflow + dbt)
    kind: batch
    dags: [revenue_daily]
    dbt_project: dev/batch/dbt/analytics
    models: [stg_orders, fct_revenue]
    sink_tables: [analytics.fct_revenue]
    sink_ts_column: loaded_at
    # The batch layers are not in the top-level `layers:` map (that map stays the
    # six CDC layers, which TestExistingFilesStayValid pins), so they are owned
    # here per-pipeline.
    owners:
      orchestrator: {approvers: priya}
      transform: {approvers: priya}
      warehouse: {approvers: meera}
layers:
  postgres: priya
  kafka-connect: arjun
  schema-registry: priya
  kafka: arjun
  consumer: kabir
  warehouse: meera
