# dev/owners.yaml plus what the X2 recovery scenarios need (dev/scenarios.md §18-§19:
# rows-lost-after-retention, consumer-skipped-range): the pipeline's reprocess_topic, the one
# topic kafka_replay_range may write to. Start the server with OWNERS_FILE=dev/owners.recovery.yaml
# to run them. Kept apart from the baseline because evals/gen derives fixtures from dev/owners.yaml.
# Keep the rest in step with dev/owners.yaml: TestOwnersRecoveryMatchesBaseline fails when they drift.
pipelines:
  - id: orders
    title: Orders CDC
    topic_prefix: pg # Debezium topic.prefix of pg-orders-connector (topics span pg.public.orders)
    source_tables: [public.orders]
    connectors: [pg-orders-connector]
    consumer_groups: [order-sync]
    sink_tables: [analytics.orders]
    sink_ts_column: updated_at
    # The topic kafka_replay_range copies a retained offset range into (X2b); both recovery
    # breaks create it and their fixes delete it. order-sync reads it only when a second
    # devconsumer is run on it (dev/scenarios.md §19).
    reprocess_topic: pg.public.orders.reprocess
    # Short `for` so `devctl break ...` trips the watcher within a few intervals.
    # slot_wal stays at the defaults (fire 1GiB): a healthy dev slot retains
    # 0.8-1.1 MB under load (dev/scenarios.md), so any small fire would warn forever.
    watch:
      enabled: true
      signals:
        connector_down: {for: 30s}
        slot_inactive: {for: 30s}
  - id: daily-revenue
    title: Daily revenue (Airflow + dbt)
    kind: batch
    dags: [revenue_daily]
    dbt_project: dev/batch/dbt/analytics
    models: [stg_orders, fct_revenue]
    sink_tables: [analytics.fct_revenue]
    sink_ts_column: loaded_at
    # The batch layers are not in the top-level `layers:` map (that map stays the
    # six CDC layers, which TestExistingFilesStayValid pins), so they are owned
    # here per-pipeline.
    owners:
      orchestrator: {approvers: priya}
      transform: {approvers: priya}
      warehouse: {approvers: meera}
layers:
  postgres: priya
  kafka-connect: arjun
  schema-registry: priya
  kafka: arjun
  consumer: kabir
  warehouse: meera
