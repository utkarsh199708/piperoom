{{- if include "piperoom.server" . }}
{{- include "piperoom.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "piperoom.fullname" . }}
  labels:
    {{- include "piperoom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # One replica: Recreate, so a rollout has no surge pod. More: RollingUpdate;
  # replicas share the work through Postgres (docs/design/replicas.md).
  strategy:
    {{- if gt (int .Values.replicaCount) 1 }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "piperoom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.files.existingConfigMap }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "piperoom.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "piperoom.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: piperoom
          image: {{ include "piperoom.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: PIPEROOM_HTTP_ADDR
              value: 0.0.0.0:8090
            - name: OWNERS_FILE
              value: {{ printf "%s/owners.yaml" .Values.files.mountPath | quote }}
            - name: USERS_FILE
              value: {{ printf "%s/users.yaml" .Values.files.mountPath | quote }}
            {{- $url := include "piperoom.publicURL" . }}
            {{- if $url }}
            - name: PIPEROOM_PUBLIC_URL
              value: {{ $url | quote }}
            {{- end }}
            # Always set explicitly, so a change of the image default cannot
            # change the mode of a release.
            - name: PIPEROOM_AUTH_MODE
              value: {{ include "piperoom.authMode" . | quote }}
            - name: PIPEROOM_DEV_ALLOW_NONLOOPBACK
              value: {{ ternary "" "1" (eq (include "piperoom.authMode" .) "oidc") | quote }}
            # The replica's name in agent leases, executor claims and leader
            # logs; the server adds a per-process suffix.
            - name: PIPEROOM_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.setupSecrets.enabled }}
            # Setup rooms: one shared volume holds the registered read
            # credentials (<pipeline>/<name>, 0600). The claim is
            # ReadWriteMany, so every replica reads and writes the same files.
            - name: PIPEROOM_SETUP_ENABLED
              value: "on"
            - name: PIPEROOM_SECRETS_DIR
              value: {{ .Values.setupSecrets.mountPath | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            {{- if and (not (kindIs "invalid" $v)) (ne $k "PIPEROOM_PUBLIC_URL") (ne $k "PIPEROOM_AUTH_MODE") (ne $k "PIPEROOM_REPLICA_ID") (or (ne (toString $v) "") (eq $k "PIPEROOM_OIDC_GROUPS_CLAIM")) }}
            - name: {{ $k }}
              value: {{ include "piperoom.envValue" $v | quote }}
            {{- end }}
            {{- end }}
            {{- $s := .Values.secrets }}
            {{- range $s.requiredKeys }}
            {{- if not (hasKey $s.refs .) }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $s.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
            {{- range $s.optionalKeys }}
            {{- if not (hasKey $s.refs .) }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $s.existingSecret }}
                  key: {{ . }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- range $name, $ref := $s.refs }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.name }}
                  key: {{ $ref.key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.files.mountPath }}
              readOnly: true
            # The root file system is read-only; /tmp is the only writable path.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.setupSecrets.enabled }}
            - name: setup-secrets
              mountPath: {{ .Values.setupSecrets.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "piperoom.configMapName" . }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if .Values.setupSecrets.enabled }}
        - name: setup-secrets
          persistentVolumeClaim:
            claimName: {{ .Values.setupSecrets.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
