{{- if include "piperoom.server" . }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "piperoom.fullname" . }}
  labels:
    {{- include "piperoom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "piperoom.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8090
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with .Values.networkPolicy.dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- range $name, $g := .Values.networkPolicy.egress }}
    {{- if $g }}
    # {{ $name }}
    - ports:
        {{- range $g.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- with $g.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
