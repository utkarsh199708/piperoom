# Throwaway try-out: passwordless dev login, no Ingress, reached with
# kubectl port-forward. Used by helm lint / helm template in CI and in the README.
allowDevMode: true
env:
  PIPEROOM_AUTH_MODE: dev
  # Required from R9 for dev mode off loopback (docs: deploy/helm/README.md).
  PIPEROOM_DEV_ACK: dev-login-has-no-password
