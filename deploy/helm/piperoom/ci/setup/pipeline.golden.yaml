# Source: piperoom/templates/setup-pipeline.yaml
# The Connect pods read the one credentials Secret through Strimzi's
# KubernetesSecretConfigProvider; the ServiceAccount is the one Strimzi
# creates for the KafkaConnect (<name>-connect).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orders-connect-secrets
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [orders-db-credentials]
    verbs: [get]
---
# Source: piperoom/templates/setup-pipeline.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orders-connect-secrets
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orders-connect-secrets
subjects:
  - kind: ServiceAccount
    name: orders-connect-connect
    namespace: data
