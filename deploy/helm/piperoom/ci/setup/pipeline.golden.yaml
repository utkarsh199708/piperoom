# Source: piperoom/templates/setup-pipeline.yaml
# D11: RBAC bounds objects, not fields. This policy, bound to this pipeline's
# named objects only, mirrors the runner's field allow-list
# (internal/setup/targets/strimzi allowlist.go, connector_config.go) for the
# fields a compromised runner could use to mount any Secret, read another
# Secret or file through a config provider, pull an unpinned plugin, push to
# another registry, reach another Kafka cluster, run code in a transform,
# move offsets, re-point the canary topic or mint a Kafka superuser. Every
# field is read behind has(), so a field the CRD lacks is absent, never an
# evaluation error. The JDBC URL and Debezium key allow-lists stay the
# runner's (connector_config.go); this policy holds the refusals that would
# hand the cluster to whoever controls the runner.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "piperoom-pipeline-orders"
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [kafka.strimzi.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [kafkaconnects, kafkaconnectors, kafkausers, kafkatopics]
  validations:
    # ---- KafkaConnect ----
    - expression: >-
        object.kind != 'KafkaConnect' || !has(object.spec) ||
        (object.spec.all(k, k in ['replicas', 'version', 'bootstrapServers', 'tls', 'authentication', 'config', 'build', 'resources', 'logging', 'metricsConfig', 'jvmOptions']) &&
        (!has(object.spec.jvmOptions) || object.spec.jvmOptions.all(k, k in ['-Xms', '-Xmx'])) &&
        (!has(object.spec.bootstrapServers) || string(object.spec.bootstrapServers).matches(r'^prod-kafka-kafka-bootstrap(\.data(\.svc(\.cluster\.local)?)?)?:[0-9]{1,5}$')))
      message: "piperoom: a KafkaConnect sets only replicas, version, bootstrapServers, tls, authentication, config, build, resources, logging, metricsConfig and jvmOptions (-Xms, -Xmx); no image, template, externalConfiguration or system properties; and its bootstrap is prod-kafka-kafka-bootstrap"
    - expression: >-
        object.kind != 'KafkaConnect' || !has(object.spec) || !has(object.spec.build) ||
        (object.spec.build.all(k, k in ['output', 'plugins']) && has(object.spec.build.output) &&
        object.spec.build.output.all(k, k in ['type', 'image', 'pushSecret']) &&
        has(object.spec.build.output.type) && object.spec.build.output.type == 'docker' &&
        has(object.spec.build.output.pushSecret) && object.spec.build.output.pushSecret == 'orders-registry-push' &&
        has(object.spec.build.output.image) && string(object.spec.build.output.image).matches(r'^(registry\.data\.svc:5000)/[a-z0-9._/-]{1,200}:piperoom-orders-[a-z0-9-]{1,60}$'))
      message: "piperoom: a build pushes a docker image <registry>/<repo>:piperoom-orders-<digest> to one of registry.data.svc:5000, with orders-registry-push only"
    - expression: >-
        object.kind != 'KafkaConnect' || !has(object.spec) || !has(object.spec.tls) || !has(object.spec.tls.trustedCertificates) ||
        object.spec.tls.trustedCertificates.all(c, has(c.secretName) && c.secretName == 'prod-kafka-cluster-ca-cert')
      message: "piperoom: spec.tls trusts only the prod-kafka-cluster-ca-cert Secret"
    - expression: >-
        object.kind != 'KafkaConnect' || !has(object.spec) || !has(object.spec.authentication) ||
        (has(object.spec.authentication.type) &&
        ((object.spec.authentication.type == 'tls' && has(object.spec.authentication.certificateAndKey) &&
        has(object.spec.authentication.certificateAndKey.secretName) && object.spec.authentication.certificateAndKey.secretName == 'orders-connect') ||
        (object.spec.authentication.type == 'scram-sha-512' && has(object.spec.authentication.passwordSecret) &&
        has(object.spec.authentication.passwordSecret.secretName) && object.spec.authentication.passwordSecret.secretName == 'orders-connect')))
      message: "piperoom: spec.authentication is tls or scram-sha-512 with the orders-connect KafkaUser's Secret only"
    - expression: >-
        object.kind != 'KafkaConnect' || !has(object.spec) || !has(object.spec.config) ||
        object.spec.config.all(k, k in ['group.id', 'offset.storage.topic', 'config.storage.topic', 'status.storage.topic',
        'offset.storage.replication.factor', 'config.storage.replication.factor', 'status.storage.replication.factor',
        'key.converter', 'value.converter', 'key.converter.schemas.enable', 'value.converter.schemas.enable',
        'key.converter.schema.registry.url', 'value.converter.schema.registry.url', 'config.providers', 'config.providers.secrets.class'] &&
        !string(object.spec.config[k]).contains('${') && !string(object.spec.config[k]).matches(r'^\s|\s$') &&
        (!(k in ['key.converter.schema.registry.url', 'value.converter.schema.registry.url']) || string(object.spec.config[k]) in ['http://registry.data.svc:8081']) &&
        (k != 'config.providers' || string(object.spec.config[k]) == 'secrets') &&
        (k != 'config.providers.secrets.class' || string(object.spec.config[k]) == 'io.strimzi.kafka.KubernetesSecretConfigProvider') &&
        (!(k in ['key.converter', 'value.converter']) || string(object.spec.config[k]) in ['org.apache.kafka.connect.json.JsonConverter', 'org.apache.kafka.connect.storage.StringConverter', 'io.confluent.connect.avro.AvroConverter', 'io.apicurio.registry.utils.converter.AvroConverter']))
      message: "piperoom: the worker config keys are the runner's allow-list, the only config provider is secrets (io.strimzi.kafka.KubernetesSecretConfigProvider), no value is a reference or has whitespace at an end, the converters are the allow-listed ones and a Schema Registry URL is one of http://registry.data.svc:8081"
    - expression: >-
        object.kind != 'KafkaConnect' || !has(object.spec) || !has(object.spec.build) || !has(object.spec.build.plugins) ||
        object.spec.build.plugins.all(pl, has(pl.artifacts) && pl.artifacts.all(a,
        has(a.type) && a.type in ['tgz', 'jar', 'zip'] && has(a.sha512sum) && a.sha512sum.matches('^[0-9a-f]{128}$') &&
        has(a.url) && ['https://repo1.maven.org/'].exists(h, a.url.startsWith(h))))
      message: "piperoom: every build artifact is a tgz, jar or zip with a sha512sum, from repo1.maven.org"
    - expression: >-
        object.kind != 'KafkaConnect' || !has(object.spec) ||
        ((!has(object.spec.logging) || !has(object.spec.logging.valueFrom) ||
        (has(object.spec.logging.valueFrom.configMapKeyRef) && has(object.spec.logging.valueFrom.configMapKeyRef.name) &&
        object.spec.logging.valueFrom.configMapKeyRef.name == 'orders-connect-logging')) &&
        (!has(object.spec.metricsConfig) || !has(object.spec.metricsConfig.valueFrom) ||
        (has(object.spec.metricsConfig.valueFrom.configMapKeyRef) && has(object.spec.metricsConfig.valueFrom.configMapKeyRef.name) &&
        object.spec.metricsConfig.valueFrom.configMapKeyRef.name == 'orders-connect-metrics')))
      message: "piperoom: logging and metrics read only the orders-connect-logging and orders-connect-metrics ConfigMaps"
    # ---- KafkaConnector ----
    # Keys: the runner's allow-list (the union over plugins; the runner holds
    # the per-plugin table) and transforms/predicates.<name>.<key>. Values:
    # nothing at either end is whitespace (a plugin that trims would read
    # " disable" as disable), and a ${ appears only as the whole value of a
    # credential key, exactly ${secrets:<ns>/<pipeline>-db-credentials:<key>},
    # or as Strimzi's own ${strimzienv:CERTS_STORE_PASSWORD} in the schema
    # history clients' store passwords.
    - expression: >-
        object.kind != 'KafkaConnector' || !has(object.spec) ||
        (object.spec.all(k, k in ['class', 'tasksMax', 'config', 'autoRestart']) &&
        (!has(object.spec.tasksMax) || object.spec.tasksMax == 1) &&
        (!has(object.spec.class) || object.spec.class.startsWith('io.debezium.connector.')) &&
        (!has(object.spec.config) || object.spec.config.all(k,
        k != 'connector.class' && k != 'heartbeat.action.query' && k != 'tasks.max' &&
        !k.startsWith('config.providers') && !k.matches('(^|\\.)override\\.') && !k.endsWith('initial.statements') &&
        (!k.endsWith('bootstrap.servers') || k == 'schema.history.internal.kafka.bootstrap.servers') &&
        (k in ['archive.log.hours', 'batch.size', 'bigint.unsigned.handling.mode', 'binary.handling.mode', 'capture.mode', 'collection.exclude.list', 'collection.include.list', 'collection.name.format', 'collection.naming.strategy', 'column.exclude.list', 'column.include.list', 'column.propagate.source.type', 'connect.keep.alive', 'connect.keep.alive.interval.ms', 'connect.timeout.ms', 'connection.password', 'connection.pool.acquire_increment', 'connection.pool.max_size', 'connection.pool.min_size', 'connection.pool.timeout', 'connection.provider', 'connection.restart.on.errors', 'connection.url', 'connection.username', 'consumer.override.fetch.max.bytes', 'consumer.override.max.partition.fetch.bytes', 'consumer.override.max.poll.interval.ms', 'consumer.override.max.poll.records', 'data.query.mode', 'database.dbname', 'database.encrypt', 'database.exclude.list', 'database.hostname', 'database.include.list', 'database.names', 'database.password', 'database.pdb.name', 'database.port', 'database.server.id', 'database.ssl.mode', 'database.sslmode', 'database.time_zone', 'database.trustServerCertificate', 'database.user', 'datatype.propagate.source.type', 'decimal.handling.mode', 'delete.enabled', 'dialect.postgres.postgis.schema', 'dialect.sqlserver.identity.insert', 'enable.time.adjuster', 'errors.deadletterqueue.context.headers.enable', 'errors.deadletterqueue.topic.name', 'errors.deadletterqueue.topic.replication.factor', 'errors.log.enable', 'errors.log.include.messages', 'errors.max.retries', 'errors.retry.delay.max.ms', 'errors.retry.timeout', 'errors.tolerance', 'event.processing.failure.handling.mode', 'field.exclude.list', 'field.include.list', 'field.renames', 'flush.max.retries', 'flush.retry.delay.ms', 'gtid.source.excludes', 'gtid.source.includes', 'heartbeat.interval.ms', 'hstore.handling.mode', 'include.query', 'include.schema.changes', 'inconsistent.schema.handling.mode', 'incremental.snapshot.chunk.size', 'incremental.snapshot.option.recompile', 'insert