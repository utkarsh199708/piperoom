        (k != 'schema.history.internal.kafka.bootstrap.servers' || string(object.spec.config[k]).matches(r'^prod-kafka-kafka-bootstrap(\.data(\.svc(\.cluster\.local)?)?)?:[0-9]{1,5}$')) &&
