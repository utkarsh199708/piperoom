        a.resource.name in ['orders-connect-connect-configs', 'orders-connect-connect-offsets', 'orders-connect-connect-status'])))
        || (a.resource.type == 'group' && a.resource.name == 'orders-connect' &&
        (!has(a.resource.patternType) || a.resource.patternType == 'literal'))) &&
        has(a.operations) && a.operations.all(o, o in ['Create', 'Describe', 'Read', 'Write', 'DescribeConfigs']) &&
        (!has(a.operation) || a.operation in ['Create', 'Describe', 'Read', 'Write', 'DescribeConfigs']))))
      message: "piperoom: a KafkaUser has no password source, and its ACLs are the pipeline's own: topics under pg. (prefix), the orders-connect-connect-* internal topics and group orders-connect (literal), with no other resource type or operation (operations or the deprecated operation)"
