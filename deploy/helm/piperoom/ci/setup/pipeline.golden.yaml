# Source: piperoom/templates/setup-pipeline.yaml
# The pipeline release (docs/design/setup-strimzi.md §3): every object the
# setup runner touches, pre-created with a chart-fixed name, so the runner's
# Role needs no create. The Strimzi CRs are paused shells: the operators
# reconcile nothing until the runner has filled the spec and removed the
# annotation. Shell specs are the smallest the v1 schema accepts; the runner
# replaces /spec whole.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: orders-connect
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
  annotations:
    strimzi.io/pause-reconciliation: "true"
    strimzi.io/use-connector-resources: "true"
spec:
  replicas: 1
  bootstrapServers: prod-kafka-kafka-bootstrap:9092
---
