# Source: piperoom/templates/setup-pipeline.yaml
# The Connect pods' egress (networkPolicy.enabled): DNS, this Kafka
# cluster's pods, the API server (the KubernetesSecretConfigProvider reads
# the credentials Secret), the databases, then extraEgress. Ingress is left
# to Strimzi, which writes the Connect REST API's own NetworkPolicy. The
# build pod (strimzi.io/name <connect>-connect-build) is not selected: it
# fetches plugins and pushes the image. An empty "to" opens the port to any
# destination, because the chart cannot know your API server's or
# databases' addresses: narrow it for production.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "orders-connect-egress"
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: KafkaConnect
      strimzi.io/name: "orders-connect-connect"
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # the Kafka cluster prod-kafka
    - ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: "prod-kafka"
              strimzi.io/kind: Kafka
    # the Kubernetes API server
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.96.0.1/32
    # the databases
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.0.5.0/24
    - ports:
      - port: 8081
        protocol: TCP
      to:
      - ipBlock:
          cidr: 10.0.6.10/32
---
