---
# Source: piperoom/templates/setup-pipeline.yaml
# The Connect pods' egress (networkPolicy.enabled): DNS, the other Connect
# workers' REST API on 8083 (a worker forwards connector writes to the
# leader), this Kafka cluster's pods, the API server (the
# KubernetesSecretConfigProvider reads the credentials Secret), the
# databases, the Schema Registries, then extraEgress. Ingress is left to
# Strimzi, which writes the Connect REST API's own NetworkPolicy. Every "to"
# is required and non-empty (piperoom.setupValidate): an empty one would
# open the port to any destination.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "orders-connect-egress"
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: KafkaConnect
      strimzi.io/name: "orders-connect-connect"
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # the other Connect workers' REST API
    - ports:
        - port: 8083
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
              strimzi.io/name: "orders-connect-connect"
    # the Kafka cluster prod-kafka
    - ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: "prod-kafka"
              strimzi.io/kind: Kafka
    # the Kubernetes API server
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.96.0.1/32
    # the databases
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.0.5.0/24
    # the Schema Registries (http://registry.data.svc:8081)
    - ports:
        - port: 8081
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.0.6.10/32
---
# Source: piperoom/templates/setup-pipeline.yaml
# The KafkaConnect build pod's egress (networkPolicy.enabled): DNS, the
# plugin artifact hosts (pluginHosts) and the registries the image is pushed
# to (imageRegistries), on the ports their host[:port] names (443 without
# one). It needs no Kafka, API server or database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "orders-connect-build-egress"
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: KafkaConnect
      strimzi.io/name: "orders-connect-connect-build"
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # the plugin artifact hosts (repo1.maven.org)
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 199.232.0.0/16
    # the image registries (registry.data.svc:5000)
    - ports:
        - port: 5000
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: registry
---
