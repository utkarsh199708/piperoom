    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
    strimzi.io/cluster: orders-connect
  annotations:
    strimzi.io/pause-reconciliation: "true"
spec:
  tasksMax: 1
