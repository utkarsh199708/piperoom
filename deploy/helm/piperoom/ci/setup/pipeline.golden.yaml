.history.internal.producer.sasl.mechanism', 'schema.history.internal.producer.security.protocol', 'schema.history.internal.producer.ssl.keystore.location', 'schema.history.internal.producer.ssl.keystore.password', 'schema.history.internal.producer.ssl.keystore.type', 'schema.history.internal.producer.ssl.truststore.location', 'schema.history.internal.producer.ssl.truststore.password', 'schema.history.internal.producer.ssl.truststore.type', 'schema.history.internal.skip.unparseable.ddl', 'schema.history.internal.store.only.captured.databases.ddl', 'schema.history.internal.store.only.captured.tables.ddl', 'schema.include.list', 'schema.refresh.mode', 'signal.data.collection', 'signal.enabled.channels', 'skipped.operations', 'slot.drop.on.stop', 'slot.max.retries', 'slot.name', 'slot.retry.delay.ms', 'snapshot.fetch.size', 'snapshot.include.collection.list', 'snapshot.isolation.mode', 'snapshot.locking.mode', 'snapshot.max.threads', 'snapshot.mode', 'status.update.interval.ms', 'table.exclude.list', 'table.include.list', 'table.name.format', 'table.naming.strategy', 'time.precision.mode', 'tombstones.on.delete', 'topic.creation.default.cleanup.policy', 'topic.creation.default.compression.type', 'topic.creation.default.partitions', 'topic.creation.default.replication.factor', 'topic.prefix', 'topics', 'transforms', 'truncate.enabled', 'use.reduction.buffer', 'use.time.zone', 'value.converter', 'value.converter.schema.registry.url', 'value.converter.schemas.enable', 'xmin.fetch.interval.ms'] ||
        k.matches(r'^(transforms|predicates)\.[A-Za-z][A-Za-z0-9_-]{0,31}\.[A-Za-z0-9_.-]{1,64}$')) &&
        !string(object.spec.config[k]).matches(r'^\s|\s$') &&
        (!string(object.spec.config[k]).contains('${') ||
        (k in ['database.user', 'database.password', 'connection.username', 'connection.password', 'mongodb.user', 'mongodb.password'] && string(object.spec.config[k]).matches(r'^\$\{secrets:data/orders-db-credentials:[A-Za-z0-9._-]{1,253}\}$')) ||
