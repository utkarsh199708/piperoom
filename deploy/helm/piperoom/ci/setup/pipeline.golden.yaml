# Source: piperoom/templates/setup-pipeline.yaml
# Fixed content: the runner reads it, never patches it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-connect-metrics
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
data:
  metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: "kafka.connect<type=connect-worker-metrics>([^:]+):"
        name: "kafka_connect_worker_$1"
      - pattern: "kafka.connect<type=connect-metrics, client-id=([^:]+)><>([^:]+)"
        name: "kafka_connect_$2"
        labels:
          client: "$1"
      - pattern: "kafka.connect<type=connector-task-metrics, connector=([^,]+), task=([^>]+)><>status: ([^:]+)"
        name: "kafka_connect_connector_status"
        value: 1
        labels:
          connector: "$1"
          task: "$2"
          status: "$3"
      - pattern: "debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^,]+), key=([^>]+)><>([^:]+)"
        name: "debezium_metrics_$5"
        labels:
          plugin: "$1"
          context: "$2"
          name: "$3"
          key: "$4"
      - pattern: "debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^>]+)><>([^:]+)"
        name: "debezium_metrics_$4"
        labels:
          plugin: "$1"
          context: "$2"
          name: "$3"
