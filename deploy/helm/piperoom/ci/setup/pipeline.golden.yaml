        object.kind != 'KafkaConnector' || !has(object.spec) || !has(object.spec.config) ||
        object.spec.config.all(k,
        (k != 'database.sslmode' || string(object.spec.config[k]).lowerAscii() in ['require', 'verify-ca', 'verify-full']) &&
        (k != 'database.ssl.mode' || string(object.spec.config[k]).lowerAscii() in ['required', 'verify_ca', 'verify_identity']) &&
        (k != 'database.encrypt' || string(object.spec.config[k]).lowerAscii() == 'true') &&
        (k != 'database.trustServerCertificate' || string(object.spec.config[k]).lowerAscii() == 'false') &&
        (!(k in ['connection.url', 'mongodb.connection.string']) || (
        !string(object.spec.config[k]).matches(r'\s') &&
        !string(object.spec.config[k]).replace('%20', '').contains('%') &&
        string(object.spec.config[k]).split('?').size() <= 2 &&
        (string(object.spec.config[k]).contains('?') ? string(object.spec.config[k]).substring(string(object.spec.config[k]).indexOf('?') + 1) :
        (string(object.spec.config[k]).contains(';') ? string(object.spec.config[k]).substring(string(object.spec.config[k]).indexOf(';') + 1) : '')).replace(';', '&').split('&').all(q,
        q == '' || q.split('=')[0].lowerAscii() in ['allowpublickeyretrieval', 'applicationname', 'appname', 'authmechanism', 'authsource', 'characterencoding', 'connecttimeout', 'connecttimeoutms', 'currentschema', 'databasename', 'directconnection', 'encrypt', 'logintimeout', 'maxpoolsize', 'preparethreshold', 'readpreference', 'replicaset', 'requiressl', 'retrywrites', 'rewritebatchedinserts', 'rewritebatchedstatements', 'serverselectiontimeoutms', 'servertimezone', 'sockettimeout', 'sockettimeoutms', 'ssl', 'sslmode', 'stringtype', 'targetservertype', 'tcpkeepalive', 'tls', 'trustservercertificate', 'usessl', 'useunicode', 'verifyservercertificate', 'w', 'zerodatetimebehavior']) &&
