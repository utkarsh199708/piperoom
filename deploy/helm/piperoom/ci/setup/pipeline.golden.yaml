# Source: piperoom/templates/setup-pipeline.yaml
# D11: RBAC bounds objects, not fields. This policy, bound to this pipeline's
# named objects only, refuses the fields a compromised runner could use to
# mount any Secret or mint a Kafka superuser.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: piperoom-pipeline-orders
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [kafka.strimzi.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [kafkaconnects, kafkausers]
  validations:
    - expression: >-
        object.kind != 'KafkaConnect' || !has(object.spec) ||
        (!has(object.spec.image) && !has(object.spec.template) && !has(object.spec.externalConfiguration) &&
        (!has(object.spec.build) || !has(object.spec.build.output) || !has(object.spec.build.output.pushSecret) ||
        object.spec.build.output.pushSecret == 'orders-registry-push'))
      message: "piperoom: spec.image, spec.template and spec.externalConfiguration are refused, and the build pushes only with orders-registry-push"
    - expression: >-
        object.kind != 'KafkaUser' || !has(object.spec) ||
        ((!has(object.spec.authentication) || !has(object.spec.authentication.password)) &&
        (!has(object.spec.authorization) || !has(object.spec.authorization.acls) ||
        object.spec.authorization.acls.all(a, !has(a.resource) || !has(a.resource.type) ||
        (a.resource.type != 'cluster' && a.resource.type != 'transactionalId'))))
      message: "piperoom: a KafkaUser's password source and cluster or transactionalId ACLs are refused"
---
# Source: piperoom/templates/setup-pipeline.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: piperoom-pipeline-orders
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-pipeline-orders
    app.kubernetes.io/part-of: piperoom-setup
spec:
  policyName: piperoom-pipeline-orders
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: data
    resourceRules:
      - apiGroups: [kafka.strimzi.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [kafkaconnects]
        resourceNames: [orders-connect]
      - apiGroups: [kafka.strimzi.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [kafkausers]
        resourceNames: [orders-connect, orders-piperoom-ro]
