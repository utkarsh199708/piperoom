    # Where a connector connects: the schema history to this Kafka cluster's
    # bootstrap Service, the database to setup.pipeline.databaseHosts, the
    # Schema Registry to setup.pipeline.schemaRegistries.
    - expression: >-
        object.kind != 'KafkaConnector' || !has(object.spec) || !has(object.spec.config) ||
