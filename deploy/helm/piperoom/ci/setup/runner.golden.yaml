# Source: piperoom/templates/setup-runner.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: piperoom-setup-01jbz3k7q8x9v2m4n6p8r0s2t4
  labels:
    helm.sh/chart: piperoom-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: piperoom-setup-01jbz3k7q8x9v2m4n6p8r0s2t4
    app.kubernetes.io/part-of: piperoom-setup
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        helm.sh/chart: piperoom-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: piperoom-setup-01jbz3k7q8x9v2m4n6p8r0s2t4
        app.kubernetes.io/part-of: piperoom-setup
    spec:
      serviceAccountName: piperoom-setup-01jbz3k7q8x9v2m4n6p8r0s2t4
      # The token comes from the projected volume below (one hour, rotated;
      # the runner re-reads the file per request), not the automount.
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: "registry.example.com/piperoom:pilot"
          imagePullPolicy: IfNotPresent
          command: ["/piperoom-setup"]
          args:
            - --server
            - "https://piperoom.example.com"
            - --code-file
            - /var/run/piperoom/pairing/code
            - --confirm-secret-prefix
            - piperoom-setup-01jbz3k7q8x9v2m4n6p8r0s2t4-confirm
            - --project
            - /work
            - --strimzi-pipeline
            - "orders"
            - --strimzi-connectors
            - "orders-src,orders-sink"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: pairing
              mountPath: /var/run/piperoom/pairing
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: work
          emptyDir: {}
        - name: pairing
          projected:
            sources:
              - secret:
                  name: piperoom-setup-01jbz3k7q8x9v2m4n6p8r0s2t4-pairing
                  optional: false
                  items:
                    - key: code
                      path: code
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
